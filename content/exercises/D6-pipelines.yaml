# D6 — stream pipeline coding exercises

- id: D6-EX-010
  objective: D6.1
  lesson: streams-pipelines
  title: Employee reports with composed comparators and primitive streams
  difficulty: advanced
  kind: implement
  prompt: |
    The file declares `record Employee(String name, String dept, int salary, int years)` — keep it as given;
    `dept` is `null` for contractors. Implement the four `public static` methods of `Reports` as stream
    pipelines (no loops), using method references where they fit. None of them may modify the input list.

    1. `List<String> seniorNames(List<Employee> staff, int minYears)` — the employees with
       `years >= minYears`, ordered by **salary, highest first**, then by **name in natural (case-sensitive)
       `String` order**, mapped to their upper-case name.
    2. `OptionalDouble averageSalary(List<Employee> staff, String dept)` — the average salary of the employees
       of `dept` (`dept` itself is never `null`), or an **empty** `OptionalDouble` if there are none.
    3. `String salaryStats(List<Employee> staff)` — computed in a single pass:
       `"n=<count> min=<min> max=<max> sum=<sum>"`, e.g. `"n=3 min=3500 max=9000 sum=19700"`. For an empty
       list return exactly `"n=0"`.
    4. `List<String> directory(List<Employee> staff)` — one entry `dept + "/" + name` per employee, with `"-"`
       in place of a `null` dept, ordered by department in natural order with **`null` departments last**,
       then by name.
