# D10 — Localization coding exercises

- id: D10-EX-001
  objective: D10.1
  lesson: l10n-locales-bundles
  title: Locale-aware invoice lines
  difficulty: intermediate
  kind: implement
  prompt: |
    Implement the three static methods of `Invoice`. The message bundles `InvoiceText` (base, English) and
    `InvoiceText_fr` are given as `ListResourceBundle` classes — do not change them.

    1. `line(locale, item, qty, unitPrice)` returns `"<qty> x <item> @ <unit price> = <line total>"`.
       Format the quantity with `NumberFormat.getIntegerInstance(locale)` (so 1200 becomes `1,200` in
       `en_US` and `1.200` in `de_DE`) and both amounts with `NumberFormat.getCurrencyInstance(locale)`.
       Example: `line(Locale.US, "Coffee", 3, 2.5)` → `3 x Coffee @ $2.50 = $7.50`.
    2. `summary(locale, lines, total)` loads `ResourceBundle.getBundle("InvoiceText", locale)`. If `lines`
       is 0 it returns the `empty` message; otherwise it formats the `summary` pattern with a
       `MessageFormat` for that locale, passing `lines` as argument `{0}` and the currency-formatted total
       as `{1}`. Example: `summary(Locale.FRANCE, 2, 1234.5)` → `2 lignes, total 1 234,50 €` (with CLDR's
       special spaces).
    3. `parseAmount(locale, text)` parses a currency string such as `$1,234.50` with the locale's currency
       format and returns it as a `double`. If the text cannot be parsed, throw an
       `IllegalArgumentException` (wrap the checked `ParseException`).

    The tests compare exact strings. German and French currency output contains U+00A0 (no-break space)
    before `€`, and French grouping uses U+202F. You get these characters for free by using the JDK
    formatters — never build the strings by hand.
