  title: ERROR-line scanner with NIO.2
  difficulty: intermediate
  kind: implement
  prompt: |
    Implement two static methods of `LogScanner` using `java.nio.file`:

    1. `List<String> errors(Path dir)` returns every line that contains `ERROR` in the **regular files
       whose name ends with `.log` directly inside `dir`** — ignore other files, sub-directories (and their
       contents) and directories that happen to be named `*.log`.
    2. Each entry has the form `fileName:lineNumber: line`, with **1-based** line numbers, e.g.
       `db.log:2: ERROR timeout`.
    3. Results are ordered by file name, then by line number. (`Files.list` returns entries in no
       particular order.) If `dir` does not exist, let the `NoSuchFileException` propagate. Remember to
       close the stream returned by `Files.list`.
    4. `int writeReport(Path report, List<String> lines)` writes one entry per line to `report`, creating
       any missing parent directories and replacing an existing file. It returns the number of lines
       written.
