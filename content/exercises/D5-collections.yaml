  title: Word-frequency leaderboard
  difficulty: intermediate
  kind: implement
  prompt: |
    You are building the "trending words" panel of a support-ticket dashboard. Implement three static methods
    in `Solution`:

    1. `SortedMap<String, Integer> countWords(List<String> words)` — counts the words **case-insensitively**
       (keys are lower case) and ignores `null` and blank entries. The returned map is sorted by word.
       Use `Map.merge` rather than a get-then-put sequence.
    2. `List<String> top(Map<String, Integer> counts, int n)` — returns at most `n` entries formatted as
       `"word=count"`, ordered by **count descending**, ties broken by **word ascending**. `n == 0` gives an
       empty list; `n < 0` throws `IllegalArgumentException`. The input map must not be modified.
    3. `<K, V extends Comparable<? super V>> Optional<K> keyOfMax(Map<K, V> map)` — a generic method that
       returns the key with the largest value, `Optional.empty()` for an empty map. On ties, the key that comes
       **first in the map's iteration order** wins. Keep the signature exactly as given: it must work for value
       types such as `LocalDate`, which implements `Comparable<ChronoLocalDate>` rather than
       `Comparable<LocalDate>`.
