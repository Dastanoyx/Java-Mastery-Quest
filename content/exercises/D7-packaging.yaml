- id: D7-EX-001
  objective: D7.1
  lesson: pkg-modules-services
  title: A mini ServiceLoader — provider resolution rules
  difficulty: advanced
  kind: implement
  prompt: |
    `ServiceLoader` turns a provider class into a service instance with a precise rule. Re-implement that rule
    with reflection in the class `MiniLoader`:

    1. `static <S> S instantiate(Class<S> service, Class<?> impl)`
       - **Provider method first.** If `impl` *declares* a method `provider()` with no parameters that is
         `public` **and** `static`, it is the provider method. Its return type must be `service` or a subtype
         (otherwise throw `ServiceConfigurationError`). Invoke it and return the result. A `provider()` that is
         not both public and static is ignored.
       - **Otherwise the constructor.** `impl` must be a subtype of `service` and have a **public** no-arg
         constructor; otherwise throw `ServiceConfigurationError`. Create and return a new instance.
       - If the provider method or constructor itself throws, throw a `ServiceConfigurationError` whose
         `getCause()` is the original exception.
    2. `static <S> Iterable<S> load(Class<S> service, List<Class<?>> impls)` returns a **lazy** `Iterable`:
       nothing is instantiated when `load` is called or when `iterator()` is called — each provider is
       instantiated (with `instantiate`) only when `next()` reaches it, in list order. A bad provider therefore
       fails only when the iteration reaches it.

    `ServiceConfigurationError` is `java.util.ServiceConfigurationError` (an `Error`, with constructors
    `(String)` and `(String, Throwable)`). The test classes live in the same (unnamed) package as your code.
