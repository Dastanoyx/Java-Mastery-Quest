  solution: |
    public class TextFormat {

        // Two trailing spaces after **%s** are kept by the \s escape; the \ at the end of line 4
        // joins it with line 5; the closing delimiter on the last content line means no final newline.
        static final String CARD = """
                **%s** \s
                Status: _%s_
                    $ status --verbose
                This profile was generated automatically \
                and must not be edited by hand.""";

        public static String normalize(String s) {
            if (s == null) return "";
            return s.strip().replaceAll("\\s+", " ");
        }

        public static String row(String[] cells, int[] widths) {
            if (cells.length != widths.length)
                throw new IllegalArgumentException(cells.length + " cells but " + widths.length + " widths");
            StringBuilder sb = new StringBuilder("|");
            for (int i = 0; i < cells.length; i++) {
                int width = widths[i];
                if (width < 1) throw new IllegalArgumentException("width must be at least 1: " + width);
                String cell = cells[i] == null ? "" : cells[i];
                sb.append(' ');
                if (cell.length() > width) {
                    sb.append(cell, 0, width - 1).append('~');
                } else {
                    sb.append(cell).append(" ".repeat(width - cell.length()));
                }
                sb.append(" |");
            }
            return sb.toString();
        }

        public static String card(String name, String status) {
            return CARD.formatted(normalize(name), normalize(status));
        }
    }
  harness: |
    public class Main {
        static void check(String name, boolean ok, String detail) {
            System.out.println(ok ? "PASS " + name : "FAIL " + name + ": got " + detail);
        }
        static void eq(String name, String expected, String actual) {
            check(name, expected.equals(actual), show(actual) + ", expected " + show(expected));
        }
        static String show(String s) {
            if (s == null) return "null";
            return "\"" + s.replace("\n", "\\n").replace("\t", "\\t").replace("\u2003", "\\u2003") + "\"";
        }
        interface Body { void run() throws Exception; }
        static void test(String name, Body body) {
            try { body.run(); } catch (Throwable t) { System.out.println("FAIL " + name + ": unexpected " + t); }
        }
        static String thrown(Runnable r) {
            try { r.run(); return "no exception"; } catch (RuntimeException e) { return e.getClass().getSimpleName(); }
        }

        public static void main(String[] args) {
            test("normalize collapses whitespace", () -> {
                String r = TextFormat.normalize("  Java \t 25\n\n  is   here  ");
                eq("normalize collapses whitespace", "Java 25 is here", r);
            });
            test("normalize strips Unicode whitespace", () -> {
                String r = TextFormat.normalize("\u2003 exam  ready \u2003");
                eq("normalize strips Unicode whitespace", "exam ready", r);
            });
            test("normalize null and blank", () -> {
                String a = TextFormat.normalize(null), b = TextFormat.normalize(" \t\n ");
                check("normalize null and blank", "".equals(a) && "".equals(b), show(a) + " / " + show(b));
            });
            test("row pads every cell", () -> {
                String r = TextFormat.row(new String[] {"id", "name", "ok"}, new int[] {4, 6, 2});
                eq("row pads every cell", "| id   | name   | ok |", r);
            });
            test("row truncates long cells", () -> {
                String r = TextFormat.row(new String[] {"Mississippi", "abcd"}, new int[] {5, 4});
                eq("row truncates long cells", "| Miss~ | abcd |", r);
            });
            test("row null cell and no columns", () -> {
                String r = TextFormat.row(new String[] {null, "x"}, new int[] {2, 1});
                String empty = TextFormat.row(new String[0], new int[0]);
                check("row null cell and no columns", "|    | x |".equals(r) && "|".equals(empty), show(r) + " / " + show(empty));
            });
            test("row rejects invalid input", () -> {
                String a = thrown(() -> TextFormat.row(new String[] {"a", "b"}, new int[] {3}));
                String b = thrown(() -> TextFormat.row(new String[] {"a"}, new int[] {0}));
                check("row rejects invalid input",
                        a.equals("IllegalArgumentException") && b.equals("IllegalArgumentException"),
                        "mismatched lengths -> " + a + ", width 0 -> " + b);
            });
            test("card exact text", () -> {
                String r = TextFormat.card("Ada", "active");
                String expected = "**Ada**  \nStatus: _active_\n    $ status --verbose\n"
                        + "This profile was generated automatically and must not be edited by hand.";
                eq("card exact text", expected, r);
            });
            test("card hard break and no final newline", () -> {
                String r = TextFormat.card("Ada", "active");
                boolean hardBreak = r.startsWith("**Ada**  \n");
                boolean lines = r.lines().count() == 4 && !r.endsWith("\n");
                check("card hard break and no final newline", hardBreak && lines,
                        "first line " + show(r.lines().findFirst().orElse("")) + ", " + r.lines().count()
                        + " lines, ends with newline: " + r.endsWith("\n"));
            });
            test("card normalizes its arguments", () -> {
                String r = TextFormat.card("  Grace \t Hopper ", "on   leave");
                check("card normalizes its arguments",
                        r.startsWith("**Grace Hopper**  \nStatus: _on leave_\n"), show(r));
            });
        }
    }
  explanation: |
    `normalize` combines two String rules. `strip()` (since Java 11) removes every character for which
    `Character.isWhitespace` is true, including U+2003, while `trim()` only removes characters up to U+0020 —
    so `trim()` leaves the em spaces in place. `replaceAll` takes a **regular expression**, so `"\\s+"` matches
    any run of whitespace. Strings are immutable: each call returns a new String that must be used.

    `row` uses one mutable `StringBuilder`: every `append` returns the same builder, `append(cs, start, end)`
    copies a slice whose end index is exclusive, and only the final `toString()` creates a String. Validating
    each width before appending prevents a half-built row.

    The text block exercises the three whitespace rules of text blocks. Incidental indentation — the smallest
    indentation of all non-blank content lines, plus the closing delimiter's line when it stands on its own — is
    removed, so the `$ status` line keeps its four extra spaces. Trailing spaces on every line are stripped,
    so the Markdown hard break needs the `\s` escape: escapes are translated *after* stripping, and the space
    in front of `\s` is no longer trailing, which gives exactly two spaces. A `\` at the end of a line
    suppresses that line terminator and joins the two source lines. Finally, putting the closing `"""` directly
    after the last word means the string does not end with `\n`. `formatted(...)` (Java 15) is
    `String.format` with the text block as the format string.
  hints:
    - '`strip()` removes all Unicode whitespace at both ends, `trim()` only characters up to U+0020. Then `replaceAll("\\s+", " ")` collapses the inner runs.'
    - 'In `row`, `sb.append(cell, 0, width - 1)` appends a slice (end index exclusive) and `" ".repeat(n)` produces the padding.'
    - 'Text blocks strip trailing spaces, but `\s` is translated after stripping and keeps the space before it. A `\` at the end of a line joins it with the next one, and a closing `"""` right after the last word avoids the final newline.'

- id: D1-EX-002
  objective: D1.3
  lesson: values-date-time
  title: Meeting planner across daylight-saving transitions
  difficulty: expert
  kind: implement
  prompt: |
    Implement the public class `Schedule`; all methods are `public static`. Every test uses fixed dates and
    explicit zones. In `Europe/Paris` in 2026 the clocks jump from 02:00 to 03:00 on **29 March** (CET +01:00 →
    CEST +02:00) and fall back from 03:00 to 02:00 on **25 October**. Never call `now()`.

    1. `ZonedDateTime meetingEnd(LocalDateTime start, ZoneId zone, Duration length)` — a meeting starts at the
       wall-clock time `start` in `zone` and lasts exactly `length` of **real elapsed time**. Return its end in
       the same zone. A `start` inside the spring gap is moved forward by the length of the gap; inside the
       autumn overlap the earlier offset applies (the default `ZonedDateTime` rules). Throw
       `IllegalArgumentException` if `length` is zero or negative.
       Example: `meetingEnd(2026-03-29T01:30, Europe/Paris, 90 minutes)` → `2026-03-29T04:00+02:00[Europe/Paris]`.
    2. `Duration calendarDayLength(LocalDate date, ZoneId zone)` — the real length of that calendar day in that
       zone, from its first instant to the first instant of the next day (`PT23H` for 29 March 2026 in Paris).
    3. `ZonedDateTime sameTimeNextDay(ZonedDateTime t)` — one **calendar day** later (`Period.ofDays(1)`).
    4. `ZonedDateTime exactly24HoursLater(ZonedDateTime t)` — `Duration.ofHours(24)` later.
    5. `ZonedDateTime parse(String text, ZoneId zone)` — parses `text` in the pattern `dd/MM/yyyy HH:mm`
       (two-digit day and month, 24-hour clock) as a local date-time in `zone`. Text in any other layout throws
       `DateTimeParseException`.
    6. `String format(ZonedDateTime t)` — `yyyy-MM-dd HH:mm`, a space, and the offset as `+hh:mm`, e.g.
       `"2026-11-07 15:05 +01:00"`.
