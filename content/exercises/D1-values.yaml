  solution: |
    import java.time.*;
    import java.time.format.DateTimeFormatter;
    import java.util.Objects;

    public class Schedule {

        private static final DateTimeFormatter INPUT = DateTimeFormatter.ofPattern("dd/MM/yyyy HH:mm");
        private static final DateTimeFormatter OUTPUT = DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm xxx");

        public static ZonedDateTime meetingEnd(LocalDateTime start, ZoneId zone, Duration length) {
            Objects.requireNonNull(start);
            Objects.requireNonNull(zone);
            if (length.isNegative() || length.isZero())
                throw new IllegalArgumentException("length must be positive: " + length);
            // Attach the zone FIRST (gap -> shifted forward, overlap -> earlier offset),
            // then add the Duration on the instant timeline.
            return ZonedDateTime.of(start, zone).plus(length);
        }

        public static Duration calendarDayLength(LocalDate date, ZoneId zone) {
            return Duration.between(date.atStartOfDay(zone), date.plusDays(1).atStartOfDay(zone));
        }

        public static ZonedDateTime sameTimeNextDay(ZonedDateTime t) {
            return t.plus(Period.ofDays(1));          // local timeline: same wall-clock time
        }

        public static ZonedDateTime exactly24HoursLater(ZonedDateTime t) {
            return t.plus(Duration.ofHours(24));      // instant timeline: 86 400 elapsed seconds
        }

        public static ZonedDateTime parse(String text, ZoneId zone) {
            return LocalDateTime.parse(text, INPUT).atZone(zone);
        }

        public static String format(ZonedDateTime t) {
            return OUTPUT.format(t);
        }
    }
  harness: |
    import java.time.*;
    import java.time.format.DateTimeParseException;

    public class Main {
        static final ZoneId PARIS = ZoneId.of("Europe/Paris");

        static void check(String name, boolean ok, Object detail) {
            System.out.println(ok ? "PASS " + name : "FAIL " + name + ": got " + detail);
        }
        static void eq(String name, Object expected, Object actual) {
            check(name, expected.equals(actual), actual + ", expected " + expected);
        }
        static ZonedDateTime z(String text) { return ZonedDateTime.parse(text); }
        interface Body { void run() throws Exception; }
        static void test(String name, Body body) {
            try { body.run(); } catch (Throwable t) { System.out.println("FAIL " + name + ": unexpected " + t); }
        }
        static String thrown(Runnable r) {
            try { r.run(); return "no exception"; } catch (RuntimeException e) { return e.getClass().getSimpleName(); }
        }

        public static void main(String[] args) {
            test("meeting on an ordinary day", () -> {
                var r = Schedule.meetingEnd(LocalDateTime.of(2026, 6, 10, 9, 0), PARIS, Duration.ofMinutes(90));
                eq("meeting on an ordinary day", z("2026-06-10T10:30+02:00[Europe/Paris]"), r);
            });
            test("meeting across spring-forward", () -> {
                var r = Schedule.meetingEnd(LocalDateTime.of(2026, 3, 29, 1, 30), PARIS, Duration.ofMinutes(90));
                eq("meeting across spring-forward", z("2026-03-29T04:00+02:00[Europe/Paris]"), r);
            });
            test("meeting starting in the gap", () -> {
                var r = Schedule.meetingEnd(LocalDateTime.of(2026, 3, 29, 2, 30), PARIS, Duration.ofMinutes(30));
                eq("meeting starting in the gap", z("2026-03-29T04:00+02:00[Europe/Paris]"), r);
            });
            test("meeting in the autumn overlap", () -> {
                var r = Schedule.meetingEnd(LocalDateTime.of(2026, 10, 25, 2, 30), PARIS, Duration.ofHours(1));
                eq("meeting in the autumn overlap", z("2026-10-25T02:30+01:00[Europe/Paris]"), r);
            });
            test("meeting length must be positive", () -> {
                var start = LocalDateTime.of(2026, 6, 10, 9, 0);
                String zero = thrown(() -> Schedule.meetingEnd(start, PARIS, Duration.ZERO));
                String negative = thrown(() -> Schedule.meetingEnd(start, PARIS, Duration.ofMinutes(-5)));
                check("meeting length must be positive",
                        zero.equals("IllegalArgumentException") && negative.equals("IllegalArgumentException"),
                        "zero -> " + zero + ", negative -> " + negative);
            });
            test("calendar day lengths", () -> {
                var spring = Schedule.calendarDayLength(LocalDate.of(2026, 3, 29), PARIS);
                var autumn = Schedule.calendarDayLength(LocalDate.of(2026, 10, 25), PARIS);
                var normal = Schedule.calendarDayLength(LocalDate.of(2026, 6, 10), PARIS);
                var utc = Schedule.calendarDayLength(LocalDate.of(2026, 3, 29), ZoneOffset.UTC);
                check("calendar day lengths",
                        spring.equals(Duration.ofHours(23)) && autumn.equals(Duration.ofHours(25))
                        && normal.equals(Duration.ofHours(24)) && utc.equals(Duration.ofHours(24)),
                        "spring " + spring + ", autumn " + autumn + ", normal " + normal + ", UTC " + utc);
            });
            test("Period day vs Duration of 24 hours", () -> {
                var saturday = z("2026-03-28T09:00+01:00[Europe/Paris]");
                var calendar = Schedule.sameTimeNextDay(saturday);
                var exact = Schedule.exactly24HoursLater(saturday);
                check("Period day vs Duration of 24 hours",
                        calendar.equals(z("2026-03-29T09:00+02:00[Europe/Paris]"))
                        && exact.equals(z("2026-03-29T10:00+02:00[Europe/Paris]")),
                        "sameTimeNextDay " + calendar + ", exactly24HoursLater " + exact);
            });
            test("parse with the dd/MM/yyyy HH:mm pattern", () -> {
                var afternoon = Schedule.parse("07/11/2026 15:05", PARIS);
                var gap = Schedule.parse("29/03/2026 02:30", PARIS);
                check("parse with the dd/MM/yyyy HH:mm pattern",
                        afternoon.equals(z("2026-11-07T15:05+01:00[Europe/Paris]"))
                        && gap.equals(z("2026-03-29T03:30+02:00[Europe/Paris]")),
                        afternoon + " / " + gap);
            });
            test("parse rejects other layouts", () -> {
                String iso = thrown(() -> Schedule.parse("2026-03-29 10:00", PARIS));
                String oneDigit = thrown(() -> Schedule.parse("29/3/2026 10:00", PARIS));
                check("parse rejects other layouts",
                        iso.equals("DateTimeParseException") && oneDigit.equals("DateTimeParseException"),
                        "\"2026-03-29 10:00\" -> " + iso + ", \"29/3/2026 10:00\" -> " + oneDigit);
            });
            test("format with offset", () -> {
                var a = Schedule.format(z("2026-11-07T15:05+01:00[Europe/Paris]"));
                var b = Schedule.format(z("2026-03-29T04:00+02:00[Europe/Paris]"));
                check("format with offset", a.equals("2026-11-07 15:05 +01:00") && b.equals("2026-03-29 04:00 +02:00"),
                        "\"" + a + "\" / \"" + b + "\"");
            });
        }
    }
  explanation: |
    A `ZonedDateTime` is a local date-time plus a zone plus the offset chosen for that moment.
    `ZonedDateTime.of(start, zone)` resolves the local time against the zone rules: 02:30 on 29 March does not
    exist in Paris, so it is shifted forward by the length of the gap to 03:30+02:00; 02:30 on 25 October
    exists twice and the **earlier** offset (+02:00) is kept. `plus(Duration)` then works on the instant
    timeline: 01:30+01:00 plus 90 minutes is 04:00+02:00, and the meeting starting at 02:30+02:00 in the
    overlap ends at 02:30+01:00 — the same wall-clock time it started. The tempting
    `start.plus(length).atZone(zone)` adds *wall-clock* time and gives 03:00 and 03:30 instead.

    Date-based amounts (`plus(Period.ofDays(1))`, `plusDays(1)`) operate on the local timeline: the wall-clock
    time stays 09:00 and the offset is adjusted. Time-based amounts (`plus(Duration.ofHours(24))`,
    `plusHours(24)`) add exactly 86,400 seconds, which on the 23-hour day lands at 10:00. The same idea gives
    the length of a day: `Duration.between(date.atStartOfDay(zone), date.plusDays(1).atStartOfDay(zone))` is
    PT23H, PT25H or PT24H — and always PT24H in UTC.

    `DateTimeFormatter` pattern letters are case-sensitive: `MM` month vs `mm` minute, `HH` hour 0–23 vs `hh`
    clock hour 1–12 (meaningful only with `a`), `yyyy` year-of-era vs `YYYY` week-based year. `xxx` prints the
    offset as `+01:00` (`XXX` would print `Z` for a zero offset). Parsing with `ofPattern` expects exactly two
    digits for `dd` and `MM`, so `29/3/2026 10:00` fails with `DateTimeParseException`, and a parsed local time
    that falls into a gap is shifted exactly like in `meetingEnd`.
  hints:
    - "Attach the zone first and add the `Duration` afterwards: `ZonedDateTime.of(start, zone).plus(length)`. Adding to the `LocalDateTime` first adds wall-clock time, which is wrong whenever the clocks change during the meeting."
    - "`date.atStartOfDay(zone)` gives the first instant of a day in that zone, and `Duration.between` of two `ZonedDateTime`s measures elapsed time."
    - "`plus(Period)` and `plusDays` work on the local timeline, `plus(Duration)` and `plusHours` on the instant timeline. In patterns `MM` is month, `mm` minute, `HH` the 0-23 hour, and `xxx` an offset like `+02:00`."
