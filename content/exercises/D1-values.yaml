# D1 — Java values (strings, text blocks, date-time) coding exercises

- id: D1-EX-001
  objective: D1.2
  lesson: values-strings-text
  title: Text formatter — whitespace, padded table rows and an exact text block
  difficulty: intermediate
  kind: complete
  prompt: |
    Complete the public class `TextFormat`. All three methods are `public static`.

    1. `String normalize(String s)` returns `s` with leading and trailing whitespace removed — **including
       Unicode whitespace such as U+2003 (em space)** — and every inner run of whitespace (spaces, tabs, line
       breaks) replaced by a single space. `normalize(null)` returns `""`.
       Example: `normalize("  Java \t 25\n is  here ")` → `"Java 25 is here"`.
    2. `String row(String[] cells, int[] widths)` builds one table row **with a `StringBuilder`**. The row
       starts with `|`; then, for every cell: a space, the cell text left-aligned and padded with spaces to
       exactly `widths[i]` characters, a space and `|`. A `null` cell counts as empty text. A cell longer than
       its width is cut to `width - 1` characters followed by `~`.
       - `row(new String[] {"id", "name"}, new int[] {4, 6})` → `"| id   | name   |"`
       - `row(new String[] {"Mississippi"}, new int[] {5})` → `"| Miss~ |"`
       - no columns at all → `"|"`

       Throw `IllegalArgumentException` if the two arrays have different lengths or a width is less than 1.
    3. `String card(String name, String status)` is already written: it returns
       `CARD.formatted(normalize(name), normalize(status))`. Fix the **text block** `CARD` — it must stay a
       text block — so that `card("Ada", "active")` returns exactly

       ```
       "**Ada**  \nStatus: _active_\n    $ status --verbose\nThis profile was generated automatically and must not be edited by hand."
       ```

       Line 1 ends with **two spaces** (a Markdown hard line break), line 3 keeps its four-space indent, the
       last sentence is **one line** although it is written over two source lines, and the card does **not**
       end with a line break.
