# D8 — executor and virtual-thread coding exercises

- id: D8-EX-010
  objective: D8.1
  lesson: conc-threads-executors
  title: Fetching quotes on virtual threads with invokeAll
  difficulty: advanced
  kind: complete
  prompt: |
    `PriceFetcher` asks several slow quote services for a price at the same time. Complete both
    `public static` methods. Each call must create its own executor with
    **`Executors.newVirtualThreadPerTaskExecutor()`** in a **try-with-resources** statement, so that no task
    is still running when the method returns.

    1. `List<Integer> fetchAll(List<Callable<Integer>> tasks) throws InterruptedException` runs all tasks
       concurrently (one virtual thread each) and returns their results **in the order of `tasks`**, no matter
       which task finishes first. If a task throws, throw an `IllegalStateException` with the message
       `"task <i> failed"` (`i` = 0-based index of the first failed task in list order) whose **cause is the
       exception the task threw** — not the `ExecutionException` that wraps it. An empty list gives an empty
       list; a `null` list throws `NullPointerException`.
    2. `List<Optional<Integer>> fetchWithin(List<Callable<Integer>> tasks, Duration timeout) throws InterruptedException`
       works like `fetchAll` but waits at most `timeout` in total. It returns one `Optional` per task, in task
       order: the result if the task completed with a non-`null` value, otherwise `Optional.empty()` (the task
       threw, returned `null`, or was still running at the deadline). Tasks still running at the deadline must
       be **cancelled**, so the method returns promptly instead of waiting for them. A zero or negative
       `timeout` throws `IllegalArgumentException`.
