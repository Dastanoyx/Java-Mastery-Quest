- id: D2-EX-001
  objective: D2.1
  lesson: flow-decisions-switch
  title: Message router with switch expressions and patterns
  difficulty: intermediate
  kind: implement
  prompt: |
    A monitoring service receives messages of mixed types and must decide where each one goes. The message
    types are already declared in `Solution.java` (do not change them):

    ```java
    enum Level { DEBUG, INFO, WARN, ERROR }
    record Login(String user, boolean success) {}
    record Payment(String id, long cents) {}
    record Alert(Level level, String text) {}
    ```

    Implement the two static methods of `Solution`:

    1. `int severity(Level level)` — `DEBUG` and `INFO` → `0`, `WARN` → `1`, `ERROR` → `2`. Write it as a
       **switch expression without `default`** (listing every constant makes it exhaustive).
    2. `String route(Object msg)` — a **single switch expression** using `case null`, record patterns and
       `when` guards:

    | Message | Result |
    |---|---|
    | `null` | `"drop"` |
    | `Login(user, true)` | `"auth:" + user` |
    | `Login(user, false)` | `"security:" + user` |
    | `Payment(id, cents)` with `cents <= 0` | `"reject:" + id` |
    | `Payment(id, cents)` with `cents >= 100_000` | `"review:" + id` |
    | any other `Payment` | `"ledger:" + id` |
    | `Alert(level, text)` with `severity(level) == 2` | `"pager:" + text` |
    | any other `Alert` | `"log:" + text` |
    | a blank `String` (`isBlank()`) | `"drop"` |
    | any other `String` | `"text:" + s.strip()` |
    | anything else | `"unknown:" + simple class name` (e.g. `"unknown:Integer"`) |

    Watch the order of your labels: a guarded case must come before the unguarded case of the same type,
    and `default` must come last.
