  title: Two custom gatherers — parcel batching and read-until-error
  difficulty: advanced
  kind: implement
  prompt: |
    Implement two reusable intermediate operations as **Stream Gatherers** (final since Java 24, JEP 485).

    1. `Gatherer<Integer, ?, List<Integer>> batchByWeight(int maxWeight)` — a shipping service loads parcels
       (their weights, in arrival order) into trucks. Emit consecutive parcels as one `List<Integer>` per truck
       so that each truck's total weight is **at most `maxWeight`**; when the next parcel does not fit, the
       current truck leaves and a new one starts. A parcel heavier than `maxWeight` travels **alone** in its own
       truck. The last, partly filled truck must be emitted too; an empty stream emits nothing. If
       `maxWeight < 1`, throw `IllegalArgumentException` **when the gatherer is created**. Emitted lists must
       not change afterwards. The gatherer must stay lazy — it should not read the whole stream before emitting.
    2. `<T> Gatherer<T, ?, T> takeUntilInclusive(Predicate<? super T> stop)` — passes elements through up to
       **and including** the first element that matches `stop`, then **stops pulling** from upstream (like
       `takeWhile`, but keeping the matching element). If nothing matches, every element passes.

    Both are sequential gatherers: use `Gatherer.ofSequential(...)`. Remember that the integrator's boolean
    return value means "send me more elements".
