      java:
        source: |
          public class Main { public static void main(String[] args) {
              for (int i = 0; i < 3; i++) { } System.out.println(i);
          } }
        expect: { compiles: false, errorContains: "cannot find symbol" }
    - key: d
      text: "`int i; for (i = 0; i < 3; i++) { } System.out.println(i);`"
      correct: true
      why: Here i is declared before the loop and the init part is only an assignment, so i is still in scope (and holds 3) after the loop.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              int i; for (i = 0; i < 3; i++) { } System.out.println(i);
          } }
        expect: { compiles: true, stdout: "3" }
    - key: e
      text: "`for (int i = 0; i < 3; i++) { int i = 5; }`"
      why: The loop variable is still in scope inside the body, and a local may not be redeclared while it is in scope.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              for (int i = 0; i < 3; i++) { int i = 5; }
          } }
        expect: { compiles: false, errorContains: "already defined" }
    - key: f
      text: "`for (var i = 0, j = 1; i < 3; i++) { }`"
      why: "`var` may declare only one variable per declaration: 'var' is not allowed in a compound declaration."
      java:
        source: |
          public class Main { public static void main(String[] args) {
              for (var i = 0, j = 1; i < 3; i++) { }
          } }
        expect: { compiles: false, errorContains: "compound declaration" }
    - key: g
      text: "`int k = 0; for (System.out.print(\"go \"); k < 2; k++, System.out.print(k)) { }`"
      correct: true
      why: Instead of a declaration, the init part may be a list of expression statements; method calls are allowed in both init and update.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              int k = 0; for (System.out.print("go "); k < 2; k++, System.out.print(k)) { }
          } }
        expect: { compiles: true, stdout: "go 12" }
  explanation: |
    The init part of a basic for loop is either one local variable declaration (one type, possibly several
    variables) or a comma-separated list of expression statements; the update part is always a list of expression
    statements. Variables declared in the header are scoped to the loop (header and body) and cannot be
    redeclared in the body. `var` works in a for header, but only for a single variable.
  rule: "for (ForInit; Expr; ForUpdate): ForInit is one LocalVariableDeclaration or a StatementExpressionList; its variables are scoped to the for statement (JLS 14.14.1, 6.3)."
  misconception: "A for header may declare variables of different types, and its variables survive the loop."
  hint: Check each header against "one declaration, one type" and each later use against the loop's scope.

- id: D2-FLW-022
  objective: D2.1
  lesson: flow-loops-branching
  type: multi
  format: select-valid
  difficulty: expert
  estSeconds: 180
  tags: [reachability, missing-return, infinite-loop, can-complete-normally]
  prompt: Which of the following methods fail to compile? Choose two.
  options:
    - key: a
      text: "`static int f() { while (true) { } }`"
      why: An infinite loop with no break cannot complete normally, so the method can never fall off its end — no return is needed.
      java:
        source: |
          public class Main {
              static int f() { while (true) { } }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: b
      text: "`static int g(int n) { while (true) { if (n > 10) return n; n *= 2; } }`"
      why: Leaving through return does not make the while statement complete normally; there is no break, so the end of the method is unreachable.
      java:
        source: |
          public class Main {
              static int g(int n) { while (true) { if (n > 10) return n; n *= 2; } }
              public static void main(String[] args) { System.out.println(g(3)); }
          }
        expect: { compiles: true, stdout: "12" }
    - key: c
      text: "`static int h(int n) { for (;;) { if (n > 10) break; n *= 2; } }`"
      correct: true
      why: "The reachable break lets the loop complete normally, after which the method falls off its end: missing return statement."
      java:
        source: |
          public class Main {
              static int h(int n) { for (;;) { if (n > 10) break; n *= 2; } }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "missing return statement" }
    - key: d
      text: "`static int k(int n) { do { n++; } while (true); }`"
      why: A do-while with constant true condition and no break cannot complete normally, exactly like while (true).
      java:
        source: |
          public class Main {
              static int k(int n) { do { n++; } while (true); }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: e
      text: "`static int m(int n) { if (true) return n; }`"
      correct: true
      why: "Because if is exempt from constant evaluation, an if-then statement can always complete normally; javac reports missing return statement."
      java:
        source: |
          public class Main {
              static int m(int n) { if (true) return n; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "missing return statement" }
  explanation: |
    A non-void method fails with *missing return statement* if its body can complete normally. A `while (true)`,
    `do … while (true)` or condition-less `for` loop can complete normally only if it contains a reachable `break`
    that targets it — `return` inside does not count. The `if` statement, by contrast, is analysed as if its
    condition were unknown, so `if (true) return n;` still lets execution "fall off" the method as far as javac
    is concerned.
  rule: "A method body that can complete normally needs a return; infinite loops without a break cannot complete normally, but an if-then always can (JLS 8.4.7, 14.22)."
  misconception: "`if (true) return x;` is treated like an unconditional return."
  hint: For each method, ask whether javac thinks the end of the body is reachable.

