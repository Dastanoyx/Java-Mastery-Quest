    - key: b
      text: "`switch (o) { case Integer i, Long l -> \"integral\"; default -> \"other\"; }`"
      why: With named bindings, only one of i or l would be initialised, so grouping patterns that declare variables is illegal.
      java:
        source: |
          public class Main {
              static String f(Object o) { return switch (o) { case Integer i, Long l -> "integral"; default -> "other"; }; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false }
    - key: c
      text: "`switch (o) { case Point(int x, _) -> x; default -> 0; }`"
      correct: true
      why: The unnamed pattern `_` may replace a component pattern in a record pattern; it matches any value of that component.
      java:
        source: |
          record Point(int x, int y) {}
          public class Main {
              static int f(Object o) { return switch (o) { case Point(int x, _) -> x; default -> 0; }; }
              public static void main(String[] args) { System.out.println(f(new Point(3, 4))); }
          }
        expect: { compiles: true, stdout: "3" }
    - key: d
      text: "`switch (o) { case Integer i -> i; case _ -> 0; }`"
      why: "The unnamed pattern is allowed only nested inside a record pattern; a top-level `case _` is rejected (use default or `case Object _`)."
      java:
        source: |
          public class Main {
              static int f(Object o) { return switch (o) { case Integer i -> i; case _ -> 0; }; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "underscore not allowed here" }
    - key: e
      text: "`switch (o) { case String _ -> _.length(); default -> 0; }`"
      why: "`_` declares a variable that can never be read; using it as an expression is a compile error."
      java:
        source: |
          public class Main {
              static int f(Object o) { return switch (o) { case String _ -> _.length(); default -> 0; }; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false }
    - key: f
      text: "`switch (o) { case Point(var x, var _) -> x; default -> 0; }`"
      correct: true
      why: "`var _` is an unnamed pattern variable with an inferred type; like `_` it matches the component without binding it."
      java:
        source: |
          record Point(int x, int y) {}
          public class Main {
              static int f(Object o) { return switch (o) { case Point(var x, var _) -> x; default -> 0; }; }
              public static void main(String[] args) { System.out.println(f(new Point(5, 6))); }
          }
        expect: { compiles: true, stdout: "5" }
  explanation: |
    JEP 456 (final since Java 22) adds unnamed variables and patterns. In a switch, `Type _` is a type pattern
    that binds nothing, `_` alone is an unnamed pattern usable only as a nested component of a record pattern,
    and `var _` is equivalent to it. Because unnamed patterns bind nothing, several of them may be grouped in one
    case label (`case Integer _, Long _`). An unnamed variable can never be referenced.
  rule: "JEP 456: _ may replace a nested pattern or a binding name; it binds nothing and cannot be read; a case label may group patterns only if none declares a named variable (JLS 14.30.1)."
  misconception: "`_` is an ordinary identifier, or `case _` is a catch-all label."
  hint: Where may `_` stand on its own, and what happens if a grouped pattern declares a name?
