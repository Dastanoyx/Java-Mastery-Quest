# ───────────────────────── decisions, switch statements & expressions ─────────────────────────

- id: D2-FLW-001
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [switch-statement, fallthrough, default, break, loop]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            StringBuilder sb = new StringBuilder();
            for (int i = 1; i <= 4; i++) {
                switch (i) {
                    case 1:
                        sb.append('a');
                    case 2:
                        sb.append('b');
                        break;
                    default:
                        sb.append('d');
                    case 4:
                        sb.append('e');
                }
                sb.append('|');
            }
            System.out.println(sb);
        }
    }
  options:
    - key: a
      text: "`ab|b|de|e|`"
      correct: true
      why: "i=1 enters at case 1 and falls into case 2 until break; i=2 prints only b; i=3 matches nothing, jumps to default and falls through into case 4; i=4 jumps straight to case 4."
    - key: b
      text: "`a|b|d|e|`"
      why: This treats colon labels like arrow labels. A `:` switch keeps executing the following groups until a `break` (or the end of the switch).
    - key: c
      text: "`ab|b|d|e|`"
      why: This assumes `default` ends the switch. Fallthrough ignores label kinds, so after `default` the code of `case 4` also runs.
    - key: d
      text: "`ab|b|de|de|`"
      why: This assumes execution always passes through `default` first. For i=4 the switch jumps directly to `case 4`; `default` is chosen only when no label matches.
    - key: e
      text: Compilation fails because `default` must be the last label
      why: "`default` may appear anywhere in a switch statement; its position only matters for fallthrough."
  explanation: |
    A switch statement with `:` labels jumps to the matching label (or to `default` when none matches) and then
    executes every following statement, across other labels, until a `break` or the end of the block. The
    `break` inside the switch leaves only the switch, so the loop continues and appends `|` every time.
    Placing `default` in the middle is legal; it is still selected only when no constant matches (i=3 here).
  rule: "A `:` switch falls through from the selected label until break or the end of the switch; default is selected only when no case matches, wherever it is written."
  misconception: "\"default always runs last\" or \"each case label stops at the next label\"."
  hint: For i=3, which label is selected, and where does execution stop?
  java:
    expect: { compiles: true, stdout: "ab|b|de|e|" }

- id: D2-FLW-002
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [if-else, dangling-else, loop-body, braces]
  prompt: What is the output of the following program? (Read the code, not the indentation.)
  code: |
    public class Main {
        public static void main(String[] args) {
            int n = 0;
            for (int i = 0; i < 4; i++)
                if (i % 2 == 0)
                    if (i > 1) n += 10;
                else n += 1;
            System.out.println(n);
        }
    }
  options:
    - key: a
      text: "`11`"
      correct: true
      why: "The else belongs to `if (i > 1)`. For i=0 the inner test fails → +1; for i=2 → +10; odd values skip the outer if entirely."
    - key: b
      text: "`12`"
      why: This pairs the else with the outer `if (i % 2 == 0)`, as the indentation suggests. An else always binds to the nearest preceding if that has no else.
    - key: c
      text: "`10`"
      why: This ignores the else completely. It is part of the inner if statement and runs for i=0.
    - key: d
      text: "Compilation fails: 'else' without 'if'"
      why: The whole nested if/else is one statement, so it is a legal brace-less body of the for loop and the else has an if to pair with.
  explanation: |
    Without braces, a for loop controls exactly one statement — here the entire nested `if` statement, including
    its `else`. The `else` binds to the closest `if` that does not already have one, which is `if (i > 1)`,
    regardless of how it is indented. So even numbers below 2 add 1, even numbers from 2 add 10, odd numbers add
    nothing: 1 + 10 = 11.
  rule: "An else belongs to the nearest preceding if without an else (JLS 14.5, dangling else); a brace-less loop body is one statement."
  misconception: Indentation decides which if an else belongs to.
  hint: Which `if` is closest to the `else` and still has no else of its own?
  java:
    expect: { compiles: true, stdout: "11" }

- id: D2-FLW-003
  objective: D2.1
  lesson: flow-decisions-switch
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 150
  tags: [switch-statement, selector-type, constant-expression, case-label]
  prompt: Which of the following code fragments compile? Choose three.
  options:
    - key: a
      text: "`long id = 7L; switch (id) { case 7: System.out.print(\"seven\"); }`"
      why: "`long` is not a legal selector type for a constant switch; Java 25 rejects it (primitive patterns for long are only a preview feature)."
      java:
        source: |
          public class Main { public static void main(String[] args) {
              long id = 7L; switch (id) { case 7: System.out.print("seven"); }
          } }
        expect: { compiles: false, errorContains: "not compatible with switch selector type long" }
    - key: b
      text: "`final int LIMIT = 3; int n = 3; switch (n) { case 1, LIMIT -> System.out.print(\"hit\"); default -> { } }`"
      correct: true
      why: A final local initialised with a constant is a constant variable, so `LIMIT` is a valid case constant; several constants may share one arrow label.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              final int LIMIT = 3; int n = 3; switch (n) { case 1, LIMIT -> System.out.print("hit"); default -> { } }
          } }
        expect: { compiles: true, stdout: "hit" }
    - key: c
      text: "`byte b = 10; switch (b) { case 10: case 200: System.out.print(\"x\"); }`"
      why: "Every case constant must be assignable to the selector type; 200 does not fit in a byte (possible lossy conversion from int to byte)."
      java:
        source: |
          public class Main { public static void main(String[] args) {
              byte b = 10; switch (b) { case 10: case 200: System.out.print("x"); }
          } }
        expect: { compiles: false, errorContains: "possible lossy conversion from int to byte" }
    - key: d
      text: "`String cmd = \"stop\"; switch (cmd) { case \"go\", \"start\": System.out.print(1); break; case \"stop\": System.out.print(2); }`"
      correct: true
      why: String is a legal selector type and a colon label may also list several comma-separated constants.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              String cmd = "stop"; switch (cmd) { case "go", "start": System.out.print(1); break; case "stop": System.out.print(2); }
          } }
        expect: { compiles: true, stdout: "2" }
    - key: e
      text: "`int limit = 3; int n = 3; switch (n) { case limit: System.out.print(\"hit\"); }`"
      why: "`limit` is an ordinary (non-final) variable, so it is not a compile-time constant: constant expression required."
      java:
        source: |
          public class Main { public static void main(String[] args) {
              int limit = 3; int n = 3; switch (n) { case limit: System.out.print("hit"); }
          } }
        expect: { compiles: false, errorContains: "constant expression required" }
    - key: f
      text: "`Character c = 'x'; switch (c) { case 'x' -> System.out.print(\"x\"); case 'y' -> System.out.print(\"y\"); }`"
      correct: true
      why: Wrapper types of char, byte, short and int are legal selectors (unboxed); a constant-label switch statement does not have to be exhaustive.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              Character c = 'x'; switch (c) { case 'x' -> System.out.print("x"); case 'y' -> System.out.print("y"); }
          } }
        expect: { compiles: true, stdout: "x" }
  explanation: |
    A switch that uses only constant labels accepts `char`, `byte`, `short`, `int`, their wrappers, `String` and
    enums. Each case constant must be a compile-time constant (a literal or a `final` variable initialised with a
    constant expression), must be assignable to the selector type, and must be unique. `long`, `float`, `double`
    and `boolean` selectors are rejected in Java 25, where switching on them belongs to the preview feature
    "primitive types in patterns".
  rule: "Constant switch: selector char/byte/short/int (+ wrappers), String or enum; labels are compile-time constants assignable to the selector type (JLS 14.11.1)."
  misconception: Any integral type, and any variable with the right value, can be used in a switch.
  hint: For each fragment, check the selector type first, then whether every label is a constant that fits.

- id: D2-FLW-004
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [switch-expression, numeric-promotion, var, result-type]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            char c = 'b';
            var r = switch (c) {
                case 'a' -> 1;
                case 'b' -> 'B';
                default -> 2L;
            };
            var q = switch (c) {
                case 'a' -> 'A';
                default -> 66;
            };
            System.out.println(r);
            System.out.println(q);
        }
    }
  options:
    - key: a
      text: |
        66
        B
      correct: true
      why: "The first switch mixes int, char and long results, so its type is long and 'B' becomes 66L. The second mixes char with the int constant 66, which fits in a char, so its type is char and prints B."
    - key: b
      text: |
        B
        B
      why: This assumes each arm keeps its own type at run time. A switch expression has one static type, and in the first switch the long arm promotes every result to long.
    - key: c
      text: |
        66
        66
      why: This applies "int and char give int" to the second switch. When the int arm is a constant representable as char, the result type is char.
    - key: d
      text: Compilation fails because the arms of a switch expression have different types
      why: Numeric arms of different types are allowed; the result type is computed with rules similar to those of the conditional operator `?:`.
  explanation: |
    A standalone switch expression (here the target is `var`) whose arms are all numeric gets one numeric type:
    if any arm is `double` → double; else `float`; else `long`; else, if one arm is `char` and the others are
    `int` constants representable as `char`, the type is `char`; otherwise `int` (JLS §15.28.1). The first switch
    is therefore `long` (prints 66) and the second is `char`, so the selected arm `default -> 66` produces the
    character `B`.
  rule: "Numeric switch expression type follows the ?: promotion rules: double > float > long > (char if int constants fit) > int (JLS 15.28.1)."
  misconception: "A switch expression's value keeps the type of whichever arm was selected."
  hint: Determine each switch expression's static type before you evaluate it.
  java:
    expect: { compiles: true, stdout: "66\nB" }

- id: D2-FLW-005
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 75
  tags: [if-else, assignment-in-condition, else-if]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            boolean done = false;
            int count = 0;
            if (done = true) count++;
            if (done == false) count += 10;
            else if (count > 0) count += 100;
            else count += 1000;
            System.out.println(done + " " + count);
        }
    }
  options:
    - key: a
      text: "`true 101`"
      correct: true
      why: "`done = true` assigns true and the assignment's value (true) is the condition, so count becomes 1; then the else-if chain takes exactly one branch (+100)."
    - key: b
      text: "`false 10`"
      why: This reads `=` as a comparison. In Java `=` is assignment; with a boolean variable, the assignment expression has type boolean and compiles.
    - key: c
      text: "`true 1101`"
      why: An else-if chain stops at the first true condition; the final else does not run as well.
    - key: d
      text: Compilation fails because an assignment cannot be used as an if condition
      why: "That is true only when the assigned type is not boolean (e.g. `if (x = 5)` with int x). Assigning a boolean yields a boolean value, which is a valid condition."
  explanation: |
    An if condition must have type `boolean` (or `Boolean`). An assignment is an expression whose value is the
    assigned value, so `if (done = true)` compiles, stores `true` and always takes the then-branch. The same
    mistake with an `int` (`if (x = 5)`) fails to compile because an int is not a boolean. An `else if` chain
    evaluates conditions top to bottom and runs only the first branch whose condition is true.
  rule: "The if condition must be of type boolean/Boolean; an assignment expression has the value and type of its left operand (JLS 15.26)."
  misconception: "`if (flag = true)` is a comparison, or it never compiles."
  hint: What is the value of the expression `done = true`?
  java:
    expect: { compiles: true, stdout: "true 101" }

- id: D2-FLW-006
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: compile-error
  difficulty: foundation
  estSeconds: 60
  tags: [if-else, braces, else-without-if]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int stock = 0;
            if (stock > 0)
                System.out.println("ship");
                System.out.println("notify");
            else
                System.out.println("backorder");
        }
    }
  options:
    - key: a
      text: Line 7 does not compile
      correct: true
      why: "Without braces the if controls only line 5. Line 6 is an ordinary statement, so the else on line 7 has no if to belong to: 'else' without 'if'."
    - key: b
      text: Line 6 does not compile
      why: A second statement after a brace-less if is perfectly legal on its own — it simply is not part of the if.
    - key: c
      text: It compiles and prints `backorder`
      why: This trusts the indentation. The if body is only the first statement, which breaks the if/else pairing.
    - key: d
      text: It compiles and prints `notify` and then `backorder`
      why: This correctly sees that `notify` is outside the if, but an else cannot follow an unrelated statement — the code never compiles.
  explanation: |
    A brace-less `if` controls exactly one statement. After `System.out.println("ship");` the if statement is
    complete, `System.out.println("notify");` is the next statement of the block, and an `else` cannot start a
    statement on its own. javac reports *'else' without 'if'* at the else. Always use braces when a branch has
    more than one statement.
  rule: "if (cond) Statement [else Statement] — each branch is a single statement unless a block {} is used (JLS 14.9)."
  misconception: Indented lines under an if all belong to it.
  hint: Where does the if statement end?
  java:
    expect: { compiles: false, errorContains: "'else' without 'if'", errorLine: 7 }

- id: D2-FLW-007
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: compile-error
  difficulty: intermediate
  estSeconds: 100
  tags: [pattern-switch, dominance, guard]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static String label(Object o) {
            return switch (o) {
                case Integer i when i > 100 -> "big";
                case Integer i -> "int";
                case CharSequence cs -> "chars";
                case String s -> "string";
                default -> "other";
            };
        }
        public static void main(String[] args) {
            System.out.println(label(500) + " " + label("x"));
        }
    }
  options:
    - key: a
      text: Line 5 does not compile
      why: A guarded pattern never dominates an unguarded one, so `case Integer i` after the guarded case is legal (and required for Integers ≤ 100).
    - key: b
      text: Line 7 does not compile
      correct: true
      why: "`String` is a subtype of `CharSequence`, so every String is already matched by the unguarded `case CharSequence cs`: this case label is dominated by a preceding case label."
    - key: c
      text: It compiles and prints `big string`
      why: Labels are not reordered by specificity. Since line 6 already catches every String, javac rejects line 7 instead of silently skipping it.
    - key: d
      text: It compiles and prints `big chars`
      why: This correctly predicts which label would win for "x", but dominated labels are compile errors, not merely dead code.
  explanation: |
    Pattern labels are tried top to bottom, and javac rejects any label that can never be selected because an
    earlier **unguarded** pattern matches everything it could match (*this case label is dominated by a
    preceding case label*). `case CharSequence cs` dominates `case String s`. Guards are not analysed, so a
    guarded label never dominates anything — that is why the guarded `Integer` case must come first.
    Fix: move `case String s` above `case CharSequence cs`.
  rule: "A case label is dominated (compile error) if an earlier unguarded pattern label matches every value it could match (JLS 14.11.1)."
  misconception: The most specific pattern is chosen, as in overload resolution, so order does not matter.
  hint: Can any String ever reach line 7?
  java:
    expect: { compiles: false, errorContains: "dominated by a preceding case label", errorLine: 7 }

- id: D2-FLW-008
  objective: D2.1
  lesson: flow-decisions-switch
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 180
  tags: [instanceof, pattern-variable, flow-scoping]
  prompt: Which of the following methods compile? Choose three.
  options:
    - key: a
      text: "`static int a(Object o) { if (o instanceof String s && s.length() > 2) return s.length(); return 0; }`"
      correct: true
      why: On the right of `&&` and in the then-statement the match is certain, so `s` is in scope there.
      java:
        source: |
          public class Main {
              static int a(Object o) { if (o instanceof String s && s.length() > 2) return s.length(); return 0; }
              public static void main(String[] args) { System.out.println(a("java")); }
          }
        expect: { compiles: true, stdout: "4" }
    - key: b
      text: "`static int b(Object o) { if (o instanceof String s || s.isEmpty()) return 1; return 0; }`"
      why: The right operand of `||` runs only when the match FAILED, so `s` is not in scope there (cannot find symbol).
      java:
        source: |
          public class Main {
              static int b(Object o) { if (o instanceof String s || s.isEmpty()) return 1; return 0; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "cannot find symbol" }
    - key: c
      text: "`static int c(Object o) { if (!(o instanceof String s)) return -1; return s.length(); }`"
      correct: true
      why: The then-branch always returns, so after the if statement the pattern has definitely matched and `s` is in scope.
      java:
        source: |
          public class Main {
              static int c(Object o) { if (!(o instanceof String s)) return -1; return s.length(); }
              public static void main(String[] args) { System.out.println(c("ab") + " " + c(1)); }
          }
        expect: { compiles: true, stdout: "2 -1" }
    - key: d
      text: "`static int d(Object o) { if (!(o instanceof String s)) { System.out.println(\"no\"); } return s.length(); }`"
      why: The then-block can complete normally, so execution may reach the return without a match; `s` is not introduced after the if.
      java:
        source: |
          public class Main {
              static int d(Object o) { if (!(o instanceof String s)) { System.out.println("no"); } return s.length(); }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "cannot find symbol" }
    - key: e
      text: "`static int e(Object o) { if (o instanceof String s) { } else { return s.length(); } return 0; }`"
      why: The else branch runs exactly when the match failed, so `s` is not in scope there.
      java:
        source: |
          public class Main {
              static int e(Object o) { if (o instanceof String s) { } else { return s.length(); } return 0; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "cannot find symbol" }
    - key: f
      text: "`static int f(Object o) { while (!(o instanceof String s)) { o = String.valueOf(o); } return s.length(); }`"
      correct: true
      why: A while loop without break exits only when its condition is false, i.e. when the pattern matched, so `s` is in scope after the loop.
      java:
        source: |
          public class Main {
              static int f(Object o) { while (!(o instanceof String s)) { o = String.valueOf(o); } return s.length(); }
              public static void main(String[] args) { System.out.println(f(12345)); }
          }
        expect: { compiles: true, stdout: "5" }
  explanation: |
    A pattern variable is in scope exactly where the compiler can prove the pattern matched (flow scoping,
    JLS §6.3.1): the right side of `&&`, the then-part of `if (x instanceof T t)`, the else-part of
    `if (!(x instanceof T t))`, and the statements **after** an `if (!(…))` whose then-part cannot complete
    normally (return/throw) or after a `while (!(…))` loop with no `break`. It is never in scope on the right
    of `||` or where the match is known to have failed.
  rule: "Pattern variables are introduced only where the match is definitely true; after if(!(e instanceof T t)) only if the then-branch cannot complete normally (JLS 6.3.1)."
  misconception: A pattern variable is in scope for the rest of the method once it has been declared.
  hint: For each use of `s`, ask "can execution reach this point when the instanceof was false?"

- id: D2-FLW-009
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: runtime-exception
  difficulty: foundation
  estSeconds: 75
  tags: [switch-statement, string-selector, null-selector, NullPointerException]
  prompt: What is the result of running this program?
  code: |
    public class Main {
        static String level(String code) {
            switch (code) {
                case "E": return "error";
                case "W": return "warning";
                default:  return "info";
            }
        }
        public static void main(String[] args) {
            System.out.print(level("W") + " ");
            System.out.print(level(null));
        }
    }
  options:
    - key: a
      text: It prints `warning info`
      why: "`default` is chosen when no constant matches a non-null value; it never receives null."
    - key: b
      text: "It prints `warning ` and then a `NullPointerException` is thrown"
      correct: true
      why: Switching on a null String throws NullPointerException before any label is considered, because the switch has no `case null`.
    - key: c
      text: It prints `warning null`
      why: The switch never compares null with the labels — it fails as soon as it evaluates the selector.
    - key: d
      text: Compilation fails because a String switch needs a `case null` label
      why: "`case null` is optional; without it a null selector compiles fine but throws NullPointerException at run time."
  explanation: |
    A switch on a reference-typed selector (`String`, a wrapper, an enum or any type in a pattern switch) throws
    `NullPointerException` when the selector is null — unless the switch has a `case null` label (Java 21+).
    `default` does **not** match null. Here the first call prints `warning `, then `level(null)` throws.
  rule: "A switch throws NullPointerException for a null selector unless a case null label is present; default does not match null (JLS 14.11.3)."
  misconception: "`default` catches every value that no case handles, including null."
  hint: Does `default` ever see a null selector?
  java:
    expect: { compiles: true, stdoutContains: ["warning"], exception: java.lang.NullPointerException }

- id: D2-FLW-010
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: compile-error
  difficulty: intermediate
  estSeconds: 120
  tags: [switch-expression, exhaustiveness, enum, switch-statement]
  prompt: What is the result of compiling and running this program?
  code: |
    enum Light { RED, AMBER, GREEN }
    public class Main {
        static int seconds(Light l) {
            return switch (l) { case RED -> 30; case AMBER -> 5; case GREEN -> 25; };
        }
        static String action(Light l) {
            switch (l) { case RED -> { return "stop"; } case GREEN -> { return "go"; } }
            return "wait";
        }
        static int bonus(int level) {
            return switch (level) { case 1 -> 10; case 2 -> 20; case 3 -> 30; };
        }
        public static void main(String[] args) {
            System.out.println(seconds(Light.AMBER) + action(Light.AMBER) + bonus(2));
        }
    }
  options:
    - key: a
      text: Line 4 does not compile
      why: A switch expression over an enum that lists every constant is exhaustive; no default is needed.
    - key: b
      text: Line 7 does not compile
      why: A switch statement with only constant labels need not be exhaustive, even when it uses arrows; AMBER simply runs no case.
    - key: c
      text: Line 11 does not compile
      correct: true
      why: An int switch expression can never list every int value, so without `default` it does not cover all possible input values.
    - key: d
      text: It compiles and prints `5wait20`
      why: This would be the output if `bonus` had a default; the int switch expression is rejected at compile time.
  explanation: |
    Every switch **expression** must be exhaustive. For an enum selector, listing all constants is enough, with no
    `default`. For `int` or `String`
    selectors only `default` can make it exhaustive. A switch **statement** must be exhaustive only when it uses
    patterns or `case null`; arrows alone do not change that, so `action` compiles.
  rule: "Switch expressions must be exhaustive: all enum constants, all permitted sealed subtypes, or a default/unconditional pattern (JLS 15.28.1)."
  misconception: Arrow-form switch statements must be exhaustive, or enum switch expressions always need default.
  hint: Which of the three switches is an expression over a type whose values cannot all be listed?
  java:
    expect: { compiles: false, errorContains: "does not cover all possible input values", errorLine: 11 }

- id: D2-FLW-011
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: does-it-compile
  difficulty: intermediate
  estSeconds: 100
  tags: [switch-expression, yield, block]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static String grade(int score) {
            return switch (score / 10) {
                case 10, 9 -> "A";
                case 8 -> {
                    if (score % 10 >= 5) yield "B+";
                    else yield "B";
                }
                case 7 -> {
                    String g = "C";
                    if (score % 10 >= 5) g += "+";
                }
                default -> "F";
            };
        }
        public static void main(String[] args) {
            System.out.println(grade(85));
        }
    }
  options:
    - key: a
      text: It prints `B+`
      why: That would be the result for 85, but the program never runs — another arm is invalid.
    - key: b
      text: It prints `B`
      why: 85 % 10 is 5, so the first yield would be taken anyway; more importantly, the program does not compile.
    - key: c
      text: Compilation fails because the `case 7` block can complete without yielding a value
      correct: true
      why: "A block arm of a switch expression must end every path with `yield` or `throw`; the case 7 block computes g but never yields it."
    - key: d
      text: Compilation fails because the `case 8` block contains two yield statements
      why: A block may contain several yield statements as long as every path ends in one; if/else with a yield on each side is fine.
  explanation: |
    In a switch expression, an arrow followed by an expression yields that expression. An arrow followed by a
    **block** must leave the block through `yield value;` or `throw` on every path. The `case 7` block falls off
    its end, so javac reports *switch rule completes without providing a value*. Adding `yield g;` fixes it.
  rule: "Every switch rule block of a switch expression must complete abruptly with yield or throw; it cannot complete normally (JLS 15.28.1)."
  misconception: The last expression evaluated in a block arm is its value.
  hint: What does the case 7 block hand back to the switch expression?
  java:
    expect: { compiles: false, errorContains: "completes without providing a value" }

- id: D2-FLW-012
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [switch-statement, scope, local-variable, definite-assignment]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            for (int x = 1; x <= 2; x++) {
                switch (x) {
                    case 1:
                        String msg = "one";
                        System.out.print(msg + " ");
                        break;
                    case 2:
                        msg = "two";
                        System.out.print(msg + " ");
                }
            }
            System.out.println();
        }
    }
  options:
    - key: a
      text: "`one two`"
      correct: true
      why: "The whole switch body is one block, so `msg` is in scope in the case 2 group; it is assigned there before it is read, so the code compiles."
    - key: b
      text: "Compilation fails: `msg` cannot be found in the case 2 group"
      why: Case groups of a colon switch do not create their own scopes; a local declared in an earlier group is visible in later ones.
    - key: c
      text: "Compilation fails: variable `msg` might not have been initialized"
      why: "That error would appear if case 2 read `msg` before assigning it. Here it assigns first, so definite assignment is satisfied."
    - key: d
      text: "`one one`"
      why: Each iteration of the loop executes the switch block afresh; there is no value left over from the previous iteration — and case 2 assigns "two" anyway.
  explanation: |
    In a switch statement with `:` labels, all the case groups share one block. A local variable declared in one
    group is therefore in scope in every later group — but its initializer runs only if execution actually passes
    through the declaration. When execution jumps directly to `case 2`, `msg` is in scope but unassigned, so it
    must be assigned before it is read. Arrow cases are different: each arrow body is its own scope.
  rule: "The scope of a local declared in a switch block extends to the end of that block, across later case labels; definite assignment still applies (JLS 6.3, 16)."
  misconception: Each case label starts a new scope, like a separate block.
  hint: How many blocks does a colon-style switch body have?
  java:
    expect: { compiles: true, stdout: "one two" }

- id: D2-FLW-013
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 180
  tags: [record-pattern, unnamed-pattern, guard, null-component, java-22]
  prompt: What is the output of the following program?
  code: |
    record Point(int x, int y) {}
    record Move(String who, Point to) {}
    public class Main {
        static String f(Object o) {
            return switch (o) {
                case Move(var w, Point(var x, _)) when x < 0 -> w + " off-board";
                case Move(String w, Point(_, int y)) -> w + " row " + y;
                case Integer _, Long _ -> "number";
                case Point _ -> "point";
                default -> "other";
            };
        }
        public static void main(String[] args) {
            System.out.println(f(new Move("K", new Point(-1, 4))) + ", " + f(new Move("Q", new Point(2, 7))));
            System.out.println(f(5L) + ", " + f(new Point(0, 0)) + ", " + f(new Move("R", null)));
        }
    }
  options:
    - key: a
      text: |
        K off-board, Q row 7
        number, point, other
      correct: true
      why: "The guard sends K to the first case; Q fails the guard and matches the second; 5L matches `Long _`; the nested record pattern `Point(...)` never matches a null component, so Move(\"R\", null) reaches default."
    - key: b
      text: |
        K row 4, Q row 7
        number, point, other
      why: Labels are tried top to bottom and the guard is true for x = -1, so K is handled by the first case, not the second.
    - key: c
      text: |
        K off-board, Q row 7
        number, point, R row 0
      why: A record pattern does not substitute default values for a null component; `Point(_, int y)` simply does not match null.
    - key: d
      text: Compilation fails because `case Integer _, Long _` combines two patterns in one label
      why: Since Java 22 (JEP 456) one case label may list several patterns, provided none of them declares a named binding variable.
  explanation: |
    Record patterns deconstruct and test in one step; nested patterns are matched component by component. A
    nested **record** pattern never matches `null`, so `Move("R", null)` fails both Move cases and falls to
    `default` — no exception. The unnamed pattern `_` (JEP 456, final since Java 22) ignores a component, and a
    label such as `case Integer _, Long _` may group several patterns because none binds a name. The guard
    (`when x < 0`) is evaluated only after the pattern matched.
  rule: "Record patterns match only non-null records and recursively match components; _ ignores a component; multiple patterns per label only without bindings (JLS 14.30, JEP 456)."
  misconception: "A null record component makes the pattern throw NullPointerException or bind default values."
  hint: Does `Point(_, int y)` match a null Point?
  java:
    expect: { compiles: true, stdout: "K off-board, Q row 7\nnumber, point, other" }

- id: D2-FLW-014
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: compile-error
  difficulty: expert
  estSeconds: 120
  tags: [pattern-switch, switch-statement, exhaustiveness, overloading]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static void log(Object o) {
            switch (o) {
                case String s -> System.out.println("text " + s);
                case Integer i -> System.out.println("int " + i);
            }
        }
        static void log(int code) {
            switch (code) {
                case 1 -> System.out.println("one");
                case 2 -> System.out.println("two");
            }
        }
        public static void main(String[] args) {
            log("hi");
            log(2);
        }
    }
  options:
    - key: a
      text: Line 3 does not compile
      correct: true
      why: "A switch statement that uses patterns must be exhaustive; Object values other than String and Integer are not covered (no default)."
    - key: b
      text: Line 9 does not compile
      why: A switch statement with only constant labels is never required to be exhaustive, arrows or not.
    - key: c
      text: It compiles and prints `text hi` and `two`
      why: Statements were exempt from exhaustiveness only before patterns; a pattern switch statement must be exhaustive.
    - key: d
      text: It compiles and throws a `MatchException` when an unmatched value is passed
      why: The check is at compile time — javac reports that the switch statement does not cover all possible input values.
  explanation: |
    Exhaustiveness is required for every switch **expression** and for every switch **statement** that uses
    pattern labels or `case null` (an "enhanced" switch statement). The first `log` switches on `Object` with
    type patterns, so it needs `default` or `case Object o`. The second is an old-style constant switch on `int`,
    which may legitimately cover only some values.
  rule: "An enhanced switch statement (patterns, case null, or a selector type not allowed in classic switches) must be exhaustive (JLS 14.11.2)."
  misconception: Only switch expressions must be exhaustive.
  hint: Which of the two switch statements uses patterns?
  java:
    expect: { compiles: false, errorContains: "does not cover all possible input values", errorLine: 3 }

