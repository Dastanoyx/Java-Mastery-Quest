- id: D2-FLW-023
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: does-it-compile
  difficulty: expert
  estSeconds: 180
  tags: [sealed, exhaustiveness, guard, enum, pattern-switch]
  prompt: Does this program compile? If not, what is the reason?
  code: |
    sealed interface Vehicle permits Car, Truck, Bike {}
    record Car(int seats) implements Vehicle {}
    record Truck(double tons) implements Vehicle {}
    enum Bike implements Vehicle { ROAD, MOUNTAIN }

    public class Main {
        static int toll(Vehicle v) {
            return switch (v) {
                case Car c when c.seats() > 5 -> 8;
                case Car c -> 5;
                case Truck t when t.tons() > 10 -> 30;
                case Truck t when t.tons() <= 10 -> 15;
                case Bike.ROAD, Bike.MOUNTAIN -> 0;
            };
        }
        public static void main(String[] args) {
            System.out.println(toll(new Car(7)) + toll(new Truck(3)) + toll(Bike.ROAD));
        }
    }
  options:
    - key: a
      text: It compiles and prints `23`
      why: That is what the program would print if `Truck` were covered by an unguarded case; as written it is rejected.
    - key: b
      text: Compilation fails because `Truck` is covered only by guarded cases, so the switch is not exhaustive
      correct: true
      why: "The compiler does not evaluate guards: two complementary guards still leave Truck uncovered. Making the last Truck case unguarded fixes it."
    - key: c
      text: Compilation fails because enum constants cannot be case labels when the selector type is `Vehicle`
      why: "Since Java 21, qualified enum constants such as `Bike.ROAD` may label a switch whose selector type is a supertype of the enum, and listing all constants covers the enum."
    - key: d
      text: Compilation fails because a switch over an interface type always needs a `default`
      why: For a sealed interface, covering every permitted subtype (here Car, Truck and every Bike constant) is enough.
  explanation: |
    A switch over a sealed type is exhaustive when its unguarded labels cover every permitted subtype. An enum
    subtype may be covered either by `case Bike b` or by listing all its constants (qualified, because the
    selector is `Vehicle`). Guarded labels never count toward exhaustiveness, because javac does not reason
    about the boolean conditions — so `when t.tons() > 10` plus `when t.tons() <= 10` still leaves `Truck`
    uncovered: *the switch expression does not cover all possible input values*.
  rule: "Exhaustiveness over a sealed hierarchy considers only unguarded patterns (and all constants of an enum subtype); guards are ignored."
  misconception: "Guards that are logically complementary make a switch exhaustive."
  hint: Which permitted subtype is covered only by `when` labels?
  java:
    expect: { compiles: false, errorContains: "does not cover all possible input values" }

- id: D2-FLW-024
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 150
  tags: [switch-expression, yield, return, contextual-keyword]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static int yield = 1;
        static int parse(String s) {
            int r = switch (s) {
                case "one" -> yield;
                case "two" -> {
                    int yield = 2;
                    yield yield;
                }
                case "" -> {
                    return -1;
                }
                default -> Integer.parseInt(s);
            };
            return r;
        }
        public static void main(String[] args) {
            System.out.println(parse("one") + parse("two") + parse(""));
        }
    }
  options:
    - key: a
      text: Line 2 does not compile
      why: "`yield` is a contextual keyword, not a reserved word, so it is still a legal field or variable name."
    - key: b
      text: Line 8 does not compile
      why: "`yield yield;` is a yield statement whose value is the local variable named yield — legal, if confusing."
    - key: c
      text: Line 11 does not compile
      correct: true
      why: "A switch expression must produce a value or throw; `return` cannot jump out of it: attempt to return out of a switch expression."
    - key: d
      text: It compiles and prints `2`
      why: This assumes `return -1` leaves parse() from inside the switch expression; javac rejects any return, break or continue that would leave a switch expression.
  explanation: |
    Inside a switch expression, a block arm hands its value back with `yield`, never with `return` (*attempt to
    return out of a switch expression*); `break` and `continue` that would leave the expression are illegal too.
    `yield` is a contextual keyword: it acts as a statement keyword only at the start of a statement such as
    `yield value;`, so `yield` as a field name, a local variable name and even `yield yield;` all compile.
    Inside a switch **statement**, by contrast, `return` is allowed.
  rule: "A switch expression completes only by yielding a value or throwing; return/break/continue may not transfer control out of it (JLS 15.28.1); yield is a contextual keyword (JLS 3.9)."
  misconception: "`return` inside a switch expression arm returns from the enclosing method."
  hint: Which jump statements may leave a switch expression?
  java:
    expect: { compiles: false, errorContains: "attempt to return out of a switch expression", errorLine: 11 }

- id: D2-FLW-025
  objective: D2.1
  lesson: flow-decisions-switch
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 210
  tags: [pattern-switch, dominance, guard, constant-label, default]
  prompt: "Given `Object o` and `Integer n`, which of these switch expressions compile? Choose three."
  options:
    - key: a
      text: "`switch (n) { case 42 -> \"answer\"; case Integer i -> \"int\"; }`"
      correct: true
      why: A constant label may precede a type pattern of the same type; `case Integer i` is unconditional for an Integer selector, so the switch is exhaustive.
      java:
        source: |
          public class Main {
              static String f(Integer n) { return switch (n) { case 42 -> "answer"; case Integer i -> "int"; }; }
              public static void main(String[] args) { System.out.println(f(42) + f(7)); }
          }
        expect: { compiles: true, stdout: "answerint" }
    - key: b
      text: "`switch (n) { case Integer i -> \"int\"; case 42 -> \"answer\"; }`"
      why: The unguarded `case Integer i` already matches 42, so the constant label after it is dominated.
      java:
        source: |
          public class Main {
              static String f(Integer n) { return switch (n) { case Integer i -> "int"; case 42 -> "answer"; }; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "dominated" }
    - key: c
      text: "`switch (o) { case Integer i when i > 0 -> \"pos\"; case Integer i -> \"int\"; default -> \"other\"; }`"
      correct: true
      why: Guarded case first, unguarded case of the same type after it — the guarded label does not dominate anything.
      java:
        source: |
          public class Main {
              static String f(Object o) { return switch (o) { case Integer i when i > 0 -> "pos"; case Integer i -> "int"; default -> "other"; }; }
              public static void main(String[] args) { System.out.println(f(1) + f(-1) + f("x")); }
          }
        expect: { compiles: true, stdout: "posintother" }
    - key: d
      text: "`switch (o) { default -> \"other\"; case String s -> \"str\"; }`"
      why: "`default` matches every remaining value, so a pattern label after it is dominated; patterns must come before default."
      java:
        source: |
          public class Main {
              static String f(Object o) { return switch (o) { default -> "other"; case String s -> "str"; }; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "dominated" }
    - key: e
      text: "`switch (o) { case CharSequence cs -> \"cs\"; case String s -> \"str\"; default -> \"x\"; }`"
      why: Every String is a CharSequence, so `case String s` can never be selected and is a dominance error.
      java:
        source: |
          public class Main {
              static String f(Object o) { return switch (o) { case CharSequence cs -> "cs"; case String s -> "str"; default -> "x"; }; }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "dominated" }
    - key: f
      text: "`switch (o) { case Integer i when i > 0 -> \"pos\"; case Integer i when i > 10 -> \"big\"; default -> \"x\"; }`"
      correct: true
      why: Guards are not analysed, so the second label is not considered dominated even though it can never be selected at run time.
      java:
        source: |
          public class Main {
              static String f(Object o) { return switch (o) { case Integer i when i > 0 -> "pos"; case Integer i when i > 10 -> "big"; default -> "x"; }; }
              public static void main(String[] args) { System.out.println(f(50) + f(-5)); }
          }
        expect: { compiles: true, stdout: "posx" }
  explanation: |
    Dominance is checked label by label, top to bottom. A label is dominated if a preceding **unguarded** pattern
    matches all of its values (a supertype, or the same type), or if it follows `default` — in a pattern switch,
    `default` must come after every pattern label. Constant labels may appear *before* a type pattern of the same
    type but not after it. Guards are opaque to the compiler: a guarded label never dominates, even when its
    condition makes a later label unreachable in practice.
  rule: "A label is dominated if an earlier unguarded pattern matches all its values; pattern labels must precede default; constants must precede a matching type pattern (JLS 14.11.1)."
  misconception: "The compiler reasons about guard conditions when checking dominance."
  hint: For each later label, ask whether an earlier unguarded label (or default) already catches all of its values.

- id: D2-FLW-026
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 150
  tags: [case-null, default, null-selector, pattern-switch, switch-statement]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        static String a(String s) {
            return switch (s) {
                case "x" -> "X";
                case null, default -> "fallback";
            };
        }
        static String b(Object o) {
            return switch (o) {
                case null -> "null";
                case String s when s.isEmpty() -> "empty";
                default -> "obj";
            };
        }
        static String c(Integer n) {
            switch (n) {
                case null: return "none";
                case 1: return "one";
                default: return "many";
            }
        }
        public static void main(String[] args) {
            System.out.println(a(null) + " " + a("x") + " " + b(null) + " " + b("") + " " + c(null) + " " + c(7));
        }
    }
  options:
    - key: a
      text: "`fallback X null empty none many`"
      correct: true
      why: "`case null, default` handles null and every unmatched value together; `case null` works in pattern switches and in constant switches on reference types alike."
    - key: b
      text: Compilation fails because `case null` cannot be combined with `default` in one label
      why: "`case null, default` is precisely the one allowed combination of null with default (Java 21+)."
    - key: c
      text: Compilation fails because `case null` is only allowed in a switch that uses type patterns
      why: Any switch whose selector is a reference type may have `case null`, including a classic colon-style switch with constant labels.
    - key: d
      text: "A `NullPointerException` is thrown by `a(null)`"
      why: "A switch throws NPE for null only when it has no `case null` label; `case null, default` provides one."
  explanation: |
    Since Java 21 any switch over a reference type may contain `case null`, either alone or as the special
    combined label `case null, default`. With such a label the switch no longer throws `NullPointerException` for
    a null selector. Adding `case null` to a switch statement makes it an "enhanced" switch, which must be
    exhaustive — `c` satisfies that with its `default`.
  rule: "case null (alone or as case null, default) may appear in any switch with a reference-typed selector; without it a null selector throws NPE (JLS 14.11.1, 14.11.3)."
  misconception: "`case null` is a pattern-switch-only feature, or default handles null."
  hint: Which switches have a label that matches null?
  java:
    expect: { compiles: true, stdout: "fallback X null empty none many" }

- id: D2-FLW-027
  objective: D2.1
  lesson: flow-decisions-switch
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 120
  tags: [pattern-switch, fallthrough, colon-labels, arrow-labels]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static void show(Object o) {
            switch (o) {
                case Integer i:
                    System.out.print("int ");
                case String s:
                    System.out.print("string " + s);
                    break;
                default:
                    System.out.print("other ");
            }
        }
        public static void main(String[] args) {
            show(1);
        }
    }
  options:
    - key: a
      text: Line 6 does not compile
      correct: true
      why: "Execution could fall through from the Integer group into `case String s`, where `s` would be unbound: illegal fall-through to a pattern."
    - key: b
      text: It compiles and prints `int string null`
      why: Classic fallthrough is not allowed into a label that declares pattern variables, precisely because they would be unbound; the code is rejected.
    - key: c
      text: It compiles and prints `int `
      why: Colon-style pattern switches do not stop automatically at the next label; javac instead forbids the fallthrough.
    - key: d
      text: Line 9 does not compile
      why: Falling through into `default` (which binds nothing) would be fine, and here the String group ends with break anyway.
  explanation: |
    Pattern labels can be written with `:` as well as `->`. With `:`, the normal fallthrough rules apply — but
    falling into a label that declares pattern variables is a compile error (*illegal fall-through to a
    pattern*), because those variables would not be initialised. Add `break;` after `int `, or use arrow labels,
    which never fall through.
  rule: "It is a compile error if a statement group can fall through into a case label that declares pattern variables (JLS 14.11.1)."
  misconception: Fallthrough works the same way for pattern labels as for constant labels.
  hint: If the Integer group falls through, what would `s` refer to?
  java:
    expect: { compiles: false, errorContains: "illegal fall-through to a pattern", errorLine: 6 }

- id: D2-FLW-028
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: compile-error
  difficulty: expert
  estSeconds: 180
  tags: [reachability, labels, nested-loops, for-loop]
  prompt: What is the result of compiling this class?
  code: |
    public class Main {
        static int search(int n, int limit) {
            outer:
            for (int k = 1; ; k++) {
                for (int m = 1; ; m++) {
                    if (m * n > limit) break outer;
                    if (m * n % k == 0) continue outer;
                }
                System.out.println("next k");
            }
            return -1;
        }
        public static void main(String[] args) {
            System.out.println(search(3, 20));
        }
    }
  options:
    - key: a
      text: Line 9 does not compile
      correct: true
      why: "The inner loop has no condition and no break that targets it (both jumps target `outer`), so it cannot complete normally and line 9 is unreachable."
    - key: b
      text: Line 11 does not compile
      why: The outer loop has no condition, but `break outer` is a reachable break that exits it, so the return after it is reachable.
    - key: c
      text: Line 7 does not compile
      why: A labelled continue may target any enclosing loop, not just the innermost one.
    - key: d
      text: The class compiles
      why: "Every jump in the inner loop leaves it, but none of them lets it complete normally, so the statement after it is an unreachable statement — a compile error, not a warning."
  explanation: |
    A loop with no condition can complete normally only if a reachable `break` **targets that loop**. Here
    `break outer` and `continue outer` both target the outer loop: they transfer control out of the inner loop,
    but the inner `for` statement itself never completes normally. The statement following it is therefore
    unreachable. The outer loop does have a `break outer`, so the `return -1` after it is reachable.
  rule: "A for statement without a condition can complete normally only if it contains a reachable break that exits it (JLS 14.22); jumps to outer labels do not count."
  misconception: Any break inside a loop lets that loop complete normally.
  hint: Which loop does each jump target?
  java:
    expect: { compiles: false, errorContains: "unreachable statement", errorLine: 9 }

- id: D2-FLW-029
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 120
  tags: [for-loop, update-expressions, do-while, block]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int i = 0, j = 10, steps = 0;
            for (; i < j; i += 3, j -= 2) steps++;
            System.out.println(i + " " + j + " " + steps);
            int k = 5;
            do k -= 2; while (k > 0);
            { System.out.println("k=" + k); }
        }
    }
  options:
    - key: a
      text: |
        6 6 2
        k=-1
      correct: true
      why: "Both updates run after every body: (0,10) → (3,8) → (6,6), where 6 < 6 fails after 2 steps. The do-while body runs for k = 5, 3, 1 and stops at -1; the block after it is an ordinary block that runs once."
    - key: b
      text: |
        9 4 3
        k=-1
      why: The condition is re-tested after the update; at (6,6) the test i < j is already false, so there is no third step.
    - key: c
      text: |
        6 6 2
        k=1
      why: The do-while tests after the body; with k = 1 the test 1 > 0 is true, so the body runs once more and k ends at -1.
    - key: d
      text: Compilation fails because a do-while body without braces cannot be followed by while
      why: Like other loops, a do statement's body can be any single statement, so `do k -= 2; while (k > 0);` is legal; the semicolon after the condition is required.
  explanation: |
    The update part of a for loop may contain several comma-separated expression statements; all of them run
    after each body, before the condition. A do-while has the form `do Statement while (Expression);` — the body
    may be a single statement and the final semicolon is mandatory. The braces on the last line form a plain
    block, which simply runs once after the loop.
  rule: "for: ForUpdate is a comma-separated list of expressions run after each iteration; do Statement while (Expression); requires the trailing semicolon (JLS 14.13, 14.14.1)."
  misconception: A do-while needs braces, or the for condition is checked between the update expressions.
  hint: Write down (i, j) after every update, and k after every do-while iteration.
  java:
    expect: { compiles: true, stdout: "6 6 2\nk=-1" }

