- id: D2-FLW-015
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 100
  tags: [enhanced-for, loop-variable, reference-semantics]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            StringBuilder[] parts = { new StringBuilder("a"), new StringBuilder("b") };
            for (StringBuilder sb : parts) {
                sb.append('!');
                sb = new StringBuilder("z");
                sb.append('?');
            }
            int[] nums = {1, 2, 3};
            for (int n : nums) n *= 2;
            System.out.println(parts[0] + "" + parts[1] + " " + nums[0] + nums[1] + nums[2]);
        }
    }
  options:
    - key: a
      text: "`a!b! 123`"
      correct: true
      why: The loop variable is a copy of each element reference, so append('!') mutates the array's objects; reassigning sb and doubling n change only the copies.
    - key: b
      text: "`z?z? 246`"
      why: This treats the loop variable as an alias of the array slot. Assigning to it never writes back into the array.
    - key: c
      text: "`ab 123`"
      why: The copy is a copy of the reference, not of the StringBuilder object; calling a mutating method through it changes the shared object.
    - key: d
      text: "`a!b! 246`"
      why: "For an int array the loop variable holds a copy of the primitive value; `n *= 2` changes only that copy."
  explanation: |
    In `for (T x : array)` the variable `x` receives a copy of each element. For primitives that is a copy of the
    value; for objects it is a copy of the reference. Calling a mutating method through the copy affects the
    object stored in the array, but assigning a new object (or a new value) to the loop variable only changes the
    local copy.
  rule: "The enhanced for loop assigns each element to a fresh local variable (JLS 14.14.2); assignments to it do not affect the array or collection."
  misconception: The enhanced-for variable is a reference to the array slot.
  hint: What exactly is copied into `sb` and `n` on each iteration?
  java:
    expect: { compiles: true, stdout: "a!b! 123" }

- id: D2-FLW-016
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: trace
  difficulty: intermediate
  estSeconds: 150
  tags: [for-loop, continue, update, loop-variable]
  prompt: What does this program print?
  code: |
    public class Main {
        public static void main(String[] args) {
            int total = 0;
            for (int i = 0; i < 6; i += 2) {
                if (i == 2) continue;
                total += i;
                i--;
            }
            System.out.println(total);
        }
    }
  options:
    - key: a
      text: "`10`"
      correct: true
      why: "i takes the values 0, 1, 2, 4, 5: the body's i-- and the update's i += 2 together add 1, except at i=2 where continue skips i-- but still runs the update. 0+1+4+5 = 10."
    - key: b
      text: "`4`"
      why: This ignores the `i--` in the body; modifying the loop variable inside a for body is legal and changes the sequence.
    - key: c
      text: "`9`"
      why: "This assumes `continue` also skips the update, so i would stay at 2 — but then the loop would never end; in fact continue jumps to the update."
    - key: d
      text: The loop never terminates
      why: "`continue` in a basic for loop transfers control to the update expression, so i goes from 2 to 4 and the loop progresses."
  explanation: |
    A basic for loop runs: init once; then test → body → update, repeatedly. `continue` ends the current body and
    goes to the **update**, not directly to the test. Trace: i=0 (total 0, i→-1, update→1), i=1 (total 1, i→0,
    update→2), i=2 (continue, update→4), i=4 (total 5, i→3, update→5), i=5 (total 10, i→4, update→6), test fails.
  rule: "In a basic for statement, continue completes the body and then the ForUpdate runs before the condition is re-evaluated (JLS 14.14.1.2)."
  misconception: "`continue` skips the update expression of a for loop."
  hint: Write down i after the body and after the update for each iteration.
  java:
    expect: { compiles: true, stdout: "10" }

- id: D2-FLW-017
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 90
  tags: [while, do-while, post-increment, empty-statement]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int a = 5, runsA = 0;
            while (a < 5) { runsA++; a++; }
            int b = 5, runsB = 0;
            do { runsB++; b++; } while (b < 5);
            int c = 0;
            while (c++ < 3);
            System.out.println(runsA + " " + runsB + " " + c);
        }
    }
  options:
    - key: a
      text: "`0 1 4`"
      correct: true
      why: "while tests first (0 runs), do-while runs once before testing, and c++ < 3 is evaluated four times (0, 1, 2 pass; 3 fails), each one incrementing c."
    - key: b
      text: "`0 0 3`"
      why: A do-while body always runs at least once; and the failing comparison still performs its post-increment.
    - key: c
      text: "`1 1 4`"
      why: A while loop tests its condition before the first iteration; 5 < 5 is false, so the body never runs.
    - key: d
      text: "`0 1 3`"
      why: The last evaluation of `c++ < 3` compares 3 and fails, but the increment to 4 still happens.
  explanation: |
    `while` and `for` test before each iteration, so their bodies may run zero times; `do … while` tests after the
    body, so it runs at least once. `while (c++ < 3);` has an empty statement as body: the condition alone does
    the work, and because `c++` yields the old value, the final failing test still increments `c` to 4.
  rule: "while: test before body; do-while: body then test, so ≥ 1 iteration (JLS 14.12, 14.13); x++ yields the old value."
  misconception: A do-while loop whose condition is false from the start never runs.
  hint: Count how many times each condition is evaluated.
  java:
    expect: { compiles: true, stdout: "0 1 4" }

- id: D2-FLW-018
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [labels, break, continue, nested-loops, enhanced-for]
  prompt: What is the output of the following program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int[][] grid = { {1, 2, 3}, {4, -1, 6}, {7, 8, 0} };
            int sum = 0;
            rows:
            for (int[] row : grid) {
                for (int v : row) {
                    if (v < 0) continue rows;
                    if (v == 0) break rows;
                    sum += v;
                }
                sum += 100;
            }
            System.out.println(sum);
        }
    }
  options:
    - key: a
      text: "`125`"
      correct: true
      why: "Row 0 adds 6 and the +100. Row 1 adds 4, then `continue rows` abandons the row (no +100). Row 2 adds 7 and 8, then `break rows` leaves both loops: 106 + 4 + 15 = 125."
    - key: b
      text: "`225`"
      why: "`continue rows` does not just leave the inner loop — it also skips the rest of the outer body, including `sum += 100`."
    - key: c
      text: "`331`"
      why: This treats the labelled jumps as unlabelled ones that only affect the inner loop.
    - key: d
      text: Compilation fails because a label cannot be applied to an enhanced for loop
      why: Any statement can be labelled; a label on an enhanced for loop is a valid target for both break and continue.
  explanation: |
    `continue label` ends the current iteration of the **labelled** loop: the remainder of every enclosed loop body
    and of the labelled loop's body is skipped, and the labelled loop proceeds with its next element.
    `break label` terminates the labelled statement completely. Unlabelled forms affect only the innermost loop.
  rule: "break L exits the statement labelled L; continue L starts the next iteration of the loop labelled L (JLS 14.15, 14.16)."
  misconception: "A labelled continue only leaves the inner loop, after which the outer body continues."
  hint: After `continue rows`, is `sum += 100` executed for that row?
  java:
    expect: { compiles: true, stdout: "125" }

- id: D2-FLW-019
  objective: D2.1
  lesson: flow-loops-branching
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 180
  tags: [reachability, unreachable-statement, constant-expression, while, if]
  prompt: Each fragment is the complete body of `main`. Which of them compile? Choose three.
  options:
    - key: a
      text: "`while (false) { System.out.println(\"x\"); }`"
      why: The body of a while loop whose condition is the constant false is unreachable, which is a compile error.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              while (false) { System.out.println("x"); }
          } }
        expect: { compiles: false, errorContains: "unreachable statement" }
    - key: b
      text: "`if (false) { System.out.println(\"x\"); }`"
      correct: true
      why: The if statement is deliberately exempt from the reachability rules so that constant flags can switch code off.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              if (false) { System.out.println("x"); }
          } }
        expect: { compiles: true, stdout: "" }
    - key: c
      text: "`final boolean DEBUG = false; while (DEBUG) { System.out.println(\"x\"); }`"
      why: A final local initialised with a constant is a constant variable, so `DEBUG` is still the constant false and the body is unreachable.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              final boolean DEBUG = false; while (DEBUG) { System.out.println("x"); }
          } }
        expect: { compiles: false, errorContains: "unreachable statement" }
    - key: d
      text: "`boolean debug = false; while (debug) { System.out.println(\"x\"); }`"
      correct: true
      why: A non-final variable is not a constant expression; the compiler does not track its value, so the body is considered reachable.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              boolean debug = false; while (debug) { System.out.println("x"); }
          } }
        expect: { compiles: true, stdout: "" }
    - key: e
      text: "`do { System.out.println(\"x\"); } while (false);`"
      correct: true
      why: The body of a do-while is reached before the condition is ever evaluated, so it runs once; a constant false condition is fine.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              do { System.out.println("x"); } while (false);
          } }
        expect: { compiles: true, stdout: "x" }
    - key: f
      text: "`for (int i = 0; ; i++) { } System.out.println(\"done\");`"
      why: A for loop without a condition and without a break cannot complete normally, so the statement after it is unreachable.
      java:
        source: |
          public class Main { public static void main(String[] args) {
              for (int i = 0; ; i++) { } System.out.println("done");
          } }
        expect: { compiles: false, errorContains: "unreachable statement" }
  explanation: |
    JLS §14.22 defines reachability conservatively, evaluating only **constant expressions**. A while or for body
    is unreachable when the condition is the constant `false`; a loop whose condition is absent or constant `true`
    can complete normally only through a reachable `break`. `if` is the deliberate exception: `if (false)` compiles
    so that constant debug flags work like conditional compilation.
  rule: "while(false)/for(;false;) bodies are unreachable; a loop with no condition or a constant-true condition completes normally only via break; if is exempt (JLS 14.22)."
  misconception: The compiler treats if(false) and while(false) the same way, or tracks ordinary variables' values.
  hint: Which conditions are constant expressions, and which statement is exempt from the rule?

- id: D2-FLW-020
  objective: D2.1
  lesson: flow-loops-branching
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 150
  tags: [definite-assignment, loops, constant-expression]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int a;
            for (;;) { a = 1; break; }
            int b;
            int n = 3;
            while (n > 0) { b = n; n--; }
            int c;
            do { c = 2; } while (n > 5);
            System.out.println(a + c);
            System.out.println(b);
        }
    }
  options:
    - key: a
      text: Line 10 does not compile
      why: "`a` is assigned before the only break that leaves `for (;;)`, and a do-while body always runs once, so both a and c are definitely assigned."
    - key: b
      text: Line 11 does not compile
      correct: true
      why: "`n > 0` is not a constant expression, so the compiler must assume the while body may run zero times; b might not have been initialized."
    - key: c
      text: Line 4 does not compile
      why: "`for (;;)` with a break is a legal loop; the statement after it is reachable through the break."
    - key: d
      text: It compiles and prints `3` and `1`
      why: At run time b would indeed be 1, but definite assignment is a compile-time analysis that ignores actual values.
  explanation: |
    Definite assignment (JLS chapter 16) is a static analysis. After `for (;;) { a = 1; break; }` the only way out
    is the break, which follows the assignment. A do-while body executes before its condition, so `c` is assigned.
    For `while (n > 0)` the condition is not constant, so the compiler assumes the body may be skipped and `b` is
    not definitely assigned: *variable b might not have been initialized* on line 11.
  rule: "A variable is definitely assigned after a loop only if it is assigned on every path out of the loop; only constant conditions are evaluated (JLS 16.2.10–16.2.12)."
  misconception: The compiler knows that `n = 3` makes the while loop run.
  hint: Which loops are guaranteed by the compiler — not by the values — to execute their body?
  java:
    expect: { compiles: false, errorContains: "might not have been initialized", errorLine: 11 }

