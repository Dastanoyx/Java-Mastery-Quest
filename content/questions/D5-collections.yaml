- id: D5-SEQ-001
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [sequenced-collections, reversed, view, java21]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> base = new ArrayList<>(List.of("a", "b", "c"));
            List<String> rev = base.reversed();
            rev.addFirst("d");
            rev.removeLast();
            base.add("e");
            System.out.println(base + " " + rev + " " + rev.getFirst());
        }
    }
  options:
    - key: a
      text: "`[b, c, d, e] [e, d, c, b] e`"
      correct: true
      why: reversed() is a live view; its first is base's last. addFirst on the view appends d to base; removeLast on the view removes base's first element a.
    - key: b
      text: "`[a, b, c, e] [d, c, b] d`"
      why: reversed() does not copy; changes through the view modify base, and changes to base show in the view.
    - key: c
      text: "`[d, b, c, e] [e, c, b, d] e`"
      why: The view's "first" end is base's last end — addFirst on rev adds to the END of base.
    - key: d
      text: An `UnsupportedOperationException` is thrown
      why: The reversed view of a modifiable ArrayList supports the same modifications as the list itself.
  explanation: |
    `List.reversed()` (Java 21, JEP 431) returns a reverse-ordered **view**. `rev.addFirst("d")` = `base.addLast("d")`
    → `[a, b, c, d]`; `rev.removeLast()` = `base.removeFirst()` → `[b, c, d]`; then `base.add("e")` → `[b, c, d, e]`.
    The view shows `[e, d, c, b]` and its first element is `e`.
  rule: "SequencedCollection.reversed() returns a reverse-ordered view; modifications through it write through to the original and vice versa."
  misconception: reversed() returns a reversed copy.
  hint: Translate each call on rev into the equivalent call on base.
  java:
    expect: { compiles: true, stdout: "[b, c, d, e] [e, d, c, b] e" }

- id: D5-SEQ-002
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: multi
  format: select-valid
