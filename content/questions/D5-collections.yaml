- id: D5-SET-001
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 90
  tags: [TreeSet, NavigableSet, ceiling, floor]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            TreeSet<Integer> t = new TreeSet<>(List.of(5, 15, 25, 35));
            System.out.println(t.floor(15) + " " + t.lower(15) + " " + t.ceiling(26) + " "
                + t.higher(35) + " " + t.tailSet(15) + " " + t.headSet(15));
        }
    }
  options:
    - key: a
      text: "`15 5 35 null [15, 25, 35] [5]`"
      correct: true
      why: floor is <=, lower is strictly <, ceiling is >=, higher is strictly > (none → null); tailSet includes the bound, headSet excludes it.
    - key: b
      text: "`5 5 35 null [25, 35] [5]`"
      why: floor(15) includes 15 itself; tailSet(15) is inclusive.
    - key: c
      text: "`15 5 25 null [15, 25, 35] [5, 15]`"
      why: ceiling(26) is the smallest element >= 26, which is 35; headSet(15) excludes 15.
    - key: d
      text: A `NoSuchElementException` is thrown by `higher(35)`
      why: The navigation methods return null when there is no such element; only first()/last() throw.
  explanation: |
    `floor`/`ceiling` are inclusive (≤ / ≥), `lower`/`higher` are strict (< / >), and all four return `null`
    when nothing qualifies. `tailSet(e)` is inclusive and `headSet(e)` is exclusive by default.
  rule: "NavigableSet: floor(e) ≤ e, lower(e) < e, ceiling(e) ≥ e, higher(e) > e, null if none; headSet(to) excludes to, tailSet(from) includes from."
  hint: Which of the four methods are strict?
  java:
    expect: { compiles: true, stdout: "15 5 35 null [15, 25, 35] [5]" }

- id: D5-SET-002
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 120
  tags: [TreeSet, Comparator, thenComparing, duplicates]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            Set<String> s = new TreeSet<>(Comparator.comparing(String::length)
                                                    .thenComparing(Comparator.reverseOrder()));
            s.addAll(List.of("ox", "cat", "ant", "be", "ox"));
            System.out.println(s);
        }
    }
  options:
    - key: a
      text: "`[ox, be, cat, ant]`"
      correct: true
      why: Shorter strings first; ties broken in reverse alphabetical order; the second "ox" compares as 0 and is rejected.
    - key: b
      text: "`[be, ox, ant, cat]`"
      why: The tie-breaker is reverseOrder(), so within each length the strings are in descending order.
    - key: c
      text: "`[ox, be, cat]`"
      why: The tie-breaker distinguishes "cat" and "ant"; only the duplicate "ox" compares as 0.
    - key: d
      text: "`[ox, be, ox, cat, ant]`"
      why: A Set never keeps two elements that compare as equal.
  explanation: |
    The comparator orders by length, and only for equal lengths by reverse natural order. Length 2: `ox`, `be`;
    length 3: `cat`, `ant`. The second `"ox"` compares as 0 with the first and is not added.
  rule: "TreeSet uses its comparator for both ordering and duplicate detection; thenComparing is consulted only when the previous comparator returns 0."
  hint: Sort by length first; apply the tie-breaker only within equal lengths.
  java:
    expect: { compiles: true, stdout: "[ox, be, cat, ant]" }

- id: D5-SET-003
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [TreeSet, HashSet, Comparable, consistent-with-equals, records]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        record Task(String name, int priority) implements Comparable<Task> {
            public int compareTo(Task o) { return Integer.compare(priority, o.priority); }
        }
        public static void main(String[] args) {
            List<Task> all = List.of(new Task("a", 1), new Task("b", 1), new Task("c", 2));
            Set<Task> tree = new TreeSet<>(all);
            Set<Task> hash = new HashSet<>(all);
            System.out.println(tree.size() + " " + hash.size() + " "
                + tree.contains(new Task("z", 2)) + " " + hash.contains(new Task("z", 2)));
        }
    }
  options:
    - key: a
      text: "`2 3 true false`"
      correct: true
      why: TreeSet treats tasks with equal priority as duplicates (compareTo returns 0) and also finds "z" by priority; HashSet uses the record's equals/hashCode over all components.
    - key: b
      text: "`3 3 false false`"
      why: TreeSet never calls equals; for it, Task("a",1) and Task("b",1) are the same element.
    - key: c
      text: "`2 2 true true`"
      why: HashSet relies on the record's generated equals/hashCode, which compare name as well as priority.
    - key: d
      text: "`2 3 false false`"
      why: TreeSet.contains also uses compareTo, and Task("z", 2) compares as 0 with Task("c", 2).
  explanation: |
    This `compareTo` is **inconsistent with equals**. A `TreeSet` relies only on `compareTo`: `a` and `b` (both
    priority 1) collide, leaving 2 elements, and `contains(new Task("z", 2))` succeeds because it compares as 0
    with `c`. A `HashSet` uses the record's generated `equals`/`hashCode` (all components), keeps 3 tasks and
    finds no task named `z`.
  rule: "TreeSet/TreeMap perform all element comparisons using compareTo (or compare), not equals; records derive equals and hashCode from all components."
  misconception: TreeSet falls back to equals to decide duplicates.
  hint: Which method does each set use to decide equality?
  java:
    expect: { compiles: true, stdout: "2 3 true false" }

# ───────────── deques ─────────────

- id: D5-DEQ-001
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 120
  tags: [ArrayDeque, stack, queue, push, offer]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            Deque<Integer> d = new ArrayDeque<>();
            d.push(1);
            d.offer(2);
            d.push(3);
            d.offerFirst(4);
            System.out.println(d + " " + d.pop() + " " + d.pollLast() + " " + d.peek());
        }
    }
  options:
    - key: a
      text: "`[4, 3, 1, 2] 4 2 3`"
      correct: true
      why: push and offerFirst add at the head, offer adds at the tail; pop removes the head (4), pollLast the tail (2), peek shows the new head (3).
    - key: b
      text: "`[2, 1, 3, 4] 2 4 1`"
      why: push inserts at the head, not the tail, and the deque prints head-first.
    - key: c
      text: "`[4, 3, 2, 1] 4 1 3`"
      why: offer(2) appends at the tail, after 1, which was pushed earlier.
    - key: d
      text: "`[4, 3, 1, 2] 4 2 1`"
      why: After pop() removed 4, the head is 3, so peek() returns 3.
  explanation: |
    Build it step by step: `push(1)` → `[1]`; `offer(2)` (tail) → `[1, 2]`; `push(3)` (head) → `[3, 1, 2]`;
    `offerFirst(4)` → `[4, 3, 1, 2]`. The string concatenation evaluates left to right: the deque is printed
    first, then `pop()` → 4, `pollLast()` → 2, and `peek()` → 3.
  rule: "Deque: push = addFirst, pop = removeFirst, offer = offerLast, peek = peekFirst; toString lists elements from head to tail."
  misconception: push adds at the end, like add.
  hint: Draw the deque with the head on the left after each call.
  java:
    expect: { compiles: true, stdout: "[4, 3, 1, 2] 4 2 3" }

