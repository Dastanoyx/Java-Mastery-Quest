    - key: a
      text: "`{a=3, b=11}`"
      correct: true
      why: Counts are a=3, b=1, n=2; computeIfPresent returns null for n → removed; computeIfAbsent with a null result adds nothing; compute updates b to 11.
    - key: b
      text: "`{a=3, b=11, n=null, z=null}`"
      why: A remapping or mapping function that returns null never stores null — it removes the entry or adds nothing.
    - key: c
      text: "`{a=3, b=11, n=2}`"
      why: n's count is 2, so the function returns null, which removes the mapping.
    - key: d
