          import java.util.*;
          public class Main { public static void main(String[] args) { new LinkedHashSet<String>().getFirst(); } }
        expect: { compiles: true, exception: java.util.NoSuchElementException }
    - key: b
      text: "`new HashSet<String>().getFirst();`"
      why: HashSet has no defined encounter order and does not implement SequencedCollection, so there is no getFirst() method.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { new HashSet<String>().getFirst(); } }
        expect: { compiles: false, errorContains: "cannot find symbol" }
    - key: c
      text: "`SequencedSet<Integer> s = new TreeSet<>();`"
      correct: true
      why: TreeSet implements NavigableSet → SortedSet, which extends SequencedSet.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { SequencedSet<Integer> s = new TreeSet<>(); System.out.println(s.isEmpty()); } }
        expect: { compiles: true, stdout: "true" }
    - key: d
      text: "`Map<String, Integer> m = new LinkedHashMap<>(); m.firstEntry();`"
      why: Even though the object is a LinkedHashMap, the declared type Map has no firstEntry() method.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { Map<String, Integer> m = new LinkedHashMap<>(); m.firstEntry(); } }
        expect: { compiles: false, errorContains: "cannot find symbol" }
    - key: e
      text: "`SequencedCollection<Integer> q = new ArrayDeque<>();`"
      correct: true
      why: Every Deque is a SequencedCollection.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { SequencedCollection<Integer> q = new ArrayDeque<>(); System.out.println(q.size()); } }
        expect: { compiles: true, stdout: "0" }
    - key: f
      text: "`SequencedMap<String, Integer> sm = new HashMap<>();`"
      why: HashMap has no encounter order and does not implement SequencedMap.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { SequencedMap<String, Integer> sm = new HashMap<>(); } }
        expect: { compiles: false, errorContains: "incompatible types" }
  explanation: |
    Java 21's sequenced interfaces are implemented by `List`, `Deque`, `LinkedHashSet`, `SortedSet`/`TreeSet`
    (`SequencedCollection`/`SequencedSet`) and `LinkedHashMap`, `SortedMap`/`TreeMap` (`SequencedMap`). `HashSet`
    and `HashMap` are not sequenced. Method availability is decided by the **declared** type, so a
    `Map`-typed variable cannot call `firstEntry()`. Whether a call later throws (e.g. `getFirst()` on an empty
    set) is a runtime matter.
  rule: "JEP 431: SequencedCollection is implemented by List, Deque, SequencedSet (LinkedHashSet, SortedSet); SequencedMap by LinkedHashMap and SortedMap."
  misconception: Every Set and Map gained getFirst()/firstEntry() in Java 21.
  hint: Ask whether each declared type has a defined encounter order.

