- id: D5-SRT-001
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: multi
  format: concept
  difficulty: foundation
  estSeconds: 75
  tags: [Comparable, Comparator]
  prompt: Which statements about `Comparable` and `Comparator` are true? Choose three.
  options:
    - key: a
      text: "`Comparable` is in `java.lang` and declares `int compareTo(T o)`."
      correct: true
      why: Comparable defines a class's natural ordering via compareTo.
    - key: b
      text: "`Comparator` is in `java.util` and declares `int compare(T a, T b)`."
      correct: true
      why: Comparator is a separate functional interface for external orderings.
    - key: c
      text: "`Collections.sort(list)` compiles for any `List<T>`, and throws at runtime if T is not Comparable."
      why: Its signature requires T extends Comparable<? super T>, so a list of non-Comparable elements does not even compile.
    - key: d
      text: "A `TreeSet` created without a comparator whose elements are not `Comparable` throws `ClassCastException` when an element is added."
      correct: true
      why: TreeSet's type parameter is unbounded, so it compiles; the cast to Comparable fails on the first add.
    - key: e
      text: "`compareTo` must return -1, 0 or 1."
      why: Only the sign matters; any negative or positive int is valid.
  explanation: |
    `Comparable` (`java.lang`) gives a type its natural order; `Comparator` (`java.util`) defines any other order.
    `Collections.sort(List<T>)` is bounded by `T extends Comparable<? super T>` — a compile-time check — whereas
    `TreeSet<E>` is unbounded and fails at runtime. Only the sign of a comparison result matters.
  rule: "Comparable.compareTo / Comparator.compare return a negative, zero or positive int; Collections.sort(List<T>) requires T extends Comparable<? super T>."
  misconception: Comparison methods must return exactly -1, 0 or 1.
  hint: Check where each API's requirement is enforced — compile time or runtime.

- id: D5-SRT-002
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 180
  tags: [Comparator, thenComparing, reversed, records]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        record Emp(String name, String dept, int salary) {}
        public static void main(String[] args) {
            List<Emp> list = new ArrayList<>(List.of(
                new Emp("Ana", "IT", 50), new Emp("Bob", "HR", 40),
                new Emp("Cid", "IT", 60), new Emp("Dee", "HR", 40)));
            list.sort(Comparator.comparing(Emp::dept)
                                .thenComparing(Emp::salary, Comparator.reverseOrder())
                                .thenComparing(Emp::name)
                                .reversed());
            list.forEach(e -> System.out.print(e.name() + " "));
            System.out.println();
        }
    }
  options:
    - key: a
      text: "`Ana Cid Dee Bob`"
      correct: true
      why: The final reversed() flips the whole chain — dept descending (IT before HR), salary ascending, name descending.
    - key: b
      text: "`Cid Ana Bob Dee`"
      why: That would be dept descending with the inner comparators unchanged; reversed() at the end also reverses the tie-breakers.
    - key: c
      text: "`Bob Dee Cid Ana`"
      why: That is the order before reversed() is applied (HR first, salary descending, name ascending).
    - key: d
      text: "`Dee Bob Ana Cid`"
      why: reversed() also reverses the primary key, so IT (larger string) comes first.
  explanation: |
    Without `reversed()` the order is: dept ascending (HR, IT); within a dept, salary descending; then name
    ascending ⇒ `Bob Dee Cid Ana`. `reversed()` at the end of the chain returns a comparator that reverses
    **all** of that ⇒ `Ana Cid Dee Bob`.
  rule: "Comparator.reversed() returns a comparator imposing the reverse ordering of the entire comparator it is called on."
  misconception: reversed() applies only to the last thenComparing.
  hint: First compute the order without reversed(), then reverse the whole list.
  java:
    expect: { compiles: true, stdout: "Ana Cid Dee Bob" }

- id: D5-SRT-003
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 120
  tags: [Comparator, lambda, type-inference, reversed]
  prompt: What is the result of compiling this code?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> words = new ArrayList<>(List.of("bb", "a", "ccc"));
            words.sort(Comparator.comparing(w -> w.length()).reversed());
            System.out.println(words);
        }
    }
  options:
    - key: a
      text: Compilation fails at line 5 because `w` is inferred as `Object`
      correct: true
      why: Because reversed() is invoked on the result of comparing(...), that call is not in an assignment/argument context, so T is inferred as Object and w.length() does not exist.
    - key: b
      text: "`[ccc, bb, a]`"
      why: That is the intended result, but the implicitly typed lambda gets no target type from words.sort here.
    - key: c
      text: "`[a, bb, ccc]`"
      why: The code does not compile; even if it did, reversed() would put the longest first.
    - key: d
      text: A `ClassCastException` is thrown
      why: The problem is detected at compile time (cannot find symbol length()).
  explanation: |
    Target typing flows into `Comparator.comparing(...)` only if that call is directly the argument. Here it is
    the receiver of `.reversed()`, so the compiler infers `T` from the lambda alone, defaulting to `Object` —
    `w.length()` ⇒ *cannot find symbol*. Fix: `Comparator.comparing(String::length).reversed()` or
    `comparing((String w) -> w.length())`.
  rule: "JLS 15.12.2.6 / 18: a method invocation used as the receiver of another invocation is not a poly expression in an assignment context, so its type arguments are inferred without a target type."
  misconception: The compiler always infers lambda parameter types from the surrounding call.
  hint: Which expression is actually passed to words.sort?
  java:
    expect: { compiles: false, errorContains: "cannot find symbol", errorLine: 5 }

# ───────────── equals / hashCode ─────────────

- id: D5-EQH-001
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 180
  tags: [hashCode, equals, HashSet, mutable-keys]
  prompt: What is the output?
  code: |
    import java.util.*;
    class Ticket {
        int id;
        Ticket(int id) { this.id = id; }
        @Override public boolean equals(Object o) { return o instanceof Ticket t && t.id == id; }
        @Override public int hashCode() { return id; }
    }
    public class Main {
        public static void main(String[] args) {
            Set<Ticket> set = new HashSet<>();
            Ticket t = new Ticket(1);
            set.add(t);
            t.id = 2;
            set.add(new Ticket(2));
            System.out.println(set.size() + " " + set.contains(t) + " " + set.contains(new Ticket(1)));
        }
    }
  options:
    - key: a
      text: "`2 true false`"
      correct: true
      why: t stays in the bucket for hash 1; the new Ticket(2) goes to bucket 2 (size 2). contains(t) looks in bucket 2 and finds the equal new Ticket(2); contains(Ticket(1)) looks in bucket 1 but t's id is now 2.
    - key: b
      text: "`1 true false`"
      why: When the second ticket is added, the set searches bucket 2 only; t is still filed under hash 1, so no duplicate is detected.
    - key: c
      text: "`2 false true`"
      why: Lookups use the current hashCode and equals; Ticket(1) is no longer equal to anything in the set.
    - key: d
      text: "`2 false false`"
      why: contains(t) computes hash 2, and the bucket for 2 contains new Ticket(2), which equals t.
  explanation: |
    A `HashSet` files each element under the hash it had **when it was added**. Mutating `t` changes its hash
    to 2, but it stays filed under 1. Adding `new Ticket(2)` checks bucket 2 — empty — so the set now has two
    "equal" elements. `contains(t)` finds the other ticket in bucket 2; `contains(new Ticket(1))` checks
    bucket 1, where `t` (now id 2) is not equal. Never mutate fields used by `equals`/`hashCode` of an element.
  rule: "Object.hashCode contract and Set Javadoc: behaviour is unspecified if an element's value is changed in a way that affects equals comparisons while it is in the set."
  misconception: A HashSet re-hashes elements automatically when they change.
  hint: Which bucket does each lookup search?
  java:
    expect: { compiles: true, stdout: "2 true false" }

# ───────────── generics ─────────────

- id: D5-GEN-001
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 150
  tags: [generics, wildcards, PECS]
  prompt: |
    Given `List<? extends Number> ext = new ArrayList<Integer>();` and
    `List<? super Integer> sup = new ArrayList<Number>();`, which statements compile? Choose four.
  options:
    - key: a
      text: "`Number n = ext.get(0);`"
      correct: true
      why: Whatever the actual type argument is, it is some subtype of Number, so reading as Number is safe.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) {
              List<? extends Number> ext = new ArrayList<Integer>(List.of(1));
              Number n = ext.get(0); System.out.println(n); } }
        expect: { compiles: true, stdout: "1" }
    - key: b
      text: "`ext.add(1);`"
      why: The list might be a List<Double>; the compiler cannot allow adding an Integer (only null).
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) {
              List<? extends Number> ext = new ArrayList<Integer>();
              ext.add(1); } }
        expect: { compiles: false, errorContains: "incompatible types" }
    - key: c
      text: "`sup.add(1);`"
      correct: true
      why: The list holds Integer or one of its supertypes, so an Integer can always be stored.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) {
              List<? super Integer> sup = new ArrayList<Number>();
              sup.add(1); System.out.println(sup); } }
        expect: { compiles: true, stdout: "[1]" }
    - key: d
      text: "`Integer i = sup.get(0);`"
      why: The list could be a List<Object> holding anything; reads are typed as Object.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) {
              List<? super Integer> sup = new ArrayList<Number>();
              sup.add(1); Integer i = sup.get(0); } }
        expect: { compiles: false, errorContains: "cannot be converted to java.lang.Integer" }
    - key: e
      text: "`Object o = sup.get(0);`"
      correct: true
      why: Every element is at least an Object.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) {
              List<? super Integer> sup = new ArrayList<Number>();
              sup.add(1); Object o = sup.get(0); System.out.println(o); } }
        expect: { compiles: true, stdout: "1" }
    - key: f
      text: "`ext.add(null);`"
      correct: true
      why: null belongs to every reference type, so it is the one value you can add to a ? extends list.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) {
              List<? extends Number> ext = new ArrayList<Integer>();
              ext.add(null); System.out.println(ext); } }
        expect: { compiles: true, stdout: "[null]" }
  explanation: |
    **PECS**: `? extends Number` is a *producer* — you can read elements as `Number`, but cannot add anything
    except `null`. `? super Integer` is a *consumer* — you can add `Integer`s, but reads only give `Object`.
  rule: "JLS 4.5.1: wildcard types; with ? extends T you may read as T; with ? super T you may write T (Producer Extends, Consumer Super)."
  misconception: "`List<? extends Number>` accepts any Number to be added."
  hint: Imagine the worst-case actual type argument for each wildcard.

- id: D5-GEN-002
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: single
  format: runtime-exception
  difficulty: expert
  estSeconds: 150
  tags: [generics, raw-types, ClassCastException, heap-pollution]
  prompt: What is the result of compiling and running this program?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List raw = new ArrayList();
            raw.add("one");
            raw.add(2);
            List<String> strings = raw;
            System.out.print(strings.size() + " ");
            for (String s : strings) System.out.print(s + " ");
        }
    }
  options:
    - key: a
      text: It compiles with warnings, prints `2 one ` and then throws a `ClassCastException`
      correct: true
      why: Raw types disable type checking (only unchecked warnings); the cast to String inserted by the compiler fails when the Integer is read in the loop.
    - key: b
      text: Compilation fails at line 7 because a raw `List` cannot be assigned to `List<String>`
      why: Assigning a raw type to a parameterized type is allowed with an unchecked warning.
    - key: c
      text: Compilation fails at line 6 because `2` is not a `String`
      why: A raw List accepts any Object; there is no type argument to check against.
    - key: d
      text: "`2 one 2`"
      why: The enhanced for loop with String s inserts a cast to String for each element; the Integer fails that cast.
  explanation: |
    Raw types bypass generic type checking. Line 7 compiles with an *unchecked* warning, polluting
    `List<String>` with an `Integer`. Because of erasure the list itself has no idea; the failure appears only
    where the compiler inserted a cast — when the loop assigns the second element to `String s` —
    as a `ClassCastException`.
  rule: "JLS 4.8 / 5.1.9: use of raw types produces unchecked warnings; heap pollution is detected only by compiler-inserted casts at runtime."
  misconception: The compiler rejects mixing types in a raw list, or the error happens at add().
  hint: Where does the compiler insert a cast to String?
  java:
    expect: { compiles: true, exception: java.lang.ClassCastException, stdout: "2 one" }

- id: D5-GEN-003
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags: [generics, type-erasure, compile-errors]
  prompt: Which of these declarations compile? Choose two.
  options:
    - key: a
      text: "`class Box<T> { T make() { return new T(); } }`"
      why: The type argument is erased at runtime, so the JVM would not know which class to instantiate.
      java:
        source: |
          class Box<T> { T make() { return new T(); } }
          public class Main { public static void main(String[] args) { } }
        expect: { compiles: false, errorContains: "unexpected type" }
    - key: b
      text: "`class Box<T> { boolean same(Object o) { return o instanceof Box<?>; } }`"
      correct: true
      why: An unbounded wildcard type is reifiable, so instanceof with Box<?> is allowed.
      java:
        source: |
          class Box<T> { boolean same(Object o) { return o instanceof Box<?>; } }
          public class Main { public static void main(String[] args) { System.out.println(new Box<String>().same(new Box<Integer>())); } }
        expect: { compiles: true, stdout: "true" }
    - key: c
      text: "`class Box<T> { static T shared; }`"
      why: A static member belongs to the class, shared by every parameterization, so it cannot use the instance type parameter T.
      java:
        source: |
          class Box<T> { static T shared; }
          public class Main { public static void main(String[] args) { } }
        expect: { compiles: false, errorContains: "non-static type variable T cannot be referenced from a static context" }
    - key: d
      text: "`class Util { void log(Set<String> s) { } void log(Set<Integer> s) { } }`"
      why: Both methods erase to log(Set), which is a name clash.
      java:
        source: |
          import java.util.*;
          class Util { void log(Set<String> s) { } void log(Set<Integer> s) { } }
          public class Main { public static void main(String[] args) { } }
        expect: { compiles: false, errorContains: "have the same erasure" }
    - key: e
      text: "`class Shelf<T extends Comparable<T>> { T best(T a, T b) { return a.compareTo(b) >= 0 ? a : b; } }`"
      correct: true
      why: A bounded type parameter lets the body call compareTo on T.
      java:
        source: |
          class Shelf<T extends Comparable<T>> { T best(T a, T b) { return a.compareTo(b) >= 0 ? a : b; } }
          public class Main { public static void main(String[] args) { System.out.println(new Shelf<String>().best("ab", "b")); } }
        expect: { compiles: true, stdout: "b" }
    - key: f
      text: "`class Holder<T> { java.util.List<T>[] lists = new java.util.List<T>[2]; }`"
      why: Arrays need a reifiable component type; generic array creation is a compile error.
      java:
        source: |
          class Holder<T> { java.util.List<T>[] lists = new java.util.List<T>[2]; }
          public class Main { public static void main(String[] args) { } }
        expect: { compiles: false, errorContains: "generic array creation" }
  explanation: |
    Type arguments are erased after compilation. That forbids `new T()`, generic array creation
    (`new List<T>[2]`), static use of a class's type parameter, and overloads whose parameter types erase to the
    same signature. `instanceof Box<?>` is fine because `Box<?>` is reifiable, and bounded type parameters let
    you call the bound's methods.
  rule: "JLS 4.6/4.7 type erasure and reifiable types; JLS 8.4.2 (override-equivalent signatures after erasure); JLS 15.10.1 generic array creation."
  misconception: Generic type information is fully available at runtime.
  hint: For each line, ask what the JVM would need to know at runtime.

- id: D5-GEN-004
  objective: D5.1
  lesson: coll-maps-sorting-generics
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [generics, generic-methods, bounded-types, type-witness]
  prompt: What is the output?
  code: |
    public class Main {
        static <T> T first(T a, T b) { return a; }
        static <T extends Number> double twice(T t) { return t.doubleValue() * 2; }
        public static void main(String[] args) {
            String s = first("x", "y");
            System.out.println(s + " " + twice(4) + " " + Main.<Object>first(1, "z"));
        }
    }
  options:
    - key: a
      text: "`x 8.0 1`"
      correct: true
      why: T is inferred as String for the first call; 4 is boxed to Integer (a Number) and doubleValue()*2 is 8.0; the explicit witness <Object> accepts both arguments and returns the first.
    - key: b
      text: "`x 8 1`"
      why: twice returns a double, so the value prints as 8.0.
    - key: c
      text: Compilation fails because `first(1, "z")` mixes Integer and String
      why: With T = Object (explicit witness), both arguments are Objects; even without a witness the compiler would infer a common supertype.
    - key: d
      text: Compilation fails because `twice(4)` passes a primitive to a generic method
      why: The int argument is boxed to Integer, which satisfies the bound T extends Number.
  explanation: |
    A generic method declares its type parameters before the return type. The compiler infers `T` from the
    arguments (and target type), boxing primitives when needed. A bound (`T extends Number`) lets the body call
    `Number` methods. An explicit type witness (`Main.<Object>first(...)`) fixes `T` directly.
  rule: "JLS 8.4.4 generic methods; JLS 18 type inference; type arguments must be reference types, so primitives are boxed."
  hint: Infer T separately for each call.
  java:
    expect: { compiles: true, stdout: "x 8.0 1" }
