# D5.1 — arrays, List/Set/Deque/Map, sequenced collections, sorting, equals/hashCode, generics

# ───────────── arrays ─────────────

- id: D5-ARR-001
  objective: D5.1
  lesson: coll-arrays
  type: multi
  format: select-valid
  difficulty: foundation
  estSeconds: 90
  tags: [arrays, declaration, initialization]
  prompt: Which of these lines compile when placed inside a method? Choose three.
  options:
    - key: a
      text: "`int[] a = new int[3];`"
      correct: true
      why: A dimension expression with no initializer — the standard creation form.
      java:
        source: |
          public class Main { public static void main(String[] args) { int[] a = new int[3]; System.out.println(a.length); } }
        expect: { compiles: true, stdout: "3" }
    - key: b
      text: "`int[] b = new int[2]{1, 2};`"
      why: A creation expression may have a dimension or an initializer, never both.
      java:
        source: |
          public class Main { public static void main(String[] args) { int[] b = new int[2]{1, 2}; } }
        expect: { compiles: false, errorContains: "array creation with both dimension expression and initialization is illegal" }
    - key: c
      text: "`int c[] = {1, 2};`"
      correct: true
      why: Brackets may follow the variable name, and the `{...}` shorthand is allowed in a declaration.
      java:
        source: |
          public class Main { public static void main(String[] args) { int c[] = {1, 2}; System.out.println(c.length); } }
        expect: { compiles: true, stdout: "2" }
    - key: d
      text: "`int[] d = new int[];`"
      why: Without an initializer the dimension is required (array dimension missing).
      java:
        source: |
          public class Main { public static void main(String[] args) { int[] d = new int[]; } }
        expect: { compiles: false, errorContains: "array dimension missing" }
    - key: e
      text: "`int[][] e = new int[2][];`"
      correct: true
      why: Only the first dimension is required; the rows start as null.
      java:
        source: |
          public class Main { public static void main(String[] args) { int[][] e = new int[2][]; System.out.println(e[0]); } }
        expect: { compiles: true, stdout: "null" }
    - key: f
      text: "`var f = {1, 2};`"
      why: The array initializer shorthand needs an explicit array type to target; `var` cannot provide it.
      java:
        source: |
          public class Main { public static void main(String[] args) { var f = {1, 2}; } }
        expect: { compiles: false, errorContains: "array initializer needs an explicit target-type" }
  explanation: |
    An array creation needs exactly one of: a dimension (`new int[3]`) or an initializer (`new int[]{1, 2}`).
    The bare `{...}` shorthand works only in a declaration with an explicit array type. For multidimensional
    arrays only the leftmost dimension is mandatory.
  rule: "JLS 15.10.1 / 10.6: an array creation expression has either dimension expressions or an array initializer; the initializer shorthand is only allowed in a declaration (or with new)."
  misconception: "`var` can infer the type from `{1, 2}` like it does from `new int[]{1, 2}`."
  hint: Count dimensions vs initializers in each creation expression.

- id: D5-ARR-002
  objective: D5.1
  lesson: coll-arrays
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 90
  tags: [arrays, covariance, ArrayStoreException]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        public static void main(String[] args) {
            Object[] items = new String[2];
            items[0] = "ok";
            items[1] = Integer.valueOf(1);
            System.out.println(items[0] + " " + items[1]);
        }
    }
  options:
    - key: a
      text: An `ArrayStoreException` is thrown at line 5
      correct: true
      why: The array object is really a String[], and every store into a reference array is type-checked at runtime.
    - key: b
      text: "`ok 1`"
      why: The static type Object[] lets the code compile, but the runtime component type is String, so the store fails.
    - key: c
      text: Compilation fails at line 3 because `String[]` cannot be assigned to `Object[]`
      why: Arrays are covariant — a String[] is an Object[].
    - key: d
      text: A `ClassCastException` is thrown at line 5
      why: The JVM uses a dedicated exception for bad array stores, ArrayStoreException.
  explanation: |
    Arrays are **covariant**: since `String` is a subtype of `Object`, `String[]` is a subtype of `Object[]`,
    so line 3 compiles. Line 5 also compiles (the static type is `Object[]`), but the array object knows its
    component type is `String`, and the runtime store check throws `ArrayStoreException: java.lang.Integer`.
  rule: "JLS 10.5: an assignment to an element of a reference array whose runtime component type is not compatible with the value throws ArrayStoreException."
  misconception: If it compiles, storing into an Object[] always works.
  hint: What is the array's runtime type, as opposed to the variable's type?
  java:
    expect: { compiles: true, exception: java.lang.ArrayStoreException }

- id: D5-ARR-003
  objective: D5.1
  lesson: coll-arrays
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 120
  tags: [Arrays.asList, write-through, UnsupportedOperationException]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            Integer[] arr = {3, 1, 2};
            List<Integer> list = Arrays.asList(arr);
            Collections.sort(list);
            arr[0] = 9;
            System.out.print(list + " ");
            try {
                list.remove(Integer.valueOf(2));
            } catch (UnsupportedOperationException e) {
                System.out.print("UOE ");
            }
            System.out.println(Arrays.toString(arr));
        }
    }
  options:
    - key: a
      text: "`[9, 2, 3] UOE [9, 2, 3]`"
      correct: true
      why: Sorting the list sorts the backing array; the later write to arr[0] shows through the list; remove is not supported by the fixed-size list.
    - key: b
      text: "`[1, 2, 3] UOE [9, 2, 3]`"
      why: Arrays.asList does not copy — the list and the array share the same storage, so arr[0] = 9 is visible via the list.
    - key: c
      text: "`[9, 2, 3] [9, 3]`"
      why: The list is fixed-size; remove(Object) throws UnsupportedOperationException even if the element exists.
    - key: d
      text: "`[9, 1, 2] UOE [9, 1, 2]`"
      why: Collections.sort works on an Arrays.asList list (it only uses set), so the array was sorted to [1, 2, 3] first.
  explanation: |
    `Arrays.asList` returns a fixed-size list **backed by** the array. `Collections.sort` only needs `set`, which
    is supported and writes through: the array becomes `[1, 2, 3]`. `arr[0] = 9` is visible through the list:
    `[9, 2, 3]`. Any size-changing operation such as `remove` throws `UnsupportedOperationException`.
  rule: "Arrays.asList(T...) returns a fixed-size list backed by the specified array; changes to the list write through to the array and vice versa."
  misconception: Arrays.asList makes an independent copy, or it is fully immutable like List.of.
  hint: Is the list a copy or a view?
  java:
    expect: { compiles: true, stdout: "[9, 2, 3] UOE [9, 2, 3]" }

- id: D5-ARR-004
  objective: D5.1
  lesson: coll-arrays
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 75
  tags: [arrays, multidimensional, ragged, defaults]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            int[][] grid = { {1, 2, 3}, {4}, new int[2] };
            System.out.println(grid.length + " " + grid[1].length + " " + grid[2][1]
                + " " + Arrays.deepToString(grid));
        }
    }
  options:
    - key: a
      text: "`3 1 0 [[1, 2, 3], [4], [0, 0]]`"
      correct: true
      why: Three rows; row 1 has one element; new int[2] is filled with default zeros; deepToString prints nested arrays.
    - key: b
      text: "`3 3 0 [[1, 2, 3], [4], [0, 0]]`"
      why: Rows of a ragged array have their own lengths; grid[1] is {4}, length 1.
    - key: c
      text: "`6 1 0 [[1, 2, 3], [4], [0, 0]]`"
      why: grid.length is the number of rows (top-level elements), not the total number of ints.
    - key: d
      text: "`3 1 null [[1, 2, 3], [4], [null, null]]`"
      why: Elements of an int array default to 0, not null.
  explanation: |
    A two-dimensional array is an array of row arrays, and each row can have its own length. `grid.length`
    is 3 (rows), `grid[1].length` is 1, and the third row created with `new int[2]` contains default zeros.
  rule: "JLS 10: multidimensional arrays are arrays of arrays; JLS 4.12.5: array components are initialized to default values."
  hint: Count rows, not elements.
  java:
    expect: { compiles: true, stdout: "3 1 0 [[1, 2, 3], [4], [0, 0]]" }

- id: D5-ARR-005
  objective: D5.1
  lesson: coll-arrays
  type: single
  format: concept
  difficulty: expert
  estSeconds: 90
  tags: [Arrays.binarySearch, unsorted, undefined]
  prompt: What can be said about the value printed by this program?
  code: |
    import java.util.Arrays;
    public class Main {
        public static void main(String[] args) {
            int[] data = {40, 10, 30, 20};
            System.out.println(Arrays.binarySearch(data, 20));
        }
    }
  options:
    - key: a
      text: The result is undefined because the array is not sorted
      correct: true
      why: binarySearch requires a sorted array; on unsorted input the Javadoc explicitly says the result is undefined.
    - key: b
      text: It always prints `3`, the index of 20
      why: A binary search does not scan every element; it may never look at index 3.
    - key: c
      text: It always prints `-3`
      why: That happens to be what the current implementation returns here, but the API makes no promise — another implementation (or JDK) could return something else.
    - key: d
      text: An `IllegalArgumentException` is thrown because the array is not sorted
      why: binarySearch does not check whether the array is sorted (that would take linear time).
  explanation: |
    `Arrays.binarySearch` assumes the array is sorted. If it is not, "the results are undefined" — the method
    neither checks nor throws. On today's JDK this particular call prints `-3` (it inspects the middle
    elements and concludes "not found"), but the exam's answer is that the result cannot be relied upon.
  rule: "Arrays.binarySearch: the array must be sorted (as by Arrays.sort) prior to making this call; if it is not sorted, the results are undefined."
  misconception: binarySearch finds any element that exists in the array.
  hint: Read the precondition in the Javadoc.
  java:
    expect: { compiles: true }
    optionCheck: false

- id: D5-ARR-006
  objective: D5.1
  lesson: coll-arrays
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [Arrays.binarySearch, insertion-point]
  prompt: What is the output?
  code: |
    import java.util.Arrays;
    public class Main {
        public static void main(String[] args) {
            int[] even = {2, 4, 6, 8};
            System.out.println(Arrays.binarySearch(even, 6) + " "
                + Arrays.binarySearch(even, 5) + " "
                + Arrays.binarySearch(even, 1) + " "
                + Arrays.binarySearch(even, 9));
        }
    }
  options:
    - key: a
      text: "`2 -3 -1 -5`"
      correct: true
      why: "6 is at index 2. 5 would be inserted at 2 → -(2)-1 = -3; 1 at 0 → -1; 9 at 4 → -5."
    - key: b
      text: "`2 -2 0 -4`"
      why: The not-found value is -(insertionPoint) - 1, so it is always negative, even for insertion point 0.
    - key: c
      text: "`2 -1 -1 -1`"
      why: binarySearch encodes the insertion point in the negative result; it does not just return -1.
    - key: d
      text: "`3 -3 -1 -5`"
      why: Indexes are zero-based; 6 is the third element, at index 2.
  explanation: |
    For a sorted array, `binarySearch` returns the index of the key if present; otherwise
    `-(insertionPoint) - 1`, where the insertion point is the index at which the key would be inserted to keep
    the array sorted (`length` if it is greater than every element). The "−1" guarantees a negative result.
  rule: "Arrays.binarySearch returns index of the search key if found; otherwise (-(insertion point) - 1)."
  misconception: Not-found always returns -1.
  hint: Work out the insertion point first, then apply -(ip) - 1.
  java:
    expect: { compiles: true, stdout: "2 -3 -1 -5" }

- id: D5-ARR-007
  objective: D5.1
  lesson: coll-arrays
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 120
  tags: [Arrays.compare, Arrays.mismatch, deepEquals]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            int[] a = {1, 2, 3};
            int[] b = {1, 2, 4};
            int[][] m1 = {{1}, {2}};
            int[][] m2 = {{1}, {2}};
            System.out.println(Arrays.compare(a, b) + " " + Arrays.mismatch(a, b) + " "
                + Arrays.equals(m1, m2) + " " + Arrays.deepEquals(m1, m2));
        }
    }
  options:
    - key: a
      text: "`-1 2 false true`"
      correct: true
      why: "compare: first difference 3 < 4 → negative; mismatch: first differing index 2; equals compares rows by identity (Object.equals); deepEquals compares contents."
    - key: b
      text: "`-1 2 true true`"
      why: Arrays.equals(Object[], Object[]) calls equals on each row, and int[] uses identity equals; the rows are distinct objects.
    - key: c
      text: "`1 2 false true`"
      why: a is lexicographically smaller (3 < 4), so compare returns a negative value.
    - key: d
      text: "`-1 3 false true`"
      why: mismatch returns the zero-based index of the first difference, which is 2.
  explanation: |
    `Arrays.compare` compares lexicographically: the first mismatching element decides (3 vs 4 ⇒ negative).
    `Arrays.mismatch` returns the index of that element (2), or -1 if the arrays are equal. For nested arrays,
    `Arrays.equals` compares elements with `equals`, which for arrays is identity — so it is `false`;
    `Arrays.deepEquals` recurses into the rows.
  rule: "Arrays.equals(Object[],Object[]) uses element equals(); Arrays.deepEquals compares nested arrays by content; Arrays.mismatch returns the first differing index or -1."
  misconception: Arrays.equals compares nested arrays deeply.
  hint: What does int[].equals(int[]) do?
  java:
    expect: { compiles: true, stdout: "-1 2 false true" }

- id: D5-ARR-008
  objective: D5.1
  lesson: coll-arrays
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 120
  tags: [arrays, declaration, covariance, primitive-arrays]
  prompt: Which statements compile? Choose two.
  options:
    - key: a
      text: "`int a[], b; b = new int[2];`"
      why: "`int a[], b;` declares a as int[] but b as a plain int, so assigning an array to b fails."
      java:
        source: |
          public class Main { public static void main(String[] args) { int a[], b; b = new int[2]; } }
        expect: { compiles: false, errorContains: "int[] cannot be converted to int" }
    - key: b
      text: "`int[] c, d[]; d = new int[2][];`"
      correct: true
      why: c is int[] and d is int[][] (the extra brackets after d add a dimension), so the assignment is fine.
      java:
        source: |
          public class Main { public static void main(String[] args) { int[] c, d[]; d = new int[2][]; System.out.println(d.length); } }
        expect: { compiles: true, stdout: "2" }
    - key: c
      text: "`Object o = new int[]{1};`"
      correct: true
      why: Every array is an Object, including primitive arrays.
      java:
        source: |
          public class Main { public static void main(String[] args) { Object o = new int[]{1}; System.out.println(o instanceof int[]); } }
        expect: { compiles: true, stdout: "true" }
    - key: d
      text: "`Object[] e = new int[1];`"
      why: Covariance applies only to reference component types; int is not an Object, so int[] is not an Object[].
      java:
        source: |
          public class Main { public static void main(String[] args) { Object[] e = new int[1]; } }
        expect: { compiles: false, errorContains: "int[] cannot be converted to java.lang.Object[]" }
    - key: e
      text: "`long[] f = new int[2];`"
      why: Widening int to long applies to values, not to array types; int[] and long[] are unrelated.
      java:
        source: |
          public class Main { public static void main(String[] args) { long[] f = new int[2]; } }
        expect: { compiles: false, errorContains: "int[] cannot be converted to long[]" }
    - key: f
      text: "`int[][] g = new int[][3];`"
      why: The leftmost dimension must be specified; later ones may be omitted, not earlier ones.
      java:
        source: |
          public class Main { public static void main(String[] args) { int[][] g = new int[][3]; } }
        expect: { compiles: false, errorContains: "expected" }
  explanation: |
    Brackets after a variable name apply only to that variable: `int a[], b;` gives an `int[]` and an `int`;
    `int[] c, d[];` gives an `int[]` and an `int[][]`. Any array is an `Object`, but only arrays of reference
    types are covariant (`String[]` → `Object[]`); primitive arrays are never converted to other array types.
  rule: "JLS 10.2: brackets may appear after the type or after the declarator; JLS 4.10.3: array subtyping applies to reference component types only."
  misconception: "`int a[], b;` declares two arrays, like `int[] a, b;`."
  hint: Determine the exact type of every variable first.

# ───────────── lists ─────────────

- id: D5-LST-001
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [List.remove, overloading, boxing]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<Integer> list = new ArrayList<>(List.of(3, 2, 1, 0));
            list.remove(1);
            list.remove(Integer.valueOf(1));
            list.add(1, 5);
            System.out.println(list);
        }
    }
  options:
    - key: a
      text: "`[3, 5, 0]`"
      correct: true
      why: "remove(1) removes the element at index 1 (the 2) → [3, 1, 0]; remove(Integer.valueOf(1)) removes the value 1 → [3, 0]; add(1, 5) inserts at index 1."
    - key: b
      text: "`[3, 5, 2, 0]`"
      why: The first call is remove(int index) — exact match without boxing — so it removes the 2 at index 1, not the value 1.
    - key: c
      text: "`[5, 2, 0]`"
      why: Only one value-based removal happens; remove(1) is by index.
    - key: d
      text: "`[3, 5, 1, 0]`"
      why: The second call explicitly passes an Integer, so remove(Object) runs and removes the value 1.
  explanation: |
    `List<Integer>` has two `remove` overloads. With an `int` argument, phase-1 overload resolution (no boxing)
    already finds `remove(int index)`. With an `Integer` argument, `remove(Object)` applies. `add(int, E)`
    inserts and shifts the rest right.
  rule: "List.remove(int index) vs List.remove(Object o); overload resolution prefers the method that applies without boxing (JLS 15.12.2)."
  misconception: remove(1) on a List<Integer> removes the value 1.
  hint: Which overload applies to an int literal without boxing?
  java:
    expect: { compiles: true, stdout: "[3, 5, 0]" }

- id: D5-LST-002
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [ConcurrentModificationException, for-each, iterator]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> tasks = new ArrayList<>(List.of("plan", "code", "test", "ship"));
            for (String t : tasks) {
                if (t.equals("test")) tasks.remove(t);
            }
            System.out.println(tasks);
        }
    }
  options:
    - key: a
      text: "`[plan, code, ship]`"
      correct: true
      why: Removing the second-to-last element drops the size to 3 while the cursor is 3, so hasNext() returns false and the loop ends before next() can detect the modification.
    - key: b
      text: A `ConcurrentModificationException` is thrown
      why: CME is thrown by next(), but next() is never called again — hasNext() already returns false after this particular removal.
    - key: c
      text: "`[plan, code, test, ship]`"
      why: The removal does happen; list.remove(Object) removed "test".
    - key: d
      text: "`[plan, code]`"
      why: Only "test" matches the condition; "ship" is never even visited, so it stays in the list.
  explanation: |
    ArrayList's iterator keeps a cursor. After returning `"test"` (index 2) the cursor is 3. Removing an element
    makes `size()` 3, so `hasNext()` (`cursor != size`) is false and the loop exits normally — no
    `ConcurrentModificationException`, and `"ship"` is never visited. Removing any other element would make the
    next `next()` call detect the modification and throw. Use `removeIf` or `Iterator.remove()` instead.
  rule: "ArrayList iterators are fail-fast on a best-effort basis: a structural modification not made through the iterator causes the next call to next() to throw ConcurrentModificationException."
  misconception: Removing inside a for-each loop always throws ConcurrentModificationException.
  hint: Track the iterator's cursor and the list size after the removal.
  java:
    expect: { compiles: true, stdout: "[plan, code, ship]" }

- id: D5-LST-003
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [unmodifiableList, List.copyOf, views]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> src = new ArrayList<>(List.of("x", "y"));
            List<String> a = Collections.unmodifiableList(src);
            List<String> b = List.copyOf(src);
            List<String> c = new ArrayList<>(src);
            src.set(0, "z");
            src.add("w");
            System.out.println(a + " " + b + " " + c);
        }
    }
  options:
    - key: a
      text: "`[z, y, w] [x, y] [x, y]`"
      correct: true
      why: unmodifiableList is a read-only view that reflects changes to src; List.copyOf and new ArrayList are independent copies.
    - key: b
      text: "`[x, y] [x, y] [x, y]`"
      why: Collections.unmodifiableList does not copy — it wraps src, so later changes show through.
    - key: c
      text: "`[z, y, w] [z, y, w] [x, y]`"
      why: List.copyOf creates an immutable snapshot at the time of the call.
    - key: d
      text: An `UnsupportedOperationException` is thrown
      why: The modifications are made on src, a normal ArrayList; only the wrapper itself rejects changes.
  explanation: |
    `Collections.unmodifiableList` returns an unmodifiable **view**: you cannot change the list through it, but
    it always shows the current contents of the backing list. `List.copyOf` and the `ArrayList` copy constructor
    take snapshots at the time of the call.
  rule: "Collections.unmodifiableList returns an unmodifiable view of the specified list; List.copyOf returns an unmodifiable List containing the elements of the given collection."
  misconception: Unmodifiable means the contents can never change.
  hint: Which of the three keeps a reference to src?
  java:
    expect: { compiles: true, stdout: "[z, y, w] [x, y] [x, y]" }

- id: D5-LST-004
  objective: D5.1
  lesson: coll-lists-sets-deques
  type: multi
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 120
  tags: [UnsupportedOperationException, List.of, Arrays.asList, immutable]
  prompt: Which statements throw an `UnsupportedOperationException` at runtime? Choose three.
  options:
    - key: a
      text: "`List.of(1, 2).set(0, 5);`"
      correct: true
      why: List.of creates an unmodifiable list; every mutator, including set, throws UOE.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { List.of(1, 2).set(0, 5); } }
        expect: { compiles: true, exception: java.lang.UnsupportedOperationException }
    - key: b
      text: "`Arrays.asList(1, 2).set(0, 5);`"
      why: The Arrays.asList list is fixed-size but supports set (it writes to the backing array).
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { Arrays.asList(1, 2).set(0, 5); System.out.println("ok"); } }
        expect: { compiles: true, stdout: "ok" }
    - key: c
      text: "`Arrays.asList(1, 2).add(3);`"
      correct: true
      why: add would change the size of a fixed-size list.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { Arrays.asList(1, 2).add(3); } }
        expect: { compiles: true, exception: java.lang.UnsupportedOperationException }
    - key: d
      text: "`new ArrayList<>(List.of(1, 2)).add(3);`"
      why: The ArrayList is a mutable copy; only the List.of source was immutable.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { new ArrayList<>(List.of(1, 2)).add(3); System.out.println("ok"); } }
        expect: { compiles: true, stdout: "ok" }
    - key: e
      text: "`Collections.unmodifiableList(new ArrayList<>(List.of(1))).clear();`"
      correct: true
      why: The unmodifiable view rejects all mutators, including clear.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { Collections.unmodifiableList(new ArrayList<>(List.of(1))).clear(); } }
        expect: { compiles: true, exception: java.lang.UnsupportedOperationException }
    - key: f
      text: "`List.of(1, null);`"
      why: List.of rejects null elements, but with a NullPointerException, not UnsupportedOperationException.
      java:
        source: |
          import java.util.*;
          public class Main { public static void main(String[] args) { List.of(1, null); } }
        expect: { compiles: true, exception: java.lang.NullPointerException }
  explanation: |
    `List.of`/`List.copyOf` and `Collections.unmodifiableList` reject **every** mutator with
    `UnsupportedOperationException`. `Arrays.asList` is only *fixed-size*: `set` works, size changes throw.
    Null elements in `List.of` are rejected at creation with `NullPointerException`.
  rule: "Unmodifiable lists (List.of, List.copyOf, Collections.unmodifiableList) throw UnsupportedOperationException from all mutators; Arrays.asList is fixed-size; List.of throws NullPointerException for null elements."
  misconception: Arrays.asList is fully immutable, like List.of.
  hint: Separate "unmodifiable" from "fixed-size" and from "rejects null".

