  tags: [Map, putIfAbsent, getOrDefault, merge, return-values]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            Map<String, Integer> stock = new HashMap<>();
            stock.put("apple", 3);
            stock.put("pear", null);
            System.out.println(stock.putIfAbsent("apple", 10) + " "
                + stock.putIfAbsent("pear", 5) + " "
                + stock.getOrDefault("fig", 0) + " "
                + stock.merge("apple", 2, Integer::sum) + " "
                + stock.merge("kiwi", 7, Integer::sum));
        }
    }
  options:
    - key: a
      text: "`3 null 0 5 7`"
      correct: true
      why: putIfAbsent returns the existing value 3 without writing; pear maps to null so it is treated as absent (writes 5, returns the old null); fig is absent → 0; merge returns the new values 5 and 7.
    - key: b
      text: "`3 5 0 5 7`"
      why: putIfAbsent returns the PREVIOUS value, which for pear was null.
    - key: c
      text: "`null null 0 5 7`"
      why: For apple a value already exists, so putIfAbsent returns it (3).
    - key: d
      text: "`3 null 0 2 7`"
      why: "merge combines the old value with the new one using the function: 3 + 2 = 5."
  explanation: |
    `putIfAbsent` writes only if the key is absent **or mapped to null**, and returns the previous value.
    `getOrDefault` returns the default for an absent key. `merge` puts the given value if absent (kiwi → 7),
    otherwise the function result (apple → 3 + 2), and returns the **new** value.
  rule: "Map.putIfAbsent returns the previous value (null if absent or null); Map.merge returns the new value associated with the key."
  misconception: putIfAbsent returns the value that ends up in the map.
  hint: Which of these methods return the old value, and which the new one?
  java:
    expect: { compiles: true, stdout: "3 null 0 5 7" }

