  tags: [sequenced-collections, SequencedSet, SequencedMap, java21]
  prompt: Which statements compile? Choose three.
  options:
    - key: a
      text: "`new LinkedHashSet<String>().getFirst();`"
      why: It compiles (LinkedHashSet is a SequencedSet) — but on an empty set getFirst() throws NoSuchElementException at runtime. Careful — this option IS correct for "compiles".
      correct: true
