# D1.3 — java.time: dates, times, Period/Duration, instants, zones, DST and formatting
# Remediation lesson: values-date-time (content/lessons/D1/03-date-time.md)
# All zone-sensitive programs pin explicit ZoneIds; no program depends on now() or the default zone.

- id: D1-DT-001
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 90
  tags: [LocalDate, immutability, plusMonths, month-end]
  prompt: What is the output?
  code: |
    import java.time.LocalDate;
    public class Main {
        public static void main(String[] args) {
            LocalDate due = LocalDate.of(2025, 8, 31);
            due.plusWeeks(1);
            LocalDate next = due.plusMonths(1);
            LocalDate back = next.minusMonths(1);
            System.out.println(due + " " + next + " " + back);
        }
    }
  options:
    - key: a
      text: "`2025-08-31 2025-09-30 2025-08-30`"
      correct: true
      why: The result of plusWeeks is discarded; August 31 plus one month clamps to September 30; going back one month from September 30 gives August 30 — the clamping is not undone.
    - key: b
      text: "`2025-09-07 2025-10-07 2025-09-07`"
      why: LocalDate is immutable; due.plusWeeks(1) returns a new object that is never assigned, so due stays 2025-08-31.
    - key: c
      text: "`2025-08-31 2025-10-01 2025-09-01`"
      why: Adding months never overflows into the following month; an invalid day is clamped to the last valid day of the target month.
    - key: d
      text: "`2025-08-31 2025-09-30 2025-08-31`"
      why: minusMonths starts from September 30 and knows nothing about the original day 31, so the result is August 30.
  explanation: |
    All java.time objects are immutable: `plusWeeks` returns a new `LocalDate`, and ignoring the return value
    changes nothing. `plusMonths`/`minusMonths` keep the day-of-month if possible and otherwise **clamp** to the
    last valid day of the resulting month. Because the original day is lost, `plusMonths(1).minusMonths(1)` does
    not always return the starting date.
  rule: "LocalDate.plusMonths/minusMonths adjust the day-of-month to the last valid day if necessary; LocalDate is immutable."
  misconception: plusX/minusX change the object they are called on, and month arithmetic is reversible.
  hint: Which statements assign their result?
  java:
    expect: { compiles: true, stdout: "2025-08-31 2025-09-30 2025-08-30" }

- id: D1-DT-002
  objective: D1.3
  lesson: values-date-time
  type: single
  format: concept
  difficulty: foundation
  estSeconds: 60
  tags: [LocalDateTime, Instant, OffsetDateTime, ZonedDateTime, type-choice]
  prompt: Which statement about the java.time types is correct?
  options:
    - key: a
      text: A `LocalDateTime` does not identify a single point on the global timeline.
      correct: true
      why: It holds only a wall-clock date and time without an offset or zone; "2024-03-10T10:15" happens at a different instant in every time zone.
    - key: b
      text: An `Instant` stores year, month and day fields that you can read with `getYear()` and `getMonth()`.
      why: An Instant is just seconds and nanoseconds since 1970-01-01T00:00Z; it has no calendar fields until you attach a zone (for example with atZone).
    - key: c
      text: An `OffsetDateTime` automatically switches between +01:00 and +02:00 when daylight-saving time starts or ends.
      why: An OffsetDateTime has a fixed ZoneOffset; only a ZonedDateTime with a region ZoneId applies DST rules.
    - key: d
      text: A `ZonedDateTime` cannot be converted to an `Instant` because zones have daylight-saving gaps.
      why: A ZonedDateTime always resolves to a specific offset, so toInstant() is always possible.
  explanation: |
    The "local" types (`LocalDate`, `LocalTime`, `LocalDateTime`) describe wall-clock values with no location.
    `Instant`, `OffsetDateTime` and `ZonedDateTime` are points on the timeline. An `OffsetDateTime` carries a
    fixed offset; a `ZonedDateTime` carries a region `ZoneId` and its DST rules, and resolves gaps and overlaps
    to a concrete offset, so it can always be converted to an `Instant`.
  rule: "LocalDateTime has no offset or zone; Instant is an epoch-seconds value without calendar fields; OffsetDateTime has a fixed offset; ZonedDateTime applies the zone's rules."
  misconception: Every date-time type in java.time represents an absolute moment.
  hint: Which type has neither an offset nor a zone?

- id: D1-DT-003
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [Period.between, ChronoUnit, month-end, negative-period]
  prompt: What is the output?
  code: |
    import java.time.*;
    import java.time.temporal.ChronoUnit;
    public class Main {
        public static void main(String[] args) {
            LocalDate start = LocalDate.of(2024, 1, 30);
            LocalDate end = LocalDate.of(2024, 3, 29);
            System.out.println(Period.between(start, end) + " " + Period.between(end, start));
            System.out.println(ChronoUnit.MONTHS.between(start, end) + " " + ChronoUnit.WEEKS.between(start, end)
                + " " + ChronoUnit.DAYS.between(end, start));
        }
    }
  options:
    - key: a
      text: |
        P1M29D P-1M-30D
        1 8 -59
      correct: true
      why: "Only one complete month fits (Jan 30 → Feb 29, clamped); Feb 29 → Mar 29 is 29 days. Backwards, Mar 29 − 1 month = Feb 29 and Feb 29 → Jan 30 is 30 days. ChronoUnit counts complete units: 1 month, 59 days = 8 complete weeks, and -59 days when reversed."
    - key: b
      text: |
        P1M30D P-1M-30D
        1 8 -59
      why: Period.between adds the whole months to the start date first (Jan 30 + 1 month = Feb 29, because 2024 is a leap year) and counts the remaining days from there — 29.
    - key: c
      text: |
        P1M29D P-1M-29D
        2 8 59
      why: ChronoUnit.MONTHS.between counts only complete months (Mar 29 is before Mar 30), and between() returns a negative amount when the end is before the start.
    - key: d
      text: |
        P1M29D P-1M-30D
        1 9 -59
      why: ChronoUnit.WEEKS.between truncates — 59 days is 8 complete weeks plus 3 days.
  explanation: |
    `Period.between(a, b)` counts complete months first, adds them to `a` (clamping the day), then counts the
    remaining days. Running it backwards starts from `end`, so the day count can differ: the negative period is
    not simply the positive one with a minus sign. `ChronoUnit.X.between(a, b)` returns the number of
    **complete** units, truncated, and is negative if `b` is before `a`. The end date is always exclusive.
  rule: "Period.between(start, endExclusive) computes whole months then remaining days from start; ChronoUnit.between returns the number of complete units (negative if end is before start)."
  misconception: Period.between(a, b) is always the exact negation of Period.between(b, a), and between() rounds partial units.
  hint: Add the whole months to the start date first, then count the leftover days.
  java:
    expect:
      compiles: true
      stdout: |
        P1M29D P-1M-30D
        1 8 -59

- id: D1-DT-004
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [Period, Duration, toString, normalized]
  prompt: What is the output?
  code: |
    import java.time.*;
    public class Main {
        public static void main(String[] args) {
            System.out.println(Period.of(0, 26, 45).normalized());
            System.out.println(Period.ofWeeks(3).plusDays(1));
            System.out.println(Duration.ofMinutes(1500));
            System.out.println(Duration.ofSeconds(59, 1_500_000_000L));
            System.out.println(Duration.ofHours(2).minusMinutes(150));
        }
    }
  options:
    - key: a
      text: |
        P2Y2M45D
        P22D
        PT25H
        PT1M0.5S
        PT-30M
      correct: true
      why: normalized() moves only months into years (26 months = 2Y2M) and never touches days; weeks are stored as days; Duration prints hours as the largest unit; 59 s + 1.5 s = 60.5 s; 2 h − 150 min = −30 min.
    - key: b
      text: |
        P2Y3M15D
        P22D
        P1DT1H
        PT1M0.5S
        PT-30M
      why: Period.normalized() never converts days to months (a month has no fixed length), and Duration.toString never uses a day unit.
    - key: c
      text: |
        P2Y2M45D
        P3W1D
        PT25H
        PT60.5S
        PT-30M
      why: Period has no weeks field — ofWeeks(3) is stored as 21 days — and Duration.toString splits seconds into minutes when there are 60 or more.
    - key: d
      text: |
        P2Y2M45D
        P22D
        PT25H
        PT1M0.5S
        PT0S
      why: A Duration can be negative; subtracting more than it holds gives PT-30M rather than stopping at zero.
  explanation: |
    `Period` stores years, months and days independently. `normalized()` only folds months into years
    (12 months = 1 year) and leaves days alone; `ofWeeks` is just `ofDays(7 × n)`. `Duration` is seconds plus
    nanoseconds; its `toString` uses `H`, `M` and `S` only (never days), shows fractional seconds, and puts the
    sign on each component of a negative value.
  rule: "Period.normalized() normalises only years and months; Period.ofWeeks stores days; Duration.toString uses the format PTnHnMn.nS without days."
  misconception: normalized() converts days to months, and Duration prints days for amounts above 24 hours.
  hint: What fields does each class actually store?
  java:
    expect:
      compiles: true
      stdout: |
        P2Y2M45D
        P22D
        PT25H
        PT1M0.5S
        PT-30M

- id: D1-DT-005
  objective: D1.3
  lesson: values-date-time
  type: multi
  format: runtime-exception
  difficulty: advanced
  estSeconds: 150
  tags: [Period, Duration, UnsupportedTemporalTypeException, Instant, LocalTime]
  prompt: Which statements throw an `UnsupportedTemporalTypeException`? Choose three.
  options:
    - key: a
      text: "`LocalDate.of(2024, 1, 1).plus(Duration.ofHours(24));`"
      correct: true
      why: "A Duration is added in seconds (and nanos), and LocalDate does not support time-based units — Unsupported unit: Seconds."
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDate.of(2024, 1, 1).plus(Duration.ofHours(24))); } }
        expect: { compiles: true, exception: java.time.temporal.UnsupportedTemporalTypeException }
    - key: b
      text: "`LocalTime.NOON.plus(Period.ofDays(1));`"
      correct: true
      why: "A Period is added in days/months/years, and LocalTime has no date — Unsupported unit: Days."
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalTime.NOON.plus(Period.ofDays(1))); } }
        expect: { compiles: true, exception: java.time.temporal.UnsupportedTemporalTypeException }
    - key: c
      text: "`Instant.EPOCH.plus(Period.ofDays(1));`"
      why: Instant supports ChronoUnit.DAYS as exactly 86 400 seconds, so this yields 1970-01-02T00:00:00Z.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(Instant.EPOCH.plus(Period.ofDays(1))); } }
        expect: { compiles: true, stdout: "1970-01-02T00:00:00Z" }
    - key: d
      text: "`Instant.EPOCH.plus(Period.ofMonths(1));`"
      correct: true
      why: Months have no fixed length and an Instant has no calendar, so Instant does not support ChronoUnit.MONTHS.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(Instant.EPOCH.plus(Period.ofMonths(1))); } }
        expect: { compiles: true, exception: java.time.temporal.UnsupportedTemporalTypeException }
    - key: e
      text: "`LocalDateTime.of(2024, 1, 1, 0, 0).plus(Duration.ofDays(1));`"
      why: LocalDateTime has a time part, so adding seconds works; the result is 2024-01-02T00:00.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDateTime.of(2024, 1, 1, 0, 0).plus(Duration.ofDays(1))); } }
        expect: { compiles: true, stdout: "2024-01-02T00:00" }
    - key: f
      text: "`LocalDate.of(2024, 1, 1).plus(Period.ofWeeks(1));`"
      why: A week-based Period is stored as 7 days, which a LocalDate supports.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDate.of(2024, 1, 1).plus(Period.ofWeeks(1))); } }
        expect: { compiles: true, stdout: "2024-01-08" }
  explanation: |
    `plus(TemporalAmount)` compiles for any combination, because both `Period` and `Duration` implement
    `TemporalAmount`. The check happens at runtime: a `Duration` adds `SECONDS`/`NANOS`, which date-only types
    reject; a `Period` adds `YEARS`/`MONTHS`/`DAYS`, which time-only types reject. `Instant` is a special case:
    it accepts `DAYS` (as exactly 24 hours) but not `MONTHS` or `YEARS`.
  rule: "Period adds date-based units and Duration adds time-based units; a temporal that does not support a unit throws UnsupportedTemporalTypeException. Instant supports units up to DAYS."
  misconception: The compiler stops you from mixing Period/Duration with the wrong temporal type.
  hint: Which units does each amount add, and which units does each temporal support?

- id: D1-DT-006
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [Instant, OffsetDateTime, withZoneSameInstant, withZoneSameLocal, epoch]
  prompt: What is the output?
  code: |
    import java.time.*;
    public class Main {
        public static void main(String[] args) {
            OffsetDateTime odt = OffsetDateTime.of(2024, 1, 15, 8, 0, 0, 0, ZoneOffset.ofHours(1));
            Instant i = odt.toInstant();
            ZonedDateTime tokyo = i.atZone(ZoneId.of("Asia/Tokyo"));
            ZonedDateTime sameLocal = tokyo.withZoneSameLocal(ZoneId.of("Africa/Tunis"));
            ZonedDateTime sameInstant = tokyo.withZoneSameInstant(ZoneId.of("Africa/Tunis"));
            System.out.println(i);
            System.out.println(tokyo.toLocalTime() + " " + sameLocal.toLocalTime() + " " + sameInstant.toLocalTime());
            System.out.println(Instant.ofEpochSecond(86_400 + 90));
        }
    }
  options:
    - key: a
      text: |
        2024-01-15T07:00:00Z
        16:00 16:00 08:00
        1970-01-02T00:01:30Z
      correct: true
      why: "08:00 at +01:00 is 07:00 UTC; Tokyo (+09:00) shows 16:00; withZoneSameLocal keeps the wall clock 16:00; withZoneSameInstant converts to Tunis (+01:00), 08:00; 86 490 s after the epoch is one day and 90 s."
    - key: b
      text: |
        2024-01-15T09:00:00Z
        18:00 18:00 10:00
        1970-01-02T00:01:30Z
      why: To convert a local time at +01:00 to UTC you subtract the offset (08:00 − 1 h = 07:00), you do not add it.
    - key: c
      text: |
        2024-01-15T07:00:00Z
        16:00 08:00 16:00
        1970-01-02T00:01:30Z
      why: withZoneSameLocal keeps the local date-time (and changes the instant), whereas withZoneSameInstant keeps the instant (and changes the local time).
    - key: d
      text: |
        2024-01-15T08:00+01:00
        16:00 16:00 08:00
        1970-01-02T00:01:30Z
      why: Instant.toString always prints in UTC with a Z suffix; the original offset is not kept.
  explanation: |
    An `Instant` is a UTC point on the timeline; converting from an offset date-time subtracts the offset.
    `atZone` attaches a zone to an instant to get local fields. `withZoneSameInstant` keeps the moment and
    recomputes the wall clock; `withZoneSameLocal` keeps the wall clock and therefore describes a different
    moment. `Instant.ofEpochSecond(n)` counts from `1970-01-01T00:00:00Z`.
  rule: "Instant.toString uses ISO-8601 in UTC; ZonedDateTime.withZoneSameInstant preserves the instant, withZoneSameLocal preserves the local date-time where possible."
  misconception: withZoneSameLocal and withZoneSameInstant both convert the time to the new zone.
  hint: Convert everything to UTC first, then apply each zone's offset.
  java:
    expect:
      compiles: true
      stdout: |
        2024-01-15T07:00:00Z
        16:00 16:00 08:00
        1970-01-02T00:01:30Z

- id: D1-DT-007
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [ZonedDateTime, DST, fall-back, plusDays, plusHours, Duration]
  prompt: "Daylight-saving time ends in `America/New_York` on 2024-11-03 at 02:00 (clocks fall back to 01:00). What is the output?"
  code: |
    import java.time.*;
    import java.time.temporal.ChronoUnit;
    public class Main {
        public static void main(String[] args) {
            ZoneId ny = ZoneId.of("America/New_York");
            ZonedDateTime evening = ZonedDateTime.of(2024, 11, 2, 20, 0, 0, 0, ny);
            ZonedDateTime a = evening.plusDays(1);
            ZonedDateTime b = evening.plusHours(24);
            System.out.println(a.toLocalDateTime() + " " + b.toLocalDateTime());
            System.out.println(Duration.between(evening, a) + " " + ChronoUnit.HOURS.between(evening, b));
        }
    }
  options:
    - key: a
      text: |
        2024-11-03T20:00 2024-11-03T19:00
        PT25H 24
      correct: true
      why: plusDays works on the local timeline (same wall clock, 20:00) and the day is 25 hours long; plusHours adds exactly 24 elapsed hours, which shows as 19:00 after the clocks fell back.
    - key: b
      text: |
        2024-11-03T20:00 2024-11-03T20:00
        PT24H 24
      why: plusHours operates on the instant timeline; because one wall-clock hour repeats, 24 real hours later the clock only shows 19:00.
    - key: c
      text: |
        2024-11-03T20:00 2024-11-03T21:00
        PT25H 24
      why: In autumn the clocks go back, so after 24 elapsed hours the wall clock is one hour behind, not ahead.
    - key: d
      text: |
        2024-11-03T20:00 2024-11-03T19:00
        PT24H 24
      why: Duration.between measures the exact elapsed time between the two instants, which is 25 hours across the fall-back transition.
  explanation: |
    For a `ZonedDateTime`, date-based arithmetic (`plusDays`, `plusMonths`, `plus(Period)`) is done on the
    **local** date-time and then re-resolved in the zone, so the wall-clock time is preserved and the elapsed
    time can be 23 or 25 hours. Time-based arithmetic (`plusHours`, `plus(Duration)`) is done on the
    **instant**, so exactly that much time passes. On 2024-11-03 in New York the hour 01:00–01:59 occurs twice,
    so that day lasts 25 hours.
  rule: "ZonedDateTime.plusDays operates on the local time-line; plusHours operates on the instant time-line (ZonedDateTime javadoc)."
  misconception: plusDays(1) and plusHours(24) always give the same ZonedDateTime.
  hint: Which method keeps the wall-clock time, and which keeps the elapsed time exact?
  java:
    expect:
      compiles: true
      stdout: |
        2024-11-03T20:00 2024-11-03T19:00
        PT25H 24

- id: D1-DT-008
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 180
  tags: [ZonedDateTime, DST, gap, overlap, withLaterOffsetAtOverlap, Europe/Paris]
  prompt: "In `Europe/Paris` (2024), clocks jumped from 02:00 to 03:00 on March 31 and fell back from 03:00 to 02:00 on October 27. What is the output?"
  code: |
    import java.time.*;
    public class Main {
        public static void main(String[] args) {
            ZoneId paris = ZoneId.of("Europe/Paris");
            ZonedDateTime gap = LocalDateTime.of(2024, 3, 31, 2, 15).atZone(paris);
            ZonedDateTime overlap = LocalDateTime.of(2024, 10, 27, 2, 15).atZone(paris);
            System.out.println(gap);
            System.out.println(overlap.getOffset() + " " + overlap.withLaterOffsetAtOverlap().getOffset());
            System.out.println(gap.minusHours(1).toLocalTime() + " " + overlap.plusHours(1).toLocalTime());
        }
    }
  options:
    - key: a
      text: |
        2024-03-31T03:15+02:00[Europe/Paris]
        +02:00 +01:00
        01:15 02:15
      correct: true
      why: "02:15 does not exist on March 31, so it is shifted forward by the 1-hour gap to 03:15 (+02:00). In the overlap the earlier offset (+02:00, summer) is chosen, and the later one is +01:00. One real hour before 03:15+02:00 is 01:15+01:00; one hour after 02:15+02:00 is 02:15+01:00."
    - key: b
      text: |
        2024-03-31T01:15+01:00[Europe/Paris]
        +02:00 +01:00
        00:15 02:15
      why: A local time in a gap is moved later by the length of the gap, never earlier.
    - key: c
      text: |
        2024-03-31T03:15+02:00[Europe/Paris]
        +01:00 +02:00
        01:15 03:15
      why: In an overlap ZonedDateTime keeps the earlier offset by default, which is the summer offset +02:00; one hour later the same wall-clock time recurs with +01:00.
    - key: d
      text: |
        2024-03-31T02:15+01:00[Europe/Paris]
        +02:00 +01:00
        01:15 02:15
      why: ZonedDateTime never stores a local time that is invalid in its zone; 02:15 in the gap is adjusted.
  explanation: |
    When a `LocalDateTime` is attached to a zone, java.time resolves it against the zone rules. In a **gap** the
    local time does not exist and is moved forward by the length of the gap (02:15 → 03:15, now at +02:00). In
    an **overlap** the local time exists twice; the earlier offset is kept by default, and
    `withLaterOffsetAtOverlap()` picks the later one. `plusHours`/`minusHours` move along the instant timeline,
    so near a transition the wall clock may repeat or skip.
  rule: "ZonedDateTime.of/atZone: in a gap the local date-time is shifted later by the gap length; in an overlap the earlier offset is retained unless withLaterOffsetAtOverlap() is used."
  misconception: Creating a ZonedDateTime keeps the given local time unchanged, or DST gaps cause an exception.
  hint: Ask first whether each local time exists zero, one or two times on that day.
  java:
    expect:
      compiles: true
      stdout: |
        2024-03-31T03:15+02:00[Europe/Paris]
        +02:00 +01:00
        01:15 02:15

