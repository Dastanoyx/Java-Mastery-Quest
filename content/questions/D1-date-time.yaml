      text: |
        29/12/2026 00:07
        12:07 AM, 363 of 2025
        29 12 2025, Monday
      why: MMM is the abbreviated month text, uu a two-digit year, and EEE the abbreviated day-of-week text.
  explanation: |
    Pattern letters are case-sensitive and several pairs look alike: `y`/`u` are the year (year-of-era /
    proleptic year) while `Y` is the **week-based year**; `M` is month while `m` is minute; `H` is 0–23 while `h`
    is 1–12 and is normally paired with `a`; `d` is day of month while `D` is day of year. The count of letters
    selects the form: `uu` gives two digits, `MMM`/`EEE` short text, `MMMM`/`EEEE` full text.
  rule: "DateTimeFormatter pattern letters: y/u year, Y week-based-year, M month, m minute, H hour-of-day (0-23), h clock-hour-of-am-pm (1-12), a am-pm, d day-of-month, D day-of-year, E day-of-week."
  misconception: Upper- and lower-case pattern letters are interchangeable variants of the same field.
  hint: Check the case of every letter against the field table.
  java:
    expect:
      compiles: true
      stdout: |
        29/12/2026 00:07
        12:07 AM, 363 of 2025
        29 Dec 25, Mon

- id: D1-DT-010
  objective: D1.3
  lesson: values-date-time
  type: multi
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 120
  tags: [DateTimeParseException, DateTimeException, parse, of]
  prompt: Which statements throw a `DateTimeParseException`? Choose two.
  options:
    - key: a
      text: "`LocalDate.parse(\"2024-02-30\");`"
      correct: true
      why: The text has the right layout, but the ISO formatter resolves strictly and February 30 does not exist; parse wraps the problem in a DateTimeParseException.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDate.parse("2024-02-30")); } }
        expect: { compiles: true, exception: java.time.format.DateTimeParseException }
    - key: b
      text: "`LocalTime.of(24, 0);`"
      why: This is a factory call, not parsing; the invalid hour throws a plain DateTimeException (Invalid value for HourOfDay).
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalTime.of(24, 0)); } }
        expect: { compiles: true, exception: java.time.DateTimeException }
    - key: c
      text: "`LocalDate.parse(\"2024-2-3\");`"
      correct: true
      why: ISO_LOCAL_DATE requires a two-digit month and day, so parsing fails at index 5.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDate.parse("2024-2-3")); } }
        expect: { compiles: true, exception: java.time.format.DateTimeParseException }
    - key: d
      text: "`LocalDate.of(2024, Month.FEBRUARY, 29);`"
      why: 2024 is a leap year, so February 29 is valid.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDate.of(2024, Month.FEBRUARY, 29)); } }
        expect: { compiles: true, stdout: "2024-02-29" }
    - key: e
      text: "`LocalDateTime.parse(\"2024-03-10T02:30\");`"
      why: A LocalDateTime has no zone, so a time that falls into a DST gap somewhere is still a perfectly valid local value.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDateTime.parse("2024-03-10T02:30")); } }
        expect: { compiles: true, stdout: "2024-03-10T02:30" }
    - key: f
      text: "`LocalDate.of(2024, 4, 31);`"
      why: April has 30 days, but of() is not parsing — it throws DateTimeException (Invalid date 'APRIL 31'), not its parse subclass.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { System.out.println(LocalDate.of(2024, 4, 31)); } }
        expect: { compiles: true, exception: java.time.DateTimeException }
  explanation: |
    `DateTimeParseException` extends `DateTimeException` and is thrown only by **parsing**: when the text does
    not match the formatter's layout, or when it matches but the resulting fields are invalid. The `of(...)`
    factories validate their arguments and throw a plain `DateTimeException`. Local types know nothing about
    zones, so DST gaps never make a `LocalDateTime` invalid.
  rule: "parse(...) failures throw java.time.format.DateTimeParseException (a subclass of DateTimeException); of(...) with invalid field values throws DateTimeException."
  misconception: Every invalid date or time value causes a DateTimeParseException.
  hint: Which statements actually parse text?

- id: D1-DT-011
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [Period, static-method, chaining, plus-period]
  prompt: What is the output?
  code: |
    import java.time.*;
    public class Main {
        public static void main(String[] args) {
            Period p = Period.ofYears(1).ofMonths(2).ofDays(3);
            Period q = Period.ofYears(1).withMonths(2).plusDays(3);
            LocalDate d = LocalDate.of(2024, 1, 31);
            System.out.println(p + " " + q + " " + d.plus(q));
        }
    }
  options:
    - key: a
      text: "`P3D P1Y2M3D 2025-04-03`"
      correct: true
      why: "ofMonths and ofDays are static factories, so only the last call counts (P3D); withMonths/plusDays are instance methods that build on q. Adding P1Y2M3D: 14 months → 2025-03-31, then 3 days → 2025-04-03."
    - key: b
      text: "`P1Y2M3D P1Y2M3D 2025-04-03`"
      why: Calling a static method through an instance ignores the instance entirely; each of* call creates a fresh Period with just that one field.
    - key: c
      text: "`P3D P1Y2M3D 2025-03-31`"
      why: Period.addTo adds the days after the months, so the 3 days are added to 2025-03-31.
    - key: d
      text: Compilation fails because a static method cannot be called on an instance
      why: Java allows calling a static method through an expression of the class type (with only a warning in some tools); the expression's value is ignored.
  explanation: |
    `Period.ofYears`, `ofMonths`, `ofDays` and `ofWeeks` are **static** factory methods. Calling them on the
    result of a previous call compiles, but the receiver is ignored, so the chain returns only the last
    Period. To combine fields, use `Period.of(y, m, d)` or the instance methods `withX`/`plusX`. When a Period
    is added to a date, years and months are applied together first (with month-end clamping), then days.
  rule: "Period.ofX are static factories; a static method invoked via an instance expression ignores the instance's value (JLS 15.12.4.1). Period.addTo adds total months, then days."
  misconception: "Chained Period.ofX(...) calls accumulate fields like a builder."
  hint: Which of these methods are static?
  java:
    expect: { compiles: true, stdout: "P3D P1Y2M3D 2025-04-03" }

- id: D1-DT-012
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [Instant, until, Duration, java-23, ChronoUnit]
  prompt: What is the output?
  code: |
    import java.time.*;
    import java.time.temporal.ChronoUnit;
    public class Main {
        public static void main(String[] args) {
            Instant start = Instant.parse("2024-03-10T06:59:30Z");
            Instant end = start.plusSeconds(3_630);
            Duration d = start.until(end);
            System.out.println(d + " " + start.until(end, ChronoUnit.HOURS) + " " + end.until(start).toMinutes());
        }
    }
  options:
    - key: a
      text: "`PT1H30S 1 -60`"
      correct: true
      why: 3 630 s is 1 h 0 min 30 s and Duration omits zero components; until(…, HOURS) counts complete hours (1); the reverse duration is −3 630 s and toMinutes truncates toward zero to −60.
    - key: b
      text: "`PT1H0M30S 1 -60`"
      why: Duration.toString leaves out zero-valued components, so there is no 0M.
    - key: c
      text: "`PT1H30S 1 -61`"
      why: Duration.toMinutes truncates toward zero (−60.5 → −60); it does not round toward negative infinity.
    - key: d
      text: Compilation fails because `Instant` has no `until(Instant)` method
      why: Since Java 23, Instant.until(Instant) returns the Duration between two instants, equivalent to Duration.between.
  explanation: |
    `Instant.until(Instant endExclusive)` was added in **Java 23** and returns a `Duration`, just like
    `Duration.between(start, end)`. The older `until(Temporal, TemporalUnit)` returns a `long` of complete units.
    `Duration.toString` prints only non-zero hour/minute/second components; `toMinutes()` truncates toward
    zero. Because `Instant` is always UTC, DST transitions never affect these results.
  rule: "Instant.until(Instant) (since Java 23) returns a Duration; until(Temporal, TemporalUnit) returns the number of complete units; Duration.toMinutes truncates."
  misconception: The only way to get a Duration between instants is Duration.between, and toMinutes rounds.
  hint: How many complete minutes are in −3 630 seconds?
  java:
    expect: { compiles: true, stdout: "PT1H30S 1 -60" }

- id: D1-DT-013
  objective: D1.3
  lesson: values-date-time
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [ChronoUnit, between, DST, spring-forward, truncation]
  prompt: "Daylight-saving time starts in `America/New_York` on 2024-03-10 at 02:00 (clocks jump to 03:00). What is the output?"
  code: |
    import java.time.*;
    import java.time.temporal.ChronoUnit;
    public class Main {
        public static void main(String[] args) {
            ZoneId ny = ZoneId.of("America/New_York");
            ZonedDateTime s = ZonedDateTime.of(2024, 3, 9, 22, 0, 0, 0, ny);
            ZonedDateTime e = s.plusDays(1);
            System.out.println(ChronoUnit.HOURS.between(s, e) + " " + ChronoUnit.DAYS.between(s, e));
            LocalDateTime a = LocalDateTime.of(2024, 5, 1, 10, 45);
            LocalDateTime b = LocalDateTime.of(2024, 5, 1, 12, 44);
            System.out.println(ChronoUnit.HOURS.between(a, b) + " " + ChronoUnit.MINUTES.between(b, a)
                + " " + ChronoUnit.DAYS.between(a.toLocalDate(), b.toLocalDate()));
        }
    }
  options:
    - key: a
      text: |
        23 1
        1 -119 0
      correct: true
      why: Time units between ZonedDateTimes are measured on the instant timeline (23 real hours across spring-forward), date units on the local timeline (1 day); 1 h 59 min truncates to 1 complete hour; reversed order gives −119 minutes; same date → 0 days.
    - key: b
      text: |
        24 1
        1 -119 0
      why: The local clock jumps from 02:00 to 03:00 that night, so only 23 hours actually elapse between 22:00 and 22:00 the next day.
    - key: c
      text: |
        23 0
        1 -119 0
      why: DAYS is a date-based unit, so it is measured on the local date-time — 22:00 to 22:00 the next day is one complete day.
    - key: d
      text: |
        23 1
        2 119 0
      why: between() counts complete units and truncates (1 h 59 min is 1 hour), and it is negative when the second argument is earlier.
  explanation: |
    `ChronoUnit.X.between(a, b)` is `a.until(b, X)`: the number of **complete** units, truncated, negative if
    `b` is before `a`. For a `ZonedDateTime`, time-based units (`HOURS`, `MINUTES`, …) are measured on the
    instant timeline, so DST changes the count; date-based units (`DAYS`, `MONTHS`, …) are measured on the local
    date-time, so the wall-clock day still counts as one.
  rule: "ZonedDateTime.until: date units use the local date-time, time units use the instant time-line; ChronoUnit.between returns complete units (truncated)."
  misconception: ChronoUnit.HOURS.between always equals 24 × DAYS.between, and between() rounds to the nearest unit.
  hint: Is each unit date-based or time-based?
  java:
    expect:
      compiles: true
      stdout: |
        23 1
        1 -119 0

- id: D1-DT-014
  objective: D1.3
  lesson: values-date-time
  type: single
  format: runtime-exception
  difficulty: expert
  estSeconds: 180
  tags: [DateTimeFormatter, ResolverStyle, uuuu, yyyy, year-of-era, parse]
  prompt: What is the result of running this program?
  code: |
    import java.time.LocalDate;
    import java.time.format.*;
    public class Main {
        public static void main(String[] args) {
            DateTimeFormatter strictU = DateTimeFormatter.ofPattern("uuuu-MM-dd").withResolverStyle(ResolverStyle.STRICT);
            DateTimeFormatter smartU = DateTimeFormatter.ofPattern("uuuu-MM-dd");
            DateTimeFormatter strictY = DateTimeFormatter.ofPattern("yyyy-MM-dd").withResolverStyle(ResolverStyle.STRICT);
            System.out.println(LocalDate.parse("2024-02-29", strictU));
            System.out.println(LocalDate.parse("2023-02-29", smartU));
            System.out.println(LocalDate.parse("2024-02-29", strictY));
        }
    }
  options:
    - key: a
      text: It prints `2024-02-29` and `2023-02-28`, then a `DateTimeParseException` is thrown
      correct: true
      why: STRICT accepts the valid leap day; the default SMART style clamps day 29 to the last day of February 2023; with STRICT, yyyy (year-of-era) cannot be resolved to a date without an era field, so the third parse fails.
    - key: b
      text: It prints `2024-02-29`, then a `DateTimeParseException` is thrown
      why: ofPattern formatters use ResolverStyle.SMART by default, which adjusts an out-of-range day-of-month to the last valid day instead of failing.
    - key: c
      text: It prints `2024-02-29`, `2023-02-28` and `2024-02-29`
      why: In STRICT mode, the pattern letter y is year-of-era and needs an era (G) to resolve; only u (proleptic year) resolves on its own.
    - key: d
      text: It prints `2024-02-29`, `2023-03-01` and `2024-02-29`
      why: SMART resolution clamps an invalid day to the end of the month; only LENIENT mode would roll over into March.
  explanation: |
    Formatters from `ofPattern` use `ResolverStyle.SMART`, which turns an out-of-range day such as 29 February
    2023 into the last valid day (the predefined `ISO_LOCAL_DATE`, used by `LocalDate.parse(String)`, is STRICT
    and would reject it). With `ResolverStyle.STRICT`, the letter `y` means **year-of-era** and cannot be
    resolved without an era, so the date cannot be built and a `DateTimeParseException` is thrown. Use `u`
    (proleptic year) in patterns that are resolved strictly.
  rule: "DateTimeFormatter.ofPattern uses ResolverStyle.SMART; in STRICT mode a year-of-era (y) without an era (G) is not resolved into a date, while u (year) is."
  misconception: yyyy and uuuu are always interchangeable, and pattern-based parsing always rejects invalid dates.
  hint: What does each resolver style do with day 29 in February 2023, and what does y need in STRICT mode?
  java:
    expect:
      compiles: true
      stdout: |
        2024-02-29
        2023-02-28
      exception: java.time.format.DateTimeParseException

- id: D1-DT-015
  objective: D1.3
  lesson: values-date-time
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 120
  tags: [ZonedDateTime, isEqual, equals, isBefore, withZoneSameInstant]
  prompt: |
    Given
    `ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris"));` and
    `ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC);`,
    which expressions evaluate to `true`? Choose three.
  options:
    - key: a
      text: "`paris.equals(utc)`"
      why: ZonedDateTime.equals compares the local date-time, the offset and the zone, which all differ here.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris")); ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC); System.out.println(paris.equals(utc)); } }
        expect: { compiles: true, stdout: "false" }
    - key: b
      text: "`paris.isEqual(utc)`"
      correct: true
      why: isEqual compares only the instant, and withZoneSameInstant kept the instant.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris")); ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC); System.out.println(paris.isEqual(utc)); } }
        expect: { compiles: true, stdout: "true" }
    - key: c
      text: "`paris.toInstant().equals(utc.toInstant())`"
      correct: true
      why: Both represent the same moment, 2024-06-01T10:00:00Z, and Instant.equals compares the timeline position.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris")); ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC); System.out.println(paris.toInstant().equals(utc.toInstant())); } }
        expect: { compiles: true, stdout: "true" }
    - key: d
      text: "`paris.isBefore(utc)`"
      why: isBefore compares instants too; the two values are the same instant, so neither is before the other.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris")); ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC); System.out.println(paris.isBefore(utc)); } }
        expect: { compiles: true, stdout: "false" }
    - key: e
      text: "`utc.getHour() == 10`"
      correct: true
      why: Paris is on summer time (+02:00) on June 1, so 12:00 local is 10:00 UTC.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris")); ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC); System.out.println(utc.getHour() == 10); } }
        expect: { compiles: true, stdout: "true" }
    - key: f
      text: "`paris.toLocalDateTime().equals(utc.toLocalDateTime())`"
      why: The wall-clock values differ (12:00 versus 10:00); only the instant is the same.
      java:
        source: |
          import java.time.*;
          public class Main { public static void main(String[] x) { ZonedDateTime paris = ZonedDateTime.of(2024, 6, 1, 12, 0, 0, 0, ZoneId.of("Europe/Paris")); ZonedDateTime utc = paris.withZoneSameInstant(ZoneOffset.UTC); System.out.println(paris.toLocalDateTime().equals(utc.toLocalDateTime())); } }
        expect: { compiles: true, stdout: "false" }
  explanation: |
    `isBefore`, `isAfter` and `isEqual` on `ZonedDateTime`/`OffsetDateTime` compare **instants only**.
    `equals` is stricter: it compares the local date-time, offset and zone. Two values for the same moment in
    different zones are therefore `isEqual` but not `equals`. Paris uses +02:00 in June, so noon local is
    10:00 UTC.
  rule: "ChronoZonedDateTime.isEqual/isBefore/isAfter compare the instant; ZonedDateTime.equals compares local date-time, offset and zone."
  misconception: equals and isEqual mean the same thing for date-time objects.
  hint: Which comparisons look at the instant only?
