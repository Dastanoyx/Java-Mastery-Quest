    - key: a
      text: "`run.sh /opt/tools/bin / 4 tools`"
      correct: true
      why: "The arguments are joined and split at separators: names opt, tools, bin, run.sh (4); the root / is not a name; index 1 is tools."
    - key: b
      text: "`run.sh /opt/tools/bin / 3 tools`"
      why: Paths.get joins its arguments with the separator and then parses the result, so bin/run.sh becomes two name elements.
    - key: c
      text: "`run.sh /opt/tools/bin / 5 opt`"
      why: The root is not counted as a name element, so the count is 4 and index 1 is tools.
    - key: d
      text: "`/opt/tools/bin/run.sh /opt/tools/bin null 4 tools`"
      why: getFileName returns only the last name element, and an absolute path has the root /.
  explanation: |
    `Paths.get(first, more...)` (like `Path.of`) joins the strings with the name separator and parses the
    result. `getFileName()` is the last element, `getParent()` everything before it, `getRoot()` the root
    component. Name elements are numbered from 0 and never include the root.
  rule: "Path name elements are indexed from 0 excluding the root; getFileName is the last element; getParent drops it."
  misconception: Each argument to Paths.get is one name element, or the root counts as element 0.
  java:
    expect: { compiles: true, stdout: "run.sh /opt/tools/bin / 4 tools" }
