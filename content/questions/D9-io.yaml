                System.out.println("done");
            }
        }
    }
  options:
    - key: a
      text: "Declare `class Engine implements Serializable`"
      correct: true
      why: Then every object reachable from Car is serializable and writeObject succeeds.
      java:
        source: |
          import java.io.*;
          class Engine implements Serializable { int hp = 300; }
          class Car implements Serializable { String model = "GT"; Engine engine = new Engine(); }
          public class Main {
              public static void main(String[] args) throws IOException {
                  try (var out = new ObjectOutputStream(new ByteArrayOutputStream())) {
                      System.out.println("writing"); out.writeObject(new Car()); System.out.println("done");
                  }
              }
