              }
          }
        expect: { compiles: true, stdout: "writing\ndone" }
    - key: c
      text: "Add `private static final long serialVersionUID = 1L;` to `Car`"
      why: A version number does not change which fields are written; Engine is still not serializable.
      java:
        source: |
          import java.io.*;
          class Engine { int hp = 300; }
          class Car implements Serializable { private static final long serialVersionUID = 1L; String model = "GT"; Engine engine = new Engine(); }
          public class Main {
              public static void main(String[] args) throws IOException {
                  try (var out = new ObjectOutputStream(new ByteArrayOutputStream())) {
                      System.out.println("writing"); out.writeObject(new Car()); System.out.println("done");
                  }
              }
          }
        expect: { compiles: true, stdout: "writing", exception: java.io.NotSerializableException }
    - key: d
      text: "Declare the field as `static Engine engine = new Engine();`"
      correct: true
      why: Static fields belong to the class and are never serialized, so the Engine is not written (although this changes the design — all cars would share one engine).
      java:
        source: |
          import java.io.*;
          class Engine { int hp = 300; }
          class Car implements Serializable { String model = "GT"; static Engine engine = new Engine(); }
          public class Main {
              public static void main(String[] args) throws IOException {
                  try (var out = new ObjectOutputStream(new ByteArrayOutputStream())) {
                      System.out.println("writing"); out.writeObject(new Car()); System.out.println("done");
                  }
              }
          }
        expect: { compiles: true, stdout: "writing\ndone" }
    - key: e
      text: "Declare the field as `final Engine engine = new Engine();`"
      why: final does not exclude a field from serialization; the Engine instance is still written and still not serializable.
      java:
        source: |
          import java.io.*;
          class Engine { int hp = 300; }
          class Car implements Serializable { String model = "GT"; final Engine engine = new Engine(); }
          public class Main {
              public static void main(String[] args) throws IOException {
                  try (var out = new ObjectOutputStream(new ByteArrayOutputStream())) {
                      System.out.println("writing"); out.writeObject(new Car()); System.out.println("done");
