  explanation: |
    `writeObject` walks the object graph and throws `NotSerializableException` (message: the class name) at
    **runtime** when it reaches an object whose class does not implement `Serializable`. The compiler cannot
    check this. Fixes: make the class serializable, or exclude the field from serialization with `transient`
    (or, changing the design, `static`). `serialVersionUID` and `final` have no effect on which fields are
    written.
  rule: "Every non-transient, non-static field reachable from a serialized object must refer to a serializable object or null, otherwise NotSerializableException is thrown at write time."
  misconception: Implementing Serializable on the outer class is enough, or the compiler checks serializability.
  hint: Which modifiers exclude a field from the serialized form?

- id: D9-SER-004
  objective: D9.2
  lesson: io-serialization
  type: single
  format: runtime-exception
  difficulty: expert
  estSeconds: 150
  tags: [serialization, invalidclassexception, no-arg-constructor]
  prompt: What is the result of running the following program?
  code: |
    import java.io.*;

    class Base {
        String id;
        Base(String id) { this.id = id; }
    }
    class Item extends Base implements Serializable {
        int qty;
        Item(String id, int qty) { super(id); this.qty = qty; }
    }

    public class Main {
        public static void main(String[] args) throws Exception {
            var bytes = new ByteArrayOutputStream();
            try (var out = new ObjectOutputStream(bytes)) { out.writeObject(new Item("x", 2)); }
            System.out.println("written");
            try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                Item copy = (Item) in.readObject();
                System.out.println(copy.id + " " + copy.qty);
            }
        }
    }
  options:
    - key: a
      text: "`written` is printed, then `java.io.InvalidClassException` (no valid constructor) is thrown"
      correct: true
      why: Writing does not need a constructor, but reading must run Base's no-arg constructor — and Base has none.
    - key: b
      text: Compilation fails because `Item` must declare a no-arg constructor
      why: The compiler does not enforce any serialization rule; the problem is only detected at runtime.
    - key: c
      text: A `java.io.NotSerializableException` is thrown by `writeObject`
      why: Item is serializable; a non-serializable SUPERCLASS is allowed — its fields are simply not written.
    - key: d
      text: "`written` and `null 2` are printed"
      why: This would be true only if Base had an accessible no-arg constructor; deserialization cannot skip constructing the non-serializable part of the object.
  explanation: |
    During deserialization the JVM must construct the non-serializable part of the object by calling the
    **no-arg constructor of the first non-serializable superclass** (`Base`). `Base` declares only
    `Base(String)`, so `readObject` throws `InvalidClassException: Item; no valid constructor`.
    Serialization itself succeeded — `written` was printed — because writing never invokes constructors.
  rule: "The first non-serializable superclass of a serializable class must have an accessible no-arg constructor; otherwise deserialization throws InvalidClassException."
  misconception: A missing no-arg constructor makes serialization fail when writing, or is a compile error.
  hint: Which step needs to call a constructor — writing or reading?
  java:
    expect: { compiles: true, stdout: "written", exception: java.io.InvalidClassException }

- id: D9-SER-005
  objective: D9.2
  lesson: io-serialization
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [serialization, record, canonical-constructor]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    record Point(int x, int y) implements Serializable {
        Point { System.out.print("P(" + x + "," + y + ") "); }
    }
    class Box implements Serializable {
        Point p;
        Box(Point p) { System.out.print("Box "); this.p = p; }
    }

    public class Main {
        public static void main(String[] args) throws Exception {
            Box box = new Box(new Point(1, 2));
            System.out.println();
            var bytes = new ByteArrayOutputStream();
            try (var out = new ObjectOutputStream(bytes)) { out.writeObject(box); }
            try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                Box copy = (Box) in.readObject();
                System.out.println();
                System.out.println(copy.p.equals(box.p) + " " + (copy.p == box.p));
            }
        }
    }
  options:
    - key: a
      text: |
        P(1,2) Box
        P(1,2)
        true false
      correct: true
      why: Deserializing a record calls its canonical constructor with the stream values; the ordinary class Box is restored without running its constructor. The copy is a new, equal record.
    - key: b
      text: |
        P(1,2) Box
        P(1,2) Box
        true false
      why: Box is an ordinary Serializable class (its superclass Object is the first non-serializable one), so Box's constructor does not run on deserialization.
    - key: c
      text: |
        P(1,2) Box

        true false
      why: Records are the exception to the "no constructor runs" rule — they are always rebuilt through their canonical constructor.
    - key: d
      text: |
        P(1,2) Box
        P(1,2)
        true true
      why: Deserialization always creates new objects; record equality is value-based, but the references differ.
  explanation: |
    Records are serialized as their component values and deserialized by invoking the **canonical
    constructor** (so a compact constructor's validation or normalization always applies). Ordinary
    serializable classes such as `Box` are rebuilt without running their constructors. Deserialization
    produces new objects: `equals` is `true` (records compare components), `==` is `false`.
  rule: "Records are deserialized through their canonical constructor; ordinary serializable classes skip their own constructors."
  misconception: Records are deserialized like any other class, without running a constructor.
  java:
    expect: { compiles: true, stdout: "P(1,2) Box\nP(1,2)\ntrue false" }

- id: D9-SER-006
  objective: D9.2
  lesson: io-serialization
  type: multi
  format: concept
  difficulty: intermediate
  estSeconds: 100
  tags: [serialization, serialversionuid, externalizable, serializable]
  prompt: Which of the following statements are true? Choose three.
  options:
    - key: a
      text: "`java.io.Serializable` declares no methods."
      correct: true
      why: Serializable is a marker interface; the serialization machinery checks for it with instanceof-style tests.
    - key: b
      text: A class that does not declare `serialVersionUID` cannot be serialized.
      why: If it is missing, the runtime computes a default UID from the class structure; declaring it is recommended, not required.
    - key: c
      text: If the `serialVersionUID` in the stream differs from that of the local class, deserialization throws `InvalidClassException`.
      correct: true
      why: A UID mismatch means "local class incompatible", reported as InvalidClassException by readObject.
    - key: d
      text: A class implementing `Externalizable` must have a public no-arg constructor.
      correct: true
      why: Deserialization of an Externalizable object calls its public no-arg constructor and then readExternal.
    - key: e
      text: "`static` fields are serialized when the class declares a `serialVersionUID`."
      why: Static fields belong to the class, never to the serialized instance — regardless of serialVersionUID.
    - key: f
      text: "`serialVersionUID` must be declared `public static final long`."
      why: It must be static, final and of type long, but any access modifier works; private is recommended.
  explanation: |
    `Serializable` is a marker interface. Each serializable class has a version number — declared as a
    `static final long serialVersionUID` with any access modifier, or computed from the class structure if
    absent — and a mismatch during reading raises `InvalidClassException`. `Externalizable` extends
    `Serializable`, requires `writeExternal`/`readExternal`, and needs a public no-arg constructor.
  rule: "serialVersionUID: static final long (any access); mismatch ⇒ InvalidClassException. Externalizable requires a public no-arg constructor."
  misconception: serialVersionUID is mandatory and must be public.

- id: D9-SER-007
  objective: D9.2
  lesson: io-serialization
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [serialization, back-reference, identity, objectoutputstream]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;
    import java.util.*;

    public class Main {
        public static void main(String[] args) throws Exception {
            List<String> tags = new ArrayList<>(List.of("a"));
            var bytes = new ByteArrayOutputStream();
            try (var out = new ObjectOutputStream(bytes)) {
                out.writeObject(tags);
                tags.add("b");
                out.writeObject(tags);
            }
            try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                List<?> first = (List<?>) in.readObject();
                List<?> second = (List<?>) in.readObject();
                System.out.println(first + " " + second + " " + (first == second));
            }
        }
    }
  options:
    - key: a
      text: "`[a] [a] true`"
      correct: true
      why: The second writeObject of the same object on the same stream only writes a back-reference to the first snapshot, so both reads return the same list containing only a.
    - key: b
      text: "`[a] [a, b] false`"
      why: An ObjectOutputStream writes each object once; it does not detect that the object changed after it was first written.
    - key: c
      text: "`[a, b] [a, b] true`"
      why: The first writeObject copied the state into the stream at that moment, when the list held only a.
    - key: d
      text: "`[a] [a, b] true`"
      why: Two reads returning the same reference cannot show two different contents.
  explanation: |
    Within one `ObjectOutputStream`, every object is assigned a handle the first time it is written; writing
    the same object again only writes that handle. When reading, the handle resolves to the object already
    read, so identity is preserved (`first == second`) and the later change (`"b"`) is lost. Call
    `out.reset()` between the writes, or use `writeUnshared`, to write a fresh copy.
  rule: "ObjectOutputStream writes an object once per stream and uses back-references for repeated writes; reading preserves identity within the stream."
  misconception: Every call to writeObject writes the object's current state.
  hint: What does the stream do the second time it sees the same object?
  java:
    expect: { compiles: true, stdout: "[a] [a] true" }

- id: D9-SER-008
  objective: D9.2
  lesson: io-serialization
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [serialization, writeobject, readobject, hooks, transient]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    class Counter implements Serializable {
        int value = 1;
        transient int cache = 99;

        private void writeObject(ObjectOutputStream out) throws IOException {
            System.out.print("W ");
            value++;
            out.defaultWriteObject();
            out.writeInt(cache);
        }
        private void readObject(ObjectInputStream in) throws IOException, ClassNotFoundException {
            System.out.print("R ");
            in.defaultReadObject();
            cache = in.readInt() + 1;
        }
    }

    public class Main {
        public static void main(String[] args) throws Exception {
            Counter c = new Counter();
            var bytes = new ByteArrayOutputStream();
            try (var out = new ObjectOutputStream(bytes)) { out.writeObject(c); }
            try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                Counter copy = (Counter) in.readObject();
                System.out.println(c.value + " " + copy.value + " " + copy.cache);
            }
        }
    }
  options:
    - key: a
      text: "`W R 2 2 100`"
      correct: true
      why: The private hooks are called by the streams; value is incremented on the original before defaultWriteObject writes it, and the transient cache is written and read manually (99 + 1).
    - key: b
      text: "`W R 1 2 100`"
      why: writeObject runs on the ORIGINAL object, so value++ changes c.value too.
    - key: c
      text: "`W R 2 2 0`"
      why: transient only excludes a field from defaultWriteObject; the hook writes cache explicitly and readObject restores it.
    - key: d
      text: "`2 2 100`"
      why: The hooks must be private with these exact signatures — which they are — so the streams do invoke them and W and R are printed.
    - key: e
      text: "`W R 1 1 99`"
      why: Neither the increment nor the explicit read-and-add is skipped; hooks run in addition to the default mechanism.
  explanation: |
    A serializable class can declare `private void writeObject(ObjectOutputStream)` and
    `private void readObject(ObjectInputStream)`; the serialization machinery invokes them reflectively
    instead of the default field handling. `defaultWriteObject()`/`defaultReadObject()` process the normal
    (non-transient, non-static) fields; anything extra must be written and read in the same order. Here
    `value` is incremented on the original object before it is written, and the transient `cache` travels
    through the explicit `writeInt`/`readInt`.
  rule: "Custom serialization hooks: private void writeObject(ObjectOutputStream) throws IOException; private void readObject(ObjectInputStream) throws IOException, ClassNotFoundException."
  misconception: transient fields can never be restored, or private hook methods cannot be called by the streams.
  java:
    expect: { compiles: true, stdout: "W R 2 2 100" }

- id: D9-SER-009
  objective: D9.2
  lesson: io-serialization
  type: single
  format: compile-error
  difficulty: foundation
  estSeconds: 75
  tags: [serialization, readobject, checked-exception, classnotfoundexception]
  prompt: Which line causes a compilation error?
