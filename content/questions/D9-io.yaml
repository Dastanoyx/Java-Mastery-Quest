# D9 — Java I/O (D9.1 streams & console, D9.2 serialization, D9.3 NIO.2 Path & Files)

# ───────────────────────── D9.1 · I/O streams & console ─────────────────────────

- id: D9-IO-001
  objective: D9.1
  lesson: io-streams
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [inputstream, read-array, end-of-stream]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    public class Main {
        public static void main(String[] args) throws IOException {
            byte[] data = { 10, 20, -128, 30, 40 };
            try (var in = new ByteArrayInputStream(data)) {
                byte[] buf = new byte[2];
                int n, total = 0;
                while ((n = in.read(buf)) != -1) {
                    total += n;
                    System.out.print(n + ":" + buf[0] + " ");
                }
                System.out.println(total + " " + in.read());
            }
        }
    }
  options:
    - key: a
      text: "`2:10 2:-128 1:40 5 -1`"
      correct: true
      why: "read(byte[]) returns how many bytes it actually stored (2, 2, then 1) and -1 only at the end; buf[0] is a byte, so -128 prints as -128."
    - key: b
      text: "`2:10 2:128 1:40 5 -1`"
      why: "Only the single-byte read() converts a byte to the unsigned range 0–255. Here the value is read from a byte[] element, which is signed."
    - key: c
      text: "`2:10 2:-128 2:40 6 -1`"
      why: "This assumes read(byte[]) always fills the whole buffer. The last call finds only one byte left and returns 1."
    - key: d
      text: "`2:10 5 -1`"
      why: "A byte value of -128 in the data does not end the loop; the loop compares the returned COUNT with -1, not the data."
  explanation: |
    `InputStream.read(byte[] b)` reads up to `b.length` bytes, stores them in `b`, and returns the **number of
    bytes read** — possibly fewer than requested — or `-1` when the stream is exhausted. The loop sees counts
    2, 2 and 1 (total 5); afterwards `read()` returns `-1`. Values stored in the array keep their signed `byte`
    type, so `-128` prints as `-128`. Stale data from earlier reads may remain in the buffer beyond `n`, which is
    why real code only processes `buf[0..n-1]`.
  rule: "InputStream.read(byte[]) returns the number of bytes read, or -1 at end of stream; read() returns an unsigned byte value 0–255 or -1."
  misconception: read(byte[]) always fills the whole array, or returns the data rather than a count.
  hint: What does read(byte[]) return — data or a count?
  java:
    expect: { compiles: true, stdout: "2:10 2:-128 1:40 5 -1" }

- id: D9-IO-002
  objective: D9.1
  lesson: io-streams
  type: single
  format: trace
  difficulty: advanced
  estSeconds: 150
  tags: [try-with-resources, close-order, decorator, filterreader]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    public class Main {
        static class Named extends FilterReader {
            final String name;
            Named(String name, Reader in) { super(in); this.name = name; }
            @Override public void close() throws IOException {
                System.out.print(name + " ");
                super.close();
            }
        }
        public static void main(String[] args) throws IOException {
            try (var a = new Named("A", new StringReader("x"));
                 var b = new Named("B", new Named("C", new StringReader("y")))) {
                System.out.print("body ");
            } finally {
                System.out.println("finally");
            }
        }
    }
  options:
    - key: a
      text: "`body B C A finally`"
      correct: true
      why: "Resources close in reverse declaration order (b before a), and closing the wrapper B closes the stream it wraps, C, before the next resource is closed."
    - key: b
      text: "`body A B C finally`"
      why: "This closes in declaration order; try-with-resources always closes the LAST declared resource first."
    - key: c
      text: "`body B A finally`"
      why: "C is not a declared resource, but FilterReader.close() closes the wrapped reader, so C's close() runs too."
    - key: d
      text: "`body C B A finally`"
      why: "The outer wrapper's close() is called first; it prints B and only then delegates to the inner reader C."
    - key: e
      text: "`B C A body finally`"
      why: "Resources are closed after the try block's body completes, not before it."
  explanation: |
    try-with-resources closes resources in the **reverse order of declaration**: first `b`, then `a`, and all
    of them before the `finally` block runs. Closing a decorator closes the stream it wraps:
    `FilterReader.close()` calls `in.close()`, so closing `B` prints `B ` and then triggers `C`'s `close()`.
    That is why it is enough to close the outermost wrapper of a chain.
  rule: "Resources are closed in reverse declaration order before catch/finally; a filter stream's close() closes its underlying stream."
  misconception: Only the declared variables are closed, or they are closed in declaration order.
  hint: Which resource was declared last, and what does B wrap?
  java:
    expect: { compiles: true, stdout: "body B C A finally" }

- id: D9-IO-003
  objective: D9.1
  lesson: io-streams
  type: multi
  format: concept
  difficulty: foundation
  estSeconds: 90
  tags: [hierarchy, printwriter, printstream, bridge]
  prompt: Which of the following statements about `java.io` are true? Choose three.
  options:
    - key: a
      text: The `print`/`println` methods of `PrintWriter` never throw `IOException`; failures are reported by `checkError()`.
      correct: true
      why: Both PrintWriter and PrintStream swallow IOExceptions in their print methods and set an internal error flag instead.
    - key: b
      text: "`System.out` is a `PrintWriter`."
      why: System.out and System.err are PrintStream objects — byte streams that can also print text.
    - key: c
      text: "`InputStreamReader` decodes bytes from an `InputStream` into characters using a charset."
      correct: true
      why: InputStreamReader is the bridge from the byte family to the character family.
    - key: d
      text: "`Reader` and `Writer` are interfaces implemented by the concrete character streams."
      why: InputStream, OutputStream, Reader and Writer are all abstract classes, not interfaces.
    - key: e
      text: "`PrintWriter` has a constructor that accepts an `OutputStream`."
      correct: true
      why: PrintWriter(OutputStream) exists and wraps the byte stream with an encoder internally — the one Writer decorator that accepts both families.
    - key: f
      text: "`BufferedReader` has a constructor that accepts an `InputStream`."
      why: BufferedReader only wraps a Reader; you need new BufferedReader(new InputStreamReader(in)).
  explanation: |
    The four roots of `java.io` — `InputStream`, `OutputStream`, `Reader`, `Writer` — are abstract classes.
    Decorators take a stream of their own family, with two bridges (`InputStreamReader`,
    `OutputStreamWriter`) and `PrintWriter`, which accepts a `Writer` or an `OutputStream`. `System.out` is a
    `PrintStream`. Neither `PrintStream` nor `PrintWriter` throws `IOException` from its printing methods.
  rule: "Byte streams: InputStream/OutputStream; character streams: Reader/Writer (all abstract classes). PrintStream/PrintWriter report errors via checkError()."
  misconception: Any stream can wrap any other stream, and System.out is a PrintWriter.

- id: D9-IO-004
  objective: D9.1
  lesson: io-streams
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [fileoutputstream, append, truncate, write-int]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) throws IOException {
            File f = Files.createTempDirectory("w").resolve("data.bin").toFile();
            try (var out = new FileOutputStream(f)) { out.write(65); out.write(322); }
            System.out.print(Files.readString(f.toPath()) + " ");
            try (var out = new FileOutputStream(f, true)) { out.write('C'); }
            System.out.print(Files.readString(f.toPath()) + " ");
            try (var out = new FileOutputStream(f)) {
                System.out.print(f.length() + " ");
            }
            System.out.println(f.length());
        }
    }
  options:
    - key: a
      text: "`AB ABC 0 0`"
      correct: true
      why: "write(322) keeps only the low 8 bits (322 - 256 = 66 = 'B'); the append flag keeps AB; opening without append truncates the file immediately, before anything is written."
    - key: b
      text: "`AB ABC 3 0`"
      why: Truncation does not wait for the first write or for close() — the file is emptied when the FileOutputStream is opened.
    - key: c
      text: "`AB ABC 3 3`"
      why: This assumes opening a FileOutputStream without writing leaves the file untouched; without the append flag the existing content is discarded at construction.
    - key: d
      text: "`AB C 0 0`"
      why: "new FileOutputStream(f, true) appends — 'C' is added after the existing AB."
    - key: e
      text: An `IllegalArgumentException` is thrown because 322 does not fit in a byte
      why: OutputStream.write(int) silently ignores the 24 high-order bits; it never validates the range.
  explanation: |
    `FileOutputStream(File)` creates the file or **truncates** an existing one as soon as it is constructed;
    `FileOutputStream(File, true)` opens it in append mode. `OutputStream.write(int b)` writes only the
    low-order 8 bits, so `322` (`0x142`) becomes `0x42` = `'B'`. The third stream truncates the file to 0
    bytes on opening, even though nothing is written.
  rule: "FileOutputStream/FileWriter truncate an existing file when opened unless append is true; write(int) writes the low-order 8 bits."
  misconception: A file is only overwritten when you actually write to it.
  hint: When exactly does truncation happen?
  java:
    expect: { compiles: true, stdout: "AB ABC 0 0" }

- id: D9-IO-005
  objective: D9.1
  lesson: io-streams
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags: [decorator, wrapping, compile, bridge]
  prompt: |
    Assume `import java.io.*;` and `import java.nio.charset.*;`, and that each statement appears in a method
    declared `throws IOException`. Which statements compile? Choose three.
  options:
    - key: a
      text: "`Reader r = new BufferedReader(new FileReader(\"in.txt\"));`"
      correct: true
      why: FileReader is a Reader, so BufferedReader can wrap it, and a BufferedReader is a Reader.
      java:
        source: |
          import java.io.*;
          public class Main {
              static void test() throws IOException { Reader r = new BufferedReader(new FileReader("in.txt")); }
              public static void main(String[] args) { System.out.println("ok"); }
          }
        expect: { compiles: true, stdout: "ok" }
    - key: b
      text: "`Reader r = new BufferedReader(new FileInputStream(\"in.txt\"));`"
      why: BufferedReader only accepts a Reader; a FileInputStream is a byte stream and needs an InputStreamReader in between.
      java:
        source: |
          import java.io.*;
          public class Main {
              static void test() throws IOException { Reader r = new BufferedReader(new FileInputStream("in.txt")); }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "FileInputStream cannot be converted to java.io.Reader" }
    - key: c
      text: "`Writer w = new PrintWriter(new FileOutputStream(\"out.txt\"));`"
      correct: true
      why: PrintWriter has a constructor taking an OutputStream, and PrintWriter is a Writer.
      java:
        source: |
          import java.io.*;
          public class Main {
              static void test() throws IOException { Writer w = new PrintWriter(new FileOutputStream("out.txt")); }
              public static void main(String[] args) { System.out.println("ok"); }
          }
        expect: { compiles: true, stdout: "ok" }
    - key: d
      text: "`var w = new BufferedWriter(new OutputStreamWriter(new FileOutputStream(\"o.txt\"), StandardCharsets.UTF_8));`"
      correct: true
      why: OutputStreamWriter bridges the byte stream to a Writer, which BufferedWriter can wrap.
      java:
        source: |
          import java.io.*;
          import java.nio.charset.*;
          public class Main {
              static void test() throws IOException {
                  var w = new BufferedWriter(new OutputStreamWriter(new FileOutputStream("o.txt"), StandardCharsets.UTF_8));
              }
              public static void main(String[] args) { System.out.println("ok"); }
          }
        expect: { compiles: true, stdout: "ok" }
    - key: e
      text: "`var out = new ObjectOutputStream(new FileWriter(\"o.bin\"));`"
      why: ObjectOutputStream writes bytes and only wraps an OutputStream; FileWriter is a character stream.
      java:
        source: |
          import java.io.*;
          public class Main {
              static void test() throws IOException { var out = new ObjectOutputStream(new FileWriter("o.bin")); }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "FileWriter cannot be converted to java.io.OutputStream" }
    - key: f
      text: "`InputStream in = new BufferedInputStream(new InputStreamReader(System.in));`"
      why: InputStreamReader is a Reader; BufferedInputStream needs an InputStream. System.in itself could be wrapped directly.
      java:
        source: |
          import java.io.*;
          public class Main {
              static void test() throws IOException { InputStream in = new BufferedInputStream(new InputStreamReader(System.in)); }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "InputStreamReader cannot be converted to java.io.InputStream" }
  explanation: |
    Decorator constructors are typed: `BufferedReader`/`BufferedWriter` wrap a `Reader`/`Writer`,
    `BufferedInputStream`/`ObjectOutputStream` wrap an `InputStream`/`OutputStream`. Crossing from bytes to
    characters needs `InputStreamReader` or `OutputStreamWriter`. `PrintWriter` is the exception that accepts
    both a `Writer` and an `OutputStream`. Mismatches are compile-time errors, not runtime errors.
  rule: "A Reader/Writer decorator takes a Reader/Writer; a byte-stream decorator takes an InputStream/OutputStream; bridges: InputStreamReader, OutputStreamWriter (and PrintWriter(OutputStream))."
  misconception: Streams of any family can be chained in any order.
  hint: Check the family (bytes or characters) of each constructor argument.

- id: D9-IO-006
  objective: D9.1
  lesson: io-streams
  type: single
  format: runtime-exception
  difficulty: foundation
  estSeconds: 75
  tags: [console, null-check, system-console]
  prompt: |
    The program is started with `java Main < answers.txt > out.txt` — standard input and output are
    redirected, so the JVM is not attached to an interactive terminal. What is the result?
  code: |
    import java.io.Console;

    public class Main {
        public static void main(String[] args) {
            Console console = System.console();
            System.out.println("start");
            String name = console.readLine("Name: ");
            System.out.println("Hello " + name);
        }
    }
  options:
    - key: a
      text: "`start` is printed, then a `NullPointerException` is thrown"
      correct: true
      why: Without an interactive console System.console() returns null, so calling readLine on it throws a NullPointerException.
    - key: b
      text: "`start` and `Hello` followed by the first line of answers.txt are printed"
      why: Console does not fall back to redirected standard input; with no terminal there is no Console object at all.
    - key: c
      text: Compilation fails because `readLine` throws a checked `IOException` that is not handled
      why: Console.readLine declares no checked exception; I/O failures are reported as the unchecked IOError.
    - key: d
      text: The program blocks, waiting for keyboard input
      why: There is no terminal to read from; the program fails as soon as it dereferences the null Console.
  explanation: |
    `System.console()` returns the unique `Console` of the JVM, or **`null`** if there is none — typically
    when input or output is redirected, inside many IDE run configurations, in CI jobs, and in this course's
    runner. Always null-check it (or fall back to `BufferedReader`/`Scanner` on `System.in`). The exact
    conditions under which a console is available have varied between JDK versions and console providers,
    which is one more reason never to assume it exists.
  rule: "System.console() returns null when no console device is available; Console.readLine/readPassword throw no checked exceptions."
  misconception: System.console() always returns an object that reads from standard input.
  java:
    stdin: "Ana\n"
    expect: { compiles: true, stdout: "start", exception: java.lang.NullPointerException }

- id: D9-IO-007
  objective: D9.1
  lesson: io-streams
  type: single
  format: trace
  difficulty: advanced
  estSeconds: 150
  tags: [mark, reset, skip, readline, bufferedreader]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    public class Main {
        public static void main(String[] args) throws IOException {
            try (var r = new BufferedReader(new StringReader("red\ngreen\nblue\n"))) {
                r.mark(100);
                String first = r.readLine();
                r.skip(2);
                String second = r.readLine();
                r.reset();
                System.out.println(first + "|" + second + "|" + r.readLine() + "|" + (char) r.read());
            }
        }
    }
  options:
    - key: a
      text: "`red|een|red|g`"
      correct: true
      why: "skip(2) skips two CHARACTERS (g, r), so the next line is \"een\"; reset() returns to the mark at the very beginning, so readLine() gives red again and read() the g."
    - key: b
      text: "`red|green|red|g`"
      why: skip(n) skips characters, not whitespace or line terminators only — the first two characters of green are discarded.
    - key: c
      text: "`red|blue|red|g`"
      why: This treats skip(2) as skipping lines; Reader.skip counts characters.
    - key: d
      text: "`red|een|blue|`"
      why: reset() does not continue from the current position; it rewinds to the position saved by mark(), here the start of the stream.
    - key: e
      text: An `IOException` is thrown by `reset()` because more than one line was read since `mark`
      why: The read-ahead limit is 100 characters, and only 9 have been read since mark(), so the mark is still valid.
  explanation: |
    `mark(100)` remembers the current position (the start) and keeps it valid for up to 100 characters.
    `readLine()` consumes `red\n`; `skip(2)` discards `g` and `r`; `readLine()` returns `een`. `reset()`
    rewinds to the mark, so reading starts again at `red`. `BufferedReader` supports mark/reset; a plain
    `FileReader` would throw `IOException: mark/reset not supported`.
  rule: "Reader.skip(n) skips characters; mark(limit) saves the position and reset() returns to it if no more than limit characters were read since."
  misconception: skip works in lines, or reset steps back only one read.
  hint: Count characters, not lines.
  java:
    expect: { compiles: true, stdout: "red|een|red|g" }

- id: D9-IO-008
  objective: D9.1
  lesson: io-streams
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 90
  tags: [charset, utf-8, outputstreamwriter, inputstreamreader]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;
    import java.nio.charset.StandardCharsets;

    public class Main {
        public static void main(String[] args) throws IOException {
            var bytes = new ByteArrayOutputStream();
            try (var w = new OutputStreamWriter(bytes, StandardCharsets.UTF_8)) {
                w.write("Größe");
            }
            var raw = new ByteArrayInputStream(bytes.toByteArray());
            int byteCount = 0;
            while (raw.read() != -1) byteCount++;
            var reader = new InputStreamReader(new ByteArrayInputStream(bytes.toByteArray()), StandardCharsets.UTF_8);
            int charCount = 0;
            while (reader.read() != -1) charCount++;
            System.out.println(bytes.size() + " " + byteCount + " " + charCount);
        }
    }
  options:
    - key: a
      text: "`7 7 5`"
      correct: true
      why: ö and ß each take two bytes in UTF-8 (5 characters → 7 bytes); the byte stream sees 7 bytes and the UTF-8 reader decodes them back into 5 characters.
    - key: b
      text: "`5 5 5`"
      why: Only ASCII characters are one byte in UTF-8; ö and ß need two bytes each.
    - key: c
      text: "`10 10 5`"
      why: This assumes two bytes per character (as in UTF-16); UTF-8 is variable-length.
    - key: d
      text: "`7 7 7`"
      why: The InputStreamReader decodes with the same charset, so multi-byte sequences become single characters again.
  explanation: |
    A `Writer` produces characters and `OutputStreamWriter` encodes them into bytes with the given charset.
    In UTF-8, ASCII characters take one byte and characters such as `ö` and `ß` take two, so `"Größe"`
    becomes 7 bytes. Reading the raw bytes counts 7; an `InputStreamReader` with the same charset decodes them
    back into 5 `char`s.
  rule: "OutputStreamWriter/InputStreamReader convert between chars and bytes with a Charset; UTF-8 uses 1–4 bytes per character."
  misconception: One character is always one byte.
  java:
    expect: { compiles: true, stdout: "7 7 5" }

- id: D9-IO-009
  objective: D9.1
  lesson: io-streams
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [printwriter, autoflush, flush, buffering]
  prompt: What is the output of the following program on a system whose line separator is `\n`?
  code: |
    import java.io.*;

    public class Main {
        public static void main(String[] args) {
            var sink = new ByteArrayOutputStream();
            var pw = new PrintWriter(sink, true);
            pw.print("a");
            System.out.print(sink.size());
            pw.println("b");
            System.out.print(sink.size());
            pw.printf("%s", "c");
            System.out.print(sink.size());
            pw.write("d");
            System.out.print(sink.size());
            pw.close();
            System.out.println(sink.size());
        }
    }
  options:
    - key: a
      text: "`03445`"
      correct: true
      why: "Autoflush happens only on println, printf and format: print leaves a buffered, println pushes ab plus newline (3), printf pushes c (4), write keeps d buffered (still 4), close flushes it (5)."
    - key: b
      text: "`13445`"
      why: Autoflush does not apply to print(); the a stays in the internal buffer until the println.
    - key: c
      text: "`03345`"
      why: printf (and format) DO trigger autoflush in a PrintWriter created with autoFlush = true.
    - key: d
      text: "`03455`"
      why: write() is not one of the autoflushing methods, so d stays buffered until close().
    - key: e
      text: "`12345`"
      why: This treats autoflush as "flush after every call", which is not how PrintWriter defines it.
  explanation: |
    `new PrintWriter(OutputStream, true)` wraps the stream in a buffered encoder and enables automatic
    flushing — but, per the `PrintWriter` API, only for `println`, `printf` and `format`. `print` and
    `write` stay in the buffer until the next autoflushing call, an explicit `flush()`, or `close()`.
    (`PrintStream`'s autoflush is broader: it also flushes when a newline is written or a byte array is written.)
  rule: "PrintWriter autoflush flushes only on println, printf and format; close() always flushes."
  misconception: Autoflush means every write is sent immediately.
  hint: Which three methods trigger PrintWriter's automatic flushing?
  java:
    expect: { compiles: true, stdout: "03445" }

- id: D9-IO-010
  objective: D9.1
  lesson: io-streams
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [scanner, system-in, nextint, nextline]
  prompt: |
    The program below is run with this text on standard input (each line ends with a newline):

    ```
    3
    hello world
    ```

    What does it print?
  code: |
    import java.util.Scanner;

    public class Main {
        public static void main(String[] args) {
            Scanner sc = new Scanner(System.in);
            int n = sc.nextInt();
            String rest = sc.nextLine();
            String line = sc.nextLine();
            System.out.println(n + "[" + rest + "][" + line + "]");
        }
    }
  options:
    - key: a
      text: "`3[][hello world]`"
      correct: true
      why: nextInt() consumes only the token 3; the first nextLine() returns the empty remainder of that line, the second returns the next line.
    - key: b
      text: "`3[hello world][]`"
      why: The line terminator after 3 is still unread, so the first nextLine() returns "" — not the following line.
    - key: c
      text: "`3[hello][world]`"
      why: nextLine() returns the whole remaining line, spaces included; it does not tokenize.
    - key: d
      text: A `java.util.InputMismatchException` is thrown by `nextLine()`
      why: nextLine() never parses; it returns whatever characters remain up to the line terminator, even none.
  explanation: |
    `Scanner.nextInt()` reads the next token and leaves the delimiter (here the newline) in the input.
    `nextLine()` then returns everything up to the next line terminator — an empty string — and consumes
    the terminator. Only the second `nextLine()` returns `hello world`. The usual fix is an extra
    `nextLine()` after `nextInt()`, or reading every line and parsing it with `Integer.parseInt`.
  rule: "Scanner.nextInt()/next() do not consume the rest of the line; nextLine() returns the remainder of the current line (possibly empty)."
  misconception: nextLine() after nextInt() returns the next line of input.
  java:
    stdin: "3\nhello world\n"
    expect: { compiles: true, stdout: "3[][hello world]" }

