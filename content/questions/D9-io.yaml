        expect: { compiles: true, stdout: "writing\ndone" }
    - key: b
      text: "Declare the field as `transient Engine engine = new Engine();`"
      correct: true
      why: Transient fields are skipped by serialization, so the non-serializable Engine is never written.
      java:
        source: |
          import java.io.*;
          class Engine { int hp = 300; }
          class Car implements Serializable { String model = "GT"; transient Engine engine = new Engine(); }
          public class Main {
              public static void main(String[] args) throws IOException {
                  try (var out = new ObjectOutputStream(new ByteArrayOutputStream())) {
                      System.out.println("writing"); out.writeObject(new Car()); System.out.println("done");
