- id: D9-NIO-001
  objective: D9.3
  lesson: io-nio2
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [path, getname, subpath, normalize]
  prompt: What is the output of the following program?
  code: |
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) {
            Path p = Path.of("/var/log/../lib/./app/data.db");
            System.out.println(p.getNameCount() + " " + p.getName(2) + " " + p.subpath(3, 5));
            Path n = p.normalize();
            System.out.println(n + " " + n.getNameCount() + " " + n.getParent().getFileName());
        }
    }
  options:
    - key: a
      text: |
        7 .. lib/.
        /var/lib/app/data.db 4 app
      correct: true
      why: Before normalizing, . and .. are ordinary name elements (7 names, index 2 is ..); subpath(3, 5) covers indices 3 and 4. normalize removes log/.. and . .
    - key: b
      text: |
        8 log lib/.
        /var/lib/app/data.db 4 app
      why: The root / is not a name element, so the count is 7 and index 2 is .. (index 0 is var).
    - key: c
      text: |
        5 lib app/data.db
        /var/lib/app/data.db 4 app
      why: getNameCount, getName and subpath do not normalize; they work on the path exactly as written.
    - key: d
      text: |
        7 .. lib/./app
        /var/lib/app/data.db 4 app
      why: subpath's end index is exclusive, so subpath(3, 5) has only two elements.
    - key: e
      text: |
        7 .. lib/.
        /var/lib/app/data.db 5 data.db
      why: After normalization the names are var, lib, app, data.db (4); the parent is /var/lib/app, whose file name is app.
  explanation: |
    Name elements are counted without the root, from index 0, and `.`/`..` are ordinary elements until you
    call `normalize()`. `subpath(begin, end)` is zero-based and end-exclusive and returns a relative path.
    `normalize()` removes `.` and cancels `log/..` syntactically, giving `/var/lib/app/data.db`.
  rule: "Path name elements exclude the root; getName/subpath are 0-based (subpath end-exclusive) and purely syntactic; normalize removes . and name/.. pairs."
  misconception: Path methods automatically normalize, or the root counts as a name element.
  java:
    expect: { compiles: true, stdout: "7 .. lib/.\n/var/lib/app/data.db 4 app" }

- id: D9-NIO-002
  objective: D9.3
  lesson: io-nio2
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [path, resolve, relativize, normalize]
  prompt: What is the output of the following program?
  code: |
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) {
            Path home = Path.of("/home/kim");
            Path a = home.resolve("docs/../music");
            Path b = home.resolve("/tmp/x");
            Path c = Path.of("docs").resolve("");
            System.out.println(a + " " + b + " " + c);
            System.out.println(home.relativize(a.normalize()) + " "
                + a.normalize().relativize(home) + " [" + home.relativize(home) + "]");
        }
    }
  options:
    - key: a
      text: |
        /home/kim/docs/../music /tmp/x docs
        music .. []
      correct: true
      why: resolve does not normalize; an absolute argument replaces the base; resolving an empty path returns the base. relativize gives the steps between the two paths — none for identical paths.
    - key: b
      text: |
        /home/kim/music /tmp/x docs
        music .. []
      why: resolve only joins the paths; the .. is removed only when normalize() is called.
    - key: c
      text: |
        /home/kim/docs/../music /home/kim/tmp/x docs
        music .. []
      why: When the argument of resolve is absolute, it is returned as is — the base is ignored.
    - key: d
      text: |
        /home/kim/docs/../music /tmp/x docs
        music ../.. [.]
      why: From /home/kim/music back to /home/kim is ONE level up; and relativizing a path against itself gives the empty path, not ".".
  explanation: |
    `resolve(other)` returns `other` if it is absolute, the base if `other` is empty, and otherwise the
    joined path **without normalizing**. `relativize` computes the relative path from one path to another;
    both must be of the same type, and the result for two equal paths is the empty path (printed as
    nothing). Neither method touches the file system.
  rule: "p.resolve(q): q if q is absolute, p if q is empty, else p/q (not normalized). p.relativize(q) is the path from p to q; p.relativize(p) is empty."
  misconception: resolve always appends and normalizes.
  java:
    expect: { compiles: true, stdout: "/home/kim/docs/../music /tmp/x docs\nmusic .. []" }

- id: D9-NIO-003
  objective: D9.3
  lesson: io-nio2
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 100
  tags: [files, delete, deleteifexists, directorynotemptyexception]
  prompt: What is the result of running the following program?
  code: |
    import java.io.IOException;
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) throws IOException {
            Path dir = Files.createTempDirectory("q");
            Path data = Files.createDirectories(dir.resolve("data/raw"));
            Files.writeString(data.resolve("a.csv"), "1,2");
            Files.deleteIfExists(dir.resolve("missing.txt"));
            System.out.println("step 1");
            Files.deleteIfExists(dir.resolve("data"));
            System.out.println("step 2");
        }
    }
  options:
    - key: a
      text: "`step 1` is printed, then a `DirectoryNotEmptyException` is thrown"
      correct: true
      why: deleteIfExists returns false for the missing file, but a non-empty directory cannot be deleted by delete or deleteIfExists.
    - key: b
      text: "`step 1` and `step 2` are printed; `data` and its contents are deleted"
      why: Neither delete nor deleteIfExists is recursive; you must walk the tree and delete the leaves first.
    - key: c
      text: A `NoSuchFileException` is thrown before anything is printed
      why: That is Files.delete's behaviour for a missing file; deleteIfExists just returns false.
    - key: d
      text: "`step 1` and `step 2` are printed; `deleteIfExists` returns `false` for the non-empty directory"
      why: deleteIfExists only tolerates a MISSING file; a non-empty directory still throws DirectoryNotEmptyException.
  explanation: |
    `Files.deleteIfExists(p)` returns `false` when `p` does not exist, instead of throwing
    `NoSuchFileException` as `Files.delete(p)` does. Both methods refuse to delete a non-empty directory and
    throw `DirectoryNotEmptyException` (a `FileSystemException`). Recursive deletion requires walking the tree
    in reverse order (deepest paths first).
  rule: "Files.delete: NoSuchFileException if missing; deleteIfExists: false if missing; both throw DirectoryNotEmptyException for a non-empty directory."
  misconception: deleteIfExists deletes recursively or never throws.
  java:
    expect: { compiles: true, stdout: "step 1", exception: java.nio.file.DirectoryNotEmptyException }

- id: D9-NIO-004
  objective: D9.3
  lesson: io-nio2
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 180
  tags: [files, walk, maxdepth, lines]
  prompt: What is the output of the following program?
  code: |
    import java.io.IOException;
    import java.nio.file.*;
    import java.util.stream.Stream;

    public class Main {
        public static void main(String[] args) throws IOException {
            Path root = Files.createTempDirectory("w");
            Files.createDirectories(root.resolve("a/b/c"));
            Files.writeString(root.resolve("a/x.txt"), "1\n2\n3\n");
            Files.writeString(root.resolve("a/b/y.txt"), "4\n");
            try (Stream<Path> s = Files.walk(root.resolve("a"), 1)) {
                System.out.print(s.count() + " ");
            }
            try (Stream<Path> s = Files.walk(root.resolve("a"))) {
                System.out.print(s.filter(Files::isRegularFile).count() + " ");
            }
            try (Stream<Path> s = Files.walk(root, 2)) {
                System.out.print(s.filter(Files::isDirectory).count() + " ");
            }
            try (Stream<String> lines = Files.lines(root.resolve("a/x.txt"))) {
                System.out.println(lines.mapToInt(Integer::parseInt).sum());
            }
        }
    }
  options:
    - key: a
      text: "`3 2 3 6`"
      correct: true
      why: "walk(a, 1) = a, a/b, a/x.txt; the full walk of a finds two regular files; walk(root, 2) reaches the directories root, a and a/b (c is at depth 3); 1+2+3 = 6."
    - key: b
      text: "`2 2 2 6`"
      why: Files.walk always includes the start path itself at depth 0, in every count.
    - key: c
      text: "`3 2 4 6`"
      why: a/b/c is three levels below root, so walk(root, 2) does not reach it.
    - key: d
      text: "`3 1 3 6`"
      why: Without a depth limit, walk is recursive and also finds a/b/y.txt.
  explanation: |
    `Files.walk(start, maxDepth)` streams `start` (depth 0) and everything up to `maxDepth` levels below it,
    depth-first; without `maxDepth` it is unlimited. Each `walk`/`lines` stream holds open resources and is
    closed by try-with-resources. `Files.lines` streams the lines without their terminators.
  rule: "Files.walk includes the start path at depth 0 and descends maxDepth levels (default Integer.MAX_VALUE); stream-returning Files methods must be closed."
  misconception: walk starts with the children of the start directory, or maxDepth counts from 0 at the children.
  hint: What is at depth 0?
  java:
    expect: { compiles: true, stdout: "3 2 3 6" }

- id: D9-NIO-005
  objective: D9.3
  lesson: io-nio2
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 100
  tags: [path, relativize, resolve, illegalargumentexception]
  prompt: What is the result of running the following program?
  code: |
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) {
            Path a = Path.of("/data/in");
            Path b = Path.of("data/out");
            System.out.println(a.resolve(b));
            System.out.println(b.resolve(a));
            System.out.println(a.relativize(b));
        }
    }
  options:
    - key: a
      text: Prints `/data/in/data/out` and `/data/in`, then an `IllegalArgumentException` is thrown
      correct: true
      why: Resolving a relative path appends it; resolving an absolute path returns it; relativize refuses to mix an absolute and a relative path.
    - key: b
      text: Prints `/data/in/data/out`, `data/out/data/in` and `../../data/out`
      why: An absolute argument to resolve is returned unchanged, and relativize throws for mixed path types.
    - key: c
      text: Prints `/data/in/data/out` and `/data/in`, then a `NoSuchFileException` is thrown
      why: Path operations never access the file system; the failure is an argument check (IllegalArgumentException).
    - key: d
      text: Prints `/data/in/data/out`, `/data/in` and `../out`
      why: relativize does not guess a common base for a relative path; the two paths must be of the same type.
  explanation: |
    `resolve` with a relative argument appends it, and with an absolute argument returns the argument.
    `relativize` can only compute a path between two absolute or two relative paths; otherwise it throws
    `IllegalArgumentException` ("'other' is different type of Path"). None of these methods checks the disk.
  rule: "p.relativize(q) throws IllegalArgumentException if exactly one of p and q is absolute."
  misconception: relativize works between any two paths, or reports missing files.
  java:
    expect: { compiles: true, stdout: "/data/in/data/out\n/data/in", exception: java.lang.IllegalArgumentException }

- id: D9-NIO-006
  objective: D9.3
  lesson: io-nio2
  type: single
  format: runtime-exception
  difficulty: advanced
  estSeconds: 120
  tags: [path, torealpath, toabsolutepath, nosuchfileexception]
  prompt: The current directory does not contain a `reports` directory or a `draft.txt` file. What is the result of running the program?
  code: |
    import java.io.IOException;
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) throws IOException {
            Path p = Path.of("reports/../draft.txt");
            System.out.println(p.toAbsolutePath().endsWith("draft.txt") + " " + p.isAbsolute());
            System.out.println(p.normalize().toAbsolutePath().getFileName());
            System.out.println(p.toRealPath());
        }
    }
  options:
    - key: a
      text: Two lines (`true false` and `draft.txt`) are printed, then a `NoSuchFileException` is thrown
      correct: true
      why: toAbsolutePath and normalize are purely syntactic, but toRealPath must look the file up on disk.
    - key: b
      text: A `NoSuchFileException` is thrown before anything is printed
      why: toAbsolutePath does not check existence; it only prefixes the current directory.
    - key: c
      text: "Three lines are printed; the last one is the absolute path ending in `/draft.txt`"
      why: toRealPath resolves links and therefore requires the file to exist.
    - key: d
      text: "`true true` and `draft.txt` are printed, then a `NoSuchFileException` is thrown"
      why: isAbsolute() is asked of p itself, which is relative; toAbsolutePath returns a NEW path.
  explanation: |
    `toAbsolutePath()` and `normalize()` only compute a new path; they work for files that do not exist and
    never modify `p` (paths are immutable). `toRealPath()` returns the canonical path of an **existing**
    file, resolving symbolic links, so it throws `NoSuchFileException` here.
  rule: "toRealPath() accesses the file system and throws NoSuchFileException for a missing file; toAbsolutePath() and normalize() do not check existence."
  misconception: toAbsolutePath checks existence, or toRealPath is just toAbsolutePath plus normalize.
  java:
    expect: { compiles: true, stdout: "true false\ndraft.txt", exception: java.nio.file.NoSuchFileException }

- id: D9-NIO-007
  objective: D9.3
  lesson: io-nio2
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 150
  tags: [files, copy, move, createfile, writestring, replace-existing]
  prompt: |
    A directory `dir` contains exactly two regular files, `a.txt` and `b.txt`; `Path a = dir.resolve("a.txt")`
    and `Path b = dir.resolve("b.txt")`. Which statements complete **without throwing an exception**?
    Choose three.
  options:
    - key: a
      text: "`Files.copy(a, b);`"
      why: The target exists and REPLACE_EXISTING was not given, so copy throws FileAlreadyExistsException.
      java:
        source: |
          import java.nio.file.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  Path dir = Files.createTempDirectory("m");
                  Path a = Files.writeString(dir.resolve("a.txt"), "A"), b = Files.writeString(dir.resolve("b.txt"), "B");
                  Files.copy(a, b);
                  System.out.println("ok");
              }
          }
        expect: { compiles: true, exception: java.nio.file.FileAlreadyExistsException }
    - key: b
      text: "`Files.copy(a, b, StandardCopyOption.REPLACE_EXISTING);`"
      correct: true
      why: REPLACE_EXISTING allows the existing target to be overwritten.
      java:
        source: |
          import java.nio.file.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  Path dir = Files.createTempDirectory("m");
                  Path a = Files.writeString(dir.resolve("a.txt"), "A"), b = Files.writeString(dir.resolve("b.txt"), "B");
                  Files.copy(a, b, StandardCopyOption.REPLACE_EXISTING);
                  System.out.println("ok " + Files.readString(b));
              }
          }
        expect: { compiles: true, stdout: "ok A" }
    - key: c
      text: "`Files.move(a, b);`"
      why: move has the same rule as copy — an existing target needs REPLACE_EXISTING.
      java:
        source: |
          import java.nio.file.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  Path dir = Files.createTempDirectory("m");
                  Path a = Files.writeString(dir.resolve("a.txt"), "A"), b = Files.writeString(dir.resolve("b.txt"), "B");
                  Files.move(a, b);
                  System.out.println("ok");
              }
          }
        expect: { compiles: true, exception: java.nio.file.FileAlreadyExistsException }
    - key: d
      text: "`Files.writeString(b, \"x\");`"
      correct: true
      why: With no options, writeString uses CREATE, TRUNCATE_EXISTING and WRITE, so an existing file is overwritten.
      java:
        source: |
          import java.nio.file.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  Path dir = Files.createTempDirectory("m");
                  Path a = Files.writeString(dir.resolve("a.txt"), "A"), b = Files.writeString(dir.resolve("b.txt"), "B");
                  Files.writeString(b, "x");
                  System.out.println("ok " + Files.readString(b));
              }
          }
        expect: { compiles: true, stdout: "ok x" }
    - key: e
      text: "`Files.createFile(b);`"
      why: createFile atomically fails with FileAlreadyExistsException when the file exists.
      java:
        source: |
          import java.nio.file.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  Path dir = Files.createTempDirectory("m");
                  Path a = Files.writeString(dir.resolve("a.txt"), "A"), b = Files.writeString(dir.resolve("b.txt"), "B");
                  Files.createFile(b);
                  System.out.println("ok");
              }
          }
        expect: { compiles: true, exception: java.nio.file.FileAlreadyExistsException }
    - key: f
      text: "`Files.move(a, dir.resolve(\"c.txt\"));`"
      correct: true
      why: The target does not exist, so move succeeds — this is how files are renamed with NIO.2.
      java:
        source: |
          import java.nio.file.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  Path dir = Files.createTempDirectory("m");
                  Path a = Files.writeString(dir.resolve("a.txt"), "A"), b = Files.writeString(dir.resolve("b.txt"), "B");
                  Files.move(a, dir.resolve("c.txt"));
                  System.out.println("ok " + Files.exists(a));
              }
          }
        expect: { compiles: true, stdout: "ok false" }
  explanation: |
    `copy` and `move` refuse to overwrite an existing target unless `StandardCopyOption.REPLACE_EXISTING` is
    passed, and `createFile` always fails if the file exists — all with `FileAlreadyExistsException`. The
    write methods (`writeString`, `write`, `newBufferedWriter`) default to `CREATE`, `TRUNCATE_EXISTING` and
    `WRITE`, so they overwrite silently; `StandardOpenOption.CREATE_NEW` would make them fail too.
  rule: "Files.copy/move throw FileAlreadyExistsException for an existing target unless REPLACE_EXISTING; createFile always fails if the file exists; write methods truncate by default."
  misconception: Files.copy and Files.move overwrite by default, like most command-line tools.

- id: D9-NIO-008
  objective: D9.3
  lesson: io-nio2
  type: multi
  format: concept
  difficulty: intermediate
  estSeconds: 100
  tags: [path, immutability, getroot, torealpath, walk]
  prompt: Which of the following statements about `java.nio.file` are true? Choose three.
  options:
    - key: a
      text: "`Path` objects are immutable; `normalize()` returns a new `Path`."
      correct: true
      why: Like String, every Path operation returns a new object and leaves the receiver unchanged.
    - key: b
      text: "`Path.of(\"x.txt\")` throws `NoSuchFileException` if `x.txt` does not exist."
      why: Creating a Path never touches the file system; only Files methods (and toRealPath) check existence.
    - key: c
      text: For a relative path, `getRoot()` returns `null`.
      correct: true
      why: Only absolute paths have a root component.
    - key: d
      text: "`toRealPath()` requires the file to exist."
      correct: true
      why: It resolves symbolic links against the real file system and throws NoSuchFileException otherwise.
    - key: e
      text: "`Files.walk(dir)` does not include `dir` itself in the stream."
      why: The start path is always the first element of the stream (depth 0).
    - key: f
      text: "`Path.of(\"/a\").resolve(\"/b\")` returns `/a/b`."
      why: If the argument of resolve is absolute, it is returned unchanged — the result is /b.
  explanation: |
    `Path` is an immutable value describing a location; constructing and manipulating it never checks the
    disk (`Path.of`, `normalize`, `resolve`, `relativize`, `getRoot`…). Methods that must consult the file
    system — `toRealPath`, `isSameFile` for non-equal paths, and every `Files` operation — can throw
    `IOException`s. `Files.walk` includes its starting path.
  rule: "Path operations are syntactic and immutable; toRealPath and Files methods access the file system; walk includes its start path."
  misconception: A Path is a handle to an existing file.

- id: D9-NIO-009
  objective: D9.3
  lesson: io-nio2
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [files, mismatch, issamefile]
  prompt: What is the output of the following program?
  code: |
    import java.io.IOException;
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) throws IOException {
            Path dir = Files.createTempDirectory("m");
            Path a = Files.writeString(dir.resolve("a.txt"), "hello");
            Path b = Files.writeString(dir.resolve("b.txt"), "hello world");
            Path c = Files.writeString(dir.resolve("c.txt"), "help");
            System.out.println(Files.mismatch(a, b) + " " + Files.mismatch(a, c) + " " + Files.mismatch(a, a));
            Path alias = dir.resolve("./a.txt");
            System.out.println(Files.isSameFile(a, alias) + " " + Files.isSameFile(a, c) + " " + a.equals(alias));
        }
    }
  options:
    - key: a
      text: |
        5 3 -1
        true false false
      correct: true
      why: a is a prefix of b, so the mismatch is at index 5 (the size of the shorter file); a and c differ at index 3; identical content gives -1. isSameFile checks the file system, so dir/./a.txt is the same file, although the Path objects are not equal.
    - key: b
      text: |
        -1 3 -1
        true false false
      why: A file that is a proper prefix of the other is NOT a match — mismatch returns the size of the smaller file.
    - key: c
      text: |
        5 3 0
        true false false
      why: Files.mismatch returns -1, not 0, when the files are identical; 0 would mean the first byte differs.
    - key: d
      text: |
        5 3 -1
        false false false
      why: For non-equal paths, isSameFile asks the file system whether both locate the same file — they do.
    - key: e
      text: |
        5 3 -1
        true false true
      why: Path.equals compares the paths syntactically, without normalizing; ./a.txt is a different path.
  explanation: |
    `Files.mismatch(p1, p2)` (Java 12) returns the position of the first mismatched byte, `-1` if the files
    are identical, or the size of the smaller file if it is a prefix of the larger. `Files.isSameFile` returns
    `true` for equal paths without I/O; otherwise it checks whether both paths locate the same file (it does
    not compare contents). `Path.equals` is a syntactic comparison.
  rule: "Files.mismatch returns -1 for identical content, else the index of the first differing byte (or the smaller size); isSameFile tests file identity, Path.equals tests path syntax."
  misconception: isSameFile compares paths as strings, or mismatch returns 0 for a match.
  java:
    expect: { compiles: true, stdout: "5 3 -1\ntrue false false" }

- id: D9-NIO-010
  objective: D9.3
  lesson: io-nio2
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 180
  tags: [files, find, walk, maxdepth, bipredicate]
  prompt: What is the output of the following program?
  code: |
    import java.io.IOException;
    import java.nio.file.*;
    import java.util.stream.Stream;

    public class Main {
        public static void main(String[] args) throws IOException {
            Path root = Files.createTempDirectory("f");
            Files.createDirectories(root.resolve("logs/old"));
            Files.writeString(root.resolve("logs/app.log"), "x");
            Files.writeString(root.resolve("logs/old/app.log"), "y");
            Files.writeString(root.resolve("notes.log"), "z");
            long one, two, three;
            try (Stream<Path> s = Files.find(root, 1, (p, attrs) -> p.toString().endsWith(".log"))) {
                one = s.count();
            }
            try (Stream<Path> s = Files.find(root.resolve("logs"), 0, (p, attrs) -> attrs.isDirectory())) {
                two = s.count();
            }
            try (Stream<Path> s = Files.walk(root)) {
                three = s.filter(p -> p.getFileName().toString().equals("app.log")).count();
            }
            System.out.println(one + " " + two + " " + three);
        }
    }
  options:
    - key: a
      text: "`1 1 2`"
      correct: true
      why: "Depth 1 below root reaches notes.log but not logs/app.log (depth 2); maxDepth 0 still visits the start path, which is a directory; the unlimited walk finds both app.log files."
    - key: b
      text: "`2 0 2`"
      why: Depth is measured from the start path (depth 0), so logs/app.log is at depth 2; and maxDepth 0 means "only the start path", not "nothing".
    - key: c
      text: "`1 0 2`"
      why: The start path is part of every walk/find stream, including with maxDepth 0, and logs is a directory.
    - key: d
      text: "`3 1 2`"
      why: maxDepth 1 stops at the direct children of root, so the two app.log files are not visited.
  explanation: |
    `Files.find(start, maxDepth, matcher)` walks like `Files.walk` — the start path is at depth 0, its
    children at depth 1 — and keeps the paths for which the `BiPredicate<Path, BasicFileAttributes>` is
    true. `maxDepth 0` visits only the start path itself. `Files.walk(root)` without a depth explores the whole
    tree.
  rule: "Files.find/walk visit the start path at depth 0 and paths up to maxDepth below it; find's matcher receives the path and its BasicFileAttributes."
  misconception: maxDepth counts the start directory's children as depth 0, so maxDepth 0 returns nothing.
  hint: At what depth is the start directory?
  java:
    expect: { compiles: true, stdout: "1 1 2" }

- id: D9-NIO-011
  objective: D9.3
  lesson: io-nio2
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 75
  tags: [path, paths-get, getfilename, getparent, getroot]
  prompt: What is the output of the following program?
  code: |
    import java.nio.file.*;

    public class Main {
        public static void main(String[] args) {
            Path p = Paths.get("/opt", "tools", "bin/run.sh");
            System.out.println(p.getFileName() + " " + p.getParent() + " " + p.getRoot()
                + " " + p.getNameCount() + " " + p.getName(1));
