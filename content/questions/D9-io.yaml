- id: D9-SER-001
  objective: D9.2
  lesson: io-serialization
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 120
  tags: [serialization, transient, static]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    class Config implements Serializable {
        int retries = 3;
        transient int timeout = 30;
        static String env = "dev";
        transient Integer cacheSize = 64;
    }

    public class Main {
        public static void main(String[] args) throws Exception {
            Config c = new Config();
            c.retries = 5;
            c.timeout = 60;
            Config.env = "test";
            var bytes = new ByteArrayOutputStream();
            try (var out = new ObjectOutputStream(bytes)) { out.writeObject(c); }
            Config.env = "prod";
            try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                Config copy = (Config) in.readObject();
                System.out.println(copy.retries + " " + copy.timeout + " " + Config.env + " " + copy.cacheSize);
            }
        }
    }
  options:
    - key: a
      text: "`5 0 prod null`"
      correct: true
      why: retries is written; the transient fields come back with default values (0 and null); the static field is not part of the object and shows its current value.
    - key: b
      text: "`5 30 prod 64`"
      why: Field initializers of a Serializable class do not run during deserialization, so transient fields are not reset to 30 and 64.
    - key: c
      text: "`5 60 test 64`"
      why: transient fields and static fields are never written to the stream.
    - key: d
      text: "`3 0 prod null`"
      why: The non-transient field retries is serialized with its current value 5, and its initializer is not re-run.
  explanation: |
    Serialization writes the non-`static`, non-`transient` fields of each serializable class. After
    deserialization, `transient` fields hold their type's **default value** — field initializers and
    constructors of serializable classes do not run — and a `static` field simply holds whatever the class
    currently stores.
  rule: "transient and static fields are not serialized; after deserialization transient fields have default values."
  misconception: transient fields are re-initialized with their declared initializer when the object is read.
  java:
    expect: { compiles: true, stdout: "5 0 prod null" }

- id: D9-SER-002
  objective: D9.2
  lesson: io-serialization
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 180
  tags: [serialization, constructor, inheritance, non-serializable-superclass]
  prompt: What is the output of the following program?
  code: |
    import java.io.*;

    class A { int a = 1; A() { System.out.print("A "); } }
    class B extends A implements Serializable { int b = 2; B() { System.out.print("B "); } }
    class C extends B { int c = 3; C() { System.out.print("C "); } }

    public class Main {
        public static void main(String[] args) throws Exception {
            C obj = new C();
            obj.a = 10; obj.b = 20; obj.c = 30;
            System.out.println();
            var bytes = new ByteArrayOutputStream();
            try (var out = new ObjectOutputStream(bytes)) { out.writeObject(obj); }
            try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                C copy = (C) in.readObject();
                System.out.println("| " + copy.a + " " + copy.b + " " + copy.c);
            }
        }
    }
  options:
    - key: a
      text: |
        A B C
        A | 1 20 30
      correct: true
      why: "On reading, only the no-arg constructor of the first NON-serializable superclass (A) runs, so a is re-initialized to 1; b and c are restored from the stream."
    - key: b
      text: |
        A B C
        | 10 20 30
      why: A is not serializable, so its field a is never written, and its no-arg constructor does run during deserialization.
    - key: c
      text: |
        A B C
        A B C | 1 2 3
      why: Constructors and initializers of serializable classes (B and C) are skipped during deserialization.
    - key: d
      text: |
        A B C
        A B | 1 20 30
      why: B is serializable (it implements Serializable), so its constructor does not run; only A, the first non-serializable superclass, is constructed normally.
    - key: e
      text: |
        A B C
        A | 0 20 30
      why: Running A() includes running A's field initializers, so a is 1, not its default 0.
  explanation: |
    Deserialization creates the object by running the no-arg constructor of the **first non-serializable
    superclass** — here `A` — together with its field initializers. For the serializable classes `B` and `C`,
    no constructor, field initializer or instance initializer runs; their fields are read from the stream.
    Fields declared in `A` were never written, so `a` gets the value assigned by `A()`'s initialization: 1.
  rule: "On deserialization, the first non-serializable superclass's no-arg constructor runs; serializable classes' constructors and initializers do not, and their fields come from the stream."
  misconception: No constructor runs at all during deserialization, or all constructors run again.
  hint: Which is the first class up the hierarchy that is NOT Serializable?
  java:
    expect: { compiles: true, stdout: "A B C\nA | 1 20 30" }

