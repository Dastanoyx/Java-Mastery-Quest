  - key: a
    text: '`A1=20`'
    correct: true
    why: '`import module shop;` imports the public top-level types of every package that `shop` exports *to `app`* — the unqualified `shop.api` and the qualified `shop.spi` — but not `shop.internal`.'
  - key: b
    text: 'Compilation fails: `Pricer` cannot be found, because module imports only cover unqualified exports'
