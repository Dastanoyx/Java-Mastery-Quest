# D7 — Packaging and Deploying Java Code (D7.1 modules, services & module imports; D7.2 compile, package, run)
# Module-mode checks (`modules: true`) are compiled with javac --module-source-path on JDK 25 and run with
# java -p out -m <mainModule>. For those questions, `code` shows exactly the files listed in `java.files`
# (one `// file:` header per file) — keep both in sync when editing.

- id: D7-MOD-001
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: compile-error
  difficulty: foundation
  estSeconds: 75
  tags:
  - module-info
  - exports
  - accessibility
  prompt: The two modules below are compiled together with `javac -d out --module-source-path src ...` and launched with `java -p out -m shop/shop.Main`. What is the result?
  code: |
    // file: inventory/module-info.java
    module inventory {
        exports inventory.api;
    }

    // file: inventory/inventory/api/Stock.java
    package inventory.api;

    public class Stock {
        public static int count(String sku) { return inventory.impl.Db.lookup(sku); }
    }

    // file: inventory/inventory/impl/Db.java
    package inventory.impl;

    public class Db {
        public static int lookup(String sku) { return sku.length(); }
    }

    // file: shop/module-info.java
    module shop {
        requires inventory;
    }

    // file: shop/shop/Main.java
    package shop;

    import inventory.api.Stock;
    import inventory.impl.Db;

    public class Main {
        public static void main(String[] args) {
            System.out.println(Stock.count("ab") + Db.lookup("abc"));
        }
    }
  options:
  - key: a
    text: '`5`'
    why: This is what happens on the class path, where `public` means visible everywhere. In a module, a public type is only accessible to other modules if its package is exported.
  - key: b
    text: Compilation fails because package `inventory.impl` is not exported by `inventory`
    correct: true
    why: '`Db` is public, but `inventory` exports only `inventory.api`, so the package `inventory.impl` is not visible to `shop` — javac rejects the import.'
  - key: c
    text: It compiles, but an `IllegalAccessError` is thrown when `Db.lookup` is called
    why: Module boundaries are enforced by the compiler as well as the JVM; the compiler sees the module-info files and stops before any code runs.
  - key: d
    text: Compilation fails because `shop` must also declare `requires inventory.impl;`
    why: '`requires` names a module, never a package. No `requires` directive can reach a package that its module does not export.'
  explanation: |
    In a named module, a type is accessible to code in another module only if three things hold: the type
    is `public`, its package is **exported** (to everyone or to that module), and the using module
    **reads** the declaring module. `shop` reads `inventory` and `Stock` is in an exported package, but
    `inventory.impl` is not exported, so javac reports *package inventory.impl is not visible* at the
    import. Code inside `inventory` (like `Stock.count`) can still use `Db` freely.
  rule: Accessibility across modules = public type + package exported to the reading module + readability (requires). A non-exported package is invisible to other modules at compile time and at run time.
  misconception: '`public` still means accessible from everywhere once a class is in a module.'
  hint: Look at which packages `inventory` exports.
  examEligible: true
  java:
    modules: true
    files:
    - name: inventory/module-info.java
      content: |
        module inventory {
            exports inventory.api;
        }
    - name: inventory/inventory/api/Stock.java
      content: |
        package inventory.api;

        public class Stock {
            public static int count(String sku) { return inventory.impl.Db.lookup(sku); }
        }
    - name: inventory/inventory/impl/Db.java
      content: |
        package inventory.impl;

        public class Db {
            public static int lookup(String sku) { return sku.length(); }
        }
    - name: shop/module-info.java
      content: |
        module shop {
            requires inventory;
        }
    - name: shop/shop/Main.java
      content: |
        package shop;

        import inventory.api.Stock;
        import inventory.impl.Db;

        public class Main {
            public static void main(String[] args) {
                System.out.println(Stock.count("ab") + Db.lookup("abc"));
            }
        }
    expect:
      compiles: false
      errorContains: is not visible

- id: D7-MOD-002
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags:
  - requires-transitive
  - implied-readability
  - qualified-exports
  prompt: The three modules are compiled with `--module-source-path` and launched with `java -p out -m app/app.Main`. What is the output?
  code: |
    // file: core/module-info.java
    module core {
        exports core.model;
        exports core.internal to service;
    }

    // file: core/core/model/Money.java
    package core.model;

    public record Money(long cents) { }

    // file: core/core/internal/Rates.java
    package core.internal;

    public class Rates {
        public static long fee() { return 25; }
    }

    // file: service/module-info.java
    module service {
        requires transitive core;
        exports service;
    }

    // file: service/service/Billing.java
    package service;

    import core.internal.Rates;
    import core.model.Money;

    public class Billing {
        public static Money charge(long cents) { return new Money(cents + Rates.fee()); }
    }

    // file: app/module-info.java
    module app {
        requires service;
    }

    // file: app/app/Main.java
    package app;

    import core.model.Money;
    import service.Billing;

    public class Main {
        public static void main(String[] args) {
            Money m = Billing.charge(100);
            System.out.println(m.cents());
        }
    }
  options:
  - key: a
    text: '`125`'
    correct: true
    why: '`requires transitive core` in `service` gives every module that reads `service` implied readability of `core`, so `app` may name `Money`; `Billing` (in `service`) may use the qualified export `core.internal`.'
  - key: b
    text: Compilation fails because `app` does not declare `requires core;`
    why: That would be true with a plain `requires core` in `service`. `requires transitive` makes `app` read `core` implicitly.
  - key: c
    text: Compilation fails because `core.internal` is exported only to `service`, yet `app` calls code that uses it
    why: Access is checked where a type is *named*. Only `Billing` (in module `service`) names `Rates`, and the qualified export allows exactly that.
  - key: d
    text: It compiles, but an `IllegalAccessError` is thrown because `app` reaches `core.internal` indirectly
    why: Calling a public method of an exported class is fine even if that method internally uses packages you cannot access; there is no transitive access check at run time.
  explanation: |
    `requires transitive core` declares an **implied readability** edge: any module that reads `service`
    also reads `core`. So `app` can import and use `core.model.Money` without its own `requires core`.
    The qualified export `exports core.internal to service` lets code in `service` use `Rates`; `app` never
    names `Rates`, so the restriction does not affect it. Use `requires transitive` whenever a type of the
    required module appears in your own exported API (here `Money` is the return type of `Billing.charge`).
  rule: If module B declares `requires transitive A`, every module that reads B also reads A (implied readability). `exports p to M` makes p accessible only to the named modules.
  misconception: Every module must explicitly `requires` each module whose types it names, even when they come through another module's API.
  hint: What does `transitive` add to the readability graph of modules that read `service`?
  examEligible: true
  java:
    modules: true
    mainModule: app/app.Main
    files:
    - name: core/module-info.java
      content: |
        module core {
            exports core.model;
            exports core.internal to service;
        }
    - name: core/core/model/Money.java
      content: |
        package core.model;

        public record Money(long cents) { }
    - name: core/core/internal/Rates.java
      content: |
        package core.internal;

        public class Rates {
            public static long fee() { return 25; }
        }
    - name: service/module-info.java
      content: |
        module service {
            requires transitive core;
            exports service;
        }
    - name: service/service/Billing.java
      content: |
        package service;

        import core.internal.Rates;
        import core.model.Money;

        public class Billing {
            public static Money charge(long cents) { return new Money(cents + Rates.fee()); }
        }
    - name: app/module-info.java
      content: |
        module app {
            requires service;
        }
    - name: app/app/Main.java
      content: |
        package app;

        import core.model.Money;
        import service.Billing;

        public class Main {
            public static void main(String[] args) {
                Money m = Billing.charge(100);
                System.out.println(m.cents());
            }
        }
    expect:
      compiles: true
      stdout: '125'

- id: D7-MOD-003
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags:
  - requires
  - readability
  - var
  - accessibility
  prompt: This time `service` uses a plain `requires core;`. The modules are compiled together and launched with `java -p out -m app/app.Main`. What is the output?
  code: |
    // file: core/module-info.java
    module core {
        exports core.model;
        exports core.internal to service;
    }

    // file: core/core/model/Money.java
    package core.model;

    public record Money(long cents) { }

    // file: core/core/internal/Rates.java
    package core.internal;

    public class Rates {
        public static long fee() { return 25; }
    }

    // file: service/module-info.java
    module service {
        requires core;
        exports service;
    }

    // file: service/service/Billing.java
    package service;

    import core.internal.Rates;
    import core.model.Money;

    public class Billing {
        public static Money charge(long cents) { return new Money(cents + Rates.fee()); }
    }

    // file: app/module-info.java
    module app {
        requires service;
    }

    // file: app/app/Main.java
    package app;

    import service.Billing;

    public class Main {
        public static void main(String[] args) {
            var m = Billing.charge(100);
            System.out.println(m);
        }
    }
  options:
  - key: a
    text: '`Money[cents=125]`'
    correct: true
    why: '`app` never *names* a type from `core`: `var` infers `Money` without a type name in the source, and `println(Object)` only uses `Object.toString()`. Readability is only needed to name types or access their members.'
  - key: b
    text: Compilation fails at `var m = ...` because `app` does not read `core`
    why: '`var` does not name the type in source code, and readability restricts what you can *refer to*, not which objects you may hold. A declaration `Money m = ...` would fail.'
  - key: c
    text: Compilation fails at `System.out.println(m)` because `Money.toString()` is not accessible from `app`
    why: '`m` is passed to `println(Object)`, and the call resolves `toString()` on `Object` dynamically. Only invoking a `Money` member directly, such as `m.cents()`, needs access to `core.model`.'
  - key: d
    text: It compiles, but `IllegalAccessError` is thrown at run time
    why: The JVM checks access when code links to a class or member it names; `app`'s bytecode only references `Billing` and `Object`/`PrintStream` members.
  explanation: |
    Readability and accessibility govern which types and members code can **refer to**. Here `app` refers to
    `service.Billing` (readable, exported) and to `PrintStream.println(Object)`; the inferred type of `var m`
    is `Money`, but no source in `app` names it. Had `app` written `Money m = ...` or `m.cents()`, javac would
    report that `core.model` is not accessible because `app` does not read `core`. This is exactly why an API
    that exposes `Money` should say `requires transitive core` — javac's `-Xlint:exports` warns about it.
  rule: Readability (requires) is needed to name a type or access its members; holding a reference whose static type comes from an unread module, without naming it, is allowed.
  misconception: Any use of an object whose class lives in an unread module is a compile error.
  hint: Which types does the source of `app` actually name?
  examEligible: true
  java:
    modules: true
    mainModule: app/app.Main
    files:
    - name: core/module-info.java
      content: |
        module core {
            exports core.model;
            exports core.internal to service;
        }
    - name: core/core/model/Money.java
      content: |
        package core.model;

        public record Money(long cents) { }
    - name: core/core/internal/Rates.java
      content: |
        package core.internal;

        public class Rates {
            public static long fee() { return 25; }
        }
    - name: service/module-info.java
      content: |
        module service {
            requires core;
            exports service;
        }
    - name: service/service/Billing.java
      content: |
        package service;

        import core.internal.Rates;
        import core.model.Money;

        public class Billing {
            public static Money charge(long cents) { return new Money(cents + Rates.fee()); }
        }
    - name: app/module-info.java
      content: |
        module app {
            requires service;
        }
    - name: app/app/Main.java
      content: |
        package app;

        import service.Billing;

        public class Main {
            public static void main(String[] args) {
                var m = Billing.charge(100);
                System.out.println(m);
            }
        }
    expect:
      compiles: true
      stdout: Money[cents=125]

