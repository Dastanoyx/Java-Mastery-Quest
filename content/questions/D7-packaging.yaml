  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags:
  - import-module
  - JEP-511
  - qualified-exports
  - named-module
  prompt: The modules are compiled together with `javac --module-source-path` on Java 25 and launched with `java -p out -m app/app.Main`. What is the result?
  code: |
