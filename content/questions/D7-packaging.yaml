          package core.internal;

          public class Rates {
              public static long fee() { return 25; }
          }
      - name: app/module-info.java
        content: |
          module app {
              requires core;
          }
      - name: app/app/Main.java
        content: |
          package app;

          import core.internal.Rates;

          public class Main {
              public static void main(String[] args) {
                  System.out.println(Rates.fee());
              }
          }
      expect:
        compiles: false
        errorContains: is not visible
  - key: e
    text: '`import core.internal.*;` — then uses `Rates`'
    why: 'An on-demand import does not bypass module encapsulation: javac reports that the package is not visible to `app`.'
    java:
      modules: true
      files:
      - name: core/module-info.java
        content: |
          module core {
              exports core.model;
              exports core.internal to service;
          }
      - name: core/core/model/Money.java
        content: |
          package core.model;

          public record Money(long cents) { }
      - name: core/core/internal/Rates.java
        content: |
          package core.internal;

          public class Rates {
              public static long fee() { return 25; }
          }
      - name: app/module-info.java
        content: |
          module app {
              requires core;
          }
      - name: app/app/Main.java
        content: |
          package app;

          import core.internal.*;

          public class Main {
              public static void main(String[] args) {
                  System.out.println(Rates.fee());
              }
          }
      expect:
        compiles: false
        errorContains: is not visible
  explanation: |
    `exports core.model;` is an unqualified export: every module that reads `core` can access its public
    types, whichever import form it uses — single-type, on-demand, or Java 25's `import module core;`.
    `exports core.internal to service;` is a **qualified export**: only `service` gets access, so for `app`
    the package is simply not visible and both import forms fail. A qualified export naming a module that
    does not exist only produces a warning.
  rule: '`exports p;` exposes p''s public types to all modules that read the module; `exports p to M1, M2;` exposes them only to the listed modules.'
  misconception: Importing with a wildcard (or a module import) reaches packages that a single-type import cannot.
  hint: To which modules is `core.internal` exported?
  examEligible: true

- id: D7-MOD-005
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: concept
  difficulty: foundation
  estSeconds: 60
  tags:
  - opens
  - reflection
  - module-info
  prompt: An ORM framework in module `orm` must read and write **private** fields of the entity classes in package `com.shop.entity` (module `com.shop`) with `setAccessible(true)`. No module — not even `orm` — should be able to compile against that package. Which single directive in `com.shop`'s module declaration grants exactly this?
  options:
  - key: a
    text: '`exports com.shop.entity to orm;`'
    why: A qualified export grants compile-time and run-time access to *public* members only; `setAccessible(true)` on a private field would still throw `InaccessibleObjectException`, and `orm` could compile against the package.
  - key: b
    text: '`opens com.shop.entity to orm;`'
    correct: true
    why: '`opens` grants run-time deep reflection (all members, including private) without granting compile-time access, and `to orm` restricts it to that module.'
  - key: c
    text: '`opens com.shop.entity;`'
    why: This allows deep reflection, but by every module — more than required.
  - key: d
    text: '`requires orm;`'
    why: '`requires` makes `com.shop` read `orm`; it grants `orm` nothing at all in `com.shop`.'
  explanation: |
    `exports` is about **compile-time and run-time access to public types and their public/protected
    members**. `opens` is about **run-time reflective access to all members**, including private ones, via
    `setAccessible` — and it does not make the package visible to the compiler. The qualified forms
    (`exports ... to`, `opens ... to`) restrict the grant to named modules. `open module` opens every package
    to every module at run time.
  rule: '`opens p [to M...]` allows deep reflection on p at run time only; `exports p [to M...]` allows compile-time and run-time access to public members of p.'
  misconception: Exporting a package is enough for frameworks to reflect on its private fields.
  examEligible: true

- id: D7-MOD-006
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 120
  tags:
  - reflection
  - setAccessible
  - InaccessibleObjectException
  - exports
  prompt: The modules are compiled together and launched with `java -p out -m app/app.Main`. What is the result?
  code: |
    // file: model/module-info.java
    module model {
        exports model;
    }

    // file: model/model/User.java
    package model;

    public class User {
        private String name = "ana";
        public String getName() { return name; }
    }

    // file: app/module-info.java
    module app {
        requires model;
    }

    // file: app/app/Main.java
    package app;

    import java.lang.reflect.Field;
    import model.User;

    public class Main {
        public static void main(String[] args) throws Exception {
            User u = new User();
            System.out.println(User.class.getMethod("getName").invoke(u));
            Field f = User.class.getDeclaredField("name");
            System.out.println("found " + f.getName());
            f.setAccessible(true);
            f.set(u, "bob");
            System.out.println(u.getName());
        }
    }
  options:
  - key: a
    text: It prints `ana`, `found name` and `bob`
    why: That is the class-path behaviour. In a named module that is only exported, `setAccessible(true)` on a private member is refused.
  - key: b
    text: It prints `ana` and `found name`, then throws `InaccessibleObjectException`
    correct: true
    why: Exporting gives reflective access to public members (so `getMethod(...).invoke` works) and lookup of declared members still works, but suppressing access checks on a private field requires the package to be opened to `app`.
  - key: c
    text: It prints `ana`, then throws `NoSuchFieldException`
    why: '`getDeclaredField` finds private fields regardless of modules; only *using* them is restricted.'
  - key: d
    text: Compilation fails because `Main` refers to the private field `name`
    why: The field is named only inside a string; the compiler does not check reflective lookups.
  explanation: |
    Reflection obeys module encapsulation. Because `model` **exports** `model`, `app` can reflectively call the
    public `getName()`, and `getDeclaredField("name")` still returns the `Field` object. But
    `setAccessible(true)` on a private member succeeds only if the package is **open** to the caller's module
    (`opens model;`, `opens model to app;` or `open module model`). Otherwise it throws
    `java.lang.reflect.InaccessibleObjectException` (an unchecked exception, since Java 9);
    `trySetAccessible()` would return `false` instead.
  rule: AccessibleObject.setAccessible(true) on a member of a type in another named module requires that the package be open to the caller's module; otherwise InaccessibleObjectException is thrown.
  misconception: '`setAccessible(true)` always works for code that has permission to load the class.'
