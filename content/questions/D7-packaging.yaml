    For `provides S with C;` javac checks the provider: `C` must be in the same module, and either declare a
    `public static` no-arg `provider()` method returning `S` (or a subtype), or be a subtype of `S` with a
    **public** no-arg constructor. Here the constructor has package access, so javac reports *the no arguments
    constructor of the service implementation is not public* on the module declaration. On the class path
    (META-INF/services), the same mistake would only surface at run time as a `ServiceConfigurationError`.
  rule: A provider named in `provides ... with` must be in the same module and have a public static no-arg provider() method or a public no-arg constructor (and then implement the service).
  misconception: Provider validation happens only when ServiceLoader instantiates the provider.
  hint: javac checks `provides` directives when it compiles module-info.java.
  examEligible: true
  java:
    modules: true
    files:
    - name: api/module-info.java
      content: |
        module api {
            exports api;
        }
    - name: api/api/Greeter.java
      content: |
        package api;

        public interface Greeter {
            String greet(String name);
        }
    - name: impl/module-info.java
      content: |
        module impl {
            requires api;
            provides api.Greeter with impl.Polite;
        }
    - name: impl/impl/Polite.java
      content: |
        package impl;

        import api.Greeter;

        public class Polite implements Greeter {
            Polite() { }
            public String greet(String name) { return "Hello " + name; }
        }
    - name: app/module-info.java
      content: |
        module app {
            requires api;
            uses api.Greeter;
        }
    - name: app/app/Main.java
      content: |
        package app;

        import api.Greeter;
        import java.util.ServiceLoader;

        public class Main {
            public static void main(String[] args) {
                System.out.println("loading");
                for (Greeter g : ServiceLoader.load(Greeter.class)) {
                    System.out.println(g.greet("ana"));
                }
            }
        }
    expect:
      compiles: false
      errorContains: is not public

- id: D7-MOD-012
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: runtime-exception
  difficulty: expert
  estSeconds: 150
  tags:
  - requires-static
  - module-resolution
  - NoClassDefFoundError
  prompt: Both modules are compiled into `out` and the application is launched with `java -p out -m app/app.Main` (no other options). What is the result?
  code: |
    // file: lib/module-info.java
    module lib {
        exports lib;
    }

    // file: lib/lib/Tool.java
    package lib;

    public class Tool {
        public static String hi() { return "tool"; }
    }

    // file: app/module-info.java
    module app {
        requires static lib;
    }

    // file: app/app/Main.java
    package app;

    public class Main {
        public static void main(String[] args) {
            System.out.println("start");
            System.out.println(lib.Tool.hi());
        }
    }
  options:
  - key: a
    text: It prints `start` and `tool`
    why: '`lib` is on the module path, but a `requires static` dependency is not resolved at run time unless something else requires it or it is added with `--add-modules lib`.'
  - key: b
    text: It prints `start`, then throws `NoClassDefFoundError`
    correct: true
    why: '`requires static` is mandatory at compile time but optional at run time. `lib` is not resolved into the boot layer, so linking `lib.Tool` fails when that line executes.'
  - key: c
    text: 'Compilation fails: `requires static` may only be used for annotation processors'
    why: '`requires static` is legal for any module; it is typically used for optional integrations and compile-time-only annotations.'
  - key: d
    text: The launcher fails with `FindException` before `start` is printed
    why: A missing *static* dependency never stops start-up; that is the whole point of the modifier.
  explanation: |
    `requires static M` means *M is required at compile time, but optional at run time*. During resolution
    the module system does not follow `requires static` edges, so `lib` is not part of the boot layer even
    though it sits in `out`. The program starts, prints `start`, and fails with
    `java.lang.NoClassDefFoundError: lib/Tool` when it first touches `Tool`. Launching with
    `--add-modules lib` (or having another resolved module require `lib`) makes it print `tool`. Code using an
    optional dependency should therefore check for it first, for example with
    `ModuleLayer.boot().findModule("lib").isPresent()`.
  rule: '`requires static` = required at compile time, optional at run time: the module is read if it is resolved, but resolution does not pull it in.'
  misconception: '`requires static` only changes compile-time behaviour; at run time it acts like a normal `requires` whenever the module is on the module path.'
  hint: Which modules end up in the boot layer when only `app` is the root?
  examEligible: true
  java:
    modules: true
    mainModule: app/app.Main
    files:
    - name: lib/module-info.java
      content: |
        module lib {
            exports lib;
        }
    - name: lib/lib/Tool.java
      content: |
        package lib;

        public class Tool {
            public static String hi() { return "tool"; }
        }
    - name: app/module-info.java
      content: |
        module app {
            requires static lib;
        }
    - name: app/app/Main.java
      content: |
        package app;

        public class Main {
            public static void main(String[] args) {
                System.out.println("start");
                System.out.println(lib.Tool.hi());
            }
        }
    expect:
      compiles: true
      stdout: start
      exception: java.lang.NoClassDefFoundError

- id: D7-MOD-013
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: compile-error
  difficulty: intermediate
  estSeconds: 90
  tags:
  - split-package
  - readability
  prompt: The three modules are compiled together with `javac --module-source-path`. What is the result?
  code: |
    // file: alpha/module-info.java
    module alpha {
        exports util;
    }

    // file: alpha/util/A.java
    package util;

    public class A { }

    // file: beta/module-info.java
    module beta {
        exports util;
    }

    // file: beta/util/B.java
    package util;

    public class B { }

    // file: app/module-info.java
    module app {
        requires alpha;
        requires beta;
    }

    // file: app/app/Main.java
    package app;

    public class Main {
        public static void main(String[] args) {
            System.out.println(new util.A().getClass().getModule().getName());
        }
    }
  options:
  - key: a
    text: It compiles and prints `alpha`
    why: Each class exists only once, but the *package* `util` exists in two modules — a split package.
  - key: b
    text: 'Compilation fails: module `app` reads package `util` from both `alpha` and `beta`'
    correct: true
    why: A module may not read the same package from two different modules; javac reports this on `app`'s module declaration.
  - key: c
    text: It compiles, but the boot layer fails at start-up because of a split package
    why: The conflict is already detected at compile time because `app` reads both modules.
  - key: d
    text: It compiles; `util` resolves to the module named in the first `requires`
    why: The order of `requires` directives has no meaning; there is no "first wins" rule.
  explanation: |
    A package must come from exactly one module in the view of any module that reads it. Here `alpha` and
    `beta` both export `util`, so `app` would read `util` from two modules — a **split package**. javac reports
    *module app reads package util from both alpha and beta*. Even when no module reads both, two modules in
    the same layer (same class loader) that contain the same package fail at start-up. The fix is to merge
    the package into one module or rename one of the packages.
  rule: A module must not read two modules that export the same package, and two modules in the same layer must not contain the same package.
  misconception: Split packages are fine as long as the class names inside them are different.
  hint: Look at package names, not class names.
  examEligible: true
  java:
    modules: true
    files:
    - name: alpha/module-info.java
      content: |
        module alpha {
            exports util;
        }
    - name: alpha/util/A.java
      content: |
        package util;

        public class A { }
    - name: beta/module-info.java
      content: |
        module beta {
            exports util;
        }
    - name: beta/util/B.java
      content: |
        package util;

        public class B { }
    - name: app/module-info.java
      content: |
        module app {
            requires alpha;
            requires beta;
        }
    - name: app/app/Main.java
      content: |
        package app;

        public class Main {
            public static void main(String[] args) {
                System.out.println(new util.A().getClass().getModule().getName());
            }
        }
    expect:
      compiles: false
      errorContains: reads package util from both

- id: D7-MOD-014
  objective: D7.1
  lesson: pkg-modules-services
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags:
  - module-info
  - directives
  - cyclic-dependence
  prompt: Module `lib` contains one package, `lib`, with a public class `X`. Which declarations of `lib` compile (with `javac --module-source-path`, together with any other module shown in the option)? Choose two.
  options:
  - key: a
    text: '`module lib { requires java.base; exports lib; }`'
    correct: true
    why: Every module implicitly requires `java.base`; writing it explicitly is allowed (and redundant).
    java:
      modules: true
      files:
      - name: lib/module-info.java
        content: |
          module lib { requires java.base; exports lib; }
      - name: lib/lib/X.java
        content: |
          package lib;

          public class X { }
      expect:
        compiles: true
  - key: b
    text: '`module lib { exports lib; exports lib to reporting; }`'
    why: A package may appear in only one `exports` directive; javac reports *duplicate or conflicting exports*.
    java:
      modules: true
      files:
      - name: lib/module-info.java
        content: |
          module lib { exports lib; exports lib to reporting; }
      - name: lib/lib/X.java
        content: |
          package lib;

          public class X { }
      expect:
        compiles: false
        errorContains: duplicate or conflicting exports
  - key: c
    text: '`module lib { exports lib to reporting; }` — and no module `reporting` exists'
    correct: true
    why: A qualified export to an unknown module is only a warning (*module not found*), so that a library can name optional friends.
    java:
      modules: true
      files:
      - name: lib/module-info.java
        content: |
          module lib { exports lib to reporting; }
      - name: lib/lib/X.java
        content: |
          package lib;

          public class X { }
      expect:
        compiles: true
  - key: d
    text: '`module lib { exports lib; uses java.sql.Driver; }`'
    why: 'The service type in `uses` must be accessible: `lib` does not read `java.sql`, so the package `java.sql` is not visible. Adding `requires java.sql;` fixes it.'
    java:
      modules: true
      files:
      - name: lib/module-info.java
        content: |
          module lib { exports lib; uses java.sql.Driver; }
      - name: lib/lib/X.java
        content: |
          package lib;

          public class X { }
      expect:
        compiles: false
        errorContains: is not visible
  - key: e
    text: '`module lib { requires util; exports lib; }` with `module util { requires lib; }`'
    why: Module dependencies must form an acyclic graph at compile time; javac reports *cyclic dependence involving lib/util*.
    java:
      modules: true
      files:
      - name: lib/module-info.java
        content: |
          module lib { requires util; exports lib; }
      - name: lib/lib/X.java
        content: |
          package lib;

          public class X { }
      - name: util/module-info.java
        content: |
          module util { requires lib; }
      - name: util/util/U.java
        content: |
          package util;

          public class U { }
      expect:
        compiles: false
        errorContains: cyclic dependence
  explanation: |
    `java.base` is required implicitly by every module, and an explicit `requires java.base;` is legal. Each
    package can be the subject of at most one `exports` (and at most one `opens`) directive, so mixing an
    unqualified and a qualified export of the same package is a conflict. Qualified exports and opens may
    name modules that are not observable — javac only warns. Types named in `uses` and `provides` follow the
    normal accessibility rules, and the `requires` graph must not contain cycles.
  rule: 'Module declarations: at most one exports/opens per package; requires must not form cycles; uses/provides types must be accessible; java.base is always read.'
  misconception: A module may only be named in `exports ... to` if it exists at compile time.
  hint: 'Test each declaration against: duplicates, readability of named types, and cycles.'
  examEligible: true

- id: D7-MOD-015
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: compile-error
  difficulty: intermediate
  estSeconds: 90
  tags:
  - import-module
  - JEP-511
  - ambiguity
  prompt: What is the result of compiling and running this program on Java 25?
  code: |
    import module java.base;
    import module java.sql;

    public class Main {
        public static void main(String[] args) {
            Date d = new Date(0L);
            System.out.println(d.getTime());
        }
    }
  options:
  - key: a
    text: '`0`'
    why: Both `java.util.Date` (from `java.base`) and `java.sql.Date` (from `java.sql`) are imported by the module imports, so the simple name is ambiguous.
  - key: b
    text: Compilation fails at line 6 because the reference to `Date` is ambiguous
    correct: true
    why: Two module imports bring in `java.util.Date` and `java.sql.Date`; neither shadows the other, so using the simple name is an error.
  - key: c
    text: Compilation fails at line 2 because two imported modules export types with the same simple name
    why: Overlapping module imports are legal; the ambiguity is only an error where the simple name is actually used.
  - key: d
    text: '`0`, because `java.base` is imported first and wins'
    why: Import order never matters in Java; there is no first-wins rule.
  explanation: |
    `import module M;` (final in Java 25, JEP 511) imports, on demand, all public top-level types of the
    packages that `M` exports, plus those of the modules `M` reads through `requires transitive`. Both
    modules here supply a `Date`, and module imports have the same priority as each other, so the reference
    on line 6 is ambiguous. The fix is a **single-type import** such as `import java.sql.Date;`, which shadows
    every on-demand and module import of that name.
  rule: Types imported by two module import declarations with the same simple name are ambiguous when used; a single-type import of one of them resolves the ambiguity (JEP 511).
  misconception: Imports are processed in order and the first matching type wins.
  hint: Which `Date` classes are exported by `java.base` and by `java.sql`?
  examEligible: true
  java:
    expect:
      compiles: false
      errorContains: reference to Date is ambiguous
      errorLine: 6

- id: D7-MOD-016
  objective: D7.1
  lesson: pkg-modules-services
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 180
  tags:
  - import-module
  - JEP-511
  - shadowing
  - requires-transitive
  prompt: Each option shows the import declarations of an ordinary `Main.java` (class `Main` in the unnamed module) followed by a statement in `main`. Which programs compile on Java 25? Choose three.
  options:
  - key: a
    text: '`import module java.base; import module java.sql; import java.sql.Date;` — `Date d = new Date(0L);`'
    correct: true
    why: The single-type import shadows the `Date` types brought in by both module imports.
    java:
      source: |
        import module java.base;
        import module java.sql;
        import java.sql.Date;

        public class Main {
            public static void main(String[] args) {
                Date d = new Date(0L);
                System.out.println(d.getClass().getName());
            }
        }
      expect:
        compiles: true
        stdout: java.sql.Date
  - key: b
    text: '`import module java.desktop; import java.util.*;` — `List<String> l = List.of("x");`'
    correct: true
    why: '`java.desktop` exports `java.awt.List`, but a type-import-on-demand (`java.util.*`) shadows module imports, so `List` means `java.util.List`.'
    java:
      source: |
        import module java.desktop;
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> l = List.of("x");
                System.out.println(l.size());
            }
        }
      expect:
        compiles: true
        stdout: '1'
  - key: c
    text: '`import module java.sql;` — `List<String> l = List.of();`'
    why: '`java.sql` does not require `java.base` transitively (no module does, except `java.se`), so `import module java.sql;` does not import `java.util.List`.'
    java:
      source: |
        import module java.sql;

        public class Main {
            public static void main(String[] args) {
                List<String> l = List.of();
            }
        }
      expect:
        compiles: false
        errorContains: cannot find symbol
  - key: d
    text: '`import module java.sql;` — `Logger log = Logger.getLogger("app");`'
    correct: true
    why: '`java.sql` declares `requires transitive java.logging`, so its module import also imports the packages of `java.logging`, including `java.util.logging.Logger`.'
    java:
      source: |
        import module java.sql;

        public class Main {
            public static void main(String[] args) {
                Logger log = Logger.getLogger("app");
                System.out.println(log.getName());
            }
        }
      expect:
        compiles: true
        stdout: app
  - key: e
    text: '`import module java.base; import module java.desktop;` — `List<String> l = new ArrayList<>();`'
    why: '`java.util.List` and `java.awt.List` are both imported by module imports of equal rank, so `List` is ambiguous.'
    java:
      source: |
        import module java.base;
        import module java.desktop;

        public class Main {
            public static void main(String[] args) {
                List<String> l = new ArrayList<>();
            }
        }
      expect:
        compiles: false
        errorContains: reference to List is ambiguous
  explanation: |
    Name lookup for imported types has a strict priority: a **single-type import** shadows a
    **type-import-on-demand** (`p.*`), which shadows a **module import** (`import module M`). Two imports at
    the same level that supply the same simple name make that name ambiguous where it is used. A module
    import covers the packages exported by `M` and by every module `M` requires *transitively* — `java.sql`
    re-exports `java.logging`, `java.xml` and `java.transaction.xa`, but not `java.base`.
  rule: 'JEP 511: single-type imports shadow on-demand imports, which shadow module imports; `import module M` also covers modules that M requires transitively.'
  misconception: '`import module java.sql;` brings in the whole JDK API that `java.sql` depends on, including `java.util`.'
  hint: Rank the three kinds of imports, then check what `java.sql` requires transitively.
  examEligible: true

