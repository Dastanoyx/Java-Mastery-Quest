- id: D7-PKG-001
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 75
  tags:
  - compact-source-file
  - instance-main
  - JEP-512
  - IO
  prompt: The file `Hello.java` contains exactly the code below and is launched with `java Hello.java` on Java 25. What is the output?
  code: |
    String greeting = "Hi";
    int count;

    void main() {
        count++;
        List<String> names = List.of("ana", "bo");
        for (String n : names) {
            IO.println(greeting + " " + n + " " + count);
        }
        IO.println(getClass().getName());
    }
  options:
  - key: a
    text: |-
      Hi ana 1
      Hi bo 1
      Hello
    correct: true
    why: The file declares an implicit class named `Hello` (after the file); its fields are instance fields of the object the launcher creates before calling the instance `main()`.
  - key: b
    text: Compilation fails because `List` is not imported
    why: Every compact source file implicitly imports `module java.base`, which includes `java.util.List`.
  - key: c
    text: Compilation fails because `main` uses the instance field `count` without an object
    why: '`main()` is an instance method; the launcher instantiates the implicit class and calls `main()` on it.'
  - key: d
    text: |-
      Hi ana 1
      Hi bo 1
      Main
    why: The implicitly declared class is named after the source file, not `Main`.
  explanation: |
    A **compact source file** (final in Java 25, JEP 512) has methods and fields outside any class
    declaration. The compiler wraps them in an **implicitly declared class**: final, in the unnamed package,
    extending `Object`, named after the file (`Hello`). The file implicitly has `import module java.base;`, so
    `List` needs no import, and `java.lang.IO` (a `java.lang` class) provides `println`. Because `main()` is an
    instance method, the launcher creates an instance and then calls it.
  rule: 'JEP 512: a compact source file declares an implicit final top-level class named after the file, implicitly imports module java.base, and may use an instance main method.'
  misconception: Code outside a class is a script with only static members, and imports still have to be written by hand.
  examEligible: true
  java:
    fileName: Hello.java
    expect:
      compiles: true
      stdout: |-
        Hi ana 1
        Hi bo 1
        Hello

- id: D7-PKG-002
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: compile-error
  difficulty: intermediate
  estSeconds: 75
  tags:
  - compact-source-file
  - IO
  - JEP-512
  prompt: The file `Greet.java` contains exactly the code below. What happens with `java Greet.java` on Java 25?
  code: |
    void main() {
        String name = "Duke";
        println("Hello, " + name);
    }
  options:
  - key: a
    text: It prints `Hello, Duke`
    why: Preview versions of this feature imported `println` statically; the final Java 25 design does not. You must write `IO.println(...)`.
  - key: b
    text: Compilation fails at line 3
    correct: true
    why: No method `println(String)` exists in the implicit class or its imports; `IO`'s methods are *not* statically imported into compact source files.
  - key: c
    text: Compilation fails at line 1 because `main` must be `public static`
    why: Since Java 25, `main` may be an instance method with no parameters and any non-private access.
  - key: d
    text: It compiles, but the launcher reports that no `main(String[])` method exists
    why: A no-arg `void main()` is a valid entry point under the Java 25 launch protocol.
  explanation: |
    In Java 25 a compact source file implicitly imports **module `java.base`** — and nothing else. The console
    helper class is `java.lang.IO` (automatically visible like every `java.lang` type), but its static methods
    are not imported, so you write `IO.println(...)`, `IO.print(...)` or `IO.readln(...)`. Earlier previews
    (JDK 21–24) imported them statically, so older tutorials show a bare `println`. Adding
    `import static java.lang.IO.*;` would also make the bare call compile.
  rule: 'JEP 512 (final in 25): compact source files implicitly import module java.base only; static members of java.lang.IO must be qualified (IO.println) or imported explicitly.'
  misconception: '`println` can be called unqualified in a compact source file.'
  examEligible: true
  java:
    fileName: Greet.java
    expect:
      compiles: false
      errorContains: cannot find symbol
      errorLine: 3

- id: D7-PKG-003
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 120
  tags:
  - launch-protocol
  - instance-main
  - JEP-512
  - inheritance
  prompt: '`Main.java` is compiled and launched with `java Main` on Java 25. What is the output?'
  code: |
    class Launcher {
        public static void main(String[] args) {
            System.out.println("Launcher.main(String[])");
        }
    }

    public class Main extends Launcher {
        void main() {
            System.out.println("Main.main()");
        }
    }
  options:
  - key: a
    text: '`Main.main()`'
    why: The launch protocol does not prefer methods declared in the launched class; it prefers a `main` with a `String[]` parameter, and inherited methods count.
  - key: b
    text: '`Launcher.main(String[])`'
    correct: true
    why: The launcher first looks for a non-private `main(String[])` that the class declares **or inherits**; `Main` inherits one from `Launcher`, so `main()` is never considered.
  - key: c
    text: Compilation fails because `Main` declares `main()` while inheriting `main(String[])`
    why: The two methods have different signatures — an overload, not an override conflict.
  - key: d
    text: The launcher reports that the main method is ambiguous
    why: The protocol has a fixed order (String[] first), so there is never an ambiguity between these forms.
  explanation: |
    Java 25's launch protocol (JEP 512) picks the entry point in a fixed order: if the class declares or
    **inherits** a non-private `main(String[])`, that method is used; only otherwise is a non-private `main()`
    with no parameters chosen. If the chosen method is static it is invoked directly; if it is an instance
    method, the launcher first creates an object through a non-private no-arg constructor. Here the inherited
    `public static void main(String[])` wins over the class's own `main()`.
  rule: 'Launch protocol (JEP 512): choose a non-private main(String[]) declared or inherited; otherwise a non-private main(); static → invoke, instance → instantiate via a non-private no-arg constructor first.'
  misconception: The main method declared in the launched class always wins over an inherited one.
  hint: Which parameter list does the launch protocol look for first?
  examEligible: true
  java:
    expect:
      compiles: true
      stdout: Launcher.main(String[])

- id: D7-PKG-004
  objective: D7.2
  lesson: pkg-compile-package-run
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags:
  - launch-protocol
  - instance-main
  - JEP-512
  prompt: Each option is the complete content of `Main.java`, compiled and launched with `java Main` on Java 25. Which ones print `run`? Choose three.
  options:
  - key: a
    text: '`public class Main { void main() { System.out.println("run"); } }`'
    correct: true
    why: An instance `main()` with package access is a valid entry point; the launcher uses the implicit public no-arg constructor.
    java:
      source: |
        public class Main { void main() { System.out.println("run"); } }
      expect:
        compiles: true
        stdout: run
  - key: b
    text: '`public class Main { private Main() { } void main() { System.out.println("run"); } }`'
    why: An instance `main` needs a non-private no-arg constructor; the launcher fails with *no non-private zero argument constructor found*.
    java:
      source: |
        public class Main { private Main() { } void main() { System.out.println("run"); } }
      expect: &id001
        compiles: true
        stdout: ''
        exitCode: 1
  - key: c
    text: '`public class Main { static void main() { System.out.println("run"); } }`'
    correct: true
    why: A static no-arg `main()` is valid; no instance is created.
    java:
      source: |
        public class Main { static void main() { System.out.println("run"); } }
      expect:
        compiles: true
        stdout: run
  - key: d
    text: '`public class Main { private static void main(String[] args) { System.out.println("run"); } }`'
    why: Private `main` methods are never candidates, and there is no other `main`, so the launcher reports *Main method not found*.
    java:
      source: |
        public class Main { private static void main(String[] args) { System.out.println("run"); } }
      expect: *id001
  - key: e
    text: '`public class Main { protected void main(String[] args) { System.out.println("run"); } }`'
    correct: true
    why: Any non-private access works since Java 25, and an instance `main(String[])` is allowed.
    java:
      source: |
        public class Main { protected void main(String[] args) { System.out.println("run"); } }
      expect:
        compiles: true
        stdout: run
  explanation: |
    Since Java 25 (JEP 512) a launchable `main` may be static or instance, may take `String[]` or nothing, and
    may have any access except `private`. For an instance `main` the launcher must create the object, so the
    class needs a **non-private no-arg constructor**; otherwise launching fails with an error (exit code 1),
    even though the class compiles. A `private` main is ignored, as if it did not exist.
  rule: 'Java 25 entry points: [static] void main(String[]) or [static] void main(), any non-private access; instance main requires a non-private zero-argument constructor.'
  misconception: Only `public static void main(String[])` can start a program, or conversely every method named main works.
  hint: Check access of the method and, for instance methods, the constructor.
  examEligible: true

- id: D7-PKG-005
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags:
  - IO
  - readln
  - compact-source-file
  - JEP-512
  prompt: '`Ask.java` is launched with `java Ask.java`, and the user types `Ana` ⏎ then `42` ⏎. Ignoring the echo of the typed input, what does the program write to standard output?'
  code: |
    void main() {
        String name = IO.readln("Name: ");
        int age = Integer.parseInt(IO.readln());
        IO.print("[" + name + "]");
        IO.println(age + 1);
    }
  options:
  - key: a
    text: '`Name: [Ana]43`'
    correct: true
    why: '`readln(prompt)` prints the prompt without a line break, then reads a line; `print` adds no newline; `age + 1` is integer addition.'
  - key: b
    text: '`[Ana]43`'
    why: '`IO.readln(String prompt)` writes the prompt to standard output before reading.'
  - key: c
    text: '`Name: [Ana]421`'
    why: '`age` is an `int`, and `age + 1` is evaluated before being passed to `println`, so it is 43, not string concatenation.'
  - key: d
    text: Compilation fails because `IO.readln` throws the checked `IOException`
    why: '`IO` methods throw only unchecked exceptions (`IOError` on I/O failure), so no `throws` clause is needed.'
  explanation: |
    `java.lang.IO` (final in Java 25, JEP 512) offers `print(Object)`, `println(Object)`, `println()`,
    `readln()` and `readln(String prompt)`. `readln(prompt)` writes the prompt, flushes, and returns the next
    line without its terminator (or `null` at end of input). In Java 25 these methods use `System.out` and
    `System.in`. None of them declares a checked exception, which is why they are convenient in small
    programs.
  rule: 'java.lang.IO: print/println write to System.out; readln(prompt) prints the prompt (no newline) and reads one line; no checked exceptions.'
  misconception: '`readln(prompt)` only uses the prompt as a label and prints nothing, or prints it with a newline.'
  examEligible: true
  java:
    fileName: Ask.java
    stdin: |
      Ana
      42
    expect:
      compiles: true
      stdout: 'Name: [Ana]43'

- id: D7-PKG-006
  objective: D7.2
  lesson: pkg-compile-package-run
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags:
  - compact-source-file
  - JEP-512
  - import-module
  prompt: Each option is the complete content of a compact source file `Tool.java`, launched with `java Tool.java` on Java 25. Which ones compile? Choose two.
  options:
  - key: a
    text: '`record Point(int x, int y) { }` and `void main() { IO.println(new Point(1, 2)); }`'
    correct: true
    why: Classes, records, interfaces and enums declared in a compact source file become **member** types of the implicit class.
    java:
      fileName: Tool.java
      source: |
        record Point(int x, int y) { }

        void main() { IO.println(new Point(1, 2)); }
      expect:
        compiles: true
        stdout: Point[x=1, y=2]
  - key: b
    text: '`package tools;` and `void main() { }`'
    why: The implicit class is always in the unnamed package; a compact source file may not have a package declaration.
    java:
      fileName: Tool.java
      source: |
        package tools;

        void main() { }
      expect:
        compiles: false
        errorContains: should not have package declaration
  - key: c
    text: '`Tool() { }` and `void main() { }`'
    why: The implicit class cannot declare constructors (it has no name you can write); `Tool() { }` is parsed as a method without a return type.
    java:
      fileName: Tool.java
      source: |
        Tool() { }

        void main() { }
      expect:
        compiles: false
        errorContains: return type required
  - key: d
    text: '`static int calls;` and `static void main() { calls++; IO.println(calls); }`'
    correct: true
    why: Static fields and a static `main()` are allowed; the members are simply members of the implicit class.
    java:
      fileName: Tool.java
      source: |
        static int calls;

        static void main() { calls++; IO.println(calls); }
      expect:
        compiles: true
        stdout: '1'
  - key: e
    text: '`import module java.desktop;` and `void main() { List<String> l = List.of(); }`'
    why: The implicit `import module java.base;` and the explicit `import module java.desktop;` both supply a `List` (`java.util.List`, `java.awt.List`), so the name is ambiguous.
    java:
      fileName: Tool.java
      source: |
        import module java.desktop;

        void main() { List<String> l = List.of(); }
      expect:
        compiles: false
        errorContains: reference to List is ambiguous
  explanation: |
    A compact source file can contain imports, fields, methods and nested type declarations; everything
    becomes a member of the implicitly declared class, which is final, extends `Object`, lives in the unnamed
    package and cannot be referenced by name from other code. Therefore no `package` declaration and no
    constructor are possible, and the file must declare a launchable `main` method. The implicit
    `import module java.base;` behaves like a written one, so an extra module import can create ambiguities —
    fix them with a single-type import such as `import java.util.List;`.
  rule: 'Compact source file: no package declaration, no constructors, must contain a main method; members (incl. nested types) belong to the implicit class; implicit `import module java.base;`.'
  misconception: A compact source file is a free-form script where any statement or declaration is allowed.
  hint: What can an implicitly declared class *not* have, given that it has no name in the source?
  examEligible: true

- id: D7-PKG-007
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: concept
  difficulty: foundation
  estSeconds: 60
  tags:
  - automatic-module
  - module-path
  - migration
  prompt: '`acme-report-tools-3.2.1.jar` has no `module-info.class` and its manifest has no `Automatic-Module-Name` attribute. It is placed on the **module path**. What is its module name?'
  options:
  - key: a
    text: '`acme.report.tools`'
    correct: true
    why: The version suffix `-3.2.1` is dropped, every non-alphanumeric character becomes a dot, and repeated/leading/trailing dots are removed.
  - key: b
    text: '`acme-report-tools`'
    why: A hyphen is not legal in a module name; the derivation replaces it with a dot.
  - key: c
    text: '`acme.report.tools.3.2.1`'
    why: The trailing version is recognised (hyphen followed by a digit) and removed before the name is derived.
  - key: d
    text: 'It has no name: a JAR without `module-info` is part of the unnamed module'
    why: That is only true on the class path. On the module path, a plain JAR becomes an automatic module.
  explanation: |
    A non-modular JAR on the module path becomes an **automatic module**. Its name comes from the
    `Automatic-Module-Name` manifest attribute if present; otherwise it is derived from the file name: drop
    `.jar`, drop a version suffix that starts with a hyphen followed by a digit, replace every
    non-alphanumeric character with a dot, collapse repeated dots and trim leading/trailing dots. If the
    result is not a legal module name (for example a part is a keyword or starts with a digit), the JAR
    cannot be used as an automatic module.
  rule: Automatic module name = Automatic-Module-Name manifest attribute, else derived from the JAR file name (strip .jar and -version, non-alphanumerics → dots).
  misconception: A JAR without module-info is always in the unnamed module, wherever it is placed.
  examEligible: true

- id: D7-PKG-008
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: concept
  difficulty: intermediate
  estSeconds: 90
  tags:
  - automatic-module
  - unnamed-module
  - named-module
  - readability
  prompt: 'An application has three kinds of code: named module `com.app` (with `module-info`), `legacy.jar` on the **module path** without `module-info`, and `old.jar` on the **class path**. Which statement is true?'
  options:
  - key: a
    text: '`com.app` can declare `requires legacy;` and use every package in `legacy.jar`, while `legacy` can use classes in `old.jar`'
    correct: true
    why: An automatic module exports (and opens) all of its packages and reads every other module, including the unnamed module that holds the class path.
  - key: b
    text: '`com.app` can use classes from `old.jar` by declaring `requires unnamed;`'
    why: The unnamed module has no name, so no named module can require it; named modules cannot see the class path at all.
  - key: c
    text: '`legacy` exports only the packages listed in its manifest''s `Export-Package` header'
    why: '`Export-Package` is an OSGi convention, not part of the JPMS: an automatic module exports every package.'
  - key: d
    text: Code in `old.jar` can use only the packages that `com.app` exports to `legacy`
    why: The unnamed module reads every module and can use all packages they export (to everyone); there is no special rule tied to `legacy`.
  explanation: |
    Three kinds of modules exist. **Named (explicit)** modules have a `module-info` and see only what they
    `require`. **Automatic** modules are plain JARs on the module path: they get a name, export and open every
    package, read every other module, and are the bridge that lets named modules depend on not-yet-modular
    libraries. The **unnamed module** holds everything on the class path: it reads all modules and exports
    all its packages, but because it has no name, named modules cannot require it — only automatic modules
    can reach the class path.
  rule: 'Automatic modules: export/open all packages, read all modules (incl. the unnamed one). Unnamed module: reads all modules, cannot be required by named modules.'
  misconception: Named modules can reach class-path code directly, or automatic modules are as encapsulated as named ones.
  hint: Which kind of module is allowed to read the unnamed module?
  examEligible: true

- id: D7-PKG-009
  objective: D7.2
  lesson: pkg-compile-package-run
  type: multi
  format: concept
  difficulty: advanced
  estSeconds: 150
  tags:
  - jlink
  - jdeps
  - runtime-image
  - services
  prompt: The directory `mods` holds modular JARs `com.app` (declares `uses com.spi.Codec`), `com.spi`, and `com.codec.png` (declares `provides com.spi.Codec with ...`; nobody requires it). Which statements are true? Choose three.
  options:
  - key: a
    text: '`jlink --module-path mods --add-modules com.app --output img` creates an image without `com.codec.png`; you must add it with `--add-modules` (or use `--bind-services`)'
    correct: true
    why: jlink resolves only the `requires` graph of the root modules; unlike the `java` launcher, it does not bind service providers by default.
  - key: b
    text: If `com.app` required an automatic module, jlink would refuse to link it
    correct: true
    why: 'jlink only links explicit modules: it reports *automatic module cannot be used with jlink*. Convert the library to a named module first.'
  - key: c
    text: '`jdeps --jdk-internals` reports class files that use internal JDK APIs and suggests replacements where known'
    correct: true
    why: That is exactly its purpose, typically run before migrating to a newer JDK.
  - key: d
    text: The image produced by jlink contains every JDK module, so that any application can run on it
    why: 'The point of jlink is a minimal runtime: only the resolved modules (here `java.base` and the app modules) are linked.'
  - key: e
    text: '`jdeps --list-deps app.jar` adds a `module-info.class` describing the dependencies to `app.jar`'
    why: jdeps only analyses and reports; `--generate-module-info` writes source files into a directory, and nothing modifies the JAR.
  explanation: |
    `jlink` builds a custom runtime image from the root modules (`--add-modules`) and the modules they
    transitively `require`, found on `--module-path` (JDK modules are found automatically). It needs explicit
    modules — automatic modules are rejected — and it does not add service providers unless asked
    (`--add-modules` or `--bind-services`). `--launcher name=module/mainclass` adds a script under `bin/`.
    `jdeps` is a static analyser: `--list-deps` / `--print-module-deps` list the JDK modules needed (ideal
    input for jlink), `-s` summarises dependencies, and `--jdk-internals` finds uses of internal APIs.
  rule: 'jlink: --module-path, --add-modules, --output, --launcher; links explicit modules only and no service providers unless added. jdeps: --list-deps, --jdk-internals, -s, --generate-module-info.'
  misconception: jlink resolves modules the same way `java` does at start-up, including service binding.
  examEligible: true

- id: D7-PKG-010
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: concept
  difficulty: intermediate
  estSeconds: 90
  tags:
  - jar
  - manifest
  - class-path
  - java-launcher
  prompt: '`dist/app.jar` contains a manifest with `Main-Class: com.acme.Cli` and `Class-Path: lib/json.jar lib/log.jar`. From the project root you run `java -cp extra.jar -jar dist/app.jar`. Which statement is true?'
  options:
  - key: a
    text: The class path is `dist/app.jar`, `dist/lib/json.jar` and `dist/lib/log.jar`; `extra.jar` is ignored
    correct: true
    why: With `-jar`, the JAR itself is the whole user class path and `-cp` is ignored; `Class-Path` entries are relative URLs resolved against the JAR's own location.
  - key: b
    text: The class path is `extra.jar`, `dist/app.jar`, `lib/json.jar` and `lib/log.jar`
    why: '`-cp` is ignored when `-jar` is used, and `Class-Path` entries are not relative to the current directory.'
  - key: c
    text: The launcher fails because `-cp` and `-jar` cannot be combined
    why: The combination is accepted; the `-cp` value is silently ignored.
  - key: d
    text: '`com.acme.Cli` is ignored unless the main class is also passed on the command line'
    why: '`Main-Class` is exactly how `java -jar` finds the entry point; you do not pass a class name.'
  explanation: |
    `jar --create --file app.jar --main-class com.acme.Cli -C classes .` (short form `jar cfe app.jar
    com.acme.Cli -C classes .`) writes `Main-Class` into `META-INF/MANIFEST.MF`; a custom manifest is added
    with `--manifest`/`m`, and its last line must end with a newline. `java -jar app.jar` uses the JAR as the
    **only** class-path source plus its `Class-Path` header — space-separated relative URLs resolved against
    the JAR's directory. Any `-cp`/`CLASSPATH` setting is ignored.
  rule: '`java -jar x.jar`: main class from Main-Class, class path = x.jar + its Class-Path entries (relative to the JAR); -cp and CLASSPATH are ignored.'
  misconception: '`-cp` entries are appended to the class path of an executable JAR, and Class-Path is relative to the working directory.'
  examEligible: true

- id: D7-PKG-011
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: concept
  difficulty: advanced
  estSeconds: 120
  tags:
  - source-launcher
  - multi-file
  - JEP-458
  prompt: |-
    A directory contains three files:

    - `Prog.java`: `class Prog { public static void main(String[] a) { System.out.println(Helper.hi()); } }`
    - `Helper.java`: `class Helper { static String hi() { return "hi"; } }`
    - `Broken.java`: `class Broken { int x = ; }` (a syntax error; no other file uses `Broken`)

    What happens with `java Prog.java` on Java 25 (no `javac` was run before)?
  options:
  - key: a
    text: It prints `hi`, and no `.class` files are written to the directory
    correct: true
    why: Since Java 22 (JEP 458) the source launcher compiles other source files in the directory tree on demand, in memory; `Broken.java` is never needed, so it is never compiled.
  - key: b
    text: It fails because `Broken.java` does not compile
    why: Files are compiled only when a class they declare is first needed; an unused broken file is never compiled.
  - key: c
    text: 'It fails because `Helper` cannot be found: source-file mode compiles only the launched file'
    why: That was the rule in Java 11–21. Since Java 22 the launcher finds `Helper.java` next to `Prog.java`.
  - key: d
    text: It prints `hi` and leaves `Prog.class` and `Helper.class` in the directory
    why: Source-file mode compiles into memory; nothing is written to disk.
  explanation: |
    `java File.java` runs in **source-file mode**: the launched file is compiled in memory and its first
    top-level class is run. Since Java 22 (JEP 458, *multi-file source-code programs*) classes that the
    program references are looked up as `.java` files in the directory tree rooted at the launched file's
    directory (packages map to subdirectories) and compiled **on demand**. Unused files are never compiled,
    and no class files are written. Libraries in JARs are added with `--class-path`/`-cp` as usual.
  rule: 'Source-file mode (JEP 330, extended by JEP 458 in Java 22): compiles in memory; other source files are compiled lazily when first referenced; no .class files are written.'
  misconception: '`java Prog.java` is a shortcut for compiling every file in the folder with javac.'
  examEligible: true

- id: D7-PKG-012
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: concept
  difficulty: foundation
  estSeconds: 75
  tags:
  - javac
  - java-launcher
  - module-path
  - module-source-path
  prompt: Sources are laid out as `src/com.app/module-info.java`, `src/com.app/com/app/Main.java` and `src/com.util/...` (module `com.app` requires `com.util`). Which pair of commands compiles both modules and runs `com.app.Main` as a module?
  options:
  - key: a
    text: '`javac -d out --module-source-path src -m com.app` then `java -p out -m com.app/com.app.Main`'
    correct: true
    why: '`--module-source-path` lets javac find and compile `com.app` and the modules it requires into `out/<module>`; `-p` (`--module-path`) and `-m module/class` launch it as a module.'
  - key: b
    text: '`javac -d out --module-source-path src -m com.app` then `java -cp out com.app.Main`'
    why: '`out` contains one directory per module (`out/com.app/...`), so `com.app.Main` is not found on that class path — and even if it were, it would run in the unnamed module.'
  - key: c
    text: '`javac -d out -p src src/com.app/com/app/Main.java` then `java -p out com.app.Main`'
    why: '`-p` expects compiled modules, not a source tree; and `java -p out com.app.Main` without `-m` treats `com.app.Main` as a class-path main class.'
  - key: d
    text: '`javac -d out --module-source-path src -m com.app` then `java -m com.app.Main -p out`'
    why: '`-m` needs `module/mainclass` (or a module with a recorded main class), and everything after `-m ...` is passed to the program as arguments, so `-p out` comes too late.'
  explanation: |
    For several modules, `javac --module-source-path src -m mod1,mod2 -d out` compiles in *multi-module mode*
    and writes `out/<module-name>/...`. Precompiled dependencies go on `--module-path`/`-p`. To run, put
    modules on the module path and name the main module and class: `java -p out -m com.app/com.app.Main`
    (or just `-m com.app` if `jar --main-class` recorded a main class in the modular JAR). Options for the JVM
    must come before `-m`; anything after the main class is program arguments.
  rule: 'Compile: javac -d out --module-source-path src -m M (or -p for precompiled modules). Run: java -p path -m module[/mainclass] [args].'
  misconception: The module path and class path are interchangeable, or launcher options may follow the main module.
  examEligible: true

- id: D7-PKG-013
  objective: D7.2
  lesson: pkg-compile-package-run
  type: single
  format: concept
  difficulty: intermediate
  estSeconds: 120
  tags:
  - migration
  - top-down
  - bottom-up
  - automatic-module
  prompt: '`app.jar` depends on `biz.jar`, which depends on `util.jar` and on a third-party `json.jar` that you cannot change. You want to give `app.jar` a `module-info` **first**, while the other JARs stay unchanged for now. Which approach works?'
  options:
  - key: a
    text: 'Top-down: move all four JARs to the module path; the three plain JARs become automatic modules, and `app`''s module-info `requires` them by their automatic names'
    correct: true
    why: Automatic modules are what let a named module depend on code that is not modularised yet; top-down migration starts at the top of the graph.
  - key: b
    text: 'Bottom-up: keep `biz.jar`, `util.jar` and `json.jar` on the class path and modularise `app` first'
    why: A named module cannot read the class path (the unnamed module), so `app` could not see `biz`. Bottom-up migration starts with the *lowest* JARs instead.
  - key: c
    text: Keep the three JARs on the class path and add `requires ALL-UNNAMED;` to `app`'s module-info
    why: '`ALL-UNNAMED` is a value for command-line options such as `--add-reads`/`--add-opens`, not a module name you can `require`.'
  - key: d
    text: 'It is impossible: every dependency must be converted to a named module before `app` can have a module-info'
    why: Automatic modules exist precisely so that migration need not wait for third-party libraries.
  explanation: |
    **Bottom-up** migration modularises the leaves first (`util`, then `biz`, then `app`): a converted JAR goes
    to the module path as a named module while the not-yet-converted code stays on the class path, where the
    unnamed module can read everything. **Top-down** migration puts every JAR on the module path at once so
    unmodified JARs become automatic modules, then converts from the top (`app`) downward; it is the usual
    choice when third-party libraries are not modular. Either way, a named module can never depend on the
    class path directly.
  rule: 'Bottom-up: modularise dependencies first (unconverted code stays on the class path). Top-down: everything on the module path, plain JARs become automatic modules, convert from the top.'
  misconception: A named module can depend on class-path JARs as long as the classes are present at run time.
  examEligible: true
