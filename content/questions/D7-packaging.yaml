- id: D7-MOD-008
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags:
  - opens
  - reflection
  - Class.forName
  prompt: Module `model` opens its package but does not export it. The modules are compiled together and launched with `java -p out -m app/app.Main`. What is the result?
  code: |
    // file: model/module-info.java
    module model {
        opens model;
    }

    // file: model/model/User.java
    package model;

    public class User {
        private String name = "ana";
        public String getName() { return name; }
    }

    // file: app/module-info.java
    module app {
        requires model;
    }

    // file: app/app/Main.java
    package app;

    public class Main {
        public static void main(String[] args) throws Exception {
            Class<?> type = Class.forName("model.User");
            Object u = type.getConstructor().newInstance();
            var f = type.getDeclaredField("name");
            f.setAccessible(true);
            f.set(u, "bob");
            System.out.println(type.getMethod("getName").invoke(u));
        }
    }
  options:
  - key: a
    text: '`bob`'
    correct: true
    why: '`app` never names `model.User` in source, so compilation succeeds; at run time an opened package grants reflective access to all its members — public constructor, private field and public method alike.'
  - key: b
    text: Compilation fails because package `model` is not exported
    why: The compiler only checks types that the source names; `"model.User"` is just a string.
  - key: c
    text: '`IllegalAccessException` is thrown by `newInstance()` because the package is not exported'
    why: That is what happens when the package is neither exported nor open. `opens` grants run-time reflective access to public members too, not only to private ones.
  - key: d
    text: '`InaccessibleObjectException` is thrown by `setAccessible(true)`'
    why: Deep reflection is exactly what `opens model;` allows — for every module, since the directive is unqualified.
  explanation: |
    `opens` is a purely **run-time** grant: the package stays invisible to the compiler, but all of its types
    and members — public and private — are reflectively accessible to the modules it is opened to. Because
    `Main` only loads the class by name, nothing in its source needs compile-time access. Without the
    `opens` (and without `exports`), `Class.forName` would still load the class, but
    `getConstructor().newInstance()` would throw `IllegalAccessException` because the package is neither
    exported nor open to `app`.
  rule: An opened package is accessible to reflection at run time (all members, with setAccessible for non-public ones) but is not accessible at compile time unless it is also exported.
  misconception: '`opens` only matters for private members; public members of a non-exported package stay inaccessible to reflection.'
  hint: Does `Main` name any type from package `model` in its source code?
  examEligible: true
  java:
    modules: true
    mainModule: app/app.Main
    files:
    - name: model/module-info.java
      content: |
        module model {
            opens model;
        }
    - name: model/model/User.java
      content: |
        package model;

        public class User {
            private String name = "ana";
            public String getName() { return name; }
        }
    - name: app/module-info.java
      content: |
        module app {
            requires model;
        }
    - name: app/app/Main.java
      content: |
        package app;

        public class Main {
            public static void main(String[] args) throws Exception {
                Class<?> type = Class.forName("model.User");
                Object u = type.getConstructor().newInstance();
                var f = type.getDeclaredField("name");
                f.setAccessible(true);
                f.set(u, "bob");
                System.out.println(type.getMethod("getName").invoke(u));
            }
        }
    expect:
      compiles: true
      stdout: bob

- id: D7-MOD-009
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 180
  tags:
  - services
  - ServiceLoader
  - provides
  - provider-method
  prompt: The three modules are compiled together and launched with `java -p out -m app/app.Main`. Note that `app` does not require `impl`, and `impl` exports nothing. What is the output?
  code: |
    // file: api/module-info.java
    module api {
        exports api;
    }

    // file: api/api/Greeter.java
    package api;

    public interface Greeter {
        String greet(String name);
    }

    // file: impl/module-info.java
    module impl {
        requires api;
        provides api.Greeter with impl.Polite, impl.Loud;
    }

    // file: impl/impl/Polite.java
    package impl;

    import api.Greeter;

    public class Polite implements Greeter {
        public String greet(String name) { return "Hello " + name; }
    }

    // file: impl/impl/Loud.java
    package impl;

    import api.Greeter;

    public class Loud {
        private Loud() { }
        public static Greeter provider() {
            return name -> "HEY " + name.toUpperCase();
        }
    }

    // file: app/module-info.java
    module app {
        requires api;
        uses api.Greeter;
    }

    // file: app/app/Main.java
    package app;

    import api.Greeter;
    import java.util.ServiceLoader;

    public class Main {
        public static void main(String[] args) {
            ServiceLoader.load(Greeter.class).stream()
                .map(p -> p.get().greet("ana"))
                .sorted()
                .forEach(System.out::println);
        }
    }
  options:
  - key: a
    text: |-
      HEY ANA
      Hello ana
    correct: true
    why: 'Both providers are found: `Polite` through its public no-arg constructor, `Loud` through its public static `provider()` method. Sorting puts `"HEY ANA"` first because `''E''` sorts before `''e''`.'
  - key: b
    text: '`Hello ana`'
    why: '`Loud` does not need to implement `Greeter`: when a provider class declares a public static no-arg `provider()` method, that method''s return value is the service instance.'
  - key: c
    text: A `ServiceConfigurationError` is thrown because `Loud`'s constructor is private
    why: The constructor is ignored when a `provider()` method exists, so its access does not matter.
  - key: d
    text: Nothing is printed, because `app` does not require `impl`
    why: 'Service binding: when `app` declares `uses api.Greeter`, module resolution adds every observable module that `provides` the service to the module graph, without any `requires`.'
  - key: e
    text: Compilation fails because `impl` does not export package `impl`
    why: Provider classes do not have to be in exported packages; `ServiceLoader` instantiates them on the consumer's behalf.
  explanation: |
    A service consumer declares `uses S`; a provider module declares `provides S with C1, C2`. At start-up the
    module system **binds** providers: modules that provide a used service are resolved even though nobody
    `requires` them, and their packages need not be exported. For each provider class `ServiceLoader` first
    looks for a `public static` no-arg method named `provider()` (whose return type must be the service type
    or a subtype); only if there is none does it require the class to implement `S` and have a public
    no-arg constructor. `stream()` yields lazy `ServiceLoader.Provider` objects; `get()` instantiates.
  rule: 'ServiceLoader in named modules: a provider is obtained from a public static no-arg provider() method if declared, otherwise from a public no-arg constructor of a class that implements the service.'
  misconception: A provider class must implement the service interface, have a public constructor, and live in an exported package.
  hint: How does ServiceLoader obtain an instance from a class that declares `public static ... provider()`?
  examEligible: true
  java:
    modules: true
    mainModule: app/app.Main
    files:
    - name: api/module-info.java
      content: |
        module api {
            exports api;
        }
    - name: api/api/Greeter.java
      content: |
        package api;

        public interface Greeter {
            String greet(String name);
        }
    - name: impl/module-info.java
      content: |
        module impl {
            requires api;
            provides api.Greeter with impl.Polite, impl.Loud;
        }
    - name: impl/impl/Polite.java
      content: |
        package impl;

        import api.Greeter;

        public class Polite implements Greeter {
            public String greet(String name) { return "Hello " + name; }
        }
    - name: impl/impl/Loud.java
      content: |
        package impl;

        import api.Greeter;

        public class Loud {
            private Loud() { }
            public static Greeter provider() {
                return name -> "HEY " + name.toUpperCase();
            }
        }
    - name: app/module-info.java
      content: |
        module app {
            requires api;
            uses api.Greeter;
        }
    - name: app/app/Main.java
      content: |
        package app;

        import api.Greeter;
        import java.util.ServiceLoader;

        public class Main {
            public static void main(String[] args) {
                ServiceLoader.load(Greeter.class).stream()
                    .map(p -> p.get().greet("ana"))
                    .sorted()
                    .forEach(System.out::println);
            }
        }
    expect:
      compiles: true
      stdout: |-
        HEY ANA
        Hello ana

- id: D7-MOD-010
  objective: D7.1
  lesson: pkg-modules-services
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 120
  tags:
  - services
  - uses
  - ServiceConfigurationError
  prompt: The modules are compiled together and launched with `java -p out -m app/app.Main` plus `--add-modules impl`. What is the result?
  code: |
    // file: api/module-info.java
    module api {
        exports api;
    }

    // file: api/api/Greeter.java
    package api;

    public interface Greeter {
        String greet(String name);
    }

    // file: impl/module-info.java
    module impl {
        requires api;
        provides api.Greeter with impl.Polite;
    }

    // file: impl/impl/Polite.java
    package impl;

    import api.Greeter;

    public class Polite implements Greeter {
        public String greet(String name) { return "Hello " + name; }
    }

    // file: app/module-info.java
    module app {
        requires api;
    }

    // file: app/app/Main.java
    package app;

    import api.Greeter;
    import java.util.ServiceLoader;

    public class Main {
        public static void main(String[] args) {
            System.out.println("loading");
            for (Greeter g : ServiceLoader.load(Greeter.class)) {
                System.out.println(g.greet("ana"));
            }
        }
    }
  options:
  - key: a
    text: It prints `loading` and `Hello ana`
    why: The provider is present, but a named module may only load a service it declares with `uses`.
  - key: b
    text: It prints `loading`, then `ServiceLoader.load` throws `ServiceConfigurationError`
    correct: true
    why: '`ServiceLoader.load` checks that the caller''s module declares `uses api.Greeter`; `app` does not, so it fails with *module app does not declare `uses`*.'
  - key: c
    text: Compilation fails because `app` lacks `uses api.Greeter;`
    why: javac does not check calls to `ServiceLoader.load`; the check happens at run time.
  - key: d
    text: It prints only `loading`, because without `uses` no provider is bound
    why: 'Missing `uses` is not silently ignored: `ServiceLoader` throws an error instead of returning an empty loader.'
  explanation: |
    In a named module, `ServiceLoader.load(S.class)` requires the caller's module to declare `uses S`; otherwise
    it throws `java.util.ServiceConfigurationError` (an `Error`, not an `Exception`). The `uses` directive is
    also what drives service binding during resolution. javac does not cross-check `uses` against code that
    calls `ServiceLoader`, so this mistake shows up only at run time. Code in the unnamed module (class path)
    needs no `uses`.
  rule: A named module that calls ServiceLoader.load(S) must declare `uses S;`, otherwise ServiceConfigurationError is thrown at run time.
  misconception: '`uses` is documentation only; ServiceLoader finds providers anyway.'
  hint: What does ServiceLoader check about the module that calls `load`?
