    module exports **to the current module** — so qualified exports to `app` are included and non-exported
    packages are not. In a named module the declaration also requires readability: `app` must read `shop`
    (here via `requires shop`); otherwise javac reports *module app does not read: shop*. Module import
    declarations are final in Java 25 (JEP 511) and usable in any compilation unit.
  rule: '`import module M;` imports all public top-level types of packages exported by M to the current module (plus those of modules M requires transitively); the current module must read M.'
  misconception: Module imports ignore qualified exports, or are only for scripts and compact source files.
