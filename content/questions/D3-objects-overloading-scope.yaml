- id: D3-OVL-001
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: does-it-compile
  difficulty: foundation
  estSeconds: 60
  tags: [overloading, signature, return-type]
  prompt: What is the result of compiling this class?
  code: |
    public class Main {
        static int  parse(String s) { return Integer.parseInt(s); }
        static long parse(String text) { return Long.parseLong(text); }
        public static void main(String[] args) {
            System.out.println(parse("7"));
        }
    }
  options:
    - key: a
      text: Prints `7`
      why: The code does not compile; two methods may not share the same name and parameter types.
    - key: b
      text: "Compilation fails at line 3: method parse(String) is already defined"
      correct: true
      why: The signature is the name plus parameter types. Return types and parameter names are not part of it, so these are duplicates.
    - key: c
      text: Compilation fails at line 5 because the call is ambiguous
      why: The declaration itself is already illegal; javac reports the duplicate method, not an ambiguous call.
    - key: d
      text: Prints `7` using the `long` version because it is declared last
      why: Declaration order never matters for overload resolution, and these are not overloads at all.
  explanation: |
    A method's **signature** is its name plus the number, order and types of its parameters (JLS §8.4.2).
    Return type, parameter names, `throws` clause and modifiers like `static` are not part of it.
    `parse(String)` appears twice, so javac reports *method parse(String) is already defined in class Main*.
  rule: "JLS 8.4.2: two methods have the same signature if they have the same name and parameter types; a class may not declare two methods with override-equivalent signatures."
  misconception: '"Changing the return type is enough to overload a method."'
  hint: What exactly is part of a method signature?
  java:
    expect: { compiles: false, errorContains: "is already defined", errorLine: 3 }

- id: D3-OVL-002
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: overload-resolution
  difficulty: intermediate
  estSeconds: 90
  tags: [overloading, widening, boxing, char]
  prompt: What is the output?
  code: |
    public class Main {
        static void m(long x)      { System.out.println("long"); }
        static void m(Character c) { System.out.println("Character"); }
        static void m(Object o)    { System.out.println("Object"); }
        public static void main(String[] args) {
            m('z');
            Character ch = 'q';
            m(ch);
        }
    }
  options:
    - key: a
      text: |
        long
        Character
      correct: true
      why: For 'z', phase 1 finds m(long) by widening char→long, before boxing is considered. For ch, m(Character) is an identity match in phase 1.
    - key: b
      text: |
        Character
        Character
      why: Boxing char→Character is a phase-2 conversion; phase 1 already succeeds with widening char→long.
    - key: c
      text: |
        long
        long
      why: For a Character argument, m(Character) and m(Object) are applicable in phase 1 without unboxing; Character is the most specific.
    - key: d
      text: |
        Object
        Character
      why: Reaching Object from a char needs boxing (phase 2), and phase 1 already succeeded with m(long).
  explanation: |
    Phase 1 (JLS §15.12.2.2) allows only identity and widening conversions. A `char` widens to `int`,
    `long`, `float`, `double`, so `m(long)` applies and wins before boxing is ever tried. A `Character`
    argument matches `m(Character)` and `m(Object)` in phase 1 (identity and widening reference); the most
    specific, `Character`, is chosen. Unboxing to reach `m(long)` would require phase 2.
  rule: "JLS 15.12.2: phase 1 = no boxing/unboxing, no varargs; phase 2 = adds boxing/unboxing; phase 3 = adds varargs. The first phase with an applicable method decides."
  misconception: '"A char argument prefers Character because they are the same kind of thing."'
  hint: Is widening or boxing tried first?
  java:
    expect: { compiles: true, stdout: "long\nCharacter" }

- id: D3-OVL-003
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: compile-error
  difficulty: expert
  estSeconds: 120
  tags: [overloading, ambiguity, boxing]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static void m(Integer a, long b) { System.out.println("Integer,long"); }
        static void m(long a, Integer b) { System.out.println("long,Integer"); }
        public static void main(String[] args) {
            m(1, 1);
        }
    }
  options:
    - key: a
      text: Prints `Integer,long`
      why: Both methods need exactly one boxing and one widening; neither is more specific, so the call is ambiguous.
    - key: b
      text: Prints `long,Integer`
      why: Declaration order and argument position do not break ties in overload resolution.
    - key: c
      text: "Compilation fails at line 5: reference to m is ambiguous"
      correct: true
      why: Neither method applies in phase 1 (both need boxing). In phase 2 both apply, and neither parameter list is a subtype-wise match for the other.
    - key: d
      text: Compilation fails at line 3 because the two methods have the same erasure
      why: (Integer, long) and (long, Integer) are different parameter lists, so the declarations are legal overloads.
  explanation: |
    Phase 1 fails: each method needs `int → Integer` boxing for one argument. In phase 2 both are
    applicable. To be *more specific*, one method's parameter types would have to be usable for the other's
    in every position: `Integer` vs `long` is incompatible in both directions, so neither wins and javac
    reports *reference to m is ambiguous*. Declaring both methods is fine — the error is at the call.
  rule: If more than one method is applicable in a phase and none is strictly more specific (JLS 15.12.2.5), the invocation is ambiguous — a compile-time error at the call site.
  misconception: '"The compiler picks the first declared method when both need the same number of conversions."'
  hint: Can either method be chosen in phase 1? If not, which one is more specific in phase 2?
  java:
    expect: { compiles: false, errorContains: "reference to m is ambiguous", errorLine: 5 }

- id: D3-OVL-004
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: overload-resolution
  difficulty: foundation
  estSeconds: 60
  tags: [overloading, "null", most-specific]
  prompt: What is the output?
  code: |
    public class Main {
        static void show(Object o) { System.out.println("Object"); }
        static void show(String s) { System.out.println("String"); }
        public static void main(String[] args) {
            Object o = "text";
            show(o);
            show(null);
        }
    }
  options:
    - key: a
      text: |
        Object
        String
      correct: true
      why: Overloads are chosen from the static (declared) type, so show(o) picks Object; null fits both, and String is more specific.
    - key: b
      text: |
        String
        String
      why: Overload resolution uses the compile-time type Object of o, not the runtime String object.
    - key: c
      text: |
        Object
        Object
      why: For null, both methods apply and the most specific (String, a subtype of Object) is chosen.
    - key: d
      text: Compilation fails because `show(null)` is ambiguous
      why: It is ambiguous only when neither candidate type is a subtype of the other; String extends Object.
  explanation: |
    Overload selection happens at **compile time** using the declared types of the arguments: `o` is an
    `Object`, so `show(Object)` is chosen even though it holds a `String`. `null` is assignable to every
    reference type, so both overloads apply; `String` is a subtype of `Object`, hence more specific.
  rule: The most specific applicable method is chosen (JLS 15.12.2.5); for reference parameters, m1 is more specific than m2 if its parameter type is a subtype of m2's.
  hint: Is overloading resolved with the variable's declared type or the object's runtime type?
  java:
    expect: { compiles: true, stdout: "Object\nString" }

- id: D3-OVL-005
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 90
  tags: [overloading, "null", ambiguity]
  prompt: What is the result of compiling this program?
  code: |
    public class Main {
        static void m(String s)         { System.out.println("String"); }
        static void m(StringBuilder sb) { System.out.println("StringBuilder"); }
        static void m(Object o)         { System.out.println("Object"); }
        public static void main(String[] args) {
            m("x");
            m(null);
        }
    }
  options:
    - key: a
      text: |
        String
        String
      why: String and StringBuilder are unrelated, so neither is more specific for a null argument.
    - key: b
      text: |
        String
        Object
      why: Object is the least specific candidate; the compiler never falls back to it when more specific candidates tie.
    - key: c
      text: "Compilation fails at line 7: reference to m is ambiguous"
      correct: true
      why: null is applicable to all three; String and StringBuilder are both more specific than Object, but neither is more specific than the other.
    - key: d
      text: Compilation fails at line 6 because a String literal could also match `CharSequence`
      why: There is no CharSequence overload; "x" is exactly a String, so line 6 is fine.
  explanation: |
    With `null`, every reference-typed overload is applicable. The compiler then looks for one method that
    is more specific than **all** others. `String` and `StringBuilder` are unrelated siblings (both extend
    `Object`), so there is no single most specific method: *reference to m is ambiguous*. Fix it with a cast:
    `m((String) null)`.
  rule: JLS 15.12.2.5 — if no applicable method is more specific than all others, the call is ambiguous.
  misconception: '"With null the compiler just picks Object, the safest type."'
  hint: Is String a subtype of StringBuilder, or vice versa?
  java:
    expect: { compiles: false, errorContains: "reference to m is ambiguous", errorLine: 7 }

- id: D3-OVL-006
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: overload-resolution
  difficulty: advanced
  estSeconds: 150
  tags: [overloading, phases, varargs, boxing, widening]
  prompt: What is the output?
  code: |
    public class Main {
        static int m(int a)     { return 1; }
        static int m(int... a)  { return 2; }
        static int m(Integer a) { return 3; }
        static int m(long a)    { return 4; }
        public static void main(String[] args) {
            Integer i = 0;
            System.out.println("" + m(1) + m(i) + m(1, 2) + m(1L) + m('a'));
        }
    }
  options:
    - key: a
      text: "`13241`"
      correct: true
      why: "m(1) exact int; m(i) identity Integer in phase 1; m(1, 2) only varargs fits; m(1L) only long fits; m('a') widens char→int, and int is more specific than long."
    - key: b
      text: "`11241`"
      why: "For an Integer argument, m(Integer) is an identity match in phase 1; unboxing to int would need phase 2."
    - key: c
      text: "`13244`"
      why: "char widens to both int and long, but m(int) is more specific because int widens to long."
    - key: d
      text: "`13243`"
      why: "Boxing char gives Character, not Integer, so m(Integer) is never applicable to 'a'."
  explanation: |
    Walk each call through the phases. `m(1)`: phase 1, `int` identity (also `long` by widening; `int` is
    more specific) → 1. `m(i)`: phase 1 accepts `Integer` identity → 3 (unboxing is phase 2). `m(1, 2)`: only
    varargs takes two ints → 2. `m(1L)`: `long` identity → 4. `m('a')`: phase 1, `char` widens to `int` and
    `long`; `int` is more specific → 1.
  rule: "JLS 15.12.2.2–15.12.2.4: strict/loose invocation (phases 1–2) before variable-arity invocation (phase 3); among primitives, the narrower type that widens to the other is more specific."
  hint: Do each call separately, checking phase 1 first.
  java:
    expect: { compiles: true, stdout: "13241" }

- id: D3-OVL-007
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 90
  tags: [varargs, "null"]
  prompt: What is the result of running this program?
  code: |
    public class Main {
        static void count(int... values) { System.out.println(values.length); }
        public static void main(String[] args) {
            count();
            count(new int[] {4, 5});
            count(null);
        }
    }
  options:
    - key: a
      text: Prints `0` and `2`, then throws a `NullPointerException`
      correct: true
      why: Zero arguments give an empty array; an int[] is passed as the array itself; null is passed as the array reference, so values.length throws.
    - key: b
      text: Prints `0`, `2` and `1`
      why: null is assignable to int[], so it is passed as the array itself, not wrapped in a one-element array.
    - key: c
      text: Compilation fails because `count()` passes no argument for `values`
      why: A varargs parameter accepts zero arguments; the method receives an empty array, not null.
    - key: d
      text: Prints `1` and `2`, then throws a `NullPointerException`
      why: With no arguments the varargs array has length 0.
  explanation: |
    A varargs parameter `int... values` is an `int[]`. `count()` → `new int[0]`; `count(new int[]{4,5})` →
    the array is passed directly; `count(null)` → `null` is a valid `int[]` value, so it is passed as the
    array reference itself and `values.length` throws `NullPointerException`.
  rule: "JLS 15.12.4.2: for a variable-arity call, if the argument is assignable to the array type T[] it is passed as-is (phase 1/2); otherwise the arguments are collected into a new array."
  misconception: '"A varargs parameter is never null."'
  hint: Is `null` assignable to `int[]`?
  java:
    expect: { compiles: true, stdout: "0\n2", exception: java.lang.NullPointerException }

- id: D3-OVL-008
  objective: D3.3
  lesson: oop-overloading
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 120
  tags: [varargs, declaration]
  prompt: Which method declarations compile? Choose three.
  options:
    - key: a
      text: "`static void a(String... names) { }`"
      correct: true
      why: A single varargs parameter is fine.
      java:
        source: |
          public class Main {
              static void a(String... names) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: b
      text: "`static void b(int id, String... names) { }`"
      correct: true
      why: Other parameters may come before the varargs parameter.
      java:
        source: |
          public class Main {
              static void b(int id, String... names) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: c
      text: "`static void c(String... names, int id) { }`"
      why: The varargs parameter must be the last parameter.
      java:
        source: |
          public class Main {
              static void c(String... names, int id) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "varargs parameter must be the last parameter" }
    - key: d
      text: "`static void d(int... ids, String... names) { }`"
      why: Only one varargs parameter is allowed, and it must be last.
      java:
        source: |
          public class Main {
              static void d(int... ids, String... names) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "varargs parameter must be the last parameter" }
    - key: e
      text: "`static void e(String[]... rows) { }`"
      correct: true
      why: The element type of a varargs parameter can itself be an array; rows is a String[][].
      java:
        source: |
          public class Main {
              static void e(String[]... rows) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: f
      text: "`static void f(String names...) { }`"
      why: The ellipsis goes after the type, not after the parameter name.
      java:
        source: |
          public class Main {
              static void f(String names...) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false }
  explanation: |
    A method may have **one** varargs parameter, written `Type... name`, and it must be the **last**
    parameter. Its type is an array (`String[]... rows` is a `String[][]`).
  rule: "JLS 8.4.1: only the last formal parameter may be a variable arity parameter."
  hint: Where may the `...` appear, and how many times?

- id: D3-OVL-009
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: polymorphism
  difficulty: advanced
  estSeconds: 120
  tags: [overloading-vs-overriding, static-type]
  prompt: What is the output?
  code: |
    class Animal { void speak(Object o) { System.out.println("Animal Object"); } }
    class Dog extends Animal { void speak(String s) { System.out.println("Dog String"); } }
    public class Main {
        public static void main(String[] args) {
            Animal a = new Dog();
            a.speak("woof");
            ((Dog) a).speak("woof");
            new Dog().speak(42);
        }
    }
  options:
    - key: a
      text: |
        Animal Object
        Dog String
        Animal Object
      correct: true
      why: Dog.speak(String) overloads rather than overrides. Through an Animal reference only speak(Object) is visible; through a Dog reference the String version is more specific for "woof"; 42 only fits speak(Object).
    - key: b
      text: |
        Dog String
        Dog String
        Animal Object
      why: Dynamic dispatch only selects among overrides of the chosen signature; speak(String) does not override speak(Object), so a.speak("woof") runs Animal's method.
    - key: c
      text: |
        Animal Object
        Dog String
        Dog String
      why: 42 boxes to Integer, which is not a String, so only the inherited speak(Object) applies.
    - key: d
      text: Compilation fails because `Dog` changes the parameter type of `speak`
      why: Declaring a method with the same name but a different parameter type is a legal overload.
  explanation: |
    The compiler picks a **signature** using the static type of the target and arguments; at runtime, the
    JVM only chooses among **overrides** of that signature. `Animal` has only `speak(Object)`, and Dog does
    not override it (different parameter type), so `a.speak("woof")` prints `Animal Object`. With a `Dog`
    reference both are visible and `speak(String)` is more specific. `@Override` on Dog's method would have
    exposed the mistake at compile time.
  rule: Overload resolution is compile-time (static types); overriding is runtime (dynamic dispatch on the receiver's class) — JLS 15.12.
  misconception: '"Dog''s speak(String) overrides speak(Object) because String is an Object."'
  hint: First decide which signature the compiler chooses for each call; then ask whether Dog overrides it.
  java:
    expect: { compiles: true, stdout: "Animal Object\nDog String\nAnimal Object" }

- id: D3-OVL-010
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: compile-error
  difficulty: expert
  estSeconds: 120
  tags: [overloading, static-context, most-specific]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        static void log(long v) { System.out.println("static long"); }
        void log(int v)         { System.out.println("instance int"); }
        public static void main(String[] args) {
            log(5);
        }
    }
  options:
    - key: a
      text: Prints `static long`
      why: The compiler does not skip instance methods when resolving a call in a static context; it chooses first, then checks.
    - key: b
      text: Prints `instance int`
      why: There is no receiver object in static main, so the instance method cannot actually be invoked.
    - key: c
      text: "Compilation fails at line 5: non-static method log(int) cannot be referenced from a static context"
      correct: true
      why: Overload resolution picks the most specific method, log(int), and only afterwards checks that a static context cannot call it.
    - key: d
      text: Compilation fails at line 3 because a static and an instance method cannot share a name
      why: They have different signatures (long vs int), so they are legal overloads.
  explanation: |
    Static and instance methods take part in the same overload resolution. For `log(5)`, both apply in
    phase 1 and `log(int)` is more specific. Only **after** choosing does the compiler check the
    invocation mode (JLS §15.12.3): an instance method from a static context is an error. It does not fall
    back to `log(long)`.
  rule: "JLS 15.12.3: after the most specific method is chosen, it is a compile-time error if it is an instance method invoked from a static context."
  misconception: '"The compiler only considers static methods when the call is in a static method."'
  hint: Does the static/instance check happen before or after the most specific method is chosen?
  java:
    expect: { compiles: false, errorContains: "non-static method log(int) cannot be referenced from a static context", errorLine: 5 }

- id: D3-OVL-011
  objective: D3.3
  lesson: oop-overloading
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags: [overloading, signature, generics, erasure]
  prompt: Each option shows two methods declared in the same class. Which pairs are legal overloads? Choose two.
  options:
    - key: a
      text: "`void add(int x)` and `void add(long x)`"
      correct: true
      why: Different parameter types make different signatures.
      java:
        source: |
          public class Main {
              void add(int x) { }
              void add(long x) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: b
      text: "`void add(List<String> x)` and `void add(List<Integer> x)`"
      why: Both erase to add(List); javac reports a name clash (same erasure).
      java:
        source: |
          import java.util.List;
          public class Main {
              void add(List<String> x) { }
              void add(List<Integer> x) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "have the same erasure" }
    - key: c
      text: "`void add(List<String> x)` and `void add(Set<String> x)`"
      correct: true
      why: List and Set are different types even after erasure.
      java:
        source: |
          import java.util.*;
          public class Main {
              void add(List<String> x) { }
              void add(Set<String> x) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: true }
    - key: d
      text: "`void add(int[] x)` and `void add(int... x)`"
      why: A varargs parameter is an array; both have parameter type int[], so they cannot both be declared.
      java:
        source: |
          public class Main {
              void add(int[] x) { }
              void add(int... x) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "cannot declare both" }
    - key: e
      text: "`static void add(int x)` and `void add(int x)`"
      why: static is not part of the signature; the two methods have the same signature.
      java:
        source: |
          public class Main {
              static void add(int x) { }
              void add(int x) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "is already defined" }
    - key: f
      text: "`void add(int x) throws Exception` and `void add(int y)`"
      why: Neither the throws clause nor parameter names are part of the signature.
      java:
        source: |
          public class Main {
              void add(int x) throws Exception { }
              void add(int y) { }
              public static void main(String[] args) { }
          }
        expect: { compiles: false, errorContains: "is already defined" }
  explanation: |
    Only the name and the parameter types (after erasure) distinguish overloads. `List<String>` and
    `List<Integer>` both erase to `List`, so they clash. `int...` is `int[]`. `static`, `throws` and
    parameter names never distinguish methods.
  rule: "JLS 8.4.2 / 8.4.8.3: two methods in a class may not have the same signature or the same erasure."
  misconception: '"Different generic type arguments make different overloads."'
  hint: Erase the generics and strip everything except name and parameter types.

- id: D3-OVL-012
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: overload-resolution
  difficulty: expert
  estSeconds: 150
  tags: [varargs, arrays, phases]
  prompt: What is the output?
  code: |
    public class Main {
        static void m(Object o)      { System.out.println("Object"); }
        static void m(Integer... xs) { System.out.println("Integer..."); }
        public static void main(String[] args) {
            Integer[] arr = {1, 2};
            m(arr);
            m(1);
        }
    }
  options:
    - key: a
      text: |
        Integer...
        Object
      correct: true
      why: An Integer[] matches the varargs method's array type directly in phase 1 and is more specific than Object. For m(1), phase 2 boxes to Integer → Object applies before varargs (phase 3) is considered.
    - key: b
      text: |
        Object
        Integer...
      why: In phase 1 a varargs method is treated as taking an Integer[] parameter, and Integer[] is more specific than Object. And for 1, boxing (phase 2) beats varargs (phase 3).
    - key: c
      text: |
        Integer...
        Integer...
      why: m(Object) is applicable to 1 via boxing in phase 2, so phase 3 (variable arity) is never reached.
    - key: d
      text: Compilation fails because `m(arr)` is ambiguous
      why: Integer[] is a subtype of Object, so the Integer... (as Integer[]) method is strictly more specific.
  explanation: |
    In phases 1 and 2 a varargs method is still applicable — as a *fixed-arity* method whose last parameter
    is the array type. `m(arr)` therefore sees `m(Integer[])` and `m(Object)`; `Integer[]` is more specific.
    For `m(1)`, phase 1 finds nothing, phase 2 boxes `1` to `Integer` which widens to `Object`, so `m(Object)`
    wins before the variable-arity form is ever considered.
  rule: "JLS 15.12.2.2–15.12.2.4: variable-arity invocation (spreading individual arguments into a new array) is only tried in phase 3."
  misconception: '"Passing an array to a varargs method or passing a single element both go through varargs matching."'
  hint: In phases 1 and 2, how is `Integer... xs` treated?
  java:
    expect: { compiles: true, stdout: "Integer...\nObject" }

- id: D3-OVL-013
  objective: D3.3
  lesson: oop-overloading
  type: single
  format: overload-resolution
  difficulty: intermediate
  estSeconds: 120
  tags: [overloading, widening, boxing]
  prompt: What is the output?
  code: |
    public class Main {
        static void print(long x)   { System.out.print("L"); }
        static void print(float x)  { System.out.print("F"); }
        static void print(Object x) { System.out.print("O"); }
        public static void main(String[] args) {
            print(1); print(1L); print(1.0); print('a'); print((short) 1);
            System.out.println();
        }
    }
  options:
    - key: a
      text: "`LLOLL`"
      correct: true
      why: int, long, char and short all widen to both long and float; long is more specific because long widens to float. A double widens to neither, so it boxes to Double → Object.
    - key: b
      text: "`LLFLL`"
      why: double → float is a narrowing conversion, which method invocation never performs.
    - key: c
      text: "`FLOFF`"
      why: Among long and float, long is more specific (long can widen to float, not vice versa).
    - key: d
      text: "`LLOOL`"
      why: char widens to long in phase 1; boxing to Character (and then Object) is only phase 2.
  explanation: |
    In phase 1 the compiler considers widening primitive conversions only. `int`, `char`, `short` and
    `long` all widen to `long` and `float`; between the two, `long` is more specific since `long <: float`
    in the primitive subtyping used by JLS §4.10.1. `1.0` is a `double`: it cannot be narrowed, so phase 1
    fails and phase 2 boxes it to `Double`, matching `Object`.
  rule: Primitive widening order byte→short→int→long→float→double (char→int); method invocation never narrows (JLS 5.3).
  hint: Can a double be passed where a float is expected?
  java:
    expect: { compiles: true, stdout: "LLOLL" }

