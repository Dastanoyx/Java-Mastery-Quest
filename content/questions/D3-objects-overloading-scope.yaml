- id: D3-SCP-001
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: compile-error
  difficulty: foundation
  estSeconds: 75
  tags: [scope, block-scope, for-loop]
  prompt: Which line causes the first compilation error?
  code: |
    public class Main {
        public static void main(String[] args) {
            int x = 1;
            { int y = 2; }
            int y = 3;
            for (int i = 0; i < 2; i++) { x += i; }
            System.out.println(x + y + i);
        }
    }
  options:
    - key: a
      text: Line 4
      why: Declaring y in a nested block is fine; no other y is in scope at that point.
    - key: b
      text: Line 5
      why: The block-scoped y on line 4 is already out of scope, so redeclaring y here is legal.
    - key: c
      text: Line 6
      why: i is a new variable scoped to the for statement; x is in scope and assignable.
    - key: d
      text: Line 7
      correct: true
      why: i was declared in the for header, so its scope ends with the loop — it cannot be found on line 7.
  explanation: |
    A local variable's scope runs from its declaration to the end of the enclosing block. The inner `y` on
    line 4 dies at the closing brace, so line 5 may declare a new `y`. The loop variable `i` exists only in
    the `for` statement, so line 7 fails with *cannot find symbol: variable i*. (The reverse — declaring an
    inner `y` while an outer `y` is still in scope — would be *already defined*.)
  rule: The scope of a local variable is the rest of its block; the scope of a for-init variable is the for statement (JLS 6.3).
  hint: Where does the scope of `i` end?
  java:
    expect: { compiles: false, errorContains: "cannot find symbol", errorLine: 7 }

- id: D3-SCP-002
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 75
  tags: [shadowing, this]
  prompt: What is the output?
  code: |
    public class Main {
        int value = 10;
        void set(int value)  { value = value; }
        void set2(int value) { this.value = value; }
        public static void main(String[] args) {
            Main m = new Main();
            m.set(5);
            System.out.print(m.value + " ");
            m.set2(7);
            System.out.println(m.value);
        }
    }
  options:
    - key: a
      text: "`10 7`"
      correct: true
      why: In set(), the parameter shadows the field, so value = value assigns the parameter to itself. set2() uses this.value to reach the field.
    - key: b
      text: "`5 7`"
      why: Without `this.`, the simple name value refers to the parameter in both positions; the field is never touched.
    - key: c
      text: "`10 10`"
      why: set2() explicitly writes the field via this.value.
    - key: d
      text: Compilation fails because a parameter cannot have the same name as a field
      why: Parameters may shadow fields; that is exactly why `this.value` exists.
  explanation: |
    A parameter (or local) with the same name as a field **shadows** the field for the whole method body.
    `value = value` is a self-assignment of the parameter. `this.value` names the field explicitly.
  rule: A local variable or parameter shadows a field of the same name within its scope (JLS 6.4.1); use this.name to access the field.
  misconception: '"The left side of an assignment automatically refers to the field."'
  hint: Inside set(), which variable does `value` name?
  java:
    expect: { compiles: true, stdout: "10 7" }

- id: D3-SCP-003
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 120
  tags: [definite-assignment, constant-expression]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int n;
            boolean ready = true;
            if (ready) n = 1;
            System.out.println(n);
        }
    }
  options:
    - key: a
      text: Prints `1`
      why: The compiler does not track the value of a non-constant variable; it must assume the if might be false.
    - key: b
      text: Prints `0`
      why: Local variables never get default values — only fields and array elements do.
    - key: c
      text: "Compilation fails at line 6: variable n might not have been initialized"
      correct: true
      why: ready is not a constant variable, so the condition is not a constant expression and n is not definitely assigned on the false path.
    - key: d
      text: "Compilation fails at line 5: `if` without braces cannot assign a variable"
      why: A single statement without braces is a legal if body.
  explanation: |
    Definite assignment is a **compile-time, flow-based** analysis. Because `ready` is not `final`,
    `if (ready)` is not a constant expression and the compiler considers both branches; on the false branch
    `n` is unassigned, so reading it fails. Declaring `final boolean ready = true;` makes the condition a
    constant expression and the program compiles and prints `1`.
  rule: "JLS ch. 16: a local variable must be definitely assigned before use; only constant expressions (JLS 15.29) are treated as known true/false."
  misconception: '"The compiler can see that ready is true."'
  hint: Is `ready` a constant variable?
  java:
    expect: { compiles: false, errorContains: "might not have been initialized", errorLine: 6 }

- id: D3-SCP-004
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: multi
  format: select-valid
  difficulty: expert
  estSeconds: 180
  tags: [access-modifiers, protected, packages]
  prompt: |
    `Animal` is in package `zoo`; `Main` is in package `safari`. Which statements compile when placed
    (one at a time) at `// INSERT`? Choose three.
  code: |
    // file zoo/Animal.java
    package zoo;
    public class Animal {
        protected String name = "generic";
        protected Animal() { }
        protected void eat() { System.out.println(name + " eats"); }
    }

    // file safari/Main.java
    package safari;
    import zoo.Animal;
    public class Main extends Animal {
        void test(Main other, Animal plain) {
            // INSERT
        }
        public static void main(String[] args) { }
    }
  options:
    - key: a
      text: "`eat();`"
      correct: true
      why: Inherited protected members are accessible in the subclass body through this (implicitly).
      java:
        source: |
          package safari;
          import zoo.Animal;
          public class Main extends Animal {
              void test(Main other, Animal plain) {
                  eat();
              }
              public static void main(String[] args) { }
          }
        files:
          - name: Animal.java
            content: |
              package zoo;
              public class Animal {
                  protected String name = "generic";
                  protected Animal() { }
                  protected void eat() { System.out.println(name + " eats"); }
              }
        expect: { compiles: true }
    - key: b
      text: "`other.eat();`"
      correct: true
      why: Access through a reference whose type is Main (the accessing subclass itself) is allowed.
      java:
        source: |
          package safari;
          import zoo.Animal;
          public class Main extends Animal {
              void test(Main other, Animal plain) {
                  other.eat();
              }
              public static void main(String[] args) { }
          }
        files:
          - name: Animal.java
            content: |
              package zoo;
              public class Animal {
                  protected String name = "generic";
                  protected Animal() { }
                  protected void eat() { System.out.println(name + " eats"); }
              }
        expect: { compiles: true }
    - key: c
      text: "`plain.eat();`"
      why: Outside zoo, a protected instance member may be accessed only through a reference of type Main (or a subclass of Main), not through an Animal reference.
      java:
        source: |
          package safari;
          import zoo.Animal;
          public class Main extends Animal {
              void test(Main other, Animal plain) {
                  plain.eat();
              }
              public static void main(String[] args) { }
          }
        files:
          - name: Animal.java
            content: |
              package zoo;
              public class Animal {
                  protected String name = "generic";
                  protected Animal() { }
                  protected void eat() { System.out.println(name + " eats"); }
              }
        expect: { compiles: false, errorContains: "eat() has protected access" }
    - key: d
      text: "`Animal a = new Animal();`"
      why: A protected constructor can be used from another package only via super(...) or an anonymous subclass body, not by a plain new expression.
      java:
        source: |
          package safari;
          import zoo.Animal;
          public class Main extends Animal {
              void test(Main other, Animal plain) {
                  Animal a = new Animal();
              }
              public static void main(String[] args) { }
          }
        files:
          - name: Animal.java
            content: |
              package zoo;
              public class Animal {
                  protected String name = "generic";
                  protected Animal() { }
                  protected void eat() { System.out.println(name + " eats"); }
              }
        expect: { compiles: false, errorContains: "Animal() has protected access" }
    - key: e
      text: "`name = \"lion\";`"
      correct: true
      why: The inherited protected field is accessed via the implicit this, whose type is Main.
      java:
        source: |
          package safari;
          import zoo.Animal;
          public class Main extends Animal {
              void test(Main other, Animal plain) {
                  name = "lion";
              }
              public static void main(String[] args) { }
          }
        files:
          - name: Animal.java
            content: |
              package zoo;
              public class Animal {
                  protected String name = "generic";
                  protected Animal() { }
                  protected void eat() { System.out.println(name + " eats"); }
              }
        expect: { compiles: true }
  explanation: |
    `protected` = package access **plus** access from subclasses in other packages — but with a catch
    (JLS §6.6.2): outside the package, code in subclass `S` may access a protected instance member only
    through an expression whose type is `S` or a subclass of `S`. So `eat()`, `this.name`, `other.eat()`
    are fine; `plain.eat()` (type `Animal`) is not. A protected constructor is usable from another package
    only via `super(...)` or an anonymous subclass (`new Animal() { }`), not via `new Animal()`.
  rule: "JLS 6.6.2.1: outside its package, a protected instance member is accessible in subclass S only via E.Id where E's type is S or a subclass of S; JLS 6.6.2.2 for protected constructors."
  misconception: '"A subclass can call a protected method on any object of the superclass type."'
  hint: In each option, what is the static type of the expression before the dot?

- id: D3-SCP-005
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [immutability, defensive-copy, encapsulation]
  prompt: What is the output?
  code: |
    import java.util.*;
    final class Team {
        private final List<String> members;
        Team(List<String> members) { this.members = members; }
        List<String> members() { return members; }
    }
    public class Main {
        public static void main(String[] args) {
            List<String> src = new ArrayList<>(List.of("a"));
            Team t = new Team(src);
            src.add("b");
            t.members().add("c");
            System.out.println(t.members());
        }
    }
  options:
    - key: a
      text: "`[a, b, c]`"
      correct: true
      why: The constructor stores the caller's list and the accessor hands it out, so both outside modifications affect Team's state.
    - key: b
      text: "`[a]`"
      why: That would need a defensive copy in the constructor and an unmodifiable result from the accessor.
    - key: c
      text: "`[a, c]`"
      why: The constructor did not copy src, so adding "b" to src also changes Team's list.
    - key: d
      text: An `UnsupportedOperationException` is thrown
      why: The list is an ArrayList (copied from List.of), so it is modifiable, and the accessor returns it directly.
  explanation: |
    `final` on the field only stops it being **reassigned**; the `ArrayList` it points to is still mutable.
    `Team` neither copies the list on the way in nor protects it on the way out, so the caller can change
    it both ways. Fix: `this.members = List.copyOf(members);` — then the accessor is safe too.
  rule: "A final reference field makes the reference constant, not the object; immutable classes need defensive copies of mutable inputs and outputs."
  misconception: '"A final class with private final fields is automatically immutable."'
  hint: How many List objects exist in this program?
  java:
    expect: { compiles: true, stdout: "[a, b, c]" }

- id: D3-SCP-006
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: runtime-exception
  difficulty: advanced
  estSeconds: 90
  tags: [immutability, List.copyOf, defensive-copy]
  prompt: What is the result of running this program?
  code: |
    import java.util.*;
    final class Team {
        private final List<String> members;
        Team(List<String> members) { this.members = List.copyOf(members); }
        List<String> members() { return members; }
    }
    public class Main {
        public static void main(String[] args) {
            List<String> src = new ArrayList<>(List.of("a"));
            Team t = new Team(src);
            src.add("b");
            System.out.println(t.members());
            t.members().add("c");
        }
    }
  options:
    - key: a
      text: Prints `[a]`, then throws `UnsupportedOperationException`
      correct: true
      why: List.copyOf takes an independent snapshot, and the copy it returns is unmodifiable, so add() throws.
    - key: b
      text: Prints `[a, b]`, then throws `UnsupportedOperationException`
      why: copyOf copied the elements when the Team was built; later changes to src are not seen.
    - key: c
      text: Prints `[a]` and terminates normally
      why: The accessor returns the unmodifiable copy itself, so add("c") is rejected at runtime.
    - key: d
      text: Compilation fails because an unmodifiable list has no `add` method
      why: Unmodifiable lists still implement List; add() exists but throws at runtime.
  explanation: |
    `List.copyOf` returns an **unmodifiable** list containing the current elements (and rejects `null`
    elements). The copy is independent of `src`, so `"b"` never appears, and because it is unmodifiable
    the accessor can return it directly — `add` throws `UnsupportedOperationException`.
  rule: "java.util.List.copyOf(Collection) returns an unmodifiable List containing the given elements; mutators throw UnsupportedOperationException."
  hint: Is the list returned by List.copyOf modifiable? Is it a view or a copy?
  java:
    expect: { compiles: true, stdout: "[a]", exception: java.lang.UnsupportedOperationException }

- id: D3-SCP-007
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags: [var, type-inference]
  prompt: Which local variable declarations compile inside a method? Choose three.
  options:
    - key: a
      text: "`var nums = {1, 2, 3};`"
      why: An array initializer needs an explicit target type; write `var nums = new int[] {1, 2, 3};`.
      java:
        source: |
          public class Main { public static void main(String[] args) { var nums = {1, 2, 3}; } }
        expect: { compiles: false, errorContains: "array initializer needs an explicit target-type" }
    - key: b
      text: "`var var = 1;`"
      correct: true
      why: var is a reserved type name, not a keyword, so it may still be used as a variable name.
      java:
        source: |
          public class Main { public static void main(String[] args) { var var = 1; } }
        expect: { compiles: true }
    - key: c
      text: "`var none = null;`"
      why: null alone has no usable type to infer.
      java:
        source: |
          public class Main { public static void main(String[] args) { var none = null; } }
        expect: { compiles: false, errorContains: "variable initializer is 'null'" }
    - key: d
      text: "`var a = 1, b = 2;`"
      why: var cannot be used in a compound declaration.
      java:
        source: |
          public class Main { public static void main(String[] args) { var a = 1, b = 2; } }
        expect: { compiles: false, errorContains: "'var' is not allowed in a compound declaration" }
    - key: e
      text: "`var list = new java.util.ArrayList<>();`"
      correct: true
      why: Legal — the diamond infers ArrayList<Object>, which is usually not what you want, but it compiles.
      java:
        source: |
          public class Main { public static void main(String[] args) { var list = new java.util.ArrayList<>(); list.add(1); list.add("x"); } }
        expect: { compiles: true }
    - key: f
      text: "`var s = (String) null;`"
      correct: true
      why: The cast gives the initializer the type String, so s is inferred as String.
      java:
        source: |
          public class Main { public static void main(String[] args) { var s = (String) null; } }
        expect: { compiles: true }
  explanation: |
    `var` infers a local variable's type from its initializer, so it needs one with a usable type: not
    missing, not bare `null`, not a bare array initializer or lambda. It declares exactly one variable.
    `var` is a *reserved type name*, so `var var = 1;` is legal (but you cannot name a class `var`).
  rule: "JLS 14.4.1: local variable type inference requires a single declarator with an initializer that is not null, an array initializer, a lambda or a method reference."
  misconception: '"var is a keyword, so it can never be an identifier."'
  hint: What type would the compiler infer in each case?

- id: D3-SCP-008
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [var, type-inference, char]
  prompt: What is the output?
  code: |
    public class Main {
        public static void main(String[] args) {
            var c = 'a';
            var d = c + 1;
            var e = c;
            e++;
            System.out.println(d + " " + e);
        }
    }
  options:
    - key: a
      text: "`98 b`"
      correct: true
      why: c + 1 is an int expression, so d is an int (98); e is inferred as char, and e++ keeps it a char ('b').
    - key: b
      text: "`b b`"
      why: Binary numeric promotion makes c + 1 an int, so var infers int for d.
    - key: c
      text: "`98 98`"
      why: e is inferred from c, which is a char; ++ on a char yields the next character.
    - key: d
      text: "`b 98`"
      why: Mixes up both inferences; var takes the exact static type of each initializer.
  explanation: |
    `var` uses the **static type of the initializer**: `'a'` → `char`, `c + 1` → `int` (binary numeric
    promotion), `c` → `char`. `e++` increments a `char` and keeps its type, so it prints `b`.
  rule: The inferred type of a var local is the type of its initializer expression (JLS 14.4.1); arithmetic on char promotes to int (JLS 5.6).
  hint: What is the type of the expression `c + 1`?
  java:
    expect: { compiles: true, stdout: "98 b" }

- id: D3-SCP-009
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [unnamed-variables, java22, jep456]
  prompt: What is the output when compiled and run with Java 25?
  code: |
    public class Main {
        public static void main(String[] args) {
            int count = 0;
            for (var _ : new String[] {"a", "b", "c"}) count++;
            try {
                Integer.parseInt("x" + count);
            } catch (NumberFormatException _) {
                System.out.println("bad " + count);
            }
            var _ = count++;
            var _ = count++;
            System.out.println(count);
        }
    }
  options:
    - key: a
      text: |
        bad 3
        5
      correct: true
      why: _ declares unnamed variables (JEP 456); several may coexist in one scope, and their initializers still run, so count++ executes twice.
    - key: b
      text: |
        bad 3
        3
      why: An unnamed variable's initializer is still evaluated; only the variable itself is nameless.
    - key: c
      text: Compilation fails because `_` is declared twice in the same scope
      why: Unnamed variables do not introduce a name, so several of them in one scope are allowed.
    - key: d
      text: Compilation fails because `_` cannot be used as a catch parameter
      why: An unnamed catch parameter is one of the places JEP 456 explicitly allows.
  explanation: |
    Since Java 22 (JEP 456), `_` declares an **unnamed variable**: it can appear in for-each loops, catch
    clauses, local declarations, try-with-resources, lambda parameters and patterns. It cannot be read, and
    because it has no name, many may exist in the same scope. Side effects of initializers still happen.
  rule: "JEP 456 / JLS 6.1: an unnamed variable is declared with _, introduces no name and may be declared multiple times in the same scope."
  hint: Does `var _ = count++;` still evaluate `count++`?
  java:
    expect: { compiles: true, stdout: "bad 3\n5" }

- id: D3-SCP-010
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: multi
  format: select-valid
  difficulty: advanced
  estSeconds: 150
  tags: [unnamed-variables, java22, jep456]
  prompt: Which uses of the underscore `_` compile with Java 25? Choose three.
  options:
    - key: a
      text: "`BiFunction<String, Integer, String> f = (s, _) -> s.strip();`"
      correct: true
      why: Unnamed lambda parameters are allowed.
      java:
