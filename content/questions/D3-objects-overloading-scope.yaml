          import java.util.function.BiFunction;
          public class Main { public static void main(String[] args) { BiFunction<String, Integer, String> f = (s, _) -> s.strip(); } }
        expect: { compiles: true }
    - key: b
      text: "`int _ = 5; System.out.println(_);`"
      why: An unnamed variable can never be read; `_` is not an expression.
      java:
        source: |
          public class Main { public static void main(String[] args) { int _ = 5; System.out.println(_); } }
        expect: { compiles: false, errorContains: "underscore not allowed here" }
    - key: c
      text: "`static int _ = 1;` (a field)"
      why: Fields cannot be unnamed; JEP 456 covers locals, parameters of lambdas and catch clauses, resources and patterns.
      java:
        source: |
          public class Main { static int _ = 1; public static void main(String[] args) { } }
        expect: { compiles: false, errorContains: "underscore not allowed here" }
    - key: d
      text: "`void m(int _) { }` (a method parameter)"
      why: Method parameters cannot be unnamed — only lambda parameters can.
      java:
        source: |
          public class Main { void m(int _) { } public static void main(String[] args) { } }
        expect: { compiles: false, errorContains: "underscore not allowed here" }
    - key: e
      text: "`try (var _ = new java.io.StringReader(\"x\")) { }`"
      correct: true
      why: An unnamed resource is still closed automatically; you just never refer to it.
      java:
        source: |
          public class Main { public static void main(String[] args) { try (var _ = new java.io.StringReader("x")) { } } }
        expect: { compiles: true }
    - key: f
      text: "`if (obj instanceof Point(int x, _)) { }` where `record Point(int x, int y)`"
      correct: true
      why: An unnamed pattern ignores a record component.
      java:
        source: |
          public class Main {
              record Point(int x, int y) { }
              public static void main(String[] args) { Object obj = new Point(1, 2); if (obj instanceof Point(int x, _)) { } }
          }
        expect: { compiles: true }
  explanation: |
    JEP 456 (final in Java 22) allows `_` for local variables, for-each and basic `for` variables, catch
    parameters, try-with-resources resources, lambda parameters, and in patterns. It does not allow `_` for
    fields or method/constructor parameters, and an unnamed variable can never be used as an expression.
  rule: "JEP 456: unnamed variables and patterns — allowed declaration contexts are locals, resources, catch/lambda parameters, loop variables and patterns."
  misconception: '"_ is just a short variable name like x."'
  hint: Is the declaration a local-ish one (local, catch, lambda, resource, pattern) or a member/method parameter?

- id: D3-SCP-011
  objective: D3.4
  lesson: oop-encapsulation-scope
  type: multi
  format: concept
  difficulty: foundation
  estSeconds: 75
  tags: [immutability, encapsulation]
  prompt: You are designing an immutable class `Invoice` holding a `List<LineItem>`. Which steps are needed? Choose three.
  options:
    - key: a
      text: Mark the class `final` (or make all constructors private) so no subclass can add mutable state or override accessors.
      correct: true
      why: A subclass could otherwise expose or change state and break the immutability guarantee.
    - key: b
      text: Make every field `private final` and assign it once in the constructor.
      correct: true
      why: private prevents outside writes; final prevents reassignment after construction.
    - key: c
      text: Copy the incoming list (e.g. `List.copyOf`) instead of storing the caller's reference, and never return a modifiable internal list.
      correct: true
      why: Without defensive copies, the caller keeps a handle to your internal state.
    - key: d
      text: Provide setters that return `this` so callers can chain calls.
      why: Any setter that changes the object breaks immutability; immutable APIs return a new object ("withers") instead.
    - key: e
      text: Make the fields `public final` so accessors are unnecessary.
      why: A public final field pointing to a mutable List still lets anyone call add() on it; access should go through methods that protect the state.
  explanation: |
    The immutable-class recipe: `final` class, `private final` fields, no mutators, defensive copies of
    mutable inputs **and** outputs (or unmodifiable copies), and "with" methods returning new objects for
    changes.
  rule: "Immutable class recipe: final class, private final fields, no setters, defensive copies in and out (cf. java.lang.String, java.time.LocalDate)."
