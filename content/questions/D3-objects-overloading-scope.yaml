# D3.1 — objects, references, nested classes, lifecycle & GC
# D3.3 — overloading & varargs
# D3.4 — scope, access, encapsulation, immutability, var, unnamed variables

# ───────────────────────────── D3.1 ─────────────────────────────

- id: D3-OBJ-001
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 90
  tags: [references, aliasing, pass-by-value]
  prompt: What is the output?
  code: |
    class Box { int v; Box(int v) { this.v = v; } }
    public class Main {
        static void reassign(Box b) { b = new Box(99); b.v++; }
        static void mutate(Box b)   { b.v++; }
        public static void main(String[] args) {
            Box a = new Box(1);
            Box c = a;
            c.v = 5;
            reassign(a);
            mutate(c);
            System.out.println(a.v + " " + (a == c));
        }
    }
  options:
    - key: a
      text: "`6 true`"
      correct: true
      why: a and c alias one Box. c.v = 5 changes it; reassign() only redirects its own parameter copy; mutate() increments the shared object to 6.
    - key: b
      text: "`1 false`"
      why: "`Box c = a;` copies the reference, not the object — both variables point to the same Box, so c.v = 5 is visible through a."
    - key: c
      text: "`100 true`"
      why: Assigning a new object to the parameter b inside reassign() does not change the caller's variable a; Java passes the reference by value.
    - key: d
      text: "`6 false`"
      why: Neither a nor c is ever reassigned in main, so they still hold the same reference and == is true.
  explanation: |
    `Box c = a;` copies the **reference**: one object, two variables. `c.v = 5` mutates that object.
    `reassign(a)` receives a copy of the reference; `b = new Box(99)` makes the *parameter* point elsewhere
    and the increment affects the new, soon-unreachable object. `mutate(c)` follows the copied reference to
    the shared object and increments it to 6. `a == c` compares references: still the same object.
  rule: Java is always pass-by-value; for reference types the value passed is the reference (JLS 15.12.4.2). Reassigning a parameter never affects the caller's variable.
  misconception: '"Objects are passed by reference, so reassigning the parameter changes the caller''s variable."'
  hint: Which method changes the object, and which only changes where its own parameter points?
  java:
    expect: { compiles: true, stdout: "6 true" }

- id: D3-OBJ-002
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [pass-by-value, immutability, arrays]
  prompt: What does this program print?
  code: |
    public class Main {
        static void change(String s, StringBuilder sb, int[] arr) {
            s = s + "!";
            sb.append("!");
            arr = new int[] {9};
        }
        public static void main(String[] args) {
            String s = "hi";
            StringBuilder sb = new StringBuilder("hi");
            int[] arr = {1};
            change(s, sb, arr);
            System.out.println(s + " " + sb + " " + arr[0]);
        }
    }
  options:
    - key: a
      text: "`hi hi! 1`"
      correct: true
      why: Only sb.append mutates an object the caller can see. The String and the array parameters are merely reassigned to new objects.
    - key: b
      text: "`hi! hi! 9`"
      why: s + "!" creates a new String and assigns it to the parameter; the caller's s still refers to "hi". The same is true for the new array.
    - key: c
      text: "`hi hi! 9`"
      why: "`arr = new int[] {9}` reassigns the parameter; the caller's array still contains 1. Writing `arr[0] = 9` would have changed it."
    - key: d
      text: "`hi hi 1`"
      why: append() mutates the StringBuilder object that both the caller and the method reference.
  explanation: |
    Three references are copied into `change`. `s = s + "!"` builds a new `String` (Strings are immutable)
    and rebinds only the parameter. `sb.append("!")` mutates the shared `StringBuilder`. `arr = new int[]{9}`
    rebinds only the parameter. Back in `main`, `s` is `"hi"`, `sb` is `"hi!"`, `arr[0]` is `1`.
  rule: A method can change the state of an object passed to it, but can never change which object the caller's variable refers to.
  misconception: '"String is an object, so changing it in a method changes it for the caller."'
  hint: For each parameter, ask "is the object mutated, or is the parameter reassigned?"
  java:
    expect: { compiles: true, stdout: "hi hi! 1" }

- id: D3-OBJ-003
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: compile-error
  difficulty: foundation
  estSeconds: 60
  tags: [inner-class, static-context]
  prompt: What is the result of compiling this code?
  code: |
    public class Main {
        class Inner { }
        public static void main(String[] args) {
            Inner i = new Inner();
        }
    }
  options:
    - key: a
      text: It compiles and runs, printing nothing
      why: An inner (non-static member) class needs an enclosing Main instance, and static main has none.
    - key: b
      text: "Compilation fails at line 4: `non-static variable this cannot be referenced from a static context`"
      correct: true
      why: "`new Inner()` implicitly means `this.new Inner()`; there is no `this` in a static method."
    - key: c
      text: Compilation fails at line 2 because inner classes must be static
      why: Inner member classes are perfectly legal; the problem is creating one without an outer instance.
    - key: d
      text: It compiles but throws a `NullPointerException` because the enclosing instance is null
      why: The compiler catches this; the code never runs. (A NullPointerException happens only with an explicit null outer, as in `nullRef.new Inner()`.)
  explanation: |
    Every instance of an inner class is bound to an instance of its enclosing class. Inside an instance
    method, `new Inner()` means `this.new Inner()`. In static `main` there is no `this`, so javac reports
    *non-static variable this cannot be referenced from a static context*. Fix:
    `Inner i = new Main().new Inner();` — or declare `static class Inner`.
  rule: An inner class instance requires an enclosing instance (JLS 15.9.2); unqualified `new Inner()` in a static context does not compile.
  misconception: '"A member class can be instantiated anywhere in its outer class, just like a top-level class."'
  hint: What does `new Inner()` implicitly mean inside the outer class?
  java:
    expect: { compiles: false, errorContains: "non-static variable this cannot be referenced from a static context", errorLine: 4 }

- id: D3-OBJ-004
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 120
  tags: [inner-class, shadowing, qualified-this]
  prompt: What is the output?
  code: |
    public class Main {
        int x = 1;
        class A {
            int x = 2;
            class B {
                int x = 3;
                void p() { System.out.println(x + "" + A.this.x + Main.this.x); }
            }
        }
        public static void main(String[] args) {
            Main.A.B b = new Main().new A().new B();
            b.p();
        }
    }
  options:
    - key: a
      text: "`321`"
      correct: true
      why: Plain x is B's own field (3); A.this.x is the enclosing A instance's field (2); Main.this.x is the outermost (1). The "" forces String concatenation.
    - key: b
      text: "`6`"
      why: Evaluation is left to right; x + "" already produces a String, so the remaining operands are concatenated, not added.
    - key: c
      text: "`333`"
      why: A.this and Main.this refer to the enclosing instances, whose x fields are different variables from B's x.
    - key: d
      text: Compilation fails because `new Main().new A().new B()` is not valid syntax
      why: Qualified instance creation can be chained; each `.new` uses the object on its left as the enclosing instance.
  explanation: |
    `new Main().new A().new B()` creates three objects, each inner object bound to the one on its left.
    Inside `B`, the simple name `x` resolves to the innermost declaration (B's field). `A.this.x` and
    `Main.this.x` reach the shadowed fields of the enclosing instances. Because `x + ""` is a `String`, the
    rest is concatenation: `"3" + 2 + 1` → `321`.
  rule: "`Outer.this` denotes the lexically enclosing instance of class Outer (JLS 15.8.4); a field declared in an inner scope shadows the outer one."
  hint: Which variable does a simple name refer to when several x are in scope?
  java:
    expect: { compiles: true, stdout: "321" }

- id: D3-OBJ-005
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 120
  tags: [nested-class, inner-class, instantiation]
  prompt: |
    Given the class below, which statements compile when placed (one at a time) at `// INSERT`?
    Choose two.
  code: |
    public class Main {
        class Inner { }
        static class Nested { }
        public static void main(String[] args) {
            // INSERT
        }
    }
  options:
    - key: a
      text: "`Inner a = new Main().new Inner();`"
      correct: true
      why: The qualified form supplies the required enclosing instance explicitly.
      java:
        source: |
          public class Main {
              class Inner { }
              static class Nested { }
              public static void main(String[] args) {
                  Inner a = new Main().new Inner();
              }
          }
        expect: { compiles: true }
    - key: b
      text: "`Main.Nested b = new Main.Nested();`"
      correct: true
      why: A static nested class needs no outer instance; it is created like a top-level class, using its qualified name.
      java:
        source: |
          public class Main {
              class Inner { }
              static class Nested { }
              public static void main(String[] args) {
                  Main.Nested b = new Main.Nested();
              }
          }
        expect: { compiles: true }
    - key: c
      text: "`Main.Inner c = new Main.Inner();`"
      why: Qualifying the type name does not provide an enclosing instance; this still needs `this`, which a static method lacks.
      java:
        source: |
          public class Main {
              class Inner { }
              static class Nested { }
              public static void main(String[] args) {
                  Main.Inner c = new Main.Inner();
              }
          }
        expect: { compiles: false, errorContains: "non-static variable this cannot be referenced" }
    - key: d
      text: "`Nested d = new Main().new Nested();`"
      why: A static nested class has no enclosing instance, so a qualified `outer.new` is rejected (qualified new of static class).
      java:
        source: |
          public class Main {
              class Inner { }
              static class Nested { }
              public static void main(String[] args) {
                  Nested d = new Main().new Nested();
              }
          }
        expect: { compiles: false, errorContains: "qualified new of static class" }
    - key: e
      text: "`Main m = new Main(); Main.Inner e = m.new Main.Inner();`"
      why: After `outer.new`, only the simple name of the inner class is allowed — `m.new Inner()`.
      java:
        source: |
          public class Main {
              class Inner { }
              static class Nested { }
              public static void main(String[] args) {
                  Main m = new Main(); Main.Inner e = m.new Main.Inner();
              }
          }
        expect: { compiles: false }
  explanation: |
    Inner classes need an enclosing instance: `outerRef.new Inner()` (simple name after `.new`). Static
    nested classes need none: `new Outer.Nested()` — and they reject the qualified `outer.new` form.
  rule: JLS 15.9 — qualified class instance creation `Primary.new Identifier(...)` is only for inner classes, and uses the simple class name.
  misconception: '"Writing the full name Main.Inner is enough to create an inner object from static code."'
  hint: Which of the two classes is tied to an instance of Main?

- id: D3-OBJ-006
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: trace
  difficulty: advanced
  estSeconds: 150
  tags: [garbage-collection, island-of-isolation]
  prompt: How many of the `Node` objects created in this program are eligible for garbage collection when execution reaches `// HERE`?
  code: |
    class Node { Node link; }
    public class Main {
        public static void main(String[] args) {
            Node p = new Node();   // #1
            Node q = new Node();   // #2
            Node r = new Node();   // #3
            p.link = q;
            q.link = r;
            r.link = q;
            q = null;
            r = null;
            p.link = new Node();   // #4
            // HERE
            System.out.println(p.link != null);
        }
    }
  options:
    - key: a
      text: "0"
      why: "#2 and #3 still reference each other, but references from unreachable objects do not keep anything alive."
    - key: b
      text: "1"
      why: "#2 and #3 form a cycle; once p.link is redirected to #4, neither is reachable, so both are eligible — not just one."
    - key: c
      text: "2"
      correct: true
      why: "#2 and #3 form an island of isolation: they reference each other, but no live variable or reachable object refers to either."
    - key: d
      text: "3"
      why: "#1 is still referenced by p and #4 by p.link, so at most #2 and #3 can be eligible."
  explanation: |
    Reachability is what matters, not reference counts. After `q = null; r = null;`, #2 is still reachable
    through `p.link`, and #3 through #2. Redirecting `p.link` to #4 cuts the only path into the #2⇄#3 cycle.
    The cycle is an **island of isolation**: both objects are eligible even though each is referenced by the
    other. #1 (via `p`) and #4 (via `p.link`) remain reachable.
  rule: An object is eligible for GC when it is no longer reachable from any live thread or static field (JLS 12.6.1); cycles of unreachable objects are collectable.
  misconception: '"An object that is still referenced by another object can never be collected."'
  hint: Draw the arrows from p, q and r after each line, then ask what is reachable from the variables.
  java:
    source: |
      import java.lang.ref.WeakReference;
      class Node { Node link; }
      public class Main {
          public static void main(String[] args) throws Exception {
              Node p = new Node();
              Node q = new Node();
              Node r = new Node();
              p.link = q;
              q.link = r;
              r.link = q;
              var w1 = new WeakReference<>(p); var w2 = new WeakReference<>(q); var w3 = new WeakReference<>(r);
              q = null;
              r = null;
              p.link = new Node();
              var w4 = new WeakReference<>(p.link);
              for (int i = 0; i < 3; i++) { System.gc(); Thread.sleep(20); }
              int cleared = 0;
              for (var w : java.util.List.of(w1, w2, w3, w4)) if (w.get() == null) cleared++;
              System.out.println(cleared);
              System.out.println(p.link != null);
          }
      }
    expect: { compiles: true, stdout: "2\ntrue" }
    optionCheck: false

- id: D3-OBJ-007
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: trace
  difficulty: intermediate
  estSeconds: 90
  tags: [garbage-collection, reference-reassignment]
  prompt: How many `StringBuilder` objects are eligible for garbage collection when execution reaches `// HERE`?
  code: |
    public class Main {
        public static void main(String[] args) {
            StringBuilder a = new StringBuilder("A");
            StringBuilder b = new StringBuilder("B");
            StringBuilder c = a;
            a = b;
            b = new StringBuilder("C");
            c = b;
            // HERE
            System.out.println(a + " " + b + " " + c);
        }
    }
  options:
    - key: a
      text: "0"
      why: The "A" object loses its last reference when c is reassigned.
    - key: b
      text: "1"
      correct: true
      why: 'Only "A" is unreachable: a refers to "B", and b and c both refer to "C".'
    - key: c
      text: "2"
      why: '"B" is still referenced by a (a = b copied the reference before b was reassigned).'
    - key: d
      text: "3"
      why: Three objects exist, but two of them are still referenced by local variables.
  explanation: |
    Track the arrows: after `c = a`, "A" has two references. `a = b` leaves "A" with only `c`. `b = new ...`
    creates "C"; `c = b` removes the last reference to "A". At `// HERE`: `a → "B"`, `b → "C"`, `c → "C"`.
    Exactly one object ("A") is eligible.
  rule: Assigning a new value to a reference variable drops that variable's reference to its old object; an object with no remaining path from live code is eligible for GC.
  hint: Draw a box per object and move the arrows line by line.
  java:
    source: |
      import java.lang.ref.WeakReference;
      public class Main {
          public static void main(String[] args) throws Exception {
              StringBuilder a = new StringBuilder("A");
              StringBuilder b = new StringBuilder("B");
              var wa = new WeakReference<>(a); var wb = new WeakReference<>(b);
              StringBuilder c = a;
              a = b;
              b = new StringBuilder("C");
              var wc = new WeakReference<>(b);
              c = b;
              for (int i = 0; i < 3; i++) { System.gc(); Thread.sleep(20); }
              int n = 0;
              for (var w : java.util.List.of(wa, wb, wc)) if (w.get() == null) n++;
              System.out.println(n);
              System.out.println(a + " " + b + " " + c);
          }
      }
    expect: { compiles: true, stdout: "1\nB C C" }
    optionCheck: false

- id: D3-OBJ-008
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: multi
  format: concept
  difficulty: intermediate
  estSeconds: 90
  tags: [garbage-collection, finalize]
  prompt: Which statements about garbage collection in Java are true? Choose three.
  options:
    - key: a
      text: "`System.gc()` is only a request; the JVM may ignore it, and you cannot force a collection."
      correct: true
      why: The API documents System.gc() as a suggestion; when or whether collection happens is up to the JVM.
    - key: b
      text: "`Object.finalize()` is deprecated for removal, and there is no guarantee it ever runs."
      correct: true
      why: "finalize() has been deprecated since Java 9 and marked forRemoval (JEP 421); the JVM never promised to call it."
    - key: c
      text: Two objects that reference each other but are not reachable from any live variable are both eligible.
      correct: true
      why: Java uses reachability, not reference counting, so an island of isolation is collectable.
    - key: d
      text: Setting a variable to `null` immediately frees the object's memory.
      why: It may only make the object eligible; memory is reclaimed later, if ever, when the collector runs.
    - key: e
      text: An object becomes eligible only when it goes out of scope at the end of its method.
      why: Eligibility depends on reachability, which can end earlier (reassignment, null) and is unrelated to scope of objects themselves — only variables have scope.
  explanation: |
    You control *eligibility* (by dropping references), never *collection*. `System.gc()` is a hint,
    `finalize()` is deprecated for removal and unreliable (use try-with-resources / `Cleaner` instead), and
    the collector reasons about reachability from GC roots, so unreachable cycles are collected.
  rule: "System.gc() javadoc: 'suggests that the JVM expend effort'; Object.finalize() is @Deprecated(forRemoval=true) (JEP 421)."
  misconception: '"Calling System.gc() or setting a reference to null frees memory right away."'

- id: D3-OBJ-009
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 90
  tags: [identity, equality, records]
  prompt: What is the output?
  code: |
    class Point { int x; Point(int x) { this.x = x; } }
    record Spot(int x) { }
    public class Main {
        public static void main(String[] args) {
            Point p1 = new Point(1), p2 = new Point(1), p3 = p1;
            Spot s1 = new Spot(1), s2 = new Spot(1);
            System.out.println((p1 == p2) + " " + p1.equals(p2) + " "
                + (p1 == p3) + " " + s1.equals(s2) + " " + (s1 == s2));
        }
    }
  options:
    - key: a
      text: "`false false true true false`"
      correct: true
      why: Point inherits Object.equals (identity); the record generates a component-wise equals; == always compares references.
    - key: b
      text: "`false true true true false`"
      why: Point does not override equals, so Object.equals is used, which is the same as ==.
    - key: c
      text: "`false false true true true`"
      why: Records override equals, but == still compares references, and s1 and s2 are two distinct objects.
    - key: d
      text: "`true true true true true`"
      why: Each `new` creates a distinct object, so p1 == p2 and s1 == s2 are false.
  explanation: |
    `==` on references tests **identity** (same object). `equals` tests whatever the class defines:
    `Object.equals` is identity, so `p1.equals(p2)` is `false`; records get a state-based `equals`, so
    `s1.equals(s2)` is `true`. `p3 = p1` copies the reference, so `p1 == p3` is `true`.
  rule: "Object.equals(Object) returns this == obj unless overridden; records implicitly implement equals by comparing components (java.lang.Record)."
  misconception: '"equals always compares field values."'
  hint: Which of the two types overrides equals?
  java:
    expect: { compiles: true, stdout: "false false true true false" }

- id: D3-OBJ-010
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 90
  tags: [local-class, effectively-final, capture]
  prompt: What is the result of compiling and running this program?
  code: |
    public class Main {
        public static void main(String[] args) {
            int base = 10;
            class Adder { int add(int v) { return base + v; } }
            Adder a = new Adder();
            System.out.println(a.add(5));
            base = 20;
        }
    }
  options:
    - key: a
      text: Prints `15`
      why: The later assignment base = 20 means base is not effectively final, so the local class may not capture it.
    - key: b
      text: Prints `25`
      why: Captured locals are copied when the object is created, so even if allowed the value would be 10. But the code does not compile.
    - key: c
      text: "Compilation fails at line 4: local variables referenced from an inner class must be final or effectively final"
      correct: true
      why: A variable assigned again anywhere in its scope is not effectively final, even if the assignment comes after the capture.
    - key: d
      text: Compilation fails at line 7 because `base` is final after being captured
      why: base is not declared final; the error is reported at the capturing reference on line 4.
  explanation: |
    Local and anonymous classes (and lambdas) may only capture local variables that are `final` or
    **effectively final** — never assigned after initialization. Effectively-final status is decided for
    the whole scope, so `base = 20;` on line 7 disqualifies the use on line 4. javac reports the error at
    the reference inside the local class.
  rule: A local variable used but not declared in a local/anonymous class must be final or effectively final (JLS 8.1.3, 4.12.4).
  misconception: '"Only assignments before the capture matter."'
  hint: Is base ever assigned after its declaration?
  java:
    expect: { compiles: false, errorContains: "must be final or effectively final", errorLine: 4 }

- id: D3-OBJ-011
  objective: D3.1
  lesson: oop-objects-lifecycle
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [anonymous-class, shadowing, qualified-this, state]
  prompt: What is the output?
  code: |
    public class Main {
        private String tag = "outer";
        interface Op { String run(); }
        Op make() {
            String tag = "local";
            return new Op() {
                private String tag = "anon";
                int calls;
                public String run() { calls++; return tag + calls + "," + Main.this.tag; }
            };
        }
        public static void main(String[] args) {
            Op op = new Main().make();
            op.run();
            System.out.println(op.run());
        }
    }
  options:
    - key: a
      text: "`anon2,outer`"
      correct: true
      why: The anonymous class's own field tag shadows both the local variable and the outer field; calls is per-object state, incremented twice.
    - key: b
      text: "`local2,outer`"
      why: Inside the anonymous class body, its member field tag is the innermost declaration and shadows the enclosing method's local tag.
    - key: c
      text: "`anon1,outer`"
      why: The same Op object is used for both calls, and its calls field keeps its value between calls.
    - key: d
      text: Compilation fails because the anonymous class declares a field with the same name as a local variable
      why: Shadowing a local by a member of a nested class is legal; only redeclaring a local in the same method scope is an error.
  explanation: |
    An anonymous class is a full class: it can declare fields and keep state across calls. Inside it, the
    simple name `tag` resolves to its own field (`"anon"`), shadowing the captured local `"local"` and the
    field `Main.tag`, which is still reachable as `Main.this.tag`. `calls` is 2 at the second call.
  rule: Scope of a member declared in a class body includes the whole body and shadows outer declarations of the same name (JLS 6.4.1); Outer.this reaches the enclosing instance.
  hint: Which declaration of tag is closest to the use?
  java:
    expect: { compiles: true, stdout: "anon2,outer" }

