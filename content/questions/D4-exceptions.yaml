  rule: "Throwable(Throwable cause) constructs a new throwable with the specified cause and a detail message of (cause == null ? null : cause.toString())."
  misconception: getMessage() on a wrapper returns the cause's message, or null when no message was passed.
  hint: Look up what the cause-only constructor uses as the detail message.
