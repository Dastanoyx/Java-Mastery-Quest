    java.io.IOException … exception thrown from implicit call to close()*.
  rule: "JLS 14.20.3: the implicit close() invocation can throw the exceptions declared by the close() method of the resource's declared type, and these are subject to catch-or-declare."
  misconception: Only the runtime class's close() matters.
  hint: Compare the declared types of r and c.
  java:
    expect: { compiles: false, errorContains: "unreported exception java.io.IOException", errorLine: 11 }

