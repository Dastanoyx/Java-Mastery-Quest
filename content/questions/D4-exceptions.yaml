                System.out.println("ISE " + e.getMessage());
            } catch (IllegalArgumentException e) {
                System.out.println("IAE " + e.getSuppressed().length + " " + e.getSuppressed()[0].getMessage());
            } finally {
                System.out.println("finally");
            }
        }
    }
  options:
    - key: a
      text: |
        IAE 1 close
        finally
      correct: true
      why: The body's IllegalArgumentException is the primary exception; the close() failure is suppressed into it, so the IAE handler runs.
    - key: b
      text: |
        ISE close
        finally
      why: An exception from close() never replaces an exception already thrown by the body in try-with-resources.
    - key: c
      text: |
        ISE close
        IAE 1 close
        finally
      why: Only one catch clause of a try statement ever runs for a single propagating exception.
    - key: d
      text: |
        IAE 0
        finally
      why: The close failure is not lost — it is recorded as suppressed. (And getSuppressed()[0] would throw if the array were empty.)
  explanation: |
    The body throws `IllegalArgumentException("body")`. While closing `r`, `close()` throws
    `IllegalStateException("close")`; because an exception is already pending, it is added to it with
    `addSuppressed`. The catch clauses then see only the primary IAE, which has one suppressed exception.
  rule: "JLS 14.20.3.1: an exception thrown by close() while an exception from the try block is propagating is suppressed (Throwable.addSuppressed)."
  misconception: The last exception thrown wins, as with finally.
  hint: Which exception is pending when close() fails?
  java:
    expect: { compiles: true, stdout: "IAE 1 close\nfinally" }

- id: D4-TWR-007
  objective: D4.1
  lesson: exc-try-with-resources
  type: multi
  format: concept
  difficulty: intermediate
  estSeconds: 90
  tags: [try-with-resources, suppressed, rules]
  prompt: Which statements about try-with-resources are true? Choose three.
  options:
    - key: a
      text: Resources are closed before the statement's own `catch` block runs.
      correct: true
      why: The generated closing code is wrapped inside the try; catch and finally are outside it.
    - key: b
      text: Resources are closed in the reverse order of their declaration.
      correct: true
      why: Later resources may depend on earlier ones (e.g. a writer wrapping a stream), so they are closed first.
    - key: c
      text: Declaring a resource initialized to `null` causes a `NullPointerException` when the block ends.
      why: The generated code checks for null and skips close() for null resources.
    - key: d
      text: "`getSuppressed()` returns `null` when no exception was suppressed."
      why: It returns an empty array — never null.
    - key: e
      text: A try-with-resources statement needs at least one `catch` or a `finally`.
      why: Unlike a plain try, try-with-resources may stand alone.
    - key: f
      text: A resource variable declared in the header is implicitly final.
      correct: true
      why: Assigning to it inside the block fails with "auto-closeable resource r may not be assigned".
  explanation: |
    try-with-resources closes non-null resources in reverse declaration order **before** any catch/finally of
    the same statement, records close failures as suppressed when an exception is pending, and its header
    variables are implicitly final and scoped to the try block. It needs no catch or finally.
  rule: "JLS 14.20.3: resources are implicitly final, closed in reverse order before catch/finally, null resources are not closed; Throwable.getSuppressed() returns an empty array if none."
  misconception: try-with-resources behaves like a plain try for catch/finally requirements and null handling.
  hint: Mentally expand the statement into the code the compiler generates.
