- id: D4-TWR-001
  objective: D4.1
  lesson: exc-try-with-resources
  type: multi
  format: select-valid
  difficulty: foundation
  estSeconds: 120
  tags: [try-with-resources, AutoCloseable, effectively-final]
  prompt: |
    Given the class `Res` and the local variable `existing`, which lines can replace `// INSERT` so that
    the code compiles? Choose three.
  code: |
    class Res implements AutoCloseable {
        @Override public void close() { System.out.println("closed"); }
    }
    public class Main {
        public static void main(String[] args) {
            Res existing = new Res();
            // INSERT
        }
    }
  options:
    - key: a
      text: "`try (Res r = new Res()) { }`"
      correct: true
      why: A resource declaration of an AutoCloseable type; no catch or finally is required in try-with-resources.
      java:
        source: |
          class Res implements AutoCloseable { @Override public void close() { System.out.println("closed"); } }
          public class Main { public static void main(String[] args) { Res existing = new Res(); try (Res r = new Res()) { } } }
        expect: { compiles: true, stdout: "closed" }
    - key: b
      text: "`try (new Res()) { }`"
      why: An arbitrary expression is not allowed; the resource must be a declaration or a reference to a final/effectively final variable.
      java:
        source: |
          class Res implements AutoCloseable { @Override public void close() { System.out.println("closed"); } }
          public class Main { public static void main(String[] args) { Res existing = new Res(); try (new Res()) { } } }
        expect: { compiles: false, errorContains: "must either be a variable declaration or an expression denoting a reference" }
    - key: c
      text: "`try (existing) { }`"
      correct: true
      why: Since Java 9 an effectively final variable can be used as a resource; it is closed at the end of the block.
      java:
        source: |
          class Res implements AutoCloseable { @Override public void close() { System.out.println("closed"); } }
          public class Main { public static void main(String[] args) { Res existing = new Res(); try (existing) { } } }
        expect: { compiles: true, stdout: "closed" }
    - key: d
      text: "`try (String s = \"x\") { }`"
      why: String does not implement AutoCloseable, so it cannot be a resource.
      java:
        source: |
          class Res implements AutoCloseable { @Override public void close() { System.out.println("closed"); } }
          public class Main { public static void main(String[] args) { Res existing = new Res(); try (String s = "x") { } } }
        expect: { compiles: false, errorContains: "try-with-resources not applicable to variable type" }
    - key: e
      text: "`try (Res r = null) { }`"
      correct: true
      why: A null resource is legal; the generated code checks for null and simply does not call close().
      java:
        source: |
          class Res implements AutoCloseable { @Override public void close() { System.out.println("closed"); } }
          public class Main { public static void main(String[] args) { Res existing = new Res(); try (Res r = null) { } } }
        expect: { compiles: true, stdout: "" }
  explanation: |
    A try-with-resources header contains declarations of `AutoCloseable` types or (Java 9+) references to
    final/effectively final variables. Arbitrary expressions such as `new Res()` are rejected, and types that
    are not `AutoCloseable` are rejected. A `null` resource compiles and is skipped at close time.
  rule: "JLS 14.20.3: each resource is a local variable declaration or an expression name/field access denoting a final or effectively final variable, whose type must be a subtype of AutoCloseable."
  misconception: Any expression that produces an AutoCloseable can be put in the header.
  hint: The header accepts declarations and variable names — what about a bare `new` expression?

- id: D4-TWR-002
  objective: D4.1
  lesson: exc-try-with-resources
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [try-with-resources, closing-order, finally]
  prompt: What is the output?
  code: |
    class R implements AutoCloseable {
        final int id;
        R(int id) { this.id = id; System.out.print("o" + id + " "); }
        @Override public void close() { System.out.print("c" + id + " "); }
    }
    public class Main {
        public static void main(String[] args) {
            try {
                try (R r1 = new R(1); R r2 = new R(2)) {
                    System.out.print("body ");
                    throw new IllegalArgumentException();
                } finally {
                    System.out.print("f ");
                }
            } catch (RuntimeException e) {
                System.out.print("catch");
            }
            System.out.println();
        }
    }
  options:
    - key: a
      text: "`o1 o2 body c2 c1 f catch`"
      correct: true
      why: Resources open left to right, close right to left as soon as the body ends, then the statement's finally runs, then the outer catch.
    - key: b
      text: "`o1 o2 body c1 c2 f catch`"
      why: Resources are closed in reverse order of declaration.
    - key: c
      text: "`o1 o2 body f c2 c1 catch`"
      why: The resources are closed before the finally block of the same try-with-resources statement.
    - key: d
      text: "`o1 o2 body catch c2 c1 f`"
      why: The inner statement (including its closing and finally) completes before the exception reaches the outer catch.
  explanation: |
    Resources are initialized in declaration order (`o1 o2`). When the body throws, the generated code closes
    them in reverse order (`c2 c1`), then the `finally` of the same statement runs (`f`). The exception then
    propagates to the enclosing try, whose catch prints `catch`.
  rule: "JLS 14.20.3.2: in an extended try-with-resources, resources are closed before any catch or finally clause runs; resources are closed in the reverse order of initialization."
  misconception: finally runs before the resources are closed.
  hint: Picture the closing code as an inner finally that the compiler generates.
  java:
    expect: { compiles: true, stdout: "o1 o2 body c2 c1 f catch" }

- id: D4-TWR-003
  objective: D4.1
  lesson: exc-try-with-resources
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [try-with-resources, suppressed, close-exception]
  prompt: What is the output?
  code: |
    class Res implements AutoCloseable {
        private final String n;
        Res(String n) { this.n = n; }
        @Override public void close() { throw new IllegalStateException("close " + n); }
    }
    public class Main {
        public static void main(String[] args) {
            try (Res a = new Res("A"); Res b = new Res("B")) {
                System.out.println("ok");
            } catch (IllegalStateException e) {
                System.out.println(e.getMessage() + " / " + e.getSuppressed()[0].getMessage());
            }
        }
    }
  options:
    - key: a
      text: |
        ok
        close B / close A
      correct: true
      why: The body succeeds, so the first close failure (B, closed first) becomes the primary exception and A's close failure is suppressed into it.
    - key: b
      text: |
        ok
        close A / close B
      why: B is declared last, so it is closed first; its exception is the primary one.
    - key: c
      text: |
        ok
        close A
      why: Close exceptions do not replace each other; the later one is attached to the first as suppressed — and the code reads getSuppressed()[0].
    - key: d
      text: |
        ok
        close B
      why: The message line also concatenates the suppressed exception; A's failure is not lost.
  explanation: |
    With no exception from the body, closing proceeds `b` then `a`. `b.close()` throws first — that becomes
    the primary exception. The compiler-generated code still closes `a`; its exception is added to the
    primary one with `addSuppressed`. So the message is `close B` and `getSuppressed()[0]` is `close A`.
  rule: "JLS 14.20.3.1: if closing a resource throws while another exception is already pending (from the body or an earlier close), the new exception is added as suppressed to the pending one."
  misconception: Suppression only happens when the try body itself throws.
  hint: Which resource is closed first, and what is pending when the second one fails?
  java:
    expect: { compiles: true, stdout: "ok\nclose B / close A" }

- id: D4-TWR-004
  objective: D4.1
  lesson: exc-try-with-resources
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 120
  tags: [try-with-resources, Closeable, catch-or-declare]
  prompt: What is the result of compiling this code?
  code: |
    import java.io.*;
    class Res implements Closeable {
        @Override public void close() { System.out.println("c"); }
    }
    public class Main {
        public static void main(String[] args) {
            try (Res r = new Res()) {
                System.out.println("one");
            }
            Closeable c = new Res();
            try (c) {
                System.out.println("two");
            }
        }
    }
  options:
    - key: a
      text: Compilation fails at line 11 because the implicit `close()` may throw `IOException`
      correct: true
      why: The second resource's declared type is Closeable, whose close() declares IOException; main neither catches nor declares it.
    - key: b
      text: Compilation fails at lines 7 and 11
      why: The first resource has type Res, whose close() override declares no exception, so line 7 needs no handler.
    - key: c
      text: Compilation fails at line 3 because `close()` must declare `throws IOException`
      why: An override may drop checked exceptions from its throws clause.
    - key: d
      text: It compiles and prints `one c two c`
