            }
        }
    }
  options:
    - key: a
      text: |
        java.io.IOException: disk full
        disk full
      correct: true
      why: "The (Throwable cause) constructor sets the detail message to cause.toString(), which is the class name plus \": \" plus the cause's message."
    - key: b
      text: |
        null
        disk full
      why: Only the no-arg constructor leaves the message null; RuntimeException(Throwable) derives the message from the cause.
    - key: c
      text: |
        disk full
        disk full
      why: The derived message is cause.toString(), which includes the fully qualified class name, not just getMessage().
    - key: d
      text: Compilation fails because a checked `IOException` is created inside `main` without a throws clause
      why: Constructing a checked exception object is not throwing it; only the unchecked WrapperException is thrown.
