- id: D6-COL-001
  objective: D6.2
  lesson: streams-collectors
  type: single
  format: runtime-exception
  difficulty: foundation
  estSeconds: 75
  tags: [toMap, duplicate-key]
  prompt: What is the result of running this program?
  code: |
    import java.util.*;
    import java.util.stream.*;
    public class Main {
        record City(String name, String country) {}
        public static void main(String[] args) {
            Map<String, String> byCountry = Stream.of(
                    new City("Tunis", "TN"), new City("Sfax", "TN"), new City("Lyon", "FR"))
                .collect(Collectors.toMap(City::country, City::name));
            System.out.println(byCountry.get("TN"));
        }
    }
  options:
    - key: a
      text: "`Tunis`"
      why: toMap does not keep the first value silently; without a merge function a duplicate key is an error.
    - key: b
      text: "`Sfax`"
      why: toMap is not Map.put — it does not overwrite; it throws on the duplicate key.
    - key: c
      text: An `IllegalStateException` is thrown
      correct: true
      why: Two elements map to the key "TN" and no merge function was supplied → IllegalStateException "Duplicate key TN".
    - key: d
      text: Compilation fails because `City::country` is not a `Function`
      why: An accessor method of a record is an ordinary instance method, so City::country is a valid Function<City, String>.
  explanation: |
    The two-argument `Collectors.toMap(keyMapper, valueMapper)` throws `IllegalStateException: Duplicate key TN
    (attempted merging values Tunis and Sfax)`. Add a merge function — e.g. `(a, b) -> a + "," + b` — to resolve
    collisions.
  rule: "Collectors.toMap(k, v): if the mapped keys contain duplicates, an IllegalStateException is thrown when the collection operation is performed."
  misconception: toMap overwrites the old value like Map.put.
  hint: Do any two cities share a country?
  java:
    expect: { compiles: true, exception: java.lang.IllegalStateException }

- id: D6-COL-002
  objective: D6.2
  lesson: streams-collectors
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [groupingBy, mapping, joining, partitioningBy]
  prompt: What is the output?
  code: |
    import java.util.*;
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            List<String> words = List.of("sun", "sea", "sky", "moon", "mist");
            Map<Integer, String> byLength = words.stream().collect(Collectors.groupingBy(String::length, TreeMap::new,
                Collectors.mapping(w -> w.substring(0, 2), Collectors.joining("+"))));
            System.out.println(byLength);
            System.out.println(words.stream().collect(
                Collectors.partitioningBy(w -> w.startsWith("x"), Collectors.counting())));
        }
    }
  options:
    - key: a
      text: |
        {3=su+se+sk, 4=mo+mi}
        {false=5, true=0}
      correct: true
      why: Words are grouped by length in a TreeMap, each mapped to its first two letters and joined; partitioningBy always contains both keys.
    - key: b
      text: |
        {3=su+se+sk, 4=mo+mi}
        {false=5}
      why: partitioningBy always produces both the false and the true partition, even if one is empty.
    - key: c
      text: |
        {3=[su, se, sk], 4=[mo, mi]}
        {false=5, true=0}
      why: The downstream collector is joining("+"), so each value is a single String, not a List.
    - key: d
      text: |
        {3=sun+sea+sky, 4=moon+mist}
        {false=5, true=0}
      why: mapping(...) applies substring(0, 2) to each element before joining.
  explanation: |
    3-argument `groupingBy(classifier, mapFactory, downstream)`: `TreeMap::new` sorts the keys, and the
    downstream `mapping(f, joining("+"))` transforms and concatenates the elements of each group.
    `partitioningBy` always contains both keys `false` and `true`.
  rule: "Collectors.groupingBy(classifier, mapFactory, downstream); Collectors.partitioningBy always returns a map with entries for both false and true."
  hint: What is the type of each map value after `mapping(..., joining("+"))`?
  java:
    expect: { compiles: true, stdout: "{3=su+se+sk, 4=mo+mi}\n{false=5, true=0}" }

- id: D6-COL-003
  objective: D6.2
  lesson: streams-collectors
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 90
  tags: [flatMap, split, decomposition]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> lines = List.of("a,b", "", "c");
            System.out.println(lines.stream()
                .flatMap(l -> Arrays.stream(l.split(",")))
                .count());
        }
    }
  options:
    - key: a
      text: "`3`"
      why: "\"\".split(\",\") returns an array containing one empty string, not an empty array — so the empty line contributes one element."
    - key: b
      text: "`4`"
      correct: true
      why: "\"a,b\" → [a, b], \"\" → [\"\"], \"c\" → [c]: 2 + 1 + 1 = 4 elements after flattening."
    - key: c
      text: "`2`"
      why: flatMap flattens every resulting array element into the stream; it does not count the lines that contain a comma.
    - key: d
      text: Compilation fails because `Arrays.stream` returns an array, not a stream
      why: Arrays.stream(T[]) returns a Stream<T>, exactly what flatMap expects.
  explanation: |
    `flatMap` replaces each line by the stream of its parts. The subtle point is `String.split`: splitting an
    empty string yields `[""]` (one element), because no match was found and the result is the whole input.
    The total is therefore 4.
  rule: Stream.flatMap replaces each element with the contents of a mapped stream; String.split returns the whole string as the only element when the regex does not match.
  misconception: Splitting an empty string produces an empty array.
  hint: What is `"".split(",").length`?
  java:
    expect: { compiles: true, stdout: "4" }

- id: D6-COL-004
  objective: D6.2
  lesson: streams-collectors
  type: multi
  format: concept
  difficulty: intermediate
  estSeconds: 120
  tags: [parallel-streams, determinism, forEachOrdered, findAny]
  prompt: |
    Given `List<Integer> data = List.of(1, 2, 3, 4, 5, 6);`, which statements always produce the same output on
    every run? Choose three.
  options:
    - key: a
      text: "`System.out.println(data.parallelStream().map(x -> x * 2).toList());`"
      correct: true
      why: toList() preserves encounter order even for parallel streams — always [2, 4, 6, 8, 10, 12].
    - key: b
      text: "`data.parallelStream().forEach(System.out::print);`"
      why: forEach on a parallel stream does not respect encounter order; elements print in thread arrival order.
    - key: c
      text: "`data.parallelStream().forEachOrdered(System.out::print);`"
      correct: true
      why: forEachOrdered processes elements in encounter order, always printing 123456.
    - key: d
      text: "`System.out.println(data.parallelStream().filter(x -> x > 2).findAny().get());`"
      why: findAny is free to return any matching element; in parallel it often does not return the first.
    - key: e
      text: "`System.out.println(data.parallelStream().reduce(0, (a, b) -> a - b));`"
      why: Subtraction is not associative, so the result depends on how the work is split.
    - key: f
      text: "`System.out.println(data.parallelStream().reduce(0, Integer::sum));`"
      correct: true
      why: Addition is associative and 0 is a true identity, so every split gives 21.
  explanation: |
    Parallel streams keep **results** deterministic when the operations are order-preserving (`toList`,
    `collect`, `forEachOrdered`, `findFirst`) and reductions are associative with a true identity. `forEach`,
    `findAny` and non-associative reductions may differ between runs.
  rule: "Stream API: forEach is explicitly nondeterministic for parallel pipelines; reduce requires an associative accumulator and an identity value."
  misconception: A parallel stream returns the same result as the sequential version as long as it compiles.
  hint: Which of these depend on the order in which threads finish?

- id: D6-COL-005
  objective: D6.2
  lesson: streams-collectors
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [reduce, Optional, identity, combiner]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> words = List.of("ab", "cde", "f");
            Optional<String> a = words.stream().reduce((x, y) -> y + x);
            String b = words.stream().reduce("", (x, y) -> x + y.length());
            int c = words.stream().reduce(0, (acc, w) -> acc + w.length(), Integer::sum);
            System.out.println(a + " " + b + " " + c);
        }
    }
  options:
    - key: a
      text: "`Optional[fcdeab] 231 6`"
      correct: true
      why: "a: (ab, cde) → \"cdeab\", then (cdeab, f) → \"fcdeab\", wrapped in Optional. b: \"\" + 2 + 3 + 1 as string concatenation. c: 2 + 3 + 1."
    - key: b
      text: "`fcdeab 231 6`"
      why: The one-argument reduce returns Optional<String>, and printing an Optional shows Optional[...].
    - key: c
      text: "`Optional[abcdef] 231 6`"
      why: The accumulator is (x, y) -> y + x, which prepends the next element each time.
    - key: d
      text: "`Optional[fcdeab] 6 6`"
      why: x is a String, so x + y.length() is string concatenation, not addition.
  explanation: |
    `reduce(BinaryOperator)` returns `Optional<T>`. `reduce(identity, BinaryOperator)` returns `T` — here the
    accumulator concatenates lengths onto a String. The three-argument form changes the result type
    (`String` elements → `Integer` result) and needs a combiner for parallel execution.
  rule: "Stream.reduce: (op) → Optional<T>; (identity, op) → T; (identity, accumulator, combiner) → U."
  hint: Which form of reduce returns an Optional, and what does `y + x` do to the order?
  java:
    expect: { compiles: true, stdout: "Optional[fcdeab] 231 6" }

