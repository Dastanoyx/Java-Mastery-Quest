    `Optional.of(null)` → `NullPointerException`; `Optional.empty().get()` → `NoSuchElementException: No value
    present`; `Stream.toList()` → unmodifiable list → `UnsupportedOperationException` on `add`. Empty-safe
    operations: `ofNullable`, `orElse`, `IntStream.sum()`.
  rule: "Optional.of rejects null; get()/orElseThrow() throw NoSuchElementException when empty; Stream.toList() is unmodifiable."
  hint: Which of these methods promise a non-empty or modifiable result?

- id: D6-PIP-008
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 120
  tags: [iterate, takeWhile, dropWhile, joining]
  prompt: What is the output?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            System.out.println(Stream.iterate(1, n -> n <= 20, n -> n + 3)
                .dropWhile(n -> n < 8)
                .takeWhile(n -> n < 17)
                .map(String::valueOf)
                .collect(Collectors.joining(",")));
        }
    }
  options:
    - key: a
      text: "`10,13,16`"
      correct: true
      why: iterate yields 1,4,7,10,13,16,19; dropWhile removes the prefix 1,4,7; takeWhile keeps 10,13,16 and stops at 19.
    - key: b
      text: "`10,13,16,19`"
      why: takeWhile(n < 17) stops as soon as it meets 19.
    - key: c
      text: "`8,11,14`"
      why: The stream starts at 1 and steps by 3 — 8 is never generated; dropWhile does not insert values.
    - key: d
      text: "`1,4,7,10,13,16`"
      why: dropWhile discards the leading elements that match its predicate (1, 4 and 7).
  explanation: |
    The three-argument `iterate(seed, hasNext, next)` behaves like `for (n = 1; n <= 20; n += 3)`. `dropWhile`
    drops the longest prefix matching the predicate, `takeWhile` keeps the longest prefix matching its predicate.
  rule: "Stream.iterate(seed, hasNext, next) (Java 9); takeWhile/dropWhile operate on the longest matching prefix of an ordered stream."
  misconception: takeWhile and dropWhile act like filter.
  hint: Write out the elements generated by iterate first.
  java:
    expect: { compiles: true, stdout: "10,13,16" }

- id: D6-PIP-009
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [laziness, late-binding, source-modification]
  prompt: What is the output?
  code: |
    import java.util.*;
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            List<Integer> list = new ArrayList<>(List.of(1, 2, 3));
            Stream<Integer> s = list.stream().filter(x -> x > 1);
            list.add(4);
            System.out.println(s.count());
        }
    }
  options:
    - key: a
      text: "`2`"
      why: The stream is not a snapshot taken at creation time; nothing is read from the list until count() runs.
    - key: b
      text: "`3`"
      correct: true
      why: ArrayList's spliterator is late-binding — it binds to the list when the terminal operation starts, so it sees 1,2,3,4; three elements are > 1.
    - key: c
      text: A `ConcurrentModificationException` is thrown
      why: The list was modified BEFORE the terminal operation started, which is allowed; modifying it during traversal would throw.
    - key: d
      text: An `IllegalStateException` is thrown
      why: The stream is used only once (count()), so it is not reused.
  explanation: |
    Building a pipeline does not read the source. ArrayList's spliterator binds to the list's contents when
    traversal begins (late-binding), so modifications made before the terminal operation are visible. Changing
    the list *inside* the pipeline (for example in `forEach`) would throw `ConcurrentModificationException`.
  rule: Non-interference — the source may be modified before the terminal operation begins; late-binding spliterators reflect those changes (java.util.stream package docs, "Non-interference").
  misconception: A stream copies its source when it is created.
  hint: When does the stream actually start reading the list?
  java:
    expect: { compiles: true, stdout: "3" }

