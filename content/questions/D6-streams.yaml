    }
  options:
    - key: a
      text: |
        3 194
        9798
      correct: true
      why: chars() is an IntStream of char codes; 3 distinct codes, 'a' (97) occurs twice → 194, and the first two codes print as numbers.
    - key: b
      text: |
        3 194
        ab
      why: The elements are ints, so the IntConsumer System.out::print resolves to print(int) and prints numbers.
    - key: c
      text: |
        4 194
        9798
