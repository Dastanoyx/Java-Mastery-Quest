    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            List<String> words = List.of("alpha", "beta", "avocado", "blue", "cherry");
            Map<Character, Long> a = words.stream()
                .filter(w -> w.length() > 4)
                .collect(Collectors.groupingBy(w -> w.charAt(0), TreeMap::new, Collectors.counting()));
            Map<Character, Long> b = words.stream()
                .collect(Collectors.groupingBy(w -> w.charAt(0), TreeMap::new,
                         Collectors.filtering(w -> w.length() > 4, Collectors.counting())));
            System.out.println(a);
            System.out.println(b);
        }
    }
  options:
    - key: a
      text: |
        {a=2, c=1}
        {a=2, b=0, c=1}
      correct: true
      why: Filtering before grouping removes "b" words entirely, so key b never appears; filtering as a downstream collector keeps key b with a count of 0.
    - key: b
      text: |
        {a=2, c=1}
        {a=2, c=1}
      why: The filtering collector runs inside each group — every key produced by the classifier is still present.
    - key: c
      text: |
        {a=2, b=0, c=1}
        {a=2, b=0, c=1}
      why: In the first pipeline the b-words are removed before groupingBy ever sees them, so no b key is created.
    - key: d
      text: |
        {a=2, b=2, c=1}
        {a=2, b=0, c=1}
      why: "\"beta\" and \"blue\" have only 4 characters and fail the length > 4 filter."
  explanation: |
    `filter` before `groupingBy` decides which elements exist at all, so empty groups disappear.
    `Collectors.filtering` (Java 9) is applied per group *after* classification, so every key is created and
    the downstream collector can produce an "empty" result (`0` for `counting`, `[]` for `toList`).
  rule: Collectors.filtering(predicate, downstream) applies the predicate inside each group; keys produced by the classifier are retained.
  hint: When is the key `b` created in each pipeline?
