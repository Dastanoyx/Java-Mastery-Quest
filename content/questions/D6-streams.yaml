  tags: [gatherers, windowFixed, windowSliding, java24]
  prompt: What is the output when run with Java 25?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            System.out.println(Stream.of("a", "b", "c", "d", "e").gather(Gatherers.windowFixed(3)).toList());
            System.out.println(Stream.of(1, 2, 3).gather(Gatherers.windowSliding(4)).toList());
        }
    }
  options:
    - key: a
      text: |
        [[a, b, c], [d, e]]
        [[1, 2, 3]]
      correct: true
      why: windowFixed emits a shorter final window; windowSliding on a stream shorter than the window emits one window with all elements.
    - key: b
      text: |
        [[a, b, c]]
        []
      why: Neither gatherer drops incomplete data — the final partial window of windowFixed is emitted, and windowSliding emits the short window.
    - key: c
      text: |
        [[a, b, c], [b, c, d], [c, d, e]]
        [[1, 2, 3]]
      why: That is windowSliding(3); windowFixed windows do not overlap.
    - key: d
      text: Compilation fails because `gather` is a preview API
      why: Stream Gatherers became final in Java 24 (JEP 485); no --enable-preview is needed in Java 25.
  explanation: |
    `Gatherers.windowFixed(n)` groups consecutive elements into non-overlapping lists of size `n`; the last one
    may be shorter. `Gatherers.windowSliding(n)` emits overlapping windows; if the stream has fewer than `n`
    elements it emits a single window containing all of them.
  rule: "JEP 485 / java.util.stream.Gatherers: windowFixed(n) and windowSliding(n)."
  hint: Do these gatherers ever drop the leftover elements?
  java:
    expect: { compiles: true, stdout: "[[a, b, c], [d, e]]\n[[1, 2, 3]]" }

- id: D6-GAT-002
  objective: D6.2
  lesson: streams-gatherers
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [gatherers, fold, scan, empty-stream]
  prompt: What is the output?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            System.out.println(Stream.of(2, 3, 4).gather(Gatherers.scan(() -> 1, (a, x) -> a * x)).toList());
            System.out.println(Stream.<Integer>empty().gather(Gatherers.fold(() -> 1, (a, x) -> a * x)).toList());
            System.out.println(Stream.<Integer>empty().gather(Gatherers.scan(() -> 1, (a, x) -> a * x)).toList());
        }
    }
  options:
    - key: a
      text: |
        [1, 2, 6, 24]
        [1]
        []
      why: scan does not emit the initial value — only the result after each element.
    - key: b
      text: |
        [2, 6, 24]
        []
        []
      why: fold always emits exactly one element when the stream ends, which is the initial value for an empty stream.
    - key: c
      text: |
        [2, 6, 24]
        [1]
        []
      correct: true
      why: scan emits 1*2, 2*3, 6*4; fold on an empty stream emits the initial value 1; scan on an empty stream emits nothing.
    - key: d
      text: |
        [2, 6, 24]
        [1]
        [1]
      why: scan only emits after integrating an element, so an empty stream produces an empty result.
  explanation: |
    `scan(initial, f)` emits the running accumulation after every element (the seed itself is not emitted).
    `fold(initial, f)` emits exactly one value — the final accumulation — at the end, which is the seed if there
    were no elements. Contrast with `reduce(BinaryOperator)`, which returns `Optional.empty()` for an empty stream.
  rule: "java.util.stream.Gatherers.fold emits a single result when the stream ends; Gatherers.scan emits each incremental accumulation."
  misconception: fold behaves like reduce without identity and produces nothing for an empty stream.
  hint: When does fold push its value downstream?
  java:
    expect: { compiles: true, stdout: "[2, 6, 24]\n[1]\n[]" }

- id: D6-GAT-003
  objective: D6.2
  lesson: streams-gatherers
  type: single
  format: trace
  difficulty: expert
  estSeconds: 180
  tags: [gatherers, custom-gatherer, integrator, short-circuit]
  prompt: What is the output?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            Gatherer<String, int[], String> numbered = Gatherer.ofSequential(
                () -> new int[1],
                (n, s, down) -> {
                    if (s.isEmpty()) return false;
                    return down.push(++n[0] + ":" + s);
                });
            Stream.of("x", "y", "", "z")
                .peek(s -> System.out.print("<" + s + ">"))
                .gather(numbered)
                .forEach(System.out::print);
        }
    }
  options:
    - key: a
      text: "`<x>1:x<y>2:y<>`"
      correct: true
      why: Elements flow one at a time; the empty string is peeked, then the integrator returns false, which stops the stream before "z" is pulled.
    - key: b
      text: "`<x>1:x<y>2:y<><z>3:z`"
      why: Returning false from the integrator is a short-circuit signal, not "skip this element" — "z" is never requested.
    - key: c
      text: "`<x><y><><z>1:x2:y`"
      why: A gatherer is part of the lazy, element-by-element pipeline; it pushes each result downstream immediately.
    - key: d
      text: "`<x>1:x<y>2:y<><z>`"
      why: After the integrator returns false, the upstream stops sending elements, so peek never sees "z".
  explanation: |
    The integrator's boolean means "do I want more input?". For `""` it returns `false`, so the stream stops after
    that element (which was already pulled and peeked). The state `int[1]` created by the initializer numbers the
    emitted elements. To *skip* an element instead, the integrator would `return true` without pushing.
  rule: "Gatherer.Integrator.integrate returns false to signal that no more elements should be sent (short-circuit) (JEP 485)."
  misconception: Returning false from the integrator filters out the current element.
  hint: What does the integrator's return value mean?
  java:
    expect: { compiles: true, stdout: "<x>1:x<y>2:y<>" }

- id: D6-GAT-004
  objective: D6.2
  lesson: streams-gatherers
  type: single
  format: predict-output
  difficulty: advanced
  estSeconds: 150
  tags: [gatherers, custom-gatherer, finisher, state]
  prompt: What is the output?
  code: |
    import java.util.*;
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            Gatherer<Integer, List<Integer>, Integer> sumPairs = Gatherer.ofSequential(
                ArrayList::new,
                (buf, x, down) -> {
                    buf.add(x);
                    if (buf.size() < 2) return true;
                    int sum = buf.get(0) + buf.get(1);
                    buf.clear();
                    return down.push(sum);
                },
                (buf, down) -> { if (!buf.isEmpty()) down.push(-buf.get(0)); });
            System.out.println(Stream.of(1, 2, 3, 4, 5).gather(sumPairs).toList());
        }
    }
  options:
    - key: a
      text: "`[3, 7]`"
      why: The finisher runs after the last element and pushes the leftover 5 (negated).
    - key: b
      text: "`[3, 7, 5]`"
      why: The finisher pushes -buf.get(0), i.e. -5.
    - key: c
      text: "`[3, 7, -5]`"
      correct: true
      why: Pairs (1,2) and (3,4) are summed by the integrator; 5 remains in the buffer and the finisher pushes -5.
    - key: d
      text: "`[1, 3, 5, 7, 9]`"
      why: The buffer is cleared after each pair, so the windows do not overlap.
  explanation: |
    `Gatherer.ofSequential(initializer, integrator, finisher)`: the initializer creates the buffer, the integrator
    pushes a sum for every complete pair, and the finisher is called once at the end of input with the final
    state — here it flushes the incomplete pair.
  rule: "Gatherer finisher: performs a final action at the end of input with the state and the downstream (JEP 485)."
  hint: What is left in the buffer when the stream ends?
  java:
    expect: { compiles: true, stdout: "[3, 7, -5]" }

