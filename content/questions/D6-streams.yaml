    Result types of common collectors: `counting()` → `Long`, `summingInt` → `Integer`, `averagingInt/Long/Double`
    → `Double`. On line 7 inference fails with *inference variable R has incompatible bounds* (Long vs Integer).
  rule: "Collectors API: counting() is Collector<T, ?, Long>; averagingX() is Collector<T, ?, Double>; summingInt() is Collector<T, ?, Integer>."
