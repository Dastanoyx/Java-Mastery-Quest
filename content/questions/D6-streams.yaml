  tags: [teeing, collectingAndThen, joining, minBy]
  prompt: What is the output?
  code: |
    import java.util.*;
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            String r = Stream.of(4, 9, 2, 7).collect(Collectors.teeing(
                Collectors.minBy(Comparator.naturalOrder()),
                Collectors.collectingAndThen(Collectors.toList(), List::size),
                (min, size) -> min.get() + "/" + size));
            System.out.println(r);
            System.out.println(Stream.of("x", "y").collect(Collectors.joining(",", "<", ">"))
                + Stream.<String>empty().collect(Collectors.joining(",", "<", ">")));
        }
    }
  options:
    - key: a
      text: |
        2/4
        <x,y>
      why: joining with a prefix and suffix adds them even for an empty stream, producing "<>".
    - key: b
      text: |
        Optional[2]/4
        <x,y><>
      why: The merger calls min.get(), which unwraps the Optional returned by minBy.
    - key: c
      text: |
        2/4
        <x,y><>
      correct: true
      why: teeing feeds every element to both collectors; minBy → Optional[2], collectingAndThen → 4; joining adds "<" and ">" even when there are no elements.
    - key: d
      text: |
        2/4
        <x>,<y><>
      why: The prefix and suffix wrap the whole joined result once, not each element.
  explanation: |
    `teeing(c1, c2, merger)` (Java 12) sends each element to both downstream collectors and merges their final
    results. `collectingAndThen(downstream, finisher)` post-processes a result. `joining(delim, prefix, suffix)`
    always emits prefix + suffix, so an empty stream gives `<>`.
  rule: "Collectors.teeing(downstream1, downstream2, merger); Collectors.joining(delimiter, prefix, suffix)."
  hint: What does `minBy` return, and what happens to the prefix/suffix for an empty stream?
