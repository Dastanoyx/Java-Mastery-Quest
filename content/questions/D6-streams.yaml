# ───────────────────────── D6.1 · lambdas & functional interfaces ─────────────────────────

- id: D6-LAM-001
  objective: D6.1
  lesson: streams-lambdas
  type: single
  format: compile-error
  difficulty: foundation
  estSeconds: 60
  tags: [lambda, effectively-final, capture]
  prompt: What is the result of compiling and running this program?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<Runnable> tasks = new ArrayList<>();
            for (int i = 0; i < 3; i++) {
                tasks.add(() -> System.out.print(i));
            }
            tasks.forEach(Runnable::run);
        }
    }
  options:
    - key: a
      text: "`012`"
      why: This is what a JavaScript closure with `let` would print; Java refuses to capture a variable that is modified, so the code never runs.
    - key: b
      text: "`333`"
      why: This models "lambdas capture the variable, not the value". Java avoids that problem by only allowing capture of effectively final locals — the code does not compile.
    - key: c
      text: Compilation fails at line 6
      correct: true
      why: "`i` is modified by `i++`, so it is not effectively final, and a lambda may only capture final or effectively final locals."
    - key: d
      text: An `IllegalStateException` is thrown at runtime
      why: Capture rules are enforced entirely by the compiler; there is no runtime check.
  explanation: |
    A lambda can read a local variable only if it is **final or effectively final** (JLS §15.27.2). The loop
    variable `i` is reassigned by `i++`, so javac reports *local variables referenced from a lambda expression
    must be final or effectively final* on line 6. Fix: copy it first (`int n = i; tasks.add(() -> print(n));`)
    or use an enhanced for loop, which declares a fresh variable per iteration.
  rule: Local variables referenced from a lambda body must be final or effectively final (JLS 15.27.2).
  misconception: Lambdas capture a snapshot of the current value, so later changes do not matter.
  hint: Is `i` ever assigned after it is declared?
  java:
    expect: { compiles: false, errorContains: "must be final or effectively final", errorLine: 6 }

- id: D6-LAM-002
  objective: D6.1
  lesson: streams-lambdas
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 120
  tags: [functional-interface, annotation, object-methods]
  prompt: Which of the following interfaces compile when annotated with `@FunctionalInterface`? Choose three.
  options:
    - key: a
      text: "`interface A { void go(); default void stop() { } }`"
      correct: true
      why: Exactly one abstract method; default methods do not count.
      java:
        source: |
          @FunctionalInterface interface A { void go(); default void stop() { } }
          public class Main { public static void main(String[] x) { A a = () -> {}; a.go(); } }
        expect: { compiles: true }
    - key: b
      text: "`interface B { boolean equals(Object o); }`"
      why: "`equals(Object)` is a public method of Object, so it does not count — B has zero abstract methods and is not functional."
      java:
        source: |
          @FunctionalInterface interface B { boolean equals(Object o); }
          public class Main { public static void main(String[] x) { } }
        expect: { compiles: false, errorContains: "no abstract method found" }
    - key: c
      text: "`interface C { int size(); String toString(); static C empty() { return () -> 0; } }`"
      correct: true
      why: toString() is a public Object method and the static method is not abstract, so size() is the single abstract method.
      java:
        source: |
          @FunctionalInterface interface C { int size(); String toString(); static C empty() { return () -> 0; } }
          public class Main { public static void main(String[] x) { System.out.println(C.empty().size()); } }
        expect: { compiles: true, stdout: "0" }
    - key: d
      text: "`interface D { void open(); void close(); }`"
      why: Two abstract methods — a lambda could not know which one it implements.
      java:
        source: |
          @FunctionalInterface interface D { void open(); void close(); }
          public class Main { public static void main(String[] x) { } }
        expect: { compiles: false, errorContains: "multiple non-overriding abstract methods" }
    - key: e
      text: "`interface E extends Runnable { void run(); }`"
      correct: true
      why: E redeclares (overrides) Runnable.run(); there is still only one abstract method.
      java:
        source: |
          @FunctionalInterface interface E extends Runnable { void run(); }
          public class Main { public static void main(String[] x) { E e = () -> System.out.println("e"); e.run(); } }
        expect: { compiles: true, stdout: "e" }
  explanation: |
    A functional interface has exactly one abstract method that is not a redeclaration of a public `Object`
    method (JLS §9.8). Default and static methods are irrelevant. Inherited abstract methods count, but an
    override of the same signature is still the same single method.
  rule: "JLS 9.8: exactly one abstract method, ignoring public methods of java.lang.Object; @FunctionalInterface only asks the compiler to check this."
  misconception: Any abstract method declared in the interface counts, including equals/toString.
  hint: Which abstract methods are already implemented by every object?

- id: D6-LAM-003
  objective: D6.1
  lesson: streams-lambdas
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [method-reference, bound, unbound, constructor-reference]
  prompt: What is the output?
  code: |
    import java.util.function.*;
    public class Main {
        public static void main(String[] args) {
            String base = "java";
            Function<String, Boolean> f1 = base::contains;
            BiFunction<String, String, Boolean> f2 = String::contains;
            Supplier<StringBuilder> f3 = StringBuilder::new;
            Function<String, StringBuilder> f4 = StringBuilder::new;
            System.out.println(f1.apply("av") + " " + f2.apply("av", "java") + " "
                + f3.get().append("x") + f4.apply("yz").reverse());
        }
    }
  options:
    - key: a
      text: "`true false xzy`"
      correct: true
      why: "f1 is bound to \"java\" → \"java\".contains(\"av\"); f2 is unbound → \"av\".contains(\"java\"); f3 calls new StringBuilder(); f4 calls new StringBuilder(\"yz\") which is then reversed."
    - key: b
      text: "`true true xzy`"
      why: For an unbound reference the FIRST argument becomes the receiver, so f2 asks whether "av" contains "java" — false.
    - key: c
      text: "`true false xyz`"
      why: f4 passes the argument to the StringBuilder(String) constructor, and reverse() then turns "yz" into "zy".
    - key: d
      text: Compilation fails because `StringBuilder::new` cannot match two different functional interfaces
      why: A constructor reference is matched against each target separately — the no-arg constructor for Supplier, StringBuilder(String) for Function.
  explanation: |
    `base::contains` is a **bound** reference: the receiver is fixed (`"java"`) and the lambda argument becomes the
    method argument. `String::contains` is **unbound**: the first lambda argument is the receiver, the second the
    argument. `StringBuilder::new` selects the constructor whose parameters match the descriptor: `()` for
    `Supplier`, `(String)` for `Function<String, StringBuilder>`.
  rule: "Method references (JLS 15.13): bound obj::m, unbound Type::m (first parameter is the receiver), static Type::m, constructor Type::new."
  misconception: "`String::contains` with two arguments calls the method on the second argument."
  hint: For `String::contains` with a BiFunction, which argument becomes `this`?
  java:
    expect: { compiles: true, stdout: "true false xzy" }

- id: D6-LAM-004
  objective: D6.1
  lesson: streams-lambdas
  type: single
  format: overload-resolution
  difficulty: expert
  estSeconds: 150
  tags: [lambda, overloading, runnable, callable, checked-exceptions]
  prompt: What does this program print?
  code: |
    import java.util.concurrent.*;
    public class Main {
        static void submit(Runnable r)         { System.out.print("R "); }
        static void submit(Callable<String> c) { System.out.print("C "); }
        public static void main(String[] args) {
            submit(() -> { throw new Exception("x"); });
            submit(() -> { });
            submit(() -> "done");
        }
    }
  options:
    - key: a
      text: "`C R C`"
      correct: true
      why: The throwing lambda only fits Callable (call() declares throws Exception); the empty block only fits Runnable (returns nothing); "done" is only value-compatible, so Callable.
    - key: b
      text: "`R R C`"
      why: A lambda that throws a checked exception cannot implement Runnable.run(), which declares no checked exceptions.
    - key: c
      text: Compilation fails because the first call is ambiguous
      why: "`{ throw ...; }` can complete only abruptly, so it is compatible with both shapes, but the checked Exception rules out Runnable — only one overload applies."
    - key: d
      text: Compilation fails because `throw new Exception` is not handled
      why: Callable.call() is declared `throws Exception`, so a lambda implementing it may throw any Exception.
  explanation: |
    A block body that can only complete by throwing is compatible with both void and value descriptors. What
    decides the first call is exception checking: `Runnable.run()` declares no checked exceptions, so only
    `Callable<String>` is applicable. `() -> { }` returns no value, so only `Runnable` fits. `() -> "done"` is an
    expression that is not a statement (a literal), so it cannot be void-compatible — `Callable` again.
  rule: A lambda body must be compatible with the descriptor's return type and may only throw checked exceptions that the descriptor declares (JLS 15.27.3).
  misconception: Overloads with Runnable and Callable are always ambiguous for lambdas.
  hint: Which of `run()` and `call()` declares `throws Exception`?
  java:
    expect: { compiles: true, stdout: "C R C" }

- id: D6-LAM-005
  objective: D6.1
  lesson: streams-lambdas
  type: multi
  format: select-valid
  difficulty: intermediate
  estSeconds: 120
  tags: [lambda-syntax, var, block-body]
  prompt: |
    Which lambda expressions can be assigned to `BiFunction<Integer, Integer, Integer> f`? Choose three.
  options:
    - key: a
      text: "`(a, b) -> a + b`"
      correct: true
      why: Both parameters are implicitly typed; the expression body returns the sum.
      java:
        source: |
          import java.util.function.*;
          public class Main { public static void main(String[] x) { BiFunction<Integer, Integer, Integer> f = (a, b) -> a + b; System.out.println(f.apply(2, 3)); } }
        expect: { compiles: true, stdout: "5" }
    - key: b
      text: "`(var a, var b) -> { return a * b; }`"
      correct: true
      why: "`var` is used for every parameter, and the block body returns a value."
      java:
        source: |
          import java.util.function.*;
          public class Main { public static void main(String[] x) { BiFunction<Integer, Integer, Integer> f = (var a, var b) -> { return a * b; }; System.out.println(f.apply(2, 3)); } }
        expect: { compiles: true, stdout: "6" }
    - key: c
      text: "`(Integer a, b) -> a - b`"
      why: Mixing an explicitly typed parameter with an implicitly typed one is not allowed.
      java:
        source: |
          import java.util.function.*;
          public class Main { public static void main(String[] x) { BiFunction<Integer, Integer, Integer> f = (Integer a, b) -> a - b; } }
        expect: { compiles: false, errorContains: "cannot mix implicitly-typed and explicitly-typed parameters" }
    - key: d
      text: "`(a, b) -> { a + b; }`"
      why: Inside a block, `a + b;` is not a statement — and a value-returning block needs `return`.
      java:
        source: |
          import java.util.function.*;
          public class Main { public static void main(String[] x) { BiFunction<Integer, Integer, Integer> f = (a, b) -> { a + b; }; } }
        expect: { compiles: false, errorContains: "not a statement" }
    - key: e
      text: "`(final Integer a, final Integer b) -> a / b`"
      correct: true
      why: Explicitly typed parameters may carry the final modifier.
      java:
        source: |
          import java.util.function.*;
          public class Main { public static void main(String[] x) { BiFunction<Integer, Integer, Integer> f = (final Integer a, final Integer b) -> a / b; System.out.println(f.apply(7, 2)); } }
        expect: { compiles: true, stdout: "3" }
    - key: f
      text: "`Integer a, Integer b -> a % b`"
      why: Explicitly typed parameters must be enclosed in parentheses.
      java:
        source: |
          import java.util.function.*;
          public class Main { public static void main(String[] x) { BiFunction<Integer, Integer, Integer> f = Integer a, Integer b -> a % b; } }
        expect: { compiles: false }
  explanation: |
    Lambda parameters must be uniformly implicit, explicit or `var`; parentheses can only be omitted for a
    single implicitly typed parameter. An expression body is returned automatically; a block body needs
    statements terminated by `;` and a `return` for a value-returning descriptor.
  rule: "JLS 15.27.1: lambda parameters are all inferred, all declared or all var; JLS 15.27.2: block bodies of value-compatible lambdas must return a value."
  hint: Check each parameter list for uniformity and each block for a `return`.

- id: D6-LAM-006
  objective: D6.1
  lesson: streams-lambdas
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [composition, andThen, compose, predicate]
  prompt: What is the output?
  code: |
    import java.util.function.*;
    public class Main {
        public static void main(String[] args) {
            Function<Integer, Integer> inc = x -> x + 3;
            Function<Integer, Integer> sq = x -> x * x;
            Predicate<String> longW = s -> s.length() > 3;
            Predicate<String> startsA = s -> s.startsWith("a");
            System.out.println(inc.compose(sq).andThen(inc).apply(2) + " "
                + longW.negate().or(startsA).test("apple") + " "
                + Predicate.not(longW).and(startsA).test("apple"));
        }
    }
  options:
    - key: a
      text: "`10 true false`"
      correct: true
      why: compose runs sq first (2*2=4, +3=7), then andThen adds 3 → 10. "apple" is long, so negate() is false, but startsA is true → true. not(longW) is false → and(...) is false.
    - key: b
      text: "`28 true false`"
      why: This applies inc before sq (5*5=25, +3). compose(g) runs g FIRST, then the receiver.
    - key: c
      text: "`10 false false`"
      why: or() is true if either side is true; "apple" starts with "a".
    - key: d
      text: "`13 true true`"
      why: Predicate.not(longW) negates the predicate; "apple" has 5 characters, so not(longW) is false and the and() short-circuits to false.
  explanation: |
    `f.compose(g)` = `f(g(x))`; `f.andThen(g)` = `g(f(x))`. So `inc.compose(sq)` maps 2 → 7 and `.andThen(inc)`
    maps 7 → 10. `negate`, `or`, `and` are default methods of `Predicate`; `Predicate.not` is a static helper
    (Java 11) that is equivalent to `p.negate()`.
  rule: "java.util.function.Function: compose(before) applies before first; andThen(after) applies after. Predicate: and/or/negate defaults, static not()."
  misconception: compose and andThen are synonyms.
  hint: Write `inc.compose(sq)` as nested calls.
  java:
    expect: { compiles: true, stdout: "10 true false" }

- id: D6-LAM-007
  objective: D6.1
  lesson: streams-lambdas
  type: single
  format: predict-output
  difficulty: expert
  estSeconds: 150
  tags: [this, anonymous-class, capture, fields]
  prompt: What is the output?
  code: |
    public class Main {
        String name = "outer";
        void show() {
            Runnable a = () -> System.out.print(name + " ");
            Runnable b = new Runnable() {
                String name = "anon";
                public void run() { System.out.print(name + " "); }
            };
            Runnable c = new Runnable() {
                public void run() { System.out.print(Main.this.name); }
            };
            name = "changed";
            a.run(); b.run(); c.run();
        }
        public static void main(String[] args) { new Main().show(); }
    }
  options:
    - key: a
      text: "`changed anon changed`"
      correct: true
      why: The lambda reads this.name when it runs (after the assignment); the anonymous class's own field shadows the outer one; Main.this.name is the outer field.
    - key: b
      text: "`outer anon outer`"
      why: Lambdas capture `this`, not a copy of the field value — they observe the field as it is when they run.
    - key: c
      text: "`changed changed changed`"
      why: Inside an anonymous class, an unqualified `name` resolves to the anonymous class's own field first.
    - key: d
      text: Compilation fails because `name` is not effectively final
      why: The effectively-final rule applies to local variables and parameters only. `name` is an instance field.
  explanation: |
    A lambda body is in the same scope as `show()`, so `name` means `this.name` and is read at call time — after
    `name = "changed"`. The first anonymous class declares its own field `name`, which shadows `Main.name`. The
    second explicitly reads `Main.this.name`. Fields are never subject to the effectively-final rule.
  rule: "`this` and simple names in a lambda body mean the same as in the enclosing context (JLS 15.27.2); anonymous classes introduce a new scope and their own `this`."
  misconception: The effectively-final rule applies to every variable a lambda uses, including fields.
  hint: Is `name` a local variable or a field?
  java:
    expect: { compiles: true, stdout: "changed anon changed" }

- id: D6-LAM-008
  objective: D6.1
  lesson: streams-lambdas
  type: multi
  format: concept
  difficulty: foundation
  estSeconds: 90
  tags: [functional-interfaces, primitive-specializations, java.util.function]
  prompt: Which statements about the functional interfaces in `java.util.function` are correct? Choose three.
  options:
    - key: a
      text: "`Supplier<T>` declares `T get()`."
      correct: true
      why: Supplier takes no arguments and produces a value via get().
    - key: b
      text: "`ToIntFunction<T>` declares `int apply(T t)`."
      why: The method is applyAsInt(T). Primitive-returning interfaces use applyAsInt/applyAsLong/applyAsDouble.
    - key: c
      text: "`ObjIntConsumer<T>` declares `void accept(T t, int value)`."
      correct: true
      why: ObjIntConsumer is the BiConsumer specialization whose second argument is an int.
    - key: d
      text: "`IntFunction<R>` declares `int apply(R value)`."
      why: The prefix says what the function TAKES. IntFunction<R> declares R apply(int value).
    - key: e
      text: "`UnaryOperator<T>` extends `Function<T, T>`."
      correct: true
      why: Its abstract method is the inherited apply(T); likewise BinaryOperator<T> extends BiFunction<T,T,T>.
    - key: f
      text: "`IntUnaryOperator` declares `Integer applyAsInt(Integer operand)`."
      why: The point of primitive specializations is to avoid boxing — it is int applyAsInt(int operand).
  explanation: |
    Naming scheme: `IntXxx` takes an `int`; `ToIntXxx` returns an `int` via `applyAsInt`; `ObjIntConsumer`
    takes an object and an `int`. `UnaryOperator`/`BinaryOperator` are specialisations of
    `Function`/`BiFunction` with identical argument and result types.
  rule: "java.util.function package: primitive prefixes describe parameters (IntFunction), To-prefixes describe results (ToIntFunction → applyAsInt)."
  misconception: "`IntFunction` returns an int."
  hint: Does the primitive name at the front of the interface describe the input or the output?

- id: D6-LAM-009
  objective: D6.1
  lesson: streams-lambdas
  type: single
  format: compile-error
  difficulty: advanced
  estSeconds: 120
  tags: [comparator, type-inference, method-reference]
  prompt: What is the result of compiling and running this program?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> names = new ArrayList<>(List.of("Eve", "Bob", "Alexandra"));
            names.sort(Comparator.comparing(s -> s.length()).reversed());
            System.out.println(names);
        }
    }
  options:
    - key: a
      text: "`[Alexandra, Eve, Bob]`"
      why: This would be the output with `Comparator.comparing(String::length).reversed()` — the lambda version does not compile.
    - key: b
      text: "`[Bob, Eve, Alexandra]`"
      why: Even ignoring the compile error, reversed() would put the longest name first.
    - key: c
      text: Compilation fails at line 5
      correct: true
      why: "`comparing(...)` is typed before `.reversed()` is applied, so the lambda has no String target and `s` is inferred as Object, which has no length() method."
    - key: d
      text: A `ClassCastException` is thrown at runtime
      why: The problem is detected by the compiler; no cast happens at runtime.
  explanation: |
    Inference does not flow "backwards" through a method chain: `Comparator.comparing(s -> s.length())` is a
    receiver expression, so it is inferred without the target type of `sort`, and `T` becomes `Object`. javac
    reports *cannot find symbol: method length()*. Fix it with a method reference (`String::length`), an
    explicitly typed lambda (`(String s) -> s.length()`) or a type witness (`Comparator.<String, Integer>comparing(...)`).
  rule: Poly expressions get their target type from the context; a method-invocation receiver has no target type, so generic inference cannot use the type expected later in the chain (JLS 15.12, 18.5).
  misconception: The compiler always infers lambda parameter types from where the result is finally used.
  hint: What does the compiler know about `s` when it types `Comparator.comparing(s -> s.length())` on its own?
  java:
    expect: { compiles: false, errorContains: "cannot find symbol", errorLine: 5 }

# ───────────────────────── D6.1 · pipelines, Optional, primitive streams ─────────────────────────

- id: D6-PIP-001
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: trace
  difficulty: intermediate
  estSeconds: 120
  tags: [laziness, vertical-processing, limit, short-circuit]
  prompt: What is the output?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            Stream.of("kiwi", "fig", "plum", "pear", "lime")
                .filter(s -> { System.out.print("F" + s.charAt(0) + " "); return s.length() == 4; })
                .map(s -> { System.out.print("M" + s.charAt(0) + " "); return s.toUpperCase(); })
                .limit(2)
                .forEach(s -> System.out.print(s + " "));
        }
    }
  options:
    - key: a
      text: "`Fk Mk KIWI Ff Fp Mp PLUM`"
      correct: true
      why: Each element goes through filter → map → limit → forEach before the next one starts; after the second element passes, limit stops the source.
    - key: b
      text: "`Fk Ff Fp Fp Fl Mk Mp Mp Ml KIWI PLUM`"
      why: Streams do not run each stage over the whole collection (horizontal); elements flow one at a time.
    - key: c
      text: "`Fk Mk KIWI Ff Fp Mp PLUM Fp Mp Fl Ml`"
      why: limit is short-circuiting — once two elements have passed, no more elements are pulled from the source.
    - key: d
      text: "`Fk Mk Ff Fp Mp KIWI PLUM`"
      why: forEach receives each element as soon as it leaves map; it does not wait for the others.
  explanation: |
    Stream pipelines are lazy and process elements **vertically**: `kiwi` passes the filter, is mapped and
    printed; `fig` fails the filter; `plum` passes and is printed. `limit(2)` has now seen two elements, so the
    pipeline stops and `pear`/`lime` are never examined.
  rule: Intermediate operations are lazy; limit is a short-circuiting stateful intermediate operation (java.util.stream package docs).
  misconception: Each intermediate operation processes the entire stream before the next one starts.
  hint: Follow one element at a time all the way to forEach.
  java:
    expect: { compiles: true, stdout: "Fk Mk KIWI Ff Fp Mp PLUM" }

- id: D6-PIP-002
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: runtime-exception
  difficulty: foundation
  estSeconds: 60
  tags: [stream-reuse, IllegalStateException]
  prompt: What is the result of running this program?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            Stream<Integer> nums = Stream.of(3, 1, 2);
            Stream<Integer> sorted = nums.sorted();
            System.out.println(nums.count());
        }
    }
  options:
    - key: a
      text: "`3`"
      why: "`nums.sorted()` already linked (consumed) the stream object `nums`; it cannot be used for another operation."
    - key: b
      text: "`0`"
      why: A consumed stream does not become empty; using it again is an error.
    - key: c
      text: An `IllegalStateException` is thrown
      correct: true
      why: A stream may be operated on only once; the second operation reports "stream has already been operated upon or closed".
    - key: d
      text: Compilation fails because `sorted` is never used
      why: Unused local variables are legal in Java.
  explanation: |
    Calling any intermediate or terminal operation on a stream consumes that stream object. `nums.sorted()`
    returned a new stage; calling `nums.count()` afterwards throws `IllegalStateException: stream has already been
    operated upon or closed`, even though the sorted stage was never used.
  rule: A stream should be operated on (invoking an intermediate or terminal operation) only once (java.util.stream.Stream API docs).
  misconception: Intermediate operations that are never "executed" leave the original stream reusable.
  hint: How many times is the stream object `nums` used?
  java:
    expect: { compiles: true, exception: java.lang.IllegalStateException }

- id: D6-PIP-003
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: compile-error
  difficulty: intermediate
  estSeconds: 90
  tags: [primitive-streams, OptionalDouble, return-types]
  prompt: Which line causes a compilation error?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            int sum = IntStream.rangeClosed(1, 3).sum();
            long count = Stream.of("a", "b").count();
            double avg = IntStream.of(2, 4).average();
            int max = IntStream.of(5, 9).max().getAsInt();
            System.out.println(sum + count + avg + max);
        }
    }
  options:
    - key: a
      text: Line 4, because `sum()` returns an `OptionalInt`
      why: IntStream.sum() returns a plain int (0 for an empty stream); only average/min/max are optional.
    - key: b
      text: Line 5, because `count()` returns an `int`
      why: count() returns long, so assigning to long is fine.
    - key: c
      text: Line 6, because `average()` returns an `OptionalDouble`
      correct: true
      why: average() always returns OptionalDouble, which cannot be assigned to double without getAsDouble()/orElse(...).
    - key: d
      text: Line 7, because `IntStream.max()` requires a `Comparator`
      why: Primitive-stream max() takes no arguments and returns OptionalInt; it is Stream<T>.max that needs a Comparator.
  explanation: |
    `IntStream` terminal return types: `sum()` → `int`, `count()` → `long`, `average()` → `OptionalDouble`,
    `min()`/`max()` → `OptionalInt`. javac reports *incompatible types: OptionalDouble cannot be converted to
    double* on line 6.
  rule: "IntStream API: sum() int, average() OptionalDouble, max()/min() OptionalInt, count() long."
  hint: Which of these operations could have no answer for an empty stream?
  java:
    expect: { compiles: false, errorContains: "OptionalDouble cannot be converted to double", errorLine: 6 }

- id: D6-PIP-004
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: trace
  difficulty: advanced
  estSeconds: 120
  tags: [sorted, stateful, barrier, findFirst]
  prompt: What is the output?
  code: |
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) {
            Stream.of("c", "a", "b")
                .peek(s -> System.out.print("1" + s + " "))
                .sorted()
                .peek(s -> System.out.print("2" + s + " "))
                .findFirst()
                .ifPresent(s -> System.out.print("=" + s));
        }
    }
  options:
    - key: a
      text: "`1c 2c =c`"
      why: sorted() cannot pass anything downstream until it has seen every element — and the first sorted element is "a".
    - key: b
      text: "`1c 1a 1b 2a 2b 2c =a`"
      why: After sorting, elements flow one at a time again, and findFirst short-circuits after the first.
    - key: c
      text: "`1c 1a 1b 2a =a`"
      correct: true
      why: sorted() is a barrier, so all three first peeks run; then only the first sorted element reaches findFirst.
    - key: d
      text: "`2a 1c 1a 1b =a`"
      why: Upstream peeks must run before sorted() can produce any element.
  explanation: |
    `sorted()` is a stateful operation: it buffers every element before emitting the first one. Everything
    upstream therefore runs for all elements (`1c 1a 1b`). Downstream processing is lazy again: `findFirst`
    needs only one element, so only `2a` is printed before the result.
  rule: Stateful intermediate operations such as sorted() may need to process the entire input before producing a result (java.util.stream package docs).
  misconception: findFirst makes the whole pipeline process only one element.
  hint: Can sorted() know which element is smallest before it has seen them all?
  java:
    expect: { compiles: true, stdout: "1c 1a 1b 2a =a" }

- id: D6-PIP-005
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: predict-output
  difficulty: foundation
  estSeconds: 60
  tags: [allMatch, anyMatch, noneMatch, empty-stream]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            List<String> none = List.of();
            System.out.println(none.stream().allMatch(String::isEmpty) + " "
                + none.stream().anyMatch(String::isEmpty) + " "
                + none.stream().noneMatch(String::isEmpty));
        }
    }
  options:
    - key: a
      text: "`false false false`"
      why: allMatch and noneMatch are vacuously true on an empty stream — there is no element that violates them.
    - key: b
      text: "`true false true`"
      correct: true
      why: "Empty stream: allMatch → true, anyMatch → false, noneMatch → true."
    - key: c
      text: "`true true true`"
      why: anyMatch needs at least one matching element, so it is false for an empty stream.
    - key: d
      text: A `NoSuchElementException` is thrown
      why: Match operations return a boolean; they never throw for empty streams.
  explanation: |
    The match operations follow logic: "all elements satisfy p" is true when there are no elements (no
    counter-example), "some element satisfies p" is false, and "no element satisfies p" is true.
  rule: "Stream API: allMatch/noneMatch return true and anyMatch returns false if the stream is empty."
  misconception: Every match operation on an empty stream returns false.
  hint: Can you find a counter-example in an empty list?
  java:
    expect: { compiles: true, stdout: "true false true" }

- id: D6-PIP-006
  objective: D6.1
  lesson: streams-pipelines
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [Optional, orElse, orElseGet, map]
  prompt: What is the output?
  code: |
    import java.util.*;
    public class Main {
        static int calls = 0;
        static String load() { calls++; return "db"; }
        public static void main(String[] args) {
            Optional<String> cached = Optional.of("cache");
            String a = cached.orElse(load());
            String b = cached.orElseGet(Main::load);
            String c = cached.map(s -> (String) null).orElseGet(Main::load);
            System.out.println(a + " " + b + " " + c + " " + calls);
        }
    }
  options:
    - key: a
      text: "`cache cache null 1`"
      why: When the mapping function returns null, Optional.map returns an EMPTY Optional, not Optional[null].
    - key: b
      text: "`cache cache db 1`"
      why: orElse(load()) evaluates its argument before the call, even though the Optional has a value — that is a second call.
    - key: c
      text: "`cache cache db 2`"
      correct: true
      why: load() runs once for orElse (eager argument) and once for the last line (map produced an empty Optional); orElseGet on a present value never calls the supplier.
    - key: d
      text: A `NullPointerException` is thrown
      why: Optional.map tolerates a null result by returning Optional.empty().
  explanation: |
    `orElse(x)` is a normal method call, so `x` (here `load()`) is evaluated first: `calls = 1`, result `"cache"`.
    `orElseGet(supplier)` calls the supplier only for an empty Optional, so line `b` does not call `load()`.
    `map` returning `null` yields `Optional.empty()`, so `orElseGet` calls `load()`: `calls = 2`, `c = "db"`.
  rule: "Optional API: orElse argument is always evaluated; orElseGet's supplier only when empty; map returns empty if the mapper returns null."
  misconception: orElse and orElseGet are interchangeable.
  hint: When are method arguments evaluated in Java?
  java:
    expect: { compiles: true, stdout: "cache cache db 2" }

