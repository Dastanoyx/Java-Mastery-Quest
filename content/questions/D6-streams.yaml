- id: D6-COL-007
  objective: D6.2
  lesson: streams-collectors
  type: single
  format: concept
  difficulty: expert
  estSeconds: 150
  tags: [parallel, reduce, identity]
  prompt: Which statement about this program is true?
  code: |
    import java.util.*;
    public class Main {
        public static void main(String[] args) {
            int r = List.of(1, 2, 3, 4).parallelStream().reduce(5, Integer::sum);
            System.out.println(r);
        }
    }
  options:
    - key: a
      text: It always prints `15`.
      why: That is the sequential result; in parallel the identity 5 is added once per chunk, not once overall.
    - key: b
      text: It always prints `10`.
      why: The identity is used at least once, so the result is never just the sum of the elements.
    - key: c
      text: The result depends on how the stream is split; it is not guaranteed to be `15` because `5` is not an identity for addition.
      correct: true
      why: Each chunk starts from the "identity", so with k chunks the result is 10 + 5k (typically 30 here). The identity contract op(identity, x) == x is violated.
    - key: d
      text: Compilation fails because `reduce` on a parallel stream needs a combiner.
      why: The two-argument form uses the accumulator as combiner; it compiles fine.
  explanation: |
    `reduce(identity, op)` requires `op(identity, x) == x` for every `x`. The framework is allowed to use the
    identity as the starting value of **every** sub-task. Sequentially 5 + 1 + 2 + 3 + 4 = 15, but in parallel
    each of the (typically four) leaf tasks adds 5, giving 30 on a typical run. The fix is `reduce(0, Integer::sum) + 5`.
  rule: "Stream.reduce: the identity value must be an identity for the accumulator function (for all t, accumulator.apply(identity, t) equals t)."
  misconception: The identity is just the starting value and is used exactly once.
  hint: How many times may the identity be used when the work is split into chunks?
  java:
    expect: { compiles: true }

- id: D6-COL-008
  objective: D6.2
