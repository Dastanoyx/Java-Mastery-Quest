      compiles: true
      stdout: |
        DELTA,ALPHA,CHARLIE,BRAVO
        delta
        [5, 5, 7, 5]

- id: D8-COL-006
  objective: D8.3
  lesson: conc-collections-parallel
  type: single
  format: concept
  difficulty: foundation
  estSeconds: 90
  tags: [synchronizedList, ConcurrentHashMap, ConcurrentSkipListMap, CopyOnWriteArrayList, iteration]
  prompt: Which statement about Java's thread-safe collections is true?
  options:
    - key: a
      text: When several threads use a list returned by `Collections.synchronizedList`, a thread that iterates over it must hold the list's lock — `synchronized (list) { … }` — for the whole loop.
      correct: true
      why: Each method call is synchronized, but iteration is many calls; the Javadoc requires manual synchronization on the list while iterating.
    - key: b
      text: "`ConcurrentHashMap` allows one `null` key, just like `HashMap`."
      why: ConcurrentHashMap rejects all null keys and values with NullPointerException.
    - key: c
      text: "`ConcurrentSkipListMap` keeps its entries in insertion order."
      why: It is the concurrent counterpart of TreeMap — sorted by natural order or a Comparator.
    - key: d
      text: Iterating over a `ConcurrentHashMap` throws `ConcurrentModificationException` if another thread adds an entry meanwhile.
      why: ConcurrentHashMap iterators are weakly consistent and never throw ConcurrentModificationException.
    - key: e
      text: "`CopyOnWriteArrayList` is the best choice for a list that many threads write to constantly."
      why: Every write copies the whole array; it suits read-mostly lists such as listener registries, not write-heavy ones.
  explanation: |
    The synchronized wrappers lock one monitor per method call, so compound actions — check-then-act and
    iteration — still need an explicit `synchronized (list)` block. Concurrent collections avoid that:
    `ConcurrentHashMap` and `ConcurrentSkipListMap/Set` have weakly consistent iterators and reject `null`;
    the skip-list structures are sorted. `CopyOnWriteArrayList` gives snapshot iteration at the cost of a full
    copy per write.
  rule: "Collections.synchronizedList: the user must manually synchronize on the returned list when iterating over it. ConcurrentHashMap/ConcurrentSkipListMap reject nulls and have weakly consistent iterators; skip-list collections are sorted."
  misconception: A synchronized wrapper makes every use of the collection, including iteration, thread-safe automatically.
  hint: Which operation of a synchronized wrapper consists of many separate method calls?

- id: D8-COL-007
  objective: D8.3
  lesson: conc-collections-parallel
  type: single
  format: runtime-exception
  difficulty: advanced
  estSeconds: 150
  tags: [ConcurrentHashMap, weakly-consistent, HashMap, ConcurrentModificationException, fail-fast]
  prompt: What is the result of running this program?
  code: |
    import java.util.*;
    import java.util.concurrent.*;

    public class Main {
        public static void main(String[] args) {
            Map<String, Integer> chm = new ConcurrentHashMap<>(Map.of("a", 1, "b", 2, "c", 3));
            for (String k : chm.keySet()) {
                if (chm.get(k) % 2 == 1) chm.remove(k);
            }
            System.out.println(chm);
            Map<String, Integer> hm = new HashMap<>(Map.of("a", 1, "b", 2, "c", 3));
            for (String k : hm.keySet()) {
                if (hm.get(k) % 2 == 1) hm.remove(k);
            }
            System.out.println(hm);
        }
    }
  options:
    - key: a
      text: It prints `{b=2}`, then a `ConcurrentModificationException` is thrown
      correct: true
      why: The ConcurrentHashMap iterator is weakly consistent and tolerates removals; the HashMap iterator is fail-fast and notices the structural change on its next step.
    - key: b
      text: It prints `{b=2}` twice
      why: HashMap's iterator is fail-fast even in a single thread; removing through the map (not the iterator) while iterating makes the next next() throw.
    - key: c
      text: A `ConcurrentModificationException` is thrown by the first loop
      why: Concurrent collections never throw ConcurrentModificationException; their iterators are weakly consistent.
    - key: d
      text: It prints `{a=1, b=2, c=3}`, then a `ConcurrentModificationException` is thrown
      why: The removals in the first loop really happen — the map is modified even though the loop is iterating over it.
  explanation: |
    `ConcurrentHashMap` iterators are **weakly consistent**: they never throw `ConcurrentModificationException`
    and you may modify the map while iterating, so both odd entries are removed. `HashMap` iterators are
    **fail-fast**: removing via `hm.remove(k)` bumps the modification count and the next `next()` throws —
    whatever the iteration order, because one of the two odd keys is removed while another key is still
    ahead. The safe single-threaded alternatives are `iterator.remove()` or `hm.values().removeIf(...)`.
  rule: "HashMap collection-view iterators are fail-fast (ConcurrentModificationException after structural modification not made through the iterator); ConcurrentHashMap iterators are weakly consistent and never throw it."
  misconception: ConcurrentModificationException only happens with multiple threads, or concurrent maps throw it too.
  hint: Which of the two iterators checks a modification counter?
  java:
    expect: { compiles: true, stdout: "{b=2}", exception: java.util.ConcurrentModificationException }

- id: D8-COL-008
  objective: D8.3
  lesson: conc-collections-parallel
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 120
  tags: [ConcurrentSkipListSet, NavigableSet, virtual-threads, sorted]
  prompt: What is the output of the following program?
  code: |
    import java.util.*;
    import java.util.concurrent.*;

    public class Main {
        public static void main(String[] args) {
            NavigableSet<Integer> seen = new ConcurrentSkipListSet<>();
            try (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor()) {
                for (int t = 0; t < 4; t++) {
                    int base = t;
                    ex.submit(() -> { for (int i = 0; i < 5; i++) seen.add(base + i * 4); });
                }
            }
            System.out.println(seen.size() + " " + seen.first() + " " + seen.last());
            System.out.println(seen.headSet(5) + " " + seen.ceiling(17) + " " + seen.descendingSet().first());
        }
    }
  options:
    - key: a
      text: |
        20 0 19
        [0, 1, 2, 3, 4] 17 19
      correct: true
      why: The four tasks add the distinct values 0..19; close() waits for them; the skip-list set is sorted, headSet(5) is exclusive and ceiling(17) is the least element >= 17.
    - key: b
      text: |
        20 0 19
        [0, 1, 2, 3, 4, 5] 17 19
      why: headSet(toElement) excludes toElement by default; headSet(5, true) would include it.
    - key: c
      text: |
        20 0 19
        [0, 1, 2, 3, 4] 18 19
      why: ceiling(e) returns the least element greater than OR EQUAL to e; higher(e) would be strictly greater.
    - key: d
      text: The output varies between runs because the four tasks add their values in an unpredictable order
      why: The insertion order does vary, but a ConcurrentSkipListSet keeps its elements sorted, and close() makes main read the set only after every task finished.
  explanation: |
    `ConcurrentSkipListSet` is a thread-safe, **sorted** `NavigableSet` — the concurrent counterpart of
    `TreeSet`. Concurrent `add` calls from many threads are safe, and since the order of the elements depends
    only on their values, the printed result is deterministic once all writers are done (here guaranteed by
    the executor's `close()`). The navigation methods behave like `TreeSet`'s: `headSet(to)` is exclusive,
    `ceiling` is ≥, `higher` is >, `descendingSet()` reverses the view.
  rule: "ConcurrentSkipListSet is a scalable concurrent NavigableSet sorted by natural ordering or a Comparator; it does not permit null elements."
  misconception: A collection filled by several threads always has an unpredictable content order.
  hint: Does the order of insertion matter for a sorted set?
  java:
    expect:
      compiles: true
      stdout: |
        20 0 19
        [0, 1, 2, 3, 4] 17 19
