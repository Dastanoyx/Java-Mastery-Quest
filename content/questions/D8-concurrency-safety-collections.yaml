- id: D8-COL-001
  objective: D8.3
  lesson: conc-collections-parallel
  type: single
  format: predict-output
  difficulty: intermediate
  estSeconds: 150
  tags: [ConcurrentHashMap, putIfAbsent, merge, compute, computeIfAbsent, null-handling]
  prompt: What is the output of the following program?
  code: |
    import java.util.concurrent.*;

    public class Main {
        public static void main(String[] args) {
            ConcurrentHashMap<String, Integer> m = new ConcurrentHashMap<>();
            System.out.println(m.putIfAbsent("a", 1) + " " + m.putIfAbsent("a", 2) + " "
                    + m.merge("a", 5, Integer::sum) + " "
                    + m.compute("b", (k, v) -> v == null ? 10 : v + 1) + " "
                    + m.computeIfAbsent("c", k -> null) + " " + m.size());
            try {
                System.out.println(m.containsKey(null));
            } catch (NullPointerException e) {
                System.out.println("NPE");
            }
        }
    }
  options:
    - key: a
      text: |
        null 1 6 10 null 2
        NPE
      correct: true
      why: putIfAbsent returns the previous value (null, then 1); merge stores and returns 1+5; compute creates b=10; a null from computeIfAbsent stores nothing; containsKey(null) throws.
    - key: b
      text: |
        null 1 6 10 null 3
        NPE
      why: When the mapping function of computeIfAbsent returns null, no mapping is recorded — ConcurrentHashMap could not store a null value anyway.
    - key: c
      text: |
        null 1 5 10 null 2
        NPE
      why: merge with an existing key stores remapping(old, value) = 1 + 5, not just the new value.
    - key: d
      text: |
        null 1 6 10 null 2
        false
      why: Unlike HashMap, ConcurrentHashMap rejects null keys in queries too — containsKey(null) throws NullPointerException.
  explanation: |
    `putIfAbsent` returns the **previous** value (`null` if absent) and only writes when absent. `merge`,
    `compute` and `computeIfAbsent` return the **new** value; a function returning `null` removes the entry or,
    for `computeIfAbsent`, stores nothing. All of these are atomic on `ConcurrentHashMap`. Because `null` must
    unambiguously mean "absent", the map rejects null keys and values — including in `get`, `containsKey` and
    `remove` — with `NullPointerException`.
  rule: "ConcurrentHashMap does not allow null keys or values (NullPointerException); putIfAbsent returns the previous value; merge/compute/computeIfAbsent return the new value and a null result means no mapping."
  misconception: ConcurrentHashMap behaves like HashMap for nulls, and a null-returning computeIfAbsent stores a null entry.
  hint: Separate "what is returned" from "what is stored" for each call.
  java:
    expect:
      compiles: true
      stdout: |
        null 1 6 10 null 2
        NPE

- id: D8-COL-002
  objective: D8.3
  lesson: conc-collections-parallel
  type: single
  format: runtime-exception
  difficulty: advanced
  estSeconds: 120
  tags: [CopyOnWriteArrayList, snapshot-iterator, UnsupportedOperationException]
  prompt: What is the result of running this program?
  code: |
    import java.util.*;
    import java.util.concurrent.*;

    public class Main {
        public static void main(String[] args) {
            List<String> listeners = new CopyOnWriteArrayList<>(List.of("audit", "mail"));
            Iterator<String> it = listeners.iterator();
            listeners.add("sms");
            listeners.remove("audit");
            int seen = 0;
            while (it.hasNext()) {
                System.out.print(it.next() + " ");
                seen++;
            }
            System.out.println(seen + " " + listeners);
            Iterator<String> again = listeners.iterator();
            again.next();
            again.remove();
        }
    }
  options:
    - key: a
      text: It prints `mail sms 2 [mail, sms]` and ends normally
      why: The iterator works on the snapshot taken when it was created; later writes copy to a new array that it never sees.
    - key: b
      text: It prints `audit mail 2 [mail, sms]`, then an `UnsupportedOperationException` is thrown
      correct: true
      why: The first iterator sees the original two elements; the list itself has changed; iterator.remove() is not supported on copy-on-write iterators.
    - key: c
      text: A `ConcurrentModificationException` is thrown by the first `it.next()`
      why: CopyOnWriteArrayList iterators are snapshot iterators and never throw ConcurrentModificationException.
    - key: d
      text: It prints `audit mail 2 [mail, sms]` and ends normally, leaving `[sms]`
      why: Snapshot iterators cannot change the list — their remove(), set() and add() throw UnsupportedOperationException.
  explanation: |
    Every write to a `CopyOnWriteArrayList` copies the backing array; an iterator keeps a reference to the array
    that existed when it was created. It therefore sees neither the added `"sms"` nor the removal of
    `"audit"`, and it never throws `ConcurrentModificationException`. Because it iterates a frozen snapshot,
    its mutating methods (`remove`, `set`, `add`) throw `UnsupportedOperationException`; modify the list itself
    instead (e.g. `listeners.remove(x)` or `removeIf`).
  rule: "CopyOnWriteArrayList iterators provide a snapshot of the list at iterator creation, never throw ConcurrentModificationException, and do not support remove, set or add (UnsupportedOperationException)."
  misconception: A concurrent list's iterator shows live changes and supports remove() like ArrayList's.
  hint: Which array does the first iterator traverse?
  java:
    expect: { compiles: true, stdout: "audit mail 2 [mail, sms]", exception: java.lang.UnsupportedOperationException }

- id: D8-COL-003
  objective: D8.3
  lesson: conc-collections-parallel
  type: single
  format: runtime-exception
  difficulty: intermediate
  estSeconds: 120
  tags: [BlockingQueue, LinkedBlockingQueue, offer, poll, remove, NoSuchElementException]
  prompt: What is the result of running this program?
  code: |
    import java.util.concurrent.*;

    public class Main {
        public static void main(String[] args) throws InterruptedException {
            BlockingQueue<Integer> q = new LinkedBlockingQueue<>(2);
            q.put(1);
            System.out.print(q.offer(2) + " ");
            System.out.print(q.offer(3, 20, TimeUnit.MILLISECONDS) + " ");
            System.out.print(q.remainingCapacity() + " " + q.peek() + " ");
            q.clear();
            System.out.println(q.poll() + " " + q.poll(20, TimeUnit.MILLISECONDS));
            q.remove();
        }
    }
  options:
    - key: a
      text: It prints `true false 0 1 null null`, then a `NoSuchElementException` is thrown
      correct: true
      why: offer fits the second element; the timed offer gives up after 20 ms and returns false; poll and timed poll return null when empty; remove() throws on an empty queue.
    - key: b
      text: It prints `true ` and then hangs forever at the timed `offer`
      why: offer(e, timeout, unit) waits at most the given time and then returns false; only put() blocks indefinitely.
    - key: c
      text: It prints `true false 0 1 null null` and ends normally
      why: remove() belongs to the "throws" family — on an empty queue it throws NoSuchElementException instead of returning null.
    - key: d
      text: It prints `true `, then an `IllegalStateException` is thrown by the timed `offer`
      why: Only add() throws IllegalStateException on a full queue; the timed offer reports failure by returning false.
  explanation: |
    `BlockingQueue` methods come in four families. **Throw**: `add` (IllegalStateException when full), `remove`
    and `element` (NoSuchElementException when empty). **Special value**: `offer` → `false`, `poll`/`peek` →
    `null`. **Block**: `put`, `take`. **Time out**: `offer(e, t, unit)` → `false`, `poll(t, unit)` → `null`.
    `new LinkedBlockingQueue<>(2)` is bounded to two elements, so `remainingCapacity()` is 0 when full.
  rule: "BlockingQueue: add/remove/element throw; offer/poll/peek return a special value; put/take block; timed offer/poll wait up to the time-out and then return false/null."
  misconception: A timed offer or remove() behaves like its blocking or special-value cousin.
  hint: Assign each call to one of the four method families.
  java:
    expect: { compiles: true, stdout: "true false 0 1 null null", exception: java.util.NoSuchElementException }

