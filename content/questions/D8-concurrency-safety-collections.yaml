  tags: [parallel-streams, encounter-order, findFirst, joining, toList]
  prompt: What is the output of the following program?
  code: |
    import java.util.*;
    import java.util.stream.*;

    public class Main {
        public static void main(String[] args) {
            List<String> words = List.of("delta", "alpha", "charlie", "bravo");
            System.out.println(words.parallelStream().map(String::toUpperCase).collect(Collectors.joining(",")));
            System.out.println(words.parallelStream().filter(w -> w.length() == 5).findFirst().get());
            System.out.println(words.parallelStream().map(String::length).toList());
        }
    }
  options:
    - key: a
      text: |
        DELTA,ALPHA,CHARLIE,BRAVO
        delta
        [5, 5, 7, 5]
      correct: true
      why: joining, findFirst and toList all respect the encounter order of the ordered List source, even in parallel.
    - key: b
      text: |
        ALPHA,BRAVO,CHARLIE,DELTA
        alpha
        [5, 5, 5, 7]
      why: Parallel processing does not sort anything; encounter order comes from the source list.
    - key: c
      text: The order of each line varies from run to run, because the streams are parallel
      why: Only order-insensitive operations such as forEach and findAny may vary; these three terminal operations are defined in terms of encounter order.
    - key: d
      text: |
        DELTA,ALPHA,CHARLIE,BRAVO
        any of delta, alpha or bravo
        [5, 5, 7, 5]
      why: That describes findAny. findFirst must return the first matching element in encounter order, also on a parallel stream.
  explanation: |
    Parallelism changes *how* the work is split, not the **meaning** of an ordered pipeline. On an ordered
    source (a `List`), `collect(...)` including `joining`, `toList()`, `reduce`, `forEachOrdered` and
    `findFirst()` give the same result as sequentially. `forEach` and `findAny` are the operations allowed to
    ignore order; `unordered()` explicitly drops the constraint.
  rule: "For ordered streams, collect, toList, reduce, findFirst and forEachOrdered respect encounter order regardless of parallel execution; forEach and findAny need not."
  misconception: Any parallel stream produces results in a random order.
  hint: Which of these three terminal operations are allowed to ignore encounter order?
  java:
