  tags: [parallel-streams, reduce, identity, associativity, forEach, encounter-order]
  prompt: Which statements are **guaranteed** to print the same result as the sequential version of the pipeline? Choose three.
  options:
    - key: a
      text: "`System.out.println(IntStream.rangeClosed(1, 5).parallel().reduce(1, (a, b) -> a * b));`"
      correct: true
      why: 1 is a true identity for multiplication and multiplication is associative, so every split gives 120.
      java:
        source: |
          import java.util.stream.*;
          public class Main { public static void main(String[] args) { System.out.println(IntStream.rangeClosed(1, 5).parallel().reduce(1, (a, b) -> a * b)); } }
        expect: { compiles: true, stdout: "120" }
    - key: b
      text: "`System.out.println(IntStream.rangeClosed(1, 5).parallel().reduce(5, Integer::sum));`"
      why: 5 is not an identity for addition; a parallel reduce applies the seed once per chunk, so the result depends on how the source was split.
      java:
        source: |
          import java.util.stream.*;
          public class Main { public static void main(String[] args) { System.out.println(IntStream.rangeClosed(1, 5).parallel().reduce(5, Integer::sum) >= 20); } }
        expect: { compiles: true, stdout: "true" }
    - key: c
      text: "`System.out.println(Stream.of(\"a\", \"b\", \"c\", \"d\").parallel().reduce(\"\", String::concat));`"
      correct: true
      why: "\"\" is the identity of concatenation, concatenation is associative, and reduce respects encounter order — always abcd."
      java:
        source: |
          import java.util.stream.*;
          public class Main { public static void main(String[] args) { System.out.println(Stream.of("a", "b", "c", "d").parallel().reduce("", String::concat)); } }
        expect: { compiles: true, stdout: "abcd" }
    - key: d
      text: "`System.out.println(IntStream.rangeClosed(1, 5).parallel().reduce(0, (a, b) -> a - b));`"
      why: Subtraction is not associative, so combining partial results in a different grouping changes the answer.
      java:
        source: |
          import java.util.stream.*;
          public class Main { public static void main(String[] args) { IntStream.rangeClosed(1, 5).parallel().reduce(0, (a, b) -> a - b); System.out.println("ran"); } }
        expect: { compiles: true, stdout: "ran" }
    - key: e
      text: "`System.out.println(List.of(3, 1, 2).parallelStream().map(x -> x * 10).collect(Collectors.toList()));`"
      correct: true
      why: collect into a list keeps encounter order on an ordered source; each thread fills its own container and they are merged in order.
      java:
        source: |
          import java.util.*;
          import java.util.stream.*;
          public class Main { public static void main(String[] args) { System.out.println(List.of(3, 1, 2).parallelStream().map(x -> x * 10).collect(Collectors.toList())); } }
        expect: { compiles: true, stdout: "[30, 10, 20]" }
    - key: f
      text: "`Stream.of(\"a\", \"b\", \"c\").parallel().forEach(System.out::print);`"
      why: Parallel forEach gives no ordering guarantee — any permutation of abc may be printed. forEachOrdered would be needed.
      java:
        source: |
          import java.util.stream.*;
          public class Main { public static void main(String[] args) { Stream.of("a", "b", "c").parallel().forEach(s -> { }); System.out.println("ran"); } }
        expect: { compiles: true, stdout: "ran" }
  explanation: |
    A parallel `reduce(identity, op)` splits the source, reduces each chunk starting from `identity`, and
    combines the partial results. That is only equivalent to the sequential result if `identity` is a real
    identity (`op(identity, x) == x`) and `op` is associative. Ordered terminal operations such as `reduce`,
    `collect`, `toList()` and `forEachOrdered` respect encounter order even in parallel; `forEach` does not.
  rule: "Stream.reduce(identity, accumulator): identity must be an identity for the accumulator and the accumulator must be associative; forEach on a parallel stream does not respect encounter order."
  misconception: A parallel stream always gives the sequential answer as long as it does not crash.
  hint: Check each one for a true identity, associativity and an order-respecting terminal operation.

- id: D8-COL-005
  objective: D8.3
  lesson: conc-collections-parallel
